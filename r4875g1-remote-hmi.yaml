# ==============================================================================
# R4875G1 REMOTE HMI - V6 BOOTSTRAP TARGET
# ==============================================================================
#
# Remote touchscreen interface for the R4875G1 three-phase charger.
#
# Hardware:
#   - Waveshare ESP32-S3-Touch-LCD-7
#   - ESP32-S3 N16R8
#   - 7-inch 800x480 RGB display
#   - GT911 capacitive touchscreen
#   - CH422G onboard I/O expander
#   - 1S backup battery
#
# The Remote HMI has no direct connection to charger-side CAN or external
# charger peripherals.
#
# This bootstrap target includes the shared board, network and display
# infrastructure together with a read-only Home Assistant backend for the
# currently implemented charger state in the shared V6 UI model.
#
# Charger command transport is available through the Home Assistant command
# backend. The current bootstrap UI remains read-only and does not expose those
# commands yet.
#
# The complete shared production HMI is not included in this bootstrap target.
# ==============================================================================

substitutions:

  # ---------------------------------------------------------------------------
  # TARGET IDENTITY
  # ---------------------------------------------------------------------------

  fallback_ap_ssid: "Charger HMI Fallback"

  ha_charger_ac_power_entity: "sensor.hg_dg_technik_charger_combined_ac_power_all_units"
  ha_charger_ac_voltage_entity: "sensor.hg_dg_technik_charger_average_ac_voltage_all_units"
  ha_charger_ac_current_entity: "sensor.hg_dg_technik_charger_average_ac_current_all_units"
  ha_charger_ac_current_limit_entity: "number.hg_dg_technik_charger_set_ac_current_limit"

  ha_charger_dc_power_entity: "sensor.hg_dg_technik_charger_combined_dc_power_all_units"
  ha_charger_dc_voltage_entity: "sensor.hg_dg_technik_charger_average_dc_voltage_all_units"
  ha_charger_dc_current_entity: "sensor.hg_dg_technik_charger_combined_dc_current_all_units"
  ha_charger_dc_voltage_limit_entity: "number.hg_dg_technik_charger_set_dc_voltage_limit"
  ha_charger_dc_sum_power_entity: "number.hg_dg_technik_charger_set_dc_sum_power"

  ha_charger_available_units_entity: "sensor.hg_dg_technik_charger_available_units"
  ha_charger_running_units_entity: "sensor.hg_dg_technik_charger_running_units"
  ha_charger_highest_output_temperature_entity: "sensor.hg_dg_technik_charger_highest_output_temperature_all_units"
  ha_charger_conversion_efficiency_entity: "sensor.hg_dg_technik_charger_conversion_efficiency_all_units"

  # ---------------------------------------------------------------------------
  # CHARGER COMMAND TARGETS
  # ---------------------------------------------------------------------------

  ha_charger_start_button_entity: "button.hg_dg_technik_charger_turn_on_all_units"
  ha_charger_stop_button_entity: "button.hg_dg_technik_charger_turn_off_all_units"

  # ---------------------------------------------------------------------------
  # SHARED WAVESHARE GPIO MAP
  # ---------------------------------------------------------------------------

  pin_touch_irq: "GPIO4"
  pin_i2c_sda: "GPIO8"
  pin_i2c_scl: "GPIO9"
  pin_battery_adc: "GPIO6"

  # ---------------------------------------------------------------------------
  # DISPLAY DEFAULTS
  # ---------------------------------------------------------------------------

  display_idle_timeout: "5min"

# ==============================================================================
# FIRMWARE PACKAGE ASSEMBLY
# ==============================================================================
#
# Assembles target-neutral Waveshare hardware and platform services together
# with the Remote HMI Home Assistant state/command backends and the current
# bootstrap display.
# ==============================================================================

packages:
  version: !include packages/version.yaml

  shared_core: !include packages/shared/core.yaml
  shared_hardware: !include packages/shared/hardware.yaml
  shared_ui_model: !include packages/shared/ui-model.yaml
  shared_battery_bank: !include packages/shared/battery-bank.yaml
  shared_battery_ui_backend: !include packages/shared/battery-ui-backend.yaml

  remote_ha_backend: !include packages/remote-hmi/ha-backend.yaml
  remote_ui_commands: !include packages/remote-hmi/ui-commands.yaml

  display_hardware: !include packages/display/hardware.yaml
  display_theme: !include packages/display/theme.yaml

  remote_bootstrap_ui: !include packages/remote-hmi/bootstrap-ui.yaml

# ==============================================================================
# ESPHOME DEVICE IDENTITY
# ==============================================================================

esphome:
  name: hg-dg-technik-charger-hmi
  friendly_name: HG|DG|Technik|Charger HMI
  min_version: 2026.8.2

  project:
    name: "anwa.r4875-remote-hmi"
    version: "${firmware_version}"
