# Board: Espressif ESP32-S3-DevKitC-1
# Module: ESP32-S3-WROOM-1-N16R8
# Flash: 16 MB Quad SPI
# PSRAM: 8 MB Octal SPI

# ==============================================================================
# THREE-PHASE R4875G1 CHARGER CONTROLLER - ARCHITECTURE OVERVIEW
# ==============================================================================
# This ESPHome firmware controls three Huawei R4875G1 rectifier units used as
# a three-phase battery charger. Each rectifier is supplied from one AC phase;
# their DC outputs are connected in parallel to the same battery bus.
#
# DATA PATH
# ---------
#   R4875G1 Unit 1 / 2 / 3
#          |
#          | extended 29-bit CAN frames @ 125 kbit/s
#          v
#   ESP32-S3 CAN decoder
#          |
#          +--> individual unit telemetry sensors
#          |      AC/DC power, voltage, current, frequency, temperatures, state
#          |
#          +--> per-unit CAN watchdogs (can_com_ok_1..3)
#          |
#          +--> CAN-aware combined AC/DC power sensors
#          |
#          +--> TFT display / Home Assistant / MQTT
#
# LOCAL BLACKSTART CONTROL PATH
# -----------------------------
#   Rotary encoder + push button
#          |
#          +--> choose DC voltage or nominal three-unit DC power target
#          +--> calculate the common per-unit current setpoint from that target
#          +--> apply active voltage/current setpoints only to verified ONLINE units
#          +--> long press starts/stops all units
#
# OFFLINE OPERATION
# -----------------
# Wi-Fi, MQTT and Home Assistant are optional for core charger operation.
# Network reboot timeouts are disabled so a dead or isolated site network cannot
# prevent the ESP32 from controlling the charger during a blackstart.
#
# CAN VALUE SCALING
# -----------------
# Most voltage/telemetry values use a fixed-point scale of 1024:
#     engineering_value = raw_CAN_value / 1024
#     raw_CAN_value     = engineering_value * 1024
#
# Current commands use current_scaling_factor.
# The controller starts with the known 75 A R4875G1 fallback value
# (1024 / 75 = 13.653333) and automatically refreshes the factor from
# the currently reachable rectifier capabilities.
#
# COMMUNICATION HEALTH
# --------------------
# Valid per-unit CAN activity refreshes last_can_rx_1..3. During normal
# operation cyclic telemetry provides the heartbeat; valid property frames also
# refresh it while discovery temporarily suspends cyclic polling.
#
# If no valid CAN activity is received within can_watchdog_timeout_ms,
# can_com_ok_x becomes false. Display and aggregate logic then ignore stale
# values from that unit.
# ==============================================================================
# ==============================================================================
# ESPHOME DEVICE IDENTITY AND BOOT ACTIONS
# ==============================================================================
# Defines the device identity used by ESPHome/Home Assistant. The boot hook
# starts the display inactivity timer so the backlight will eventually switch off
# even if the user never touches the encoder after power-up.
substitutions:
  mqtt_command_prefix: "HG/DG/Technik/Charger"

  # --------------------------------------------------------------------------
  # ESP32-S3-DevKitC-1 GPIO map
  # --------------------------------------------------------------------------
  # Keep every hardware pin assignment centralized here so firmware, docs and
  # KiCad can be compared against one authoritative map.
  pin_encoder_button: "GPIO2"
  pin_tft_backlight: "GPIO4"
  pin_tft_cs: "GPIO5"
  pin_tft_reset: "GPIO6"
  pin_tft_dc: "GPIO7"
  pin_i2c_sda: "GPIO8"
  pin_i2c_scl: "GPIO9"
  pin_spi_mosi: "GPIO11"
  pin_spi_miso: "GPIO12"
  pin_spi_clk: "GPIO13"
  pin_can_tx: "GPIO15"
  pin_can_rx: "GPIO16"
  pin_encoder_a: "GPIO17"
  pin_encoder_b: "GPIO18"
  pin_fan_enable: "GPIO21"
  pin_fan3_tach: "GPIO39"
  pin_fan2_tach: "GPIO40"
  pin_fan1_tach: "GPIO41"
  pin_fan_pwm: "GPIO42"

  # --------------------------------------------------------------------------
  # External cooling-fan defaults
  # --------------------------------------------------------------------------
  cooling_fan_pwm_frequency: "25000Hz"
  cooling_fan_default_pwm_percent: "100.0"
  cooling_fan_tach_pulses_per_revolution: "2.0"

  # --------------------------------------------------------------------------
  # Project-wide operating limits
  # --------------------------------------------------------------------------
  project_max_dc_current_a: "75.0"
  failsafe_dc_current_a: "50.0"
  minimum_dc_current_a: "1.0"

  dc_voltage_min_v: "49.0"
  dc_voltage_max_v: "58.0"
  dc_voltage_default_v: "53.0"

  thermal_warn1_c: "70.0"
  thermal_warn1_reset_c: "65.0"
  thermal_warn1_limit_a: "50.0"

  thermal_warn2_c: "80.0"
  thermal_warn2_reset_c: "75.0"
  thermal_warn2_limit_a: "30.0"

  overtemp_trip_c: "90.0"
  overtemp_reset_c: "80.0"

  thermal_state_normal: "0"
  thermal_state_warn1: "1"
  thermal_state_warn2: "2"
  thermal_state_lockout: "3"

  efficiency_min_ac_power_w: "100.0"

  protocol_value_scale: "1024"
  fan_duty_counts_per_percent: "256.0"

  rectifier_state_offline: "0"
  rectifier_state_discovering: "1"
  rectifier_state_online: "2"

  can_rx_queue_len: "64"

  # Normal runtime CAN watchdog. 7 s deliberately exceeds the 5 s discovery
  # stabilization delay so a newly detected unit does not appear unreachable
  # during the intentional quiet/stabilization window before discovery starts.
  can_watchdog_timeout_ms: "7000"

  property_poll_resume_grace_ms: "2000"

  live_telemetry_timeout: "5s"

  telemetry_poll_interval: "577ms"
  fan_query_delay: "27ms"
  unit_2_poll_gap: "156ms"
  unit_3_poll_gap: "166ms"

  offline_probe_slot_interval: "5s"
  can_recovery_check_interval: "2s"
  setpoint_refresh_interval: "30s"

  property_discovery_attempts: "3"
  capability_discovery_attempts: "10"
  discovery_retry_delay: "1s"
  discovery_startup_delay: "5s"
  property_bus_quiet_delay: "500ms"

packages:
  core: !include packages/core.yaml
  hardware: !include packages/hardware.yaml
  display: !include packages/display.yaml
  cooling: !include packages/cooling.yaml
  controls: !include packages/controls.yaml
  rectifier_shared: !include packages/rectifier-shared.yaml

  rectifier_unit_1: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "1"

  rectifier_unit_2: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "2"

  rectifier_unit_3: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "3"

esphome:
  name: hg-dg-technik-charger3ph
  friendly_name: HG|DG|Technik|Charger-3Ph
  min_version: 2026.7.4

  project:
    name: "anwa.3phase-charger"
    version: "4.0.1"

  on_boot:
    then:
      - lambda: |-
          id(power_state_1).publish_state("UNKNOWN");
          id(power_state_2).publish_state("UNKNOWN");
          id(power_state_3).publish_state("UNKNOWN");

          id(thermal_state_text_1).publish_state("NORMAL");
          id(thermal_state_text_2).publish_state("NORMAL");
          id(thermal_state_text_3).publish_state("NORMAL");

          id(effective_dc_current_limit_sensor).publish_state(
            id(effective_dc_current_limit)
          );

      - script.execute:
          id: set_rectifier_control_state
          unit: 1
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 2
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 3
          state: ${rectifier_state_offline}

      - script.execute: display_inactivity_timer

      - lambda: |-
          id(cooling_fan_pwm_output).set_level(
            ${cooling_fan_default_pwm_percent}f / 100.0f
          );

      - switch.turn_on: cooling_fan_enable

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
      icon: "mdi:memory"

    block:
      name: "Heap Max Block"
      entity_category: diagnostic
      icon: "mdi:memory"

    loop_time:
      name: "Loop Time"
      entity_category: diagnostic
      icon: "mdi:timer-outline"

    psram:
      name: "Free PSRAM"
      entity_category: diagnostic
      icon: "mdi:memory"

    cpu_frequency:
      name: "CPU Frequency"
      entity_category: diagnostic
      icon: "mdi:speedometer"

  - platform: internal_temperature
    name: "Controller CPU Temperature"
    id: cpu_temp
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    icon: "mdi:thermometer"

  - platform: uptime
    type: seconds
    name: "Uptime"
    entity_category: diagnostic
    icon: "mdi:timer-outline"

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_sig
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    update_interval: 10s
    icon: "mdi:wifi"

  - platform: aht10
    variant: AHT10
    i2c_id: i2c_bus
    address: 0x38
    update_interval: 60s

    temperature:
      name: "Rectifier Compartment Temperature"
      id: rectifier_compartment_temperature
      accuracy_decimals: 1
      icon: "mdi:thermometer"

    humidity:
      name: "Rectifier Compartment Humidity"
      id: rectifier_compartment_humidity
      accuracy_decimals: 1
      icon: "mdi:water-percent"

  - platform: rotary_encoder
    id: local_encoder

    pin_a:
      number: ${pin_encoder_a}
      mode:
        input: true
        pullup: true

    pin_b:
      number: ${pin_encoder_b}
      mode:
        input: true
        pullup: true

    resolution: 1
    internal: true

    on_clockwise:
      then:
        - script.execute: display_inactivity_timer
        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.increment:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.increment:
                  id: set_dc_sum_power
                  cycle: false
    on_anticlockwise:
      then:
        - script.execute: display_inactivity_timer
        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.decrement:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.decrement:
                  id: set_dc_sum_power
                  cycle: false

  - platform: template
    name: "Effective DC Current Limit"
    id: effective_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never
    icon: "mdi:current-dc"

  - platform: template
    name: "Thermal DC Current Limit"
    id: thermal_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 1s
    lambda: 'return id(thermal_dc_current_limit);'
    icon: "mdi:thermometer-alert"

  - platform: template
    name: "Applied DC Current Limit"
    id: applied_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const float requested = id(set_dc_current_limit).state;
      if (isnan(requested)) return NAN;
      float applied = std::min(requested, id(effective_dc_current_limit));
      applied = std::min(applied, id(thermal_dc_current_limit));
      return applied;
    icon: "mdi:current-dc"

  - platform: template
    name: "Combined AC Power All Units"
    id: combined_ac_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    filters:
      - multiply: 0.001
    lambda: |-
      float power = 0.0f;
      int valid_units = 0;
      if (id(can_com_ok_1).state && !isnan(id(ac_power_1).state)) { power += id(ac_power_1).state; valid_units++; }
      if (id(can_com_ok_2).state && !isnan(id(ac_power_2).state)) { power += id(ac_power_2).state; valid_units++; }
      if (id(can_com_ok_3).state && !isnan(id(ac_power_3).state)) { power += id(ac_power_3).state; valid_units++; }
      if (valid_units == 0) return NAN;
      return power;
    icon: "mdi:flash"

  - platform: template
    name: "Combined DC Power All Units"
    id: combined_dc_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    filters:
      - multiply: 0.001
    lambda: |-
      float power = 0.0f;
      int valid_units = 0;
      if (id(can_com_ok_1).state && !isnan(id(dc_power_1).state)) { power += id(dc_power_1).state; valid_units++; }
      if (id(can_com_ok_2).state && !isnan(id(dc_power_2).state)) { power += id(dc_power_2).state; valid_units++; }
      if (id(can_com_ok_3).state && !isnan(id(dc_power_3).state)) { power += id(dc_power_3).state; valid_units++; }
      if (valid_units == 0) return NAN;
      return power;
    icon: "mdi:flash"

  - platform: template
    name: "Available Units"
    id: available_units
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      int count = 0;
      if (id(can_com_ok_1).state) count++;
      if (id(can_com_ok_2).state) count++;
      if (id(can_com_ok_3).state) count++;
      return count;
    icon: "mdi:server-network"

  - platform: template
    name: "Combined DC Current All Units"
    id: combined_dc_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      float current = 0.0f;
      int valid_units = 0;
      if (id(can_com_ok_1).state && !isnan(id(dc_current_1).state)) { current += id(dc_current_1).state; valid_units++; }
      if (id(can_com_ok_2).state && !isnan(id(dc_current_2).state)) { current += id(dc_current_2).state; valid_units++; }
      if (id(can_com_ok_3).state && !isnan(id(dc_current_3).state)) { current += id(dc_current_3).state; valid_units++; }
      if (valid_units == 0) return NAN;
      return current;
    icon: "mdi:current-dc"

  - platform: template
    name: "Average DC Voltage All Units"
    id: average_dc_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      float voltage = 0.0f;
      int valid_units = 0;
      if (id(can_com_ok_1).state && !isnan(id(dc_voltage_1).state)) { voltage += id(dc_voltage_1).state; valid_units++; }
      if (id(can_com_ok_2).state && !isnan(id(dc_voltage_2).state)) { voltage += id(dc_voltage_2).state; valid_units++; }
      if (id(can_com_ok_3).state && !isnan(id(dc_voltage_3).state)) { voltage += id(dc_voltage_3).state; valid_units++; }
      if (valid_units == 0) return NAN;
      return voltage / valid_units;
    icon: "mdi:current-dc"

  - platform: template
    name: "Highest Output Temperature All Units"
    id: highest_output_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float highest = 0.0f;
      bool valid = false;
      if (id(can_com_ok_1).state && !isnan(id(output_temperature_1).state)) { highest = id(output_temperature_1).state; valid = true; }
      if (id(can_com_ok_2).state && !isnan(id(output_temperature_2).state)) { if (!valid || id(output_temperature_2).state > highest) highest = id(output_temperature_2).state; valid = true; }
      if (id(can_com_ok_3).state && !isnan(id(output_temperature_3).state)) { if (!valid || id(output_temperature_3).state > highest) highest = id(output_temperature_3).state; valid = true; }
      if (!valid) return NAN;
      return highest;
    icon: "mdi:thermometer-high"

  - platform: template
    name: "Conversion Efficiency All Units"
    id: conversion_efficiency
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float ac_power = 0.0f;
      float dc_power = 0.0f;
      int valid_units = 0;
      if (id(can_com_ok_1).state && !isnan(id(ac_power_1).state) && !isnan(id(dc_power_1).state)) { ac_power += id(ac_power_1).state; dc_power += id(dc_power_1).state; valid_units++; }
      if (id(can_com_ok_2).state && !isnan(id(ac_power_2).state) && !isnan(id(dc_power_2).state)) { ac_power += id(ac_power_2).state; dc_power += id(dc_power_2).state; valid_units++; }
      if (id(can_com_ok_3).state && !isnan(id(ac_power_3).state) && !isnan(id(dc_power_3).state)) { ac_power += id(ac_power_3).state; dc_power += id(dc_power_3).state; valid_units++; }
      if (valid_units == 0 || ac_power < ${efficiency_min_ac_power_w}f) return NAN;
      return (dc_power / ac_power) * 100.0f;
    icon: "mdi:gauge"

  - platform: total_daily_energy
    name: "AC Energy Today"
    power_id: combined_ac_power
    time_id: sntp_time
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    icon: "mdi:counter"

  - platform: total_daily_energy
    name: "DC Energy Today"
    power_id: combined_dc_power
    time_id: sntp_time
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    icon: "mdi:counter"

binary_sensor:
  - platform: gpio
    id: local_encoder_button
    internal: true

    pin:
      number: ${pin_encoder_button}
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 30ms

    on_press:
      then:
        - script.execute: display_inactivity_timer

    on_multi_click:
      - timing:
          - ON for 50ms to 2800ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(encoder_mode) = !id(encoder_mode);
              ESP_LOGI(
                "encoder",
                "Selected: %s",
                id(encoder_mode) == 0 ? "DC Voltage" : "DC Sum Power"
              );
          - component.update: tft

      - timing:
          - ON for at least 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return
                    id(power_state_1).state == "ON" ||
                    id(power_state_2).state == "ON" ||
                    id(power_state_3).state == "ON";
              then:
                - script.execute: blackstart_stop
              else:
                - if:
                    condition:
                      lambda: |-
                        return
                          (id(rectifier_control_state_1) == ${rectifier_state_online} && id(can_com_ok_1).state) ||
                          (id(rectifier_control_state_2) == ${rectifier_state_online} && id(can_com_ok_2).state) ||
                          (id(rectifier_control_state_3) == ${rectifier_state_online} && id(can_com_ok_3).state);
                    then:
                      - script.execute: blackstart_start
                    else:
                      - logger.log:
                          level: WARN
                          format: "BLACKSTART: START ignored - no fully ONLINE rectifier with fresh CAN communication is available."

  - platform: template
    name: "Rectifier Capability Mismatch"
    id: rectifier_capability_mismatch
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:alert-circle-outline"

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    icon: "mdi:code-tags"

  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
      icon: "mdi:information-outline"

    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
      icon: "mdi:restart-alert"
