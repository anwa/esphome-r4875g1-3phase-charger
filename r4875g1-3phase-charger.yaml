  # --------------------------------------------------------------------------
  # Output Temperature Unit-1
  # Rectifier output temperature from telemetry selector 0x7F. The on_value safety automation sends an individual OFF command and engages a lockout once this unit exceeds 90 °C; the lockout only clears below the 80 °C hysteresis threshold.
  - platform: template
    name: "Output Temperature Unit-1"
    id: output_temperature_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 3s
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);  
    icon: "mdi:thermometer"
    on_value:
      then:
        - lambda: |-
            // Edge-triggered: only act when crossing the trip or recovery threshold,
            // not on every 3s update while the state is unchanged.
            if (!id(overtemp_lockout_1) && x > 90.0f) {
              id(overtemp_lockout_1) = true;
              ESP_LOGW("overtemp", "Unit 1 exceeded 90°C (%.1f°C). Sending CAN OFF and engaging lockout.", x);
            } else if (id(overtemp_lockout_1) && x < 80.0f) {
              id(overtemp_lockout_1) = false;
              ESP_LOGI("overtemp", "Unit 1 cooled below 80°C (%.1f°C). Lockout cleared.", x);
            }
        - if:
            condition:
              lambda: 'return id(overtemp_lockout_1) && x > 90.0f;'
            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108180FE
                  data: [1, 50, 0, 1, 0, 0, 0, 0]

  # --------------------------------------------------------------------------
  # Output Temperature Unit-2
  # Rectifier output temperature from telemetry selector 0x7F. The on_value safety automation sends an individual OFF command and engages a lockout once this unit exceeds 90 °C; the lockout only clears below the 80 °C hysteresis threshold.
  - platform: template
    name: "Output Temperature Unit-2"
    id: output_temperature_2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 3s
    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);  
    icon: "mdi:thermometer"
    on_value:
      then:
        - lambda: |-
            // Edge-triggered: only act when crossing the trip or recovery threshold,
            // not on every 3s update while the state is unchanged.
            if (!id(overtemp_lockout_2) && x > 90.0f) {
              id(overtemp_lockout_2) = true;
              ESP_LOGW("overtemp", "Unit 2 exceeded 90°C (%.1f°C). Sending CAN OFF and engaging lockout.", x);
            } else if (id(overtemp_lockout_2) && x < 80.0f) {
              id(overtemp_lockout_2) = false;
              ESP_LOGI("overtemp", "Unit 2 cooled below 80°C (%.1f°C). Lockout cleared.", x);
            }
        - if:
            condition:
              lambda: 'return id(overtemp_lockout_2) && x > 90.0f;'
            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108280FE
                  data: [1, 50, 0, 1, 0, 0, 0, 0]

