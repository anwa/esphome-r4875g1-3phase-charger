  # --------------------------------------------------------------------------
  # Highest Output Temperature All Units
  # Reports the hottest currently reachable rectifier.
  - platform: template
    name: "Highest Output Temperature All Units"
    id: highest_output_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float highest = 0.0f;
      bool valid = false;

      if (id(can_com_ok_1).state &&
          !isnan(id(output_temperature_1).state)) {
        highest = id(output_temperature_1).state;
        valid = true;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(output_temperature_2).state)) {
        if (!valid ||
            id(output_temperature_2).state > highest) {
          highest = id(output_temperature_2).state;
        }
        valid = true;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(output_temperature_3).state)) {
        if (!valid ||
            id(output_temperature_3).state > highest) {
          highest = id(output_temperature_3).state;
        }
        valid = true;
      }

      if (!valid) {
        return NAN;
      }

      return highest;
    icon: "mdi:thermometer-high"

  # --------------------------------------------------------------------------
  # Conversion Efficiency All Units
  # Calculates DC output power divided by AC input power.
  #
  # Only units that simultaneously provide valid AC and DC power telemetry are
  # included. Values below 100 W AC input are ignored because efficiency becomes
  # meaningless and unstable close to idle operation.
  - platform: template
    name: "Conversion Efficiency All Units"
    id: conversion_efficiency
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float ac_power = 0.0f;
      float dc_power = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(ac_power_1).state) &&
          !isnan(id(dc_power_1).state)) {
        ac_power += id(ac_power_1).state;
        dc_power += id(dc_power_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(ac_power_2).state) &&
          !isnan(id(dc_power_2).state)) {
        ac_power += id(ac_power_2).state;
        dc_power += id(dc_power_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(ac_power_3).state) &&
          !isnan(id(dc_power_3).state)) {
        ac_power += id(ac_power_3).state;
        dc_power += id(dc_power_3).state;
        valid_units++;
      }

      if (valid_units == 0 ||
          ac_power < ${efficiency_min_ac_power_w}f) {
        return NAN;
      }

      return (dc_power / ac_power) * 100.0f;
    icon: "mdi:gauge"

