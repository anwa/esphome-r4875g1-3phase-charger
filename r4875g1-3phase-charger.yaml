      # Handler for CAN ID 0x1081507F (Packet 1)
      # Max current capability for Unit 1
      # ----------------------------------------------------------------------
      # CAN RX 0x1081507F
      # Unit 1 capability packet. Packet 1 reports the maximum output current.
      # Unit 1 is the canonical source for the shared current_scaling_factor.
      - can_id: 0x1081507F
        use_extended_id: true
        then:
          - lambda: |-
              if (id(max_current_found_1)) {
                return;
              }

              if (x.size() != 8) {
                ESP_LOGW(
                  "canbus",
                  "Unit 1: Ignoring invalid capability frame 0x1081507F "
                  "(DLC=%u, expected 8).",
                  static_cast<unsigned>(x.size())
                );
                return;
              }

              // A valid address response confirms active communication during discovery.
              id(last_can_rx_1) = millis();

              const uint8_t packet_number =
                  static_cast<uint8_t>(x[1]);

              if (packet_number != 1) {
                return;
              }

              // A valid capability response confirms active communication during discovery.
              id(last_can_rx_1) = millis();

              const uint8_t max_current_raw =
                  static_cast<uint8_t>(x[5]);

              const float max_current =
                  max_current_raw / 2.0f;

              if (max_current <= 0.0f) {
                ESP_LOGW(
                  "canbus",
                  "Unit 1: Invalid maximum current capability %.1f A.",
                  max_current
                );
                return;
              }

              ESP_LOGI(
                "canbus",
                "Unit 1: Max current capability: %.1f A",
                max_current
              );

              id(max_current_found_1) = true;
              id(max_dc_current_1).publish_state(max_current);

              // Unit 1 defines the shared current-command scaling factor.
              id(current_scaling_factor) =
                  static_cast<float>(${protocol_value_scale}) / max_current;

              ESP_LOGI(
                "canbus",
                "Unit 1: Current scaling factor updated to %.6f",
                id(current_scaling_factor)
              );

              id(current_scaling_factor_unit_1).publish_state(
                id(current_scaling_factor)
              );


