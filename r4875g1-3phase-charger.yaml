# Board: Androegg ESP32-S3 UNO
# Module: ESP32-S3-WROOM-1-N16R8
# Flash: 16 MB Quad SPI
# PSRAM: 8 MB Octal SPI

esphome:
  name: hg-dg-technik-charger3ph
  friendly_name: HG⁄DG⁄Technik⁄Charger-3Ph
  min_version: 2026.7.4
  on_boot:
    then:
      - script.execute: display_inactivity_timer

esp32:
  variant: esp32s3

  flash_size: 16MB
  flash_mode: qio
  flash_frequency: 80MHz
  cpu_frequency: 240MHz

  toolchain: esp-idf

  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0
  logs:
    component: ERROR

web_server:
  version: 3

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Gerät wird dauerhaft versorgt -> maximale WLAN-Stabilität
  power_save_mode: none

  # 8 MB PSRAM auch für WiFi-Allokationen verwenden
  use_psram: true
  reboot_timeout: 0s

  ap:
    ssid: HG⁄DG⁄Technik⁄C Fallback Hotspot
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              ESP_LOGI("zeit", "Uhrzeit: %02d:%02d:%02d", id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second);
      - seconds: 0
        minutes: /1  # jede Minute
        then:
          - component.update: my_tft

debug:
  update_interval: 5s

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  reboot_timeout: 0s

i2c:
  - id: bus_a
    sda: GPIO10
    scl: GPIO9
    scan: true

spi:
  id: spi_bus
  clk_pin: GPIO13  # SCK
  mosi_pin: GPIO11 # SDI(MOSI)
  miso_pin: GPIO12 # SDO(MISI)

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: GPIO4  # LED
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Touchscreen XPT2046 (resistiv)
#touchscreen:
