  ###################################################################################################################################
  ##This Block must be added to enable voltage and currrent SET topics when using the mqtt: component
  ## Subscribe to MQTT topic to update CAN voltage
  # MQTT voltage command. Payload is parsed/validated and then published into set_dc_voltage_limit.
  - platform: mqtt_subscribe
    name: "CAN Voltage MQTT"
    id: mqtt_set_dc_voltage
    topic: "home/canbus/set_dc_voltage"
    internal: true  # This makes the sensor internal
    on_value:
      then:
        - delay: 0.01s  # Small delay to ensure the value is properly updated
        - lambda: |-
            // Convert MQTT message to float
            float mqtt_dc_voltage = atof(x.c_str());
            // Update the number input with the new value
            if (mqtt_dc_voltage >= 49.0 && mqtt_dc_voltage <= 58.0) {
              id(set_dc_voltage_limit).publish_state(mqtt_dc_voltage);
            } else {
              ESP_LOGW("custom", "Received out-of-range voltage value: %.1fV", mqtt_dc_voltage);
            }
  # Subscribe to MQTT topic to update current
  # MQTT current command. Payload is parsed/validated and then published into set_dc_current_limit.
  - platform: mqtt_subscribe
    name: "CAN Current MQTT"
    id: mqtt_set_dc_current
    topic: "home/canbus/set_dc_current"
    internal: true  # This makes the sensor internal
    on_value:
      then:
        - delay: 0.01s  # Small delay to ensure the value is properly updated
        - lambda: |-
            // Convert MQTT message to float
            float mqtt_dc_current = atof(x.c_str());
            // Update the number input with the new value
            if (mqtt_dc_current >= 1.0 && mqtt_dc_current <= 75.0) {
              id(set_dc_current_limit).publish_state(mqtt_dc_current);
            } else {
              ESP_LOGW("custom", "Received out-of-range current value: %.1fA", mqtt_dc_current);
            }
  # Subscribe to MQTT topic to update Fallback Voltage
  # MQTT fallback-voltage command feeding set_dc_voltage_limit_fallback.
  - platform: mqtt_subscribe
    name: "Fallback Voltage MQTT"
    id: mqtt_set_dc_voltage_fallback
    topic: "home/canbus/set_dc_voltage_fallback"
    internal: true  # This makes the sensor internal
    on_value:
      then:
        - delay: 0.01s  # Small delay to ensure the value is properly updated
        - lambda: |-
            // Convert MQTT message to float
            float fallback_voltage = atof(x.c_str());
            // Update the number input with the new value
            if (fallback_voltage >= 49.0 && fallback_voltage <= 58.0) {
              id(set_dc_voltage_limit_fallback).publish_state(fallback_voltage);
            } else {
              ESP_LOGW("custom", "Received out-of-range fallback voltage value: %.1fV", fallback_voltage);
            }
  # Subscribe to MQTT topic to update Fallback current
  # MQTT fallback-current command feeding set_dc_current_limit_fallback.
  - platform: mqtt_subscribe
    name: "Fallback Current MQTT"
    id: mqtt_set_dc_current_fallback
    topic: "home/canbus/set_dc_current_fallback"
    internal: true  # This makes the sensor internal
    on_value:
      then:
        - delay: 0.01s  # Small delay to ensure the value is properly updated
        - lambda: |-
            // Convert MQTT message to float
            float fallback_current = atof(x.c_str());
            // Update the number input with the new value
            if (fallback_current >= 1.0 && fallback_current <= 75.0) {
              id(set_dc_current_limit_fallback).publish_state(fallback_current);
            } else {
              ESP_LOGW("custom", "Received out-of-range fallback current value: %.1fA", fallback_current);
            }
