                "canbus",
                "Unit 3: Received CAN message 0x1083507E (Packet 6)"
              );

              const uint8_t pin11 =
                  static_cast<uint8_t>(x[2]);

              const uint8_t pin12 =
                  static_cast<uint8_t>(x[3]);

              ESP_LOGI(
                "canbus",
                "Unit 3: Pin 11: %u, Pin 12: %u",
                static_cast<unsigned>(pin11),
                static_cast<unsigned>(pin12)
              );

              id(pin11_3).publish_state(pin11);
              id(pin12_3).publish_state(pin12);

              if ((pin11 >= 1 && pin11 <= 4) &&
                  (pin12 >= 1 && pin12 <= 4)) {
                id(data_found_3) = true;
              }

      # Handler for CAN ID 0x1001117E (Packet x)
      # Alt Values Unit 1
      # ----------------------------------------------------------------------
      # CAN RX 0x1001117E
      # Unit 1 alternate-current and power-state frame. Maps state/error bytes to ON, OFF or ERROR.
      - can_id: 0x1001117E
        use_extended_id: true
        then:
          - lambda: |-
              static uint16_t last_alt_current_value_1 = 0;
              if (x.size() == 8) {
                // Extract data from the message
                const uint8_t state_byte = x[3];
                const uint8_t error_byte = x[4];
                const uint16_t alt_current_value =
                  (static_cast<uint16_t>(x[6]) << 8) |
                  static_cast<uint16_t>(x[7]);

                // Publish alt current value only if it has changed
                if (alt_current_value != last_alt_current_value_1) {
                  id(alt_dc_current_1).publish_state(alt_current_value);
                  last_alt_current_value_1 = alt_current_value;
                }

                // Determine the new power state
                std::string new_power_state;
                if (error_byte == 1) {
                  new_power_state = "ERROR";
                } else if (state_byte == 0) {
                  new_power_state = "ON";
                } else {
                  new_power_state = "OFF";
                }

                // Compare against the actual published sensor state instead of a separate
                // local cache. This allows the CAN watchdog to set the sensor to UNKNOWN
                // and ensures the next valid CAN frame restores ON/OFF/ERROR correctly.
                if (id(power_state_1).state != new_power_state) {
                  id(power_state_1).publish_state(new_power_state.c_str());
                }
              }

      # Handler for CAN ID 0x1002117E (Packet x)
      # Alt Values Unit 2
      # ----------------------------------------------------------------------
      # CAN RX 0x1002117E
      # Unit 2 alternate-current and power-state frame.
      - can_id: 0x1002117E
        use_extended_id: true
        then:
          - lambda: |-
              static uint16_t last_alt_current_value_2 = 0;
              if (x.size() == 8) {
                // Extract data from the message
                const uint8_t state_byte = x[3];
                const uint8_t error_byte = x[4];
                const uint16_t alt_current_value =
                  (static_cast<uint16_t>(x[6]) << 8) |
                  static_cast<uint16_t>(x[7]);

                // Publish alt current value only if it has changed
                if (alt_current_value != last_alt_current_value_2) {
                  id(alt_dc_current_2).publish_state(alt_current_value);
                  last_alt_current_value_2 = alt_current_value;
                }

                // Determine the new power state
                std::string new_power_state;
                if (error_byte == 1) {
                  new_power_state = "ERROR";
                } else if (state_byte == 0) {
                  new_power_state = "ON";
                } else {
                  new_power_state = "OFF";
                }

                // Compare against the actual published sensor state instead of a separate
                // local cache. This allows the CAN watchdog to set the sensor to UNKNOWN
                // and ensures the next valid CAN frame restores ON/OFF/ERROR correctly.
                if (id(power_state_2).state != new_power_state) {
                  id(power_state_2).publish_state(new_power_state.c_str());
                }
              }

      # Handler for CAN ID 0x1003117E (Packet x)
      # Alt Values Unit 3
      # ----------------------------------------------------------------------
      # CAN RX 0x1003117E
      # Unit 3 alternate-current and power-state frame.
      - can_id: 0x1003117E
        use_extended_id: true
        then:
          - lambda: |-
              static uint16_t last_alt_current_value_3 = 0;
              if (x.size() == 8) {
                // Extract data from the message
                const uint8_t state_byte = x[3];
                const uint8_t error_byte = x[4];
                const uint16_t alt_current_value =
                  (static_cast<uint16_t>(x[6]) << 8) |
                  static_cast<uint16_t>(x[7]);

                // Publish alt current value only if it has changed
                if (alt_current_value != last_alt_current_value_3) {
                  id(alt_dc_current_3).publish_state(alt_current_value);
                  last_alt_current_value_3 = alt_current_value;
                }

                // Determine the new power state
                std::string new_power_state;
                if (error_byte == 1) {
                  new_power_state = "ERROR";
                } else if (state_byte == 0) {
                  new_power_state = "ON";
                } else {
                  new_power_state = "OFF";
                }

                // Compare against the actual published sensor state instead of a separate
                // local cache. This allows the CAN watchdog to set the sensor to UNKNOWN
                // and ensures the next valid CAN frame restores ON/OFF/ERROR correctly.
                if (id(power_state_3).state != new_power_state) {
                  id(power_state_3).publish_state(new_power_state.c_str());
                }
              }

# ==============================================================================
# NUMERIC SENSORS
# ==============================================================================
# Contains controller diagnostics, rotary encoder input, all decoded numeric
# rectifier telemetry, CAN-aware aggregate power and daily energy counters.
sensor:
  # --------------------------------------------------------------------------
  # Heap Free
  # ESPHome internal diagnostics: free heap, largest block, loop time, free PSRAM and CPU frequency.
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"

  # --------------------------------------------------------------------------
  # ESP32 Internal Temperature Sensor
  # ESP32 controller-die temperature. This is not a rectifier temperature.
  - platform: internal_temperature
    name: "Controller CPU Temperature"
    id: cpu_temp
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    icon: mdi:thermometer

  # --------------------------------------------------------------------------
  # Uptime Sensor
  # Controller uptime in seconds since the last ESP32 boot.
  - platform: uptime
    type: seconds
    name: Uptime Sensor

  # --------------------------------------------------------------------------
  # WiFi RSSI
  # Wi-Fi RSSI diagnostic, also displayed in the TFT footer.
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_sig
    update_interval: 10s
    icon: mdi:wifi
    unit_of_measurement: "dBm"
    device_class: signal_strength

  # --------------------------------------------------------------------------
  # local_encoder
  # Physical local rotary encoder on GPIO17/GPIO18. In voltage mode it changes set_dc_voltage_limit and recalculates current to preserve total power; in power mode it changes dc_sum_power_set. Every movement wakes/restarts the backlight timer.
  - platform: rotary_encoder
    id: local_encoder

    pin_a:
      number: GPIO17
      mode:
        input: true
        pullup: true

    pin_b:
      number: GPIO18
      mode:
        input: true
        pullup: true

    resolution: 1
    internal: true

    on_clockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.increment:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.increment:
                  id: dc_sum_power_set
                  cycle: false
    on_anticlockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.decrement:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.decrement:
                  id: dc_sum_power_set
                  cycle: false

