# Board: Androegg ESP32-S3 UNO
# Unit: ESP32-S3-WROOM-1-N16R8
# Flash: 16 MB Quad SPI
# PSRAM: 8 MB Octal SPI

# ==============================================================================
# THREE-PHASE R4875G1 CHARGER CONTROLLER - ARCHITECTURE OVERVIEW
# ==============================================================================
# This ESPHome firmware controls three Huawei R4875G1 rectifier units used as
# a three-phase battery charger. Each rectifier is supplied from one AC phase;
# their DC outputs are connected in parallel to the same battery bus.
#
# DATA PATH
# ---------
#   R4875G1 Unit 1 / 2 / 3
#          |
#          | extended 29-bit CAN frames @ 125 kbit/s
#          v
#   ESP32-S3 CAN decoder
#          |
#          +--> individual unit telemetry sensors
#          |      AC/DC power, voltage, current, frequency, temperatures, state
#          |
#          +--> per-unit CAN watchdogs (can_com_ok_1..3)
#          |
#          +--> CAN-aware combined AC/DC power sensors
#          |
#          +--> TFT display / Home Assistant / MQTT
#
# LOCAL BLACKSTART CONTROL PATH
# -----------------------------
#   Rotary encoder + push button
#          |
#          +--> choose DC voltage or total DC power
#          +--> calculate equal current setpoint for all three units
#          +--> broadcast voltage/current setpoints over CAN
#          +--> long press starts/stops all units
#
# OFFLINE OPERATION
# -----------------
# Wi-Fi, MQTT and Home Assistant are optional for core charger operation.
# Network reboot timeouts are disabled so a dead or isolated site network cannot
# prevent the ESP32 from controlling the charger during a blackstart.
#
# CAN VALUE SCALING
# -----------------
# Most voltage/telemetry values use a fixed-point scale of 1024:
#     engineering_value = raw_CAN_value / 1024
#     raw_CAN_value     = engineering_value * 1024
#
# Current commands use current_scaling_factor. That factor is derived from the
# detected maximum-current capability of Unit 1.
#
# COMMUNICATION HEALTH
# --------------------
# Each valid cyclic telemetry frame refreshes last_can_rx_1..3. If no telemetry
# is seen from a unit for 3 seconds, its can_com_ok_x binary sensor becomes
# false. Display and combined-power logic then ignore stale values from that
# unit instead of presenting them as live data.
# ==============================================================================
# ==============================================================================
# ESPHOME DEVICE IDENTITY AND BOOT ACTIONS
# ==============================================================================
# Defines the device identity used by ESPHome/Home Assistant. The boot hook
# starts the display inactivity timer so the backlight will eventually switch off
# even if the user never touches the encoder after power-up.
esphome:
  name: hg-dg-technik-charger3ph
  friendly_name: HG|DG|Technik|Charger-3Ph
  min_version: 2026.7.4

  on_boot:
    then:
      # Until valid rectifier status frames have been received, the actual
      # power state of each unit is unknown.
      - lambda: |-
          id(power_state_1).publish_state("UNKNOWN");
          id(power_state_2).publish_state("UNKNOWN");
          id(power_state_3).publish_state("UNKNOWN");

      - script.execute: display_inactivity_timer

# ==============================================================================
# ESP32-S3 HARDWARE, FLASH AND FRAMEWORK
# ==============================================================================
# Hardware settings for the Androegg ESP32-S3 UNO / ESP32-S3-WROOM-1-N16R8:
# 16 MB Quad-SPI flash, 8 MB Octal PSRAM and 240 MHz CPU. ESP-IDF is used as the
# framework because it provides the native ESP32-S3 feature set used here.
esp32:
  variant: esp32s3

  flash_size: 16MB
  flash_mode: qio
  flash_frequency: 80MHz
  cpu_frequency: 240MHz

  toolchain: esp-idf

  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true

# ==============================================================================
# EXTERNAL PSRAM
# ==============================================================================
# Explicitly enables the unit's 8 MB Octal PSRAM at 80 MHz. The large TFT
# framebuffer and Wi-Fi allocations benefit significantly from this memory.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# ==============================================================================
# LOGGING
# ==============================================================================
# Runtime logs are sent over UART0 through the board's USB/UART interface.
# INFO provides useful diagnostics without the volume of full DEBUG logging.
logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0
  logs:
    canbus: WARN

# ==============================================================================
# LOCAL ESPHOME WEB SERVER
# ==============================================================================
# Exposes entities and controls directly from the ESP32 whenever IP networking
# is available. Local blackstart operation does not depend on this web server.
web_server:
  version: 3

# ==============================================================================
# HOME ASSISTANT NATIVE API
# ==============================================================================
# Encrypted ESPHome API. reboot_timeout is disabled deliberately: a missing
# Home Assistant instance must never reboot a charger needed for blackstart.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ==============================================================================
# OVER-THE-AIR FIRMWARE UPDATE
# ==============================================================================
# Enables normal ESPHome OTA updates after the first USB installation.
ota:
  - platform: esphome

# ==============================================================================
# WI-FI
# ==============================================================================
# Wi-Fi credentials come from secrets.yaml. Power saving is disabled for stable
# latency. reboot_timeout: 0s keeps the controller alive indefinitely when Wi-Fi
# is unavailable, which is essential for offline blackstart operation.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # The device is permanently powered: disable Wi-Fi power saving for maximum link stability.
  power_save_mode: none

  # Allow Wi-Fi buffers/allocations to use the available 8 MB PSRAM.
  use_psram: true
  reboot_timeout: 0s

  ap:
    ssid: 3PhCharger Fallback Hotspot
    password: !secret fallback_ap_password

# ==============================================================================
# FALLBACK CAPTIVE PORTAL
# ==============================================================================
# Works with the fallback access point above if the configured infrastructure
# Wi-Fi cannot be reached.
captive_portal:

# ==============================================================================
# TIME SYNCHRONIZATION
# ==============================================================================
# SNTP supplies Europe/Berlin local time for the TFT clock and daily energy
# integration. The minute callback also forces an occasional display refresh.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              ESP_LOGI("zeit", "Uhrzeit: %02d:%02d:%02d", id(sntp_time).now().hour, id(sntp_time).now().minute, id(sntp_time).now().second);
      - seconds: 0
        minutes: /1  # Refresh the display once per minute.
        then:
          - component.update: tft

# ==============================================================================
# ESPHOME DEBUG METRICS
# ==============================================================================
# Enables internal diagnostic values such as heap, loop timing, PSRAM and CPU
# frequency that are published further down in the sensor section.
debug:
  update_interval: 5s

# ==============================================================================
# MQTT CLIENT
# ==============================================================================
# Provides additional command topics besides the native API. MQTT is optional:
# reboot_timeout is disabled so broker failure cannot affect local charging.
mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  reboot_timeout: 0s

# ==============================================================================
# I2C BUS
# ==============================================================================
# I2C is reserved on GPIO10/GPIO9 with scanning enabled. GPIO8 is intentionally
# not used because the Androegg board has an onboard WS2812 connected there.
i2c:
  - id: bus_a
    sda: GPIO10
    scl: GPIO9
    scan: true

# ==============================================================================
# SPI BUS
# ==============================================================================
# Shared hardware SPI bus for the ILI9488 TFT and the optional XPT2046 touch
# controller. Each peripheral uses its own chip-select line.
spi:
  id: spi_bus
  clk_pin: GPIO13  # SCK
  mosi_pin: GPIO11 # SDI(MOSI)
  miso_pin: GPIO12 # SDO(MISI)

# Define a PWM output on the ESP32

# ==============================================================================
# DISPLAY BACKLIGHT PWM
# ==============================================================================
# LEDC hardware PWM on GPIO4 drives the TFT backlight brightness.
output:
  - platform: ledc
    pin: GPIO4  # LED
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight

# ==============================================================================
# DISPLAY BACKLIGHT LIGHT ENTITY
# ==============================================================================
# Wraps the PWM output as an ESPHome monochromatic light so automations can use
# brightness values and smooth transition/fade times.
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# Optional XPT2046 resistive touchscreen (currently disabled).
#touchscreen:
#  - platform: xpt2046
#    display: tft
#    id: touch
#    cs_pin: GPIO32  # Touch controller chip-select pin
#    interrupt_pin: GPIO33  # Optional IRQ pin
#    spi_id: spi_bus
