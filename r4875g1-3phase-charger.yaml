                // Publish every valid frame so the sensor timeout represents actual
                // communication freshness rather than value changes.
                id(alt_dc_current_2).publish_state(alt_current_value);

                // Determine the new power state
                std::string new_power_state;
                if (error_byte == 1) {
                  new_power_state = "ERROR";
                } else if (state_byte == 0) {
                  new_power_state = "ON";
                } else {
                  new_power_state = "OFF";
                }

                // Compare against the actual published sensor state instead of a separate
                // local cache. This allows the CAN watchdog to set the sensor to UNKNOWN
                // and ensures the next valid CAN frame restores ON/OFF/ERROR correctly.
                if (id(power_state_2).state != new_power_state) {
                  id(power_state_2).publish_state(new_power_state.c_str());
                }
              }

      # Handler for CAN ID 0x1003117E (Packet x)
      # Alt Values Unit 3
      # ----------------------------------------------------------------------
      # CAN RX 0x1003117E
      # Unit 3 alternate-current and power-state frame.
      - can_id: 0x1003117E
        use_extended_id: true
        then:
          - lambda: |-
              if (x.size() == 8) {
                // Extract data from the message
                const uint8_t state_byte = x[3];
                const uint8_t error_byte = x[4];
                const uint16_t alt_current_value =
                  (static_cast<uint16_t>(x[6]) << 8) |
                  static_cast<uint16_t>(x[7]);

                // Publish every valid frame so the sensor timeout represents actual
                // communication freshness rather than value changes.
                id(alt_dc_current_3).publish_state(alt_current_value);

                // Determine the new power state
                std::string new_power_state;
                if (error_byte == 1) {
                  new_power_state = "ERROR";
                } else if (state_byte == 0) {
                  new_power_state = "ON";
                } else {
                  new_power_state = "OFF";
                }

                // Compare against the actual published sensor state instead of a separate
                // local cache. This allows the CAN watchdog to set the sensor to UNKNOWN
                // and ensures the next valid CAN frame restores ON/OFF/ERROR correctly.
                if (id(power_state_3).state != new_power_state) {
                  id(power_state_3).publish_state(new_power_state.c_str());
                }
              }

# ==============================================================================
# NUMERIC SENSORS
# ==============================================================================
# Contains controller diagnostics, rotary encoder input, all decoded numeric
# rectifier telemetry, CAN-aware aggregate power and daily energy counters.
sensor:
  # --------------------------------------------------------------------------
  # ESPHome internal diagnostics
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

    block:
      name: "Heap Max Block"
      entity_category: diagnostic

    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

    psram:
      name: "Free PSRAM"
      entity_category: diagnostic

    cpu_frequency:
      name: "CPU Frequency"
      entity_category: diagnostic

  # --------------------------------------------------------------------------
  # ESP32 Internal Temperature Sensor
  - platform: internal_temperature
    name: "Controller CPU Temperature"
    id: cpu_temp
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    icon: "mdi:thermometer"

  # --------------------------------------------------------------------------
  # Uptime Sensor
  - platform: uptime
    type: seconds
    name: "Uptime"
    entity_category: diagnostic

  # --------------------------------------------------------------------------
  # WiFi RSSI
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_sig
    update_interval: 10s
    icon: "mdi:wifi"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic

  # --------------------------------------------------------------------------
  # Rectifier Compartment Temperature and Humidity
  #
  # AHT10 sensor installed in the shared rear connection compartment behind
  # the three rectifier units. The measured air is influenced by the warm
  # exhaust/airflow from all rectifiers and therefore represents the thermal
  # conditions inside the rectifier compartment rather than room temperature.
  #
  # The AHT10 uses I²C address 0x38.
  - platform: aht10
    variant: AHT10
    i2c_id: i2c_bus
    address: 0x38
    update_interval: 60s

    temperature:
      name: "Rectifier Compartment Temperature"
      id: rectifier_compartment_temperature
      accuracy_decimals: 1
      icon: "mdi:thermometer"

    humidity:
      name: "Rectifier Compartment Humidity"
      id: rectifier_compartment_humidity
      accuracy_decimals: 1
      icon: "mdi:water-percent"

  # --------------------------------------------------------------------------
  # local_encoder
  # Physical local rotary encoder on GPIO17/GPIO18. In voltage mode it changes set_dc_voltage_limit and recalculates current to preserve total power; in power mode it changes set_dc_sum_power. Every movement wakes/restarts the backlight timer.
  - platform: rotary_encoder
    id: local_encoder

    pin_a:
      number: GPIO17
      mode:
        input: true
        pullup: true

    pin_b:
      number: GPIO18
      mode:
        input: true
        pullup: true

    resolution: 1
    internal: true

    on_clockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.increment:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.increment:
                  id: set_dc_sum_power
                  cycle: false
    on_anticlockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.decrement:
                  id: set_dc_voltage_limit
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.decrement:
                  id: set_dc_sum_power
                  cycle: false

  # --------------------------------------------------------------------------
  # Input Temperature Unit 1
  # Rectifier input temperature decoded from cyclic CAN telemetry and scaled by 1/1024.
  - platform: template
    name: "Input Temperature Unit 1"
    id: input_temperature_1
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    # Updated exclusively by CAN publish_state() calls.
    # Disable the template sensor's own polling loop.
    update_interval: never
    filters:
