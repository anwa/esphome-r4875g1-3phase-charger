                switch (byte_0) {
                  case 0x01:
                    switch (byte_1) {
                      case 0x70: id(ac_power_in_sensor_1).publish_state(value); break;
                      case 0x71: id(grid_frequency_sensor_1).publish_state(value); break;
                      case 0x72: id(input_current_sensor_1).publish_state(value); break;
