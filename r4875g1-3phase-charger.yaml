# ==============================================================================
# HARDWARE GENERATION: V5
# ==============================================================================
# Board: Waveshare ESP32-S3-Touch-LCD-7
# Module: ESP32-S3 N16R8
# Flash: 16 MB
# PSRAM: 8 MB
#
# Integrated hardware:
#   - 7-inch 800x480 RGB IPS display
#   - GT911 capacitive touch controller
#   - CH422G I/O expander
#   - onboard CAN transceiver
#   - onboard RS485
#   - TF card interface
#   - native USB and USB-to-UART
#
# Planned external hardware:
#   - TCA9548A I2C multiplexer
#   - AHT10 compartment temperature/humidity sensor behind TCA9548A
#
# Deferred hardware:
#   - rotary encoder
#   - physical blackstart button
#   - external cooling fan PWM
#   - external cooling fan tachometer inputs
#
# V5 migration strategy:
#   Port the proven v4 charger functionality to the new hardware first.
#   Preserve the existing five-page UI functionality before redesigning it
#   for the larger 800x480 touch display.
# ==============================================================================

# ==============================================================================
# THREE-PHASE R4875G1 CHARGER CONTROLLER - ARCHITECTURE OVERVIEW
# ==============================================================================
# This ESPHome firmware controls three Huawei R4875G1 rectifier units used as
# a three-phase battery charger. Each rectifier is supplied from one AC phase;
# their DC outputs are connected in parallel to the same battery bus.
#
# DATA PATH
# ---------
#   R4875G1 Unit 1 / 2 / 3
#          |
#          | extended 29-bit CAN frames @ 125 kbit/s
#          v
#   ESP32-S3 CAN decoder
#          |
#          +--> individual unit telemetry sensors
#          |      AC/DC power, voltage, current, frequency, temperatures, state
#          |
#          +--> per-unit CAN watchdogs (can_com_ok_1..3)
#          |
#          +--> CAN-aware combined AC/DC power sensors
#          |
#          +--> TFT display / Home Assistant / MQTT
#
# LOCAL BLACKSTART CONTROL PATH
# -----------------------------
#   Rotary encoder + push button
#          |
#          +--> choose DC voltage or nominal three-unit DC power target
#          +--> calculate the common per-unit current setpoint from that target
#          +--> apply active voltage/current setpoints only to verified ONLINE units
#          +--> long press starts/stops all units
#
# OFFLINE OPERATION
# -----------------
# Wi-Fi, MQTT and Home Assistant are optional for core charger operation.
# Network reboot timeouts are disabled so a dead or isolated site network cannot
# prevent the ESP32 from controlling the charger during a blackstart.
#
# CAN VALUE SCALING
# -----------------
# Most voltage/telemetry values use a fixed-point scale of 1024:
#     engineering_value = raw_CAN_value / 1024
#     raw_CAN_value     = engineering_value * 1024
#
# Current commands use current_scaling_factor.
# The controller starts with the known 75 A R4875G1 fallback value
# (1024 / 75 = 13.653333) and automatically refreshes the factor from
# Unit 1's detected maximum-current capability whenever Unit 1 becomes
# available on the CAN bus.
#
# COMMUNICATION HEALTH
# --------------------
# Valid per-unit CAN activity refreshes last_can_rx_1..3. During normal
# operation cyclic telemetry provides the heartbeat; valid property frames also
# refresh it while discovery temporarily suspends cyclic polling.
#
# If no valid CAN activity is received within can_watchdog_timeout_ms,
# can_com_ok_x becomes false. Display and aggregate logic then ignore stale
# values from that unit.
# ==============================================================================
# ==============================================================================
# ESPHOME DEVICE IDENTITY AND BOOT ACTIONS
# ==============================================================================
# Defines the device identity used by ESPHome/Home Assistant. The boot hook
# starts the display inactivity timer so the backlight will eventually switch off
# even if the user never touches the encoder after power-up.
substitutions:
  # Firmware version is defined once in packages/version.yaml.
  mqtt_command_prefix: "HG/DG/Technik/Charger"

  # --------------------------------------------------------------------------
  # LEGACY V4 GPIO MAP - TEMPORARY DURING V5 MIGRATION
  # --------------------------------------------------------------------------
  # These assignments belong to the former ESP32-S3-DevKitC-1 hardware.
  #
  # They are intentionally retained during the first v5 migration commits so
  # existing package references remain resolvable while the new Waveshare
  # hardware layer is introduced incrementally.
  #
  # Do NOT use these assignments as the v5 hardware definition.
  # Each legacy pin will be removed or replaced as its subsystem is migrated.
  pin_encoder_button: "GPIO2"
  pin_tft_backlight: "GPIO4"
  pin_tft_cs: "GPIO5"
  pin_tft_reset: "GPIO6"
  pin_tft_dc: "GPIO7"
  pin_i2c_sda: "GPIO8"
  pin_i2c_scl: "GPIO9"
  pin_spi_mosi: "GPIO11"
  pin_spi_miso: "GPIO12"
  pin_spi_clk: "GPIO13"
  pin_can_tx: "GPIO15"
  pin_can_rx: "GPIO16"
  pin_encoder_a: "GPIO17"
  pin_encoder_b: "GPIO18"
  pin_fan_enable: "GPIO21"
  pin_fan3_tach: "GPIO39"
  pin_fan2_tach: "GPIO40"
  pin_fan1_tach: "GPIO41"
  pin_fan_pwm: "GPIO42"

  # --------------------------------------------------------------------------
  # V5 WAVESHARE BOARD GPIO MAP
  # --------------------------------------------------------------------------
  #
  # RGB LCD - reserved by onboard display:
  #   GPIO0   LCD G3
  #   GPIO1   LCD R3
  #   GPIO2   LCD R4
  #   GPIO3   LCD VSYNC
  #   GPIO5   LCD DE
  #   GPIO7   LCD PCLK
  #   GPIO10  LCD B7
  #   GPIO14  LCD B3
  #   GPIO17  LCD B6
  #   GPIO18  LCD B5
  #   GPIO21  LCD G7
  #   GPIO38  LCD B4
  #   GPIO39  LCD G2
  #   GPIO40  LCD R7
  #   GPIO41  LCD R6
  #   GPIO42  LCD R5
  #   GPIO45  LCD G4
  #   GPIO46  LCD HSYNC
  #   GPIO47  LCD G6
  #   GPIO48  LCD G5
  #
  # Touch / shared I2C:
  #   GPIO4   GT911 interrupt
  #   GPIO8   I2C SDA
  #   GPIO9   I2C SCL
  #
  # CAN / native USB shared pins:
  #   GPIO19  CAN RX / USB D-
  #   GPIO20  CAN TX / USB D+
  #
  # TF card:
  #   GPIO11  MOSI
  #   GPIO12  SCK
  #   GPIO13  MISO
  #
  # RS485:
  #   GPIO15  TX
  #   GPIO16  RX
  #
  # CH422G:
  #   EXIO1   GT911 reset
  #   EXIO2   display/backlight enable
  #   EXIO4   TF card CS
  #   EXIO5   USB/CAN selection
  #
  # External I2C expansion:
  #   TCA9548A @ 0x70
  #     Channel 0 -> AHT10 @ 0x38

  # --------------------------------------------------------------------------
  # External cooling-fan defaults
  # --------------------------------------------------------------------------
  cooling_fan_pwm_frequency: "25000Hz"
  cooling_fan_default_pwm_percent: "100.0"
  cooling_fan_tach_pulses_per_revolution: "2.0"

  # --------------------------------------------------------------------------
  # Project-wide operating limits
  # --------------------------------------------------------------------------
  # Absolute supported project ceiling.
  project_max_dc_current_a: "75.0"
  # Conservative current ceiling until every currently reachable rectifier
  # has a freshly confirmed maximum-current capability.
  failsafe_dc_current_a: "50.0"
  minimum_dc_current_a: "1.0"

  dc_voltage_min_v: "49.0"
  dc_voltage_max_v: "58.0"
  dc_voltage_default_v: "53.0"

  # Thermal derating thresholds and hysteresis.
  thermal_warn1_c: "70.0"
  thermal_warn1_reset_c: "65.0"
  thermal_warn1_limit_a: "50.0"

  thermal_warn2_c: "80.0"
  thermal_warn2_reset_c: "75.0"
  thermal_warn2_limit_a: "30.0"

  overtemp_trip_c: "90.0"
  overtemp_reset_c: "80.0"

  # Internal thermal-state codes.
  thermal_state_normal: "0"
  thermal_state_warn1: "1"
  thermal_state_warn2: "2"
  thermal_state_lockout: "3"

  efficiency_min_ac_power_w: "100.0"

  # --------------------------------------------------------------------------
  # Protocol scaling
  # --------------------------------------------------------------------------
  protocol_value_scale: "1024"
  fan_duty_counts_per_percent: "256.0"

  # --------------------------------------------------------------------------
  # Rectifier control-state codes
  # --------------------------------------------------------------------------
  # Internal lifecycle state used independently for each rectifier.
  #
  # OFFLINE:
  #   No usable communication / unit not operationally released.
  #
  # DISCOVERING:
  #   CAN communication has been detected, but discovery and validation have
  #   not yet completed.
  #
  # ONLINE:
  #   Discovery completed successfully and the unit is ready for normal
  #   operational handling.
  rectifier_state_offline: "0"
  rectifier_state_discovering: "1"
  rectifier_state_online: "2"

  # --------------------------------------------------------------------------
  # CAN communication buffering
  # --------------------------------------------------------------------------
  can_rx_queue_len: "64"

  # --------------------------------------------------------------------------
  # CAN communication timing
  # --------------------------------------------------------------------------
  # Normal runtime CAN watchdog.
  can_watchdog_timeout_ms: "3000"

  # Grace period after property discovery so normal cyclic polling has enough
  # time to resume before lifecycle connectivity is evaluated again.
  property_poll_resume_grace_ms: "2000"

  live_telemetry_timeout: "5s"

  telemetry_poll_interval: "577ms"
  fan_query_delay: "27ms"
  unit_2_poll_gap: "156ms"
  unit_3_poll_gap: "166ms"

  # Offline rectifiers are probed round-robin. One unit is considered every
  # five seconds, resulting in a maximum probe interval of approximately
  # 15 seconds per offline rectifier.
  offline_probe_slot_interval: "5s"

  can_recovery_check_interval: "2s"

  setpoint_refresh_interval: "30s"

  # --------------------------------------------------------------------------
  # Discovery retry policy
  # --------------------------------------------------------------------------
  property_discovery_attempts: "3"
  capability_discovery_attempts: "10"
  discovery_retry_delay: "1s"
  discovery_startup_delay: "5s"
  property_bus_quiet_delay: "500ms"

packages:
  version: !include packages/version.yaml
  core: !include packages/core.yaml

esphome:
  name: hg-dg-technik-charger
  friendly_name: HG|DG|Technik|Charger
  min_version: 2026.8.2

  project:
    name: "anwa.r4875-charger"
    version: "${firmware_version}"

# ==============================================================================
# PROJECT-WIDE / AGGREGATE SENSORS
# ==============================================================================
# Controller diagnostics, shared compartment/environment input, local encoder
# input and charger-wide aggregate telemetry that do not belong to one package
# or one parameterized rectifier instance.

# ==============================================================================
# PROJECT-WIDE BINARY SENSORS
# ==============================================================================
# Local physical push button and charger-wide capability diagnostics.

# ==============================================================================
# PROJECT-WIDE TEXT / STATUS SENSORS
# ==============================================================================
# Network/controller diagnostics that are shared by the assembled device.
