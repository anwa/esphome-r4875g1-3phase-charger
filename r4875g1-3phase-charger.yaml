                      case 0x76: id(set_max_output_current_sensor_1).publish_state(value); break;
                      case 0x78: id(input_grid_voltage_sensor_1).publish_state(value); break;
                      case 0x7F: id(output_temperature_sensor_1).publish_state(value); break;
                      case 0x81: id(output_current_sensor_1).publish_state(value); break;
