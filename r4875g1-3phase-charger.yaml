    type: seconds
    name: Uptime Sensor

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_sig
    update_interval: 10s
    icon: mdi:wifi
    unit_of_measurement: "dBm"
    device_class: signal_strength

  - platform: rotary_encoder
    id: local_encoder

    pin_a:
      number: GPIO17
      mode:
        input: true
        pullup: true

    pin_b:
      number: GPIO18
      mode:
        input: true
        pullup: true

    resolution: 1
    internal: true

    on_clockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.increment:
                  id: can_voltage_set
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.increment:
                  id: dc_sum_power_set
                  cycle: false
    on_anticlockwise:
      then:
        - script.execute: display_inactivity_timer

        - if:
            condition:
              lambda: 'return id(encoder_mode) == 0;'
            then:
              - number.decrement:
                  id: can_voltage_set
                  cycle: false
              - script.execute: apply_dc_sum_power
            else:
              - number.decrement:
                  id: dc_sum_power_set
