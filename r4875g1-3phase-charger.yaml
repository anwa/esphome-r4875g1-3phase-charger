# ==============================================================================
# DISPLAY COLORS
# ==============================================================================
# Named colors used by the TFT lambda for normal text, warnings, healthy state
# and the currently selected encoder parameter.
color:
  # Normal text on the white background.
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  # Faults/warnings and DC-output emphasis.
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  # Healthy/running state and the setpoint-section heading.
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  # AC emphasis, partial-state information and active encoder selection.
  - id: color_blue
    red: 0%
    green: 0%
    blue: 100%
