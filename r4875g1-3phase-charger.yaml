# ==============================================================================
# HARDWARE GENERATION: V5
# ==============================================================================
# Board: Waveshare ESP32-S3-Touch-LCD-7
# Module: ESP32-S3 N16R8
# Flash: 16 MB
# PSRAM: 8 MB
#
# Integrated hardware:
#   - 7-inch 800x480 RGB IPS display
#   - GT911 capacitive touch controller
#   - CH422G I/O expander
#   - onboard CAN transceiver
#   - onboard RS485
#   - TF card interface
#   - native USB and USB-to-UART
#
# External I2C hardware:
#   - TCA9548A I2C multiplexer @ 0x70
#   - MCP23017 I/O expander @ 0x20 on TCA channel 0
#   - AHT10 compartment temperature/humidity sensor @ 0x38 on TCA channel 1
#
# Deferred hardware:
#   - physical blackstart button
#   - external cooling fan PWM
#   - external cooling fan tachometer inputs
#
# V5 migration strategy:
#   Port the proven v4 charger functionality to the new hardware first.
#   Preserve the existing five-page UI functionality before redesigning it
#   for the larger 800x480 touch display.
# ==============================================================================

# ==============================================================================
# THREE-PHASE R4875G1 CHARGER CONTROLLER - ARCHITECTURE OVERVIEW
# ==============================================================================
# This ESPHome firmware controls three Huawei R4875G1 rectifier units used as
# a three-phase battery charger. Each rectifier is supplied from one AC phase;
# their DC outputs are connected in parallel to the same battery bus.
#
# DATA PATH
# ---------
#   R4875G1 Unit 1 / 2 / 3
#          |
#          | extended 29-bit CAN frames @ 125 kbit/s
#          v
#   ESP32-S3 CAN decoder
#          |
#          +--> individual unit telemetry sensors
#          |      AC/DC power, voltage, current, frequency, temperatures, state
#          |
#          +--> per-unit CAN watchdogs (can_com_ok_1..3)
#          |
#          +--> CAN-aware combined AC/DC power sensors
#          |
#          +--> TFT display / Home Assistant / MQTT
#
# LOCAL BLACKSTART CONTROL PATH
# -----------------------------
#   Rotary encoder + push button
#          |
#          +--> choose DC voltage or nominal three-unit DC power target
#          +--> calculate the common per-unit current setpoint from that target
#          +--> apply active voltage/current setpoints only to verified ONLINE units
#          +--> long press starts/stops all units
#
# OFFLINE OPERATION
# -----------------
# Wi-Fi, MQTT and Home Assistant are optional for core charger operation.
# Network reboot timeouts are disabled so a dead or isolated site network cannot
# prevent the ESP32 from controlling the charger during a blackstart.
#
# CAN VALUE SCALING
# -----------------
# Most voltage/telemetry values use a fixed-point scale of 1024:
#     engineering_value = raw_CAN_value / 1024
#     raw_CAN_value     = engineering_value * 1024
#
# Current commands use current_scaling_factor.
# The controller starts with the known 75 A R4875G1 fallback value
# (1024 / 75 = 13.653333) and automatically refreshes the factor from
# Unit 1's detected maximum-current capability whenever Unit 1 becomes
# available on the CAN bus.
#
# COMMUNICATION HEALTH
# --------------------
# Valid per-unit CAN activity refreshes last_can_rx_1..3. During normal
# operation cyclic telemetry provides the heartbeat; valid property frames also
# refresh it while discovery temporarily suspends cyclic polling.
#
# If no valid CAN activity is received within can_watchdog_timeout_ms,
# can_com_ok_x becomes false. Display and aggregate logic then ignore stale
# values from that unit.
# ==============================================================================

substitutions:
  # Firmware version is defined once in packages/version.yaml.
  mqtt_command_prefix: "HG/DG/Technik/Charger"

  # --------------------------------------------------------------------------
  # V5 ACTIVE GPIO MAP
  # --------------------------------------------------------------------------
  pin_touch_irq: "GPIO4"
  pin_i2c_sda: "GPIO8"
  pin_i2c_scl: "GPIO9"
  pin_can_tx: "GPIO20"
  pin_can_rx: "GPIO19"
  pin_mcp_interrupt: "GPIO6"

  pin_fan_enable: "GPIO21"
  pin_fan3_tach: "GPIO39"
  pin_fan2_tach: "GPIO40"
  pin_fan1_tach: "GPIO41"
  pin_fan_pwm: "GPIO42"

  # --------------------------------------------------------------------------
  # V5 WAVESHARE BOARD GPIO MAP
  # --------------------------------------------------------------------------
  #
  # RGB LCD - reserved by onboard display:
  #   GPIO0   LCD G3
  #   GPIO1   LCD R3
  #   GPIO2   LCD R4
  #   GPIO3   LCD VSYNC
  #   GPIO5   LCD DE
  #   GPIO7   LCD PCLK
  #   GPIO10  LCD B7
  #   GPIO14  LCD B3
  #   GPIO17  LCD B6
  #   GPIO18  LCD B5
  #   GPIO21  LCD G7
  #   GPIO38  LCD B4
  #   GPIO39  LCD G2
  #   GPIO40  LCD R7
  #   GPIO41  LCD R6
  #   GPIO42  LCD R5
  #   GPIO45  LCD G4
  #   GPIO46  LCD HSYNC
  #   GPIO47  LCD G6
  #   GPIO48  LCD G5
  #
  # Touch / shared I2C:
  #   GPIO4   GT911 interrupt
  #   GPIO8   I2C SDA
  #   GPIO9   I2C SCL
  #
  # CAN / native USB shared pins:
  #   GPIO19  CAN RX / USB D-
  #   GPIO20  CAN TX / USB D+
  #
  # TF card:
  #   GPIO11  MOSI
  #   GPIO12  SCK
  #   GPIO13  MISO
  #
  # RS485:
  #   GPIO15  TX
  #   GPIO16  RX
  #
  # CH422G:
  #   EXIO1   GT911 reset
  #   EXIO2   display/backlight enable
  #   EXIO4   TF card CS
  #   EXIO5   USB/CAN selection
  #
  # External I2C expansion:
  #   TCA9548A @ 0x70
  #     Channel 0 -> MCP23017 @ 0x20
  #       GPA0 -> rotary encoder A
  #       GPA1 -> rotary encoder B
  #       GPA2 -> rotary encoder button
  #     Channel 1 -> AHT10 @ 0x38
  #
  # External GPIO:
  #   GPIO6 -> reserved for optional MCP23017 interrupt input

  # --------------------------------------------------------------------------
  # External cooling-fan defaults
  # --------------------------------------------------------------------------
  cooling_fan_pwm_frequency: "25000Hz"
  cooling_fan_default_pwm_percent: "100.0"
  cooling_fan_tach_pulses_per_revolution: "2.0"

  # --------------------------------------------------------------------------
  # Project-wide operating limits
  # --------------------------------------------------------------------------
  # Absolute supported project ceiling.
  project_max_dc_current_a: "75.0"
  # Conservative current ceiling until every currently reachable rectifier
  # has a freshly confirmed maximum-current capability.
  failsafe_dc_current_a: "50.0"
  minimum_dc_current_a: "1.0"

  dc_voltage_min_v: "49.0"
  dc_voltage_max_v: "58.0"
  dc_voltage_default_v: "53.0"

  # Thermal derating thresholds and hysteresis.
  thermal_warn1_c: "70.0"
  thermal_warn1_reset_c: "65.0"
  thermal_warn1_limit_a: "50.0"

  thermal_warn2_c: "80.0"
  thermal_warn2_reset_c: "75.0"
  thermal_warn2_limit_a: "30.0"

  overtemp_trip_c: "90.0"
  overtemp_reset_c: "80.0"

  # Internal thermal-state codes.
  thermal_state_normal: "0"
  thermal_state_warn1: "1"
  thermal_state_warn2: "2"
  thermal_state_lockout: "3"

  efficiency_min_ac_power_w: "100.0"

  # --------------------------------------------------------------------------
  # Protocol scaling
  # --------------------------------------------------------------------------
  protocol_value_scale: "1024"
  fan_duty_counts_per_percent: "256.0"

  # --------------------------------------------------------------------------
  # Rectifier control-state codes
  # --------------------------------------------------------------------------
  # Internal lifecycle state used independently for each rectifier.
  #
  # OFFLINE:
  #   No usable communication / unit not operationally released.
  #
  # DISCOVERING:
  #   CAN communication has been detected, but discovery and validation have
  #   not yet completed.
  #
  # ONLINE:
  #   Discovery completed successfully and the unit is ready for normal
  #   operational handling.
  rectifier_state_offline: "0"
  rectifier_state_discovering: "1"
  rectifier_state_online: "2"

  # --------------------------------------------------------------------------
  # CAN communication buffering
  # --------------------------------------------------------------------------
  can_rx_queue_len: "64"

  # --------------------------------------------------------------------------
  # CAN communication timing
  # --------------------------------------------------------------------------
  # Normal runtime CAN watchdog.
  can_watchdog_timeout_ms: "3000"

  # Grace period after property discovery so normal cyclic polling has enough
  # time to resume before lifecycle connectivity is evaluated again.
  property_poll_resume_grace_ms: "2000"

  live_telemetry_timeout: "5s"

  telemetry_poll_interval: "577ms"
  fan_query_delay: "27ms"
  unit_2_poll_gap: "156ms"
  unit_3_poll_gap: "166ms"

  # Offline rectifiers are probed round-robin. One unit is considered every
  # five seconds, resulting in a maximum probe interval of approximately
  # 15 seconds per offline rectifier.
  offline_probe_slot_interval: "5s"

  can_recovery_check_interval: "2s"

  setpoint_refresh_interval: "30s"

  # --------------------------------------------------------------------------
  # Discovery retry policy
  # --------------------------------------------------------------------------
  property_discovery_attempts: "3"
  capability_discovery_attempts: "10"
  discovery_retry_delay: "1s"
  discovery_startup_delay: "5s"
  property_bus_quiet_delay: "500ms"

packages:
  version: !include packages/version.yaml
  core: !include packages/core.yaml
  hardware: !include packages/hardware.yaml
  display: !include packages/display.yaml

  controls: !include packages/controls.yaml
  rectifier_shared: !include packages/rectifier-shared.yaml

  rectifier_unit_1: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "1"

  rectifier_unit_2: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "2"

  rectifier_unit_3: !include
    file: packages/rectifier-unit.yaml
    vars:
      ru_unit: "3"

# ==============================================================================
# ESPHOME DEVICE IDENTITY AND BOOT ACTIONS
# ==============================================================================
# Defines the device identity used by ESPHome/Home Assistant.
# The boot hook initializes rectifier lifecycle and shared diagnostic states.
esphome:
  name: hg-dg-technik-charger
  friendly_name: HG|DG|Technik|Charger
  min_version: 2026.8.2

  project:
    name: "anwa.r4875-charger"
    version: "${firmware_version}"

  includes:
    - trend_helpers.h

  platformio_options:
    build_flags:
      - -D LV_USE_CHART=1

  on_boot:
    then:
      # Until valid rectifier status frames have been received, the actual
      # power state of each unit is unknown.
      - lambda: |-
          id(power_state_1).publish_state("UNKNOWN");
          id(power_state_2).publish_state("UNKNOWN");
          id(power_state_3).publish_state("UNKNOWN");

          id(thermal_state_text_1).publish_state("NORMAL");
          id(thermal_state_text_2).publish_state("NORMAL");
          id(thermal_state_text_3).publish_state("NORMAL");

          // Publish the conservative 50 A failsafe ceiling until the
          // capabilities of all currently reachable rectifiers are known.
          id(effective_dc_current_limit_sensor).publish_state(
            id(effective_dc_current_limit)
          );

      # Every rectifier starts in OFFLINE control state after an ESP reboot.
      # A unit must be detected and successfully discovered before it can later
      # transition to ONLINE.
      - script.execute:
          id: set_rectifier_control_state
          unit: 1
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 2
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 3
          state: ${rectifier_state_offline}

# ==============================================================================
# PROJECT-WIDE / AGGREGATE SENSORS
# ==============================================================================
# Controller diagnostics, shared compartment/environment input, local encoder
# input and charger-wide aggregate telemetry that do not belong to one package
# or one parameterized rectifier instance.
sensor:
  # --------------------------------------------------------------------------
  # ESPHome Runtime Diagnostics
  # --------------------------------------------------------------------------
  - platform: debug
    free:
      name: "Heap Free"
      id: debug_heap_free
      entity_category: diagnostic
      icon: "mdi:memory"

      on_value:
        then:
          - lvgl.label.update:
              id: ui_system_heap
              text: !lambda |-
                if (isnan(x)) {
                  return std::string("---- kB");
                }

                return str_sprintf(
                  "%.0f kB",
                  x / 1024.0f
                );

    block:
      name: "Heap Max Block"
      id: debug_heap_max_block
      entity_category: diagnostic
      icon: "mdi:memory"

      on_value:
        then:
          - lvgl.label.update:
              id: ui_system_heap_block
              text: !lambda |-
                if (isnan(x)) {
                  return std::string("---- kB");
                }

                return str_sprintf(
                  "%.0f kB",
                  x / 1024.0f
                );

    loop_time:
      name: "Loop Time"
      id: debug_loop_time
      entity_category: diagnostic
      icon: "mdi:timer-outline"

      on_value:
        then:
          - lvgl.label.update:
              id: ui_system_loop_time
              text: !lambda |-
                if (isnan(x)) {
                  return std::string("-- ms");
                }

                return str_sprintf(
                  "%.0f ms",
                  x
                );

    psram:
      name: "Free PSRAM"
      id: debug_free_psram
      entity_category: diagnostic
      icon: "mdi:memory"

      on_value:
        then:
          - lvgl.label.update:
              id: ui_system_psram
              text: !lambda |-
                if (isnan(x)) {
                  return std::string("---- kB");
                }

                return str_sprintf(
                  "%.0f kB",
                  x / 1024.0f
                );

    cpu_frequency:
      name: "CPU Frequency"
      id: debug_cpu_frequency
      entity_category: diagnostic
      icon: "mdi:speedometer"

      on_value:
        then:
          - lvgl.label.update:
              id: ui_system_cpu_frequency
              text: !lambda |-
                if (isnan(x)) {
                  return std::string("--- MHz");
                }

                return str_sprintf(
                  "%.0f MHz",
                  x / 1000000.0f
                );

  # --------------------------------------------------------------------------
  # Controller CPU Temperature
  - platform: internal_temperature
    name: "Controller CPU Temperature"
    id: cpu_temp
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 10s
    icon: "mdi:thermometer"

  # --------------------------------------------------------------------------
  # Controller Uptime
  - platform: uptime
    type: seconds
    name: "Uptime"
    id: debug_uptime
    entity_category: diagnostic
    icon: "mdi:timer-outline"

    on_value:
      then:
        - lvgl.label.update:
            id: ui_system_uptime
            text: !lambda |-
              if (isnan(x)) {
                return std::string("--");
              }

              const uint32_t seconds =
                static_cast<uint32_t>(x);

              const uint32_t days =
                seconds / 86400U;

              const uint32_t hours =
                (seconds % 86400U) / 3600U;

              const uint32_t minutes =
                (seconds % 3600U) / 60U;

              if (days > 0) {
                return str_sprintf(
                  "%lu d %02lu:%02lu",
                  static_cast<unsigned long>(days),
                  static_cast<unsigned long>(hours),
                  static_cast<unsigned long>(minutes)
                );
              }

              return str_sprintf(
                "%02lu:%02lu",
                static_cast<unsigned long>(hours),
                static_cast<unsigned long>(minutes)
              );

  # --------------------------------------------------------------------------
  # Wi-Fi RSSI
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_sig
    unit_of_measurement: "dBm"
    device_class: signal_strength
    entity_category: diagnostic
    update_interval: 10s
    icon: "mdi:wifi"

  # --------------------------------------------------------------------------
  # Rectifier Compartment Temperature and Humidity
  #
  # AHT10 installed in the shared rear connection compartment behind the
  # three rectifier units.
  #
  # Connected through:
  #   main I2C -> TCA9548A channel 1 -> AHT10 @ 0x38
  # --------------------------------------------------------------------------
  - platform: aht10
    variant: AHT10
    i2c_id: external_i2c_ch1
    update_interval: 60s

    temperature:
      name: "Rectifier Compartment Temperature"
      id: rectifier_compartment_temperature
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
      icon: "mdi:thermometer"

    humidity:
      name: "Rectifier Compartment Humidity"
      id: rectifier_compartment_humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
      icon: "mdi:water-percent"

  # --------------------------------------------------------------------------
  # local_encoder
  #
  # Page-aware SELECT / EDIT controller.
  #
  # SELECT:
  #   Dashboard  -> select Voltage / Power
  #   Rectifiers -> select L1 / L2 / L3 and open detail with short press
  #   Cooling    -> select Automatic and, in manual mode, Power / PWM
  #   System     -> no selectable parameters
  #   Trends     -> select displayed trend
  #
  # EDIT:
  #   Rotation changes only encoder_edit_value.
  #   No real entity is changed until the confirming short press.


  # --------------------------------------------------------------------------
  # Effective DC Current Limit
  # Runtime hardware/capability ceiling shared by all active-current paths.
  - platform: template
    name: "Effective DC Current Limit"
    id: effective_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never
    icon: "mdi:current-dc"

  # --------------------------------------------------------------------------
  # Thermal / applied current diagnostics
  # --------------------------------------------------------------------------
  - platform: template
    name: "Thermal DC Current Limit"
    id: thermal_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 1s
    lambda: 'return id(thermal_dc_current_limit);'
    icon: "mdi:thermometer-alert"

  - platform: template
    name: "Applied DC Current Limit"
    id: applied_dc_current_limit_sensor
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const float requested = id(set_dc_current_limit).state;
      if (isnan(requested)) return NAN;
      float applied = std::min(requested, id(effective_dc_current_limit));
      applied = std::min(applied, id(thermal_dc_current_limit));
      return applied;
    icon: "mdi:current-dc"

  # --------------------------------------------------------------------------
  # Combined AC Power All Units
  # CAN-aware AC-input power total from reachable units with valid telemetry.
  - platform: template
    name: "Combined AC Power All Units"
    id: combined_ac_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    filters:
      - multiply: 0.001
    lambda: |-
      float power = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(ac_power_1).state)) {
        power += id(ac_power_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(ac_power_2).state)) {
        power += id(ac_power_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(ac_power_3).state)) {
        power += id(ac_power_3).state;
        valid_units++;
      }

      // No valid CAN data available
      if (valid_units == 0) {
        return NAN;
      }

      return power;
    icon: "mdi:flash"

  # --------------------------------------------------------------------------
  # Combined DC Power All Units
  # CAN-aware DC power total with the same stale-data protection as the AC total. The lambda sums watts and the multiply filter converts W to kW.
  - platform: template
    name: "Combined DC Power All Units"
    id: combined_dc_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    filters:
      - multiply: 0.001
    lambda: |-
      float power = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(dc_power_1).state)) {
        power += id(dc_power_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(dc_power_2).state)) {
        power += id(dc_power_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(dc_power_3).state)) {
        power += id(dc_power_3).state;
        valid_units++;
      }

      // No valid CAN data available
      if (valid_units == 0) {
        return NAN;
      }

      return power;
    icon: "mdi:flash"

  # --------------------------------------------------------------------------
  # Available Units
  # Number of rectifier units currently providing valid CAN communication.
  - platform: template
    name: "Available Units"
    id: available_units
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      int count = 0;

      if (id(can_com_ok_1).state) {
        count++;
      }

      if (id(can_com_ok_2).state) {
        count++;
      }

      if (id(can_com_ok_3).state) {
        count++;
      }

      return count;
    icon: "mdi:server-network"

  # --------------------------------------------------------------------------
  # Combined DC Current All Units
  # Sum of DC output current from all reachable rectifiers with valid telemetry.
  - platform: template
    name: "Combined DC Current All Units"
    id: combined_dc_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      float current = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(dc_current_1).state)) {
        current += id(dc_current_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(dc_current_2).state)) {
        current += id(dc_current_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(dc_current_3).state)) {
        current += id(dc_current_3).state;
        valid_units++;
      }

      if (valid_units == 0) {
        return NAN;
      }

      return current;
    icon: "mdi:current-dc"

  # --------------------------------------------------------------------------
  # Average DC Voltage All Units
  # Average DC output voltage across all reachable rectifiers.
  # The rectifier outputs are connected in parallel, so their voltages should
  # normally be nearly identical.
  - platform: template
    name: "Average DC Voltage All Units"
    id: average_dc_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      float voltage = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(dc_voltage_1).state)) {
        voltage += id(dc_voltage_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(dc_voltage_2).state)) {
        voltage += id(dc_voltage_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(dc_voltage_3).state)) {
        voltage += id(dc_voltage_3).state;
        valid_units++;
      }

      if (valid_units == 0) {
        return NAN;
      }

      return voltage / valid_units;
    icon: "mdi:current-dc"

  # --------------------------------------------------------------------------
  # Highest Output Temperature All Units
  # Reports the hottest currently reachable rectifier.
  - platform: template
    name: "Highest Output Temperature All Units"
    id: highest_output_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float highest = 0.0f;
      bool valid = false;

      if (id(can_com_ok_1).state &&
          !isnan(id(output_temperature_1).state)) {
        highest = id(output_temperature_1).state;
        valid = true;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(output_temperature_2).state)) {
        if (!valid ||
            id(output_temperature_2).state > highest) {
          highest = id(output_temperature_2).state;
        }
        valid = true;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(output_temperature_3).state)) {
        if (!valid ||
            id(output_temperature_3).state > highest) {
          highest = id(output_temperature_3).state;
        }
        valid = true;
      }

      if (!valid) {
        return NAN;
      }

      return highest;
    icon: "mdi:thermometer-high"

  # --------------------------------------------------------------------------
  # Conversion Efficiency All Units
  # Calculates DC output power divided by AC input power.
  #
  # Only units that simultaneously provide valid AC and DC power telemetry are
  # included. Values below 100 W AC input are ignored because efficiency becomes
  # meaningless and unstable close to idle operation.
  - platform: template
    name: "Conversion Efficiency All Units"
    id: conversion_efficiency
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float ac_power = 0.0f;
      float dc_power = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(ac_power_1).state) &&
          !isnan(id(dc_power_1).state)) {
        ac_power += id(ac_power_1).state;
        dc_power += id(dc_power_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(ac_power_2).state) &&
          !isnan(id(dc_power_2).state)) {
        ac_power += id(ac_power_2).state;
        dc_power += id(dc_power_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(ac_power_3).state) &&
          !isnan(id(dc_power_3).state)) {
        ac_power += id(ac_power_3).state;
        dc_power += id(dc_power_3).state;
        valid_units++;
      }

      if (valid_units == 0 ||
          ac_power < ${efficiency_min_ac_power_w}f) {
        return NAN;
      }

      return (dc_power / ac_power) * 100.0f;
    icon: "mdi:gauge"

  # --------------------------------------------------------------------------
  # AC Energy Today
  # Daily AC input energy integrated from the CAN-aware combined AC power.
  - platform: total_daily_energy
    name: "AC Energy Today"
    power_id: combined_ac_power
    time_id: sntp_time
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    icon: "mdi:counter"

  # --------------------------------------------------------------------------
  # DC Energy Today
  # Daily DC output energy integrated from the CAN-aware combined DC power.
  - platform: total_daily_energy
    name: "DC Energy Today"
    power_id: combined_dc_power
    time_id: sntp_time
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    icon: "mdi:counter"

# ==============================================================================
# PROJECT-WIDE BINARY SENSORS
# ==============================================================================
# Local physical push button and charger-wide capability diagnostics.
binary_sensor:
  # --------------------------------------------------------------------------
  # local_encoder_button
  #
  # SELECT MODE:
  #   short press  -> enter EDIT if the page has an editable parameter
  #   double press -> next page
  #   long press   -> toggle all rectifiers ON/OFF
  #
  # EDIT MODE:
  #   short press  -> commit and return to SELECT
  #   double press -> disabled
  #   long press   -> disabled

  # --------------------------------------------------------------------------
  # Rectifier Capability Mismatch
  # Diagnostic problem indicator comparing the maximum-current capability
  # reported by all three rectifiers.
  #
  # State:
  #   unknown = not all three current capabilities have been confirmed
  #   OFF     = all three capabilities match
  #   ON      = at least one rectifier reports a different capability
  #
  # The state is published by evaluate_rectifier_capabilities whenever fresh
  # capability data is received.
  - platform: template
    name: "Rectifier Capability Mismatch"
    id: rectifier_capability_mismatch
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:alert-circle-outline"

# ==============================================================================
# PROJECT-WIDE TEXT / STATUS SENSORS
# ==============================================================================
# Network/controller diagnostics that are shared by the assembled device.
text_sensor:
  # Network diagnostic used by the TFT footer.
  - platform: wifi_info
    ip_address:
      id: ip_address
      entity_category: diagnostic

  # Running ESPHome firmware version.
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

    icon: "mdi:code-tags"

  # ESPHome device information and last reset reason.
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
      icon: "mdi:information-outline"

    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
      icon: "mdi:restart-alert"