# Board: Androegg ESP32-S3 UNO
# Unit: ESP32-S3-WROOM-1-N16R8
# Flash: 16 MB Quad SPI
# PSRAM: 8 MB Octal SPI

# ==============================================================================
# THREE-PHASE R4875G1 CHARGER CONTROLLER - ARCHITECTURE OVERVIEW
# ==============================================================================
# This ESPHome firmware controls three Huawei R4875G1 rectifier units used as
# a three-phase battery charger. Each rectifier is supplied from one AC phase;
# their DC outputs are connected in parallel to the same battery bus.
#
# DATA PATH
# ---------
#   R4875G1 Unit 1 / 2 / 3
#          |
#          | extended 29-bit CAN frames @ 125 kbit/s
#          v
#   ESP32-S3 CAN decoder
#          |
#          +--> individual unit telemetry sensors
#          |      AC/DC power, voltage, current, frequency, temperatures, state
#          |
#          +--> per-unit CAN watchdogs (can_com_ok_1..3)
#          |
#          +--> CAN-aware combined AC/DC power sensors
#          |
#          +--> TFT display / Home Assistant / MQTT
#
# LOCAL BLACKSTART CONTROL PATH
# -----------------------------
#   Rotary encoder + push button
#          |
#          +--> choose DC voltage or nominal three-unit DC power target
#          +--> calculate the common per-unit current setpoint from that target
#          +--> broadcast voltage/current setpoints over CAN
#          +--> long press starts/stops all units
#
# OFFLINE OPERATION
# -----------------
# Wi-Fi, MQTT and Home Assistant are optional for core charger operation.
# Network reboot timeouts are disabled so a dead or isolated site network cannot
# prevent the ESP32 from controlling the charger during a blackstart.
#
# CAN VALUE SCALING
# -----------------
# Most voltage/telemetry values use a fixed-point scale of 1024:
#     engineering_value = raw_CAN_value / 1024
#     raw_CAN_value     = engineering_value * 1024
#
# Current commands use current_scaling_factor.
# The controller starts with the known 75 A R4875G1 fallback value
# (1024 / 75 = 13.653333) and automatically refreshes the factor from
# Unit 1's detected maximum-current capability whenever Unit 1 becomes
# available on the CAN bus.
#
# COMMUNICATION HEALTH
# --------------------
# Valid per-unit CAN activity refreshes last_can_rx_1..3. During normal
# operation cyclic telemetry provides the heartbeat; valid property frames also
# refresh it while discovery temporarily suspends cyclic polling.
#
# If no valid CAN activity is received within can_watchdog_timeout_ms,
# can_com_ok_x becomes false. Display and aggregate logic then ignore stale
# values from that unit.
# ==============================================================================
# ==============================================================================
# ESPHOME DEVICE IDENTITY AND BOOT ACTIONS
# ==============================================================================
# Defines the device identity used by ESPHome/Home Assistant. The boot hook
# starts the display inactivity timer so the backlight will eventually switch off
# even if the user never touches the encoder after power-up.
substitutions:
  mqtt_command_prefix: "HG/DG/Technik/Charger"

  # --------------------------------------------------------------------------
  # Project-wide operating limits
  # --------------------------------------------------------------------------
  project_max_dc_current_a: "75.0"
  minimum_dc_current_a: "1.0"

  dc_voltage_min_v: "49.0"
  dc_voltage_max_v: "58.0"
  dc_voltage_default_v: "53.0"

  overtemp_trip_c: "90.0"
  overtemp_reset_c: "80.0"

  efficiency_min_ac_power_w: "100.0"

  # --------------------------------------------------------------------------
  # Protocol scaling
  # --------------------------------------------------------------------------
  protocol_value_scale: "1024"
  fan_duty_counts_per_percent: "256.0"

  # --------------------------------------------------------------------------
  # Rectifier control-state codes
  # --------------------------------------------------------------------------
  # Internal lifecycle state used independently for each rectifier.
  #
  # OFFLINE:
  #   No usable communication / unit not operationally released.
  #
  # DISCOVERING:
  #   CAN communication has been detected, but discovery and validation have
  #   not yet completed.
  #
  # ONLINE:
  #   Discovery completed successfully and the unit is ready for normal
  #   operational handling.
  rectifier_state_offline: "0"
  rectifier_state_discovering: "1"
  rectifier_state_online: "2"

  # --------------------------------------------------------------------------
  # CAN communication buffering
  # --------------------------------------------------------------------------
  can_rx_queue_len: "64"

  # --------------------------------------------------------------------------
  # CAN communication timing
  # --------------------------------------------------------------------------
  can_watchdog_timeout_ms: "3000"
  live_telemetry_timeout: "5s"

  telemetry_poll_interval: "577ms"
  fan_query_delay: "27ms"
  unit_2_poll_gap: "156ms"
  unit_3_poll_gap: "166ms"

  # Offline rectifiers are probed round-robin. One unit is considered every
  # five seconds, resulting in a maximum probe interval of approximately
  # 15 seconds per offline rectifier.
  offline_probe_slot_interval: "5s"

  can_recovery_check_interval: "2s"

  setpoint_refresh_interval: "30s"

  # --------------------------------------------------------------------------
  # Discovery retry policy
  # --------------------------------------------------------------------------
  property_discovery_attempts: "3"
  capability_discovery_attempts: "10"
  discovery_retry_delay: "1s"
  discovery_startup_delay: "5s"
  property_bus_quiet_delay: "500ms"

esphome:
  name: hg-dg-technik-charger3ph
  friendly_name: HG|DG|Technik|Charger-3Ph
  min_version: 2026.7.4

  on_boot:
    then:
      # Until valid rectifier status frames have been received, the actual
      # power state of each unit is unknown.
      - lambda: |-
          id(power_state_1).publish_state("UNKNOWN");
          id(power_state_2).publish_state("UNKNOWN");
          id(power_state_3).publish_state("UNKNOWN");

          // Publish the model-specific fallback until actual rectifier
          // capabilities become available.
          id(effective_dc_current_limit_sensor).publish_state(
            id(effective_dc_current_limit)
          );

      # Every rectifier starts in OFFLINE control state after an ESP reboot.
      # A unit must be detected and successfully discovered before it can later
      # transition to ONLINE.
      - script.execute:
          id: set_rectifier_control_state
          unit: 1
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 2
          state: ${rectifier_state_offline}

      - script.execute:
          id: set_rectifier_control_state
          unit: 3
          state: ${rectifier_state_offline}

      - script.execute: display_inactivity_timer

# ==============================================================================
# ESP32-S3 HARDWARE, FLASH AND FRAMEWORK
# ==============================================================================
# Hardware settings for the Androegg ESP32-S3 UNO / ESP32-S3-WROOM-1-N16R8:
# 16 MB Quad-SPI flash, 8 MB Octal PSRAM and 240 MHz CPU. ESP-IDF is used as the
# framework because it provides the native ESP32-S3 feature set used here.
esp32:
  variant: esp32s3

  flash_size: 16MB
  flash_mode: qio
  flash_frequency: 80MHz
  cpu_frequency: 240MHz

  toolchain: esp-idf

  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true

# ==============================================================================
# EXTERNAL PSRAM
# ==============================================================================
# Explicitly enables the unit's 8 MB Octal PSRAM at 80 MHz. The large TFT
# framebuffer and Wi-Fi allocations benefit significantly from this memory.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# ==============================================================================
# LOGGING
# ==============================================================================
# Runtime logs are sent over UART0 through the board's USB/UART interface.
# INFO provides useful diagnostics without the volume of full DEBUG logging.
logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0
  logs:
    canbus: WARN

# ==============================================================================
# LOCAL ESPHOME WEB SERVER
# ==============================================================================
# Exposes entities and controls directly from the ESP32 whenever IP networking
# is available. Local blackstart operation does not depend on this web server.
web_server:
  version: 3
  port: 80

  # Keep all web UI assets on the ESP32 so the interface remains usable
  # without internet access, including during blackstart scenarios.
  local: true

  # Internal helper entities are implementation details and should not be
  # exposed through the browser UI.
  include_internal: false

  # Protect browser access to charger controls and diagnostics.
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest

  # Native ESPHome OTA is already configured separately. Do not expose
  # firmware upload through the normal web interface.
  ota: false

# ==============================================================================
# HOME ASSISTANT NATIVE API
# ==============================================================================
# Encrypted ESPHome API. reboot_timeout is disabled deliberately: a missing
# Home Assistant instance must never reboot a charger needed for blackstart.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ==============================================================================
# OVER-THE-AIR FIRMWARE UPDATE
# ==============================================================================
# Enables normal ESPHome OTA updates after the first USB installation.
ota:
  - platform: esphome

# ==============================================================================
# WI-FI
# ==============================================================================
# Wi-Fi credentials come from secrets.yaml. Power saving is disabled for stable
# latency. reboot_timeout: 0s keeps the controller alive indefinitely when Wi-Fi
# is unavailable, which is essential for offline blackstart operation.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # The device is permanently powered: disable Wi-Fi power saving for maximum link stability.
  power_save_mode: none

  # Allow Wi-Fi buffers/allocations to use the available 8 MB PSRAM.
  use_psram: true
  reboot_timeout: 0s

  ap:
    ssid: 3PhCharger Fallback Hotspot
    password: !secret fallback_ap_password

# ==============================================================================
# FALLBACK CAPTIVE PORTAL
# ==============================================================================
# Works with the fallback access point above if the configured infrastructure
# Wi-Fi cannot be reached.
captive_portal:

# ==============================================================================
# TIME SYNCHRONIZATION
# ==============================================================================
# SNTP provides Europe/Berlin local time for the TFT clock and daily energy
# integration. Display updates are handled independently by the TFT component.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org

    on_time_sync:
      then:
        - lambda: |-
            auto now = id(sntp_time).now();

            ESP_LOGI(
              "time",
              "SNTP synchronized: %02d.%02d.%04d %02d:%02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute,
              now.second
            );

# ==============================================================================
# ESPHOME DEBUG METRICS
# ==============================================================================
# Enables internal diagnostic values such as heap, loop timing, PSRAM and CPU
# frequency that are published further down in the sensor section.
debug:
  update_interval: 5s

# ==============================================================================
# MQTT CLIENT
# ==============================================================================
# Provides additional command topics besides the native API. MQTT is optional:
# reboot_timeout is disabled so broker failure cannot affect local charging.
mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password

  # Home Assistant uses the native ESPHome API as the canonical integration.
  # Keep MQTT available for external command/state transport without creating
  # duplicate MQTT-discovered entities in Home Assistant.
  discovery: false
  discover_ip: true

  # MQTT availability must never affect local charger operation.
  reboot_timeout: 0s

# ==============================================================================
# I2C BUS
# ==============================================================================
# I2C is reserved on GPIO10/GPIO9 with scanning enabled. GPIO8 is intentionally
# not used because the Androegg board has an onboard WS2812 connected there.
i2c:
  - id: i2c_bus
    sda: GPIO10
    scl: GPIO9
    scan: true

# ==============================================================================
# SPI BUS
# ==============================================================================
# Hardware SPI bus used by the ILI9488 TFT display.
spi:
  id: spi_bus
  clk_pin: GPIO13  # SCK
  mosi_pin: GPIO11 # SDI(MOSI)
  miso_pin: GPIO12 # SDO(MISI)

# ==============================================================================
# DISPLAY BACKLIGHT PWM
# ==============================================================================
# LEDC hardware PWM on GPIO4 drives the TFT backlight brightness.
output:
  - platform: ledc
    pin: GPIO4  # LED
    id: backlight_pwm

# ==============================================================================
# DISPLAY BACKLIGHT LIGHT ENTITY
# ==============================================================================
# Wraps the PWM output as an ESPHome monochromatic light so automations can use
# brightness values and smooth transition/fade times.
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

# ==============================================================================
# ILI9488 480x320 LOCAL TFT
# ==============================================================================
# Main local user interface. It is intentionally usable without Wi-Fi and shows
# CAN-aware telemetry, per-unit communication faults, rectifier state and the
# rotary-encoder setpoints. The 500 ms refresh interval balances responsiveness
# against SPI/display workload.
display:
  - platform: mipi_spi
    model: ILI9488
    id: tft

    cs_pin: GPIO5
    dc_pin: GPIO7
    reset_pin: GPIO6

    # Keep the same effective memory usage as the previous
    # ili9xxx "color_palette: 8BIT" configuration.
    color_depth: 8
    buffer_size: 100%

    invert_colors: false

    # ili9xxx used 40 MHz by default.
    # mipi_spi defaults to only 10 MHz, so explicitly keep 40 MHz
    # to avoid making display refreshes significantly slower.
    data_rate: 40MHz

    # Previous hardware transform:
    #   swap_xy: true
    #   mirror_x: true
    # corresponds to a 90-degree rotation.
    dimensions:
      width: 480
      height: 320

    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

    update_interval: 500ms

    lambda: |-
      // Full-screen redraw: clear the framebuffer first so shorter new values
      // cannot leave pixels from a previous longer string behind.
      it.fill(Color::WHITE);
      it.print(
        10, 10,
        id(font_large),
        id(color_black),
        "3 Phase Battery Charger R4875G1"
      );

      it.strftime(
        10, 40,
        id(font_small),
        id(color_black),
        "%d.%m.%Y %H:%M",
        id(sntp_time).now()
      );

      // -----------------------------------------------------------------
      // AC Input - use all units with valid CAN communication
      // -----------------------------------------------------------------

      // Build the AC summary only from units that are both CAN-online and have
      // all required numeric AC telemetry values. This allows clean 3/3, 2/3 or
      // 1/3 operation when individual rectifiers disappear from the CAN bus.
      int ac_units_ok = 0;

      float ac_voltage_sum = 0.0f;
      float ac_current_sum = 0.0f;
      float ac_frequency_sum = 0.0f;
      float ac_power_sum = 0.0f;


      // Unit 1
      if (id(can_com_ok_1).state) {

        if (!isnan(id(ac_voltage_1).state) &&
            !isnan(id(ac_current_1).state) &&
            !isnan(id(ac_frequency_1).state) &&
            !isnan(id(ac_power_1).state)) {

          ac_voltage_sum += id(ac_voltage_1).state;
          ac_current_sum += id(ac_current_1).state;
          ac_frequency_sum += id(ac_frequency_1).state;
          ac_power_sum += id(ac_power_1).state;

          ac_units_ok++;
        }
      }

      // Unit 2
      if (id(can_com_ok_2).state) {

        if (!isnan(id(ac_voltage_2).state) &&
            !isnan(id(ac_current_2).state) &&
            !isnan(id(ac_frequency_2).state) &&
            !isnan(id(ac_power_2).state)) {

          ac_voltage_sum += id(ac_voltage_2).state;
          ac_current_sum += id(ac_current_2).state;
          ac_frequency_sum += id(ac_frequency_2).state;
          ac_power_sum += id(ac_power_2).state;

          ac_units_ok++;
        }
      }

      // Unit 3
      if (id(can_com_ok_3).state) {

        if (!isnan(id(ac_voltage_3).state) &&
            !isnan(id(ac_current_3).state) &&
            !isnan(id(ac_frequency_3).state) &&
            !isnan(id(ac_power_3).state)) {

          ac_voltage_sum += id(ac_voltage_3).state;
          ac_current_sum += id(ac_current_3).state;
          ac_frequency_sum += id(ac_frequency_3).state;
          ac_power_sum += id(ac_power_3).state;

          ac_units_ok++;
        }
      }

      // -----------------------------------------------------------------
      // Display AC values
      // -----------------------------------------------------------------

      if (ac_units_ok > 0) {

        float ac_voltage_avg =
            ac_voltage_sum / ac_units_ok;

        float ac_current_avg =
            ac_current_sum / ac_units_ok;

        float ac_frequency_avg =
            ac_frequency_sum / ac_units_ok;

        float ac_power_kw =
            ac_power_sum / 1000.0f;


        // Header
        it.printf(
          10, 70,
          id(font_small_bold),
          id(color_blue),
          "AC Input: %.3f kW  (%d/3)",
          ac_power_kw,
          ac_units_ok
        );


        // Details
        it.printf(
          10, 95,
          id(font_small),
          id(color_black),
          "%.1f V - %.1f A - %.1f Hz",
          ac_voltage_avg,
          ac_current_avg,
          ac_frequency_avg
        );

      } else {

        it.print(
          10, 70,
          id(font_small_bold),
          id(color_red),
          "AC Input: CAN bus communication fault!"
        );

        it.print(
          10, 95,
          id(font_small),
          id(color_red),
          "No charger unit reachable"
        );
      }
      // -----------------------------------------------------------------
      // DC Output - use only units with valid CAN communication
      // -----------------------------------------------------------------
      //
      // combined_dc_power already excludes stale values from disconnected
      // rectifiers. Count the same valid units here so the display can show
      // whether the total currently represents 1/3, 2/3 or all 3 units.
      int dc_units_ok = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(dc_power_1).state)) {
        dc_units_ok++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(dc_power_2).state)) {
        dc_units_ok++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(dc_power_3).state)) {
        dc_units_ok++;
      }

      // Display the CAN-aware combined DC power only when at least one
      // rectifier has valid telemetry. If no unit is available, show a
      // clear communication fault instead of formatting NAN as "nan kW".
      if (dc_units_ok > 0 &&
          !isnan(id(combined_dc_power).state)) {

        it.printf(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: %.3f kW  (%d/3)",
          id(combined_dc_power).state,
          dc_units_ok
        );

      } else {

        it.print(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: CAN bus communication fault!"
        );
      }
      // -----------------------------------------------------------------
      // Per-unit DC telemetry
      // -----------------------------------------------------------------
      //
      // CAN communication and live telemetry freshness are evaluated
      // separately. Property/discovery frames can keep a unit CAN-online
      // while individual live telemetry sensors have already timed out.
      //
      // Never format non-numeric sensor states because printf() would render
      // them as "nan" on the TFT.

      const bool unit_1_telemetry_ok =
          !isnan(id(dc_voltage_1).state) &&
          !isnan(id(dc_current_1).state) &&
          !isnan(id(dc_power_1).state) &&
          !isnan(id(input_temperature_1).state) &&
          !isnan(id(output_temperature_1).state);

      const bool unit_2_telemetry_ok =
          !isnan(id(dc_voltage_2).state) &&
          !isnan(id(dc_current_2).state) &&
          !isnan(id(dc_power_2).state) &&
          !isnan(id(input_temperature_2).state) &&
          !isnan(id(output_temperature_2).state);

      const bool unit_3_telemetry_ok =
          !isnan(id(dc_voltage_3).state) &&
          !isnan(id(dc_current_3).state) &&
          !isnan(id(dc_power_3).state) &&
          !isnan(id(input_temperature_3).state) &&
          !isnan(id(output_temperature_3).state);

      // Unit 1
      if (!id(can_com_ok_1).state) {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: CAN bus communication fault!"
        );

      } else if (!unit_1_telemetry_ok) {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 150,
          id(font_small),
          id(color_black),
          "L1: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_1).state,
          id(dc_current_1).state,
          id(dc_power_1).state,
          id(input_temperature_1).state,
          id(output_temperature_1).state
        );
      }

      // Unit 2
      if (!id(can_com_ok_2).state) {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: CAN bus communication fault!"
        );

      } else if (!unit_2_telemetry_ok) {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 170,
          id(font_small),
          id(color_black),
          "L2: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_2).state,
          id(dc_current_2).state,
          id(dc_power_2).state,
          id(input_temperature_2).state,
          id(output_temperature_2).state
        );
      }

      // Unit 3
      if (!id(can_com_ok_3).state) {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: CAN bus communication fault!"
        );

      } else if (!unit_3_telemetry_ok) {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 190,
          id(font_small),
          id(color_black),
          "L3: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_3).state,
          id(dc_current_3).state,
          id(dc_power_3).state,
          id(input_temperature_3).state,
          id(output_temperature_3).state
        );
      }
      // -----------------------------------------------------------------
      // Local / Blackstart setpoints
      // -----------------------------------------------------------------
      it.print(
        10, 220,
        id(font_small_bold),
        id(color_green),
        "Setpoints:"
      );

      // Actual rectifier status
      // Count actual ON states reported by the units. This value is also useful
      // to show partial operation such as 1/3 or 2/3 units running.
      int rectifiers_on = 0;

      if (id(can_com_ok_1).state &&
          id(power_state_1).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_2).state &&
          id(power_state_2).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_3).state &&
          id(power_state_3).state == "ON") {
        rectifiers_on++;
      }

      if (rectifiers_on == 3) {

        it.print(
          375, 220,
          id(font_small_bold),
          id(color_green),
          "3/3 ON"
        );

      } else if (rectifiers_on == 0) {

        it.print(
          410, 220,
          id(font_small_bold),
          id(color_red),
          "OFF"
        );

      } else {

        it.printf(
          375, 220,
          id(font_small_bold),
          id(color_blue),
          "%d/3 ON",
          rectifiers_on
        );
      }

      // -----------------------------------------------------------------
      // Encoder selection
      // -----------------------------------------------------------------

      // The active encoder-edit field is rendered bold/blue; the inactive field
      // remains visible in normal black text for context.
      if (id(encoder_mode) == 0) {

        // Voltage selected
        it.printf(
          10, 245,
          id(font_small_bold),
          id(color_blue),
          "> DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small),
          id(color_black),
          "  DC Target(3U): %.2f kW - %.1f A/u",
          id(set_dc_sum_power).state,
          id(set_dc_current_limit).state
        );

      } else {

        // Sum power selected
        it.printf(
          10, 245,
          id(font_small),
          id(color_black),
          "  DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small_bold),
          id(color_blue),
          "> DC Target(3U): %.2f kW - %.1f A/u",
          id(set_dc_sum_power).state,
          id(set_dc_current_limit).state
        );
      }
      // Footer diagnostics are controller-side values and remain useful even if
      // every rectifier is offline.
      it.printf(10, 300, id(font_footer), id(color_black), "IP: %s", id(ip_address).state.c_str());
      it.printf(200, 300, id(font_footer), id(color_black), "CPU Temp: %.1f °C", id(cpu_temp).state);
      it.printf(390, 300, id(font_footer), id(color_black), "WiFi: %.1f dBm", id(wifi_sig).state);

# ==============================================================================
# GLOBAL RUNTIME STATE
# ==============================================================================
# Non-entity state used by protocol decoding, discovery, watchdog timing and
# local UI logic. None of these variables independently transmit CAN frames.
globals:
  # Selects what the rotary encoder edits locally.
  # 0 = DC voltage, 1 = total DC power. It is not restored so the UI starts in a
  # known mode after boot.
  - id: encoder_mode
    type: int
    restore_value: false
    initial_value: "0"

  # Timestamp (millis) of the most recent valid CAN activity from Unit 1.
  # Normally refreshed by cyclic telemetry and additionally by valid property
  # frames during discovery.
  - id: last_can_rx_1
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Timestamp (millis) of the most recent valid CAN activity from Unit 2.
  # Normally refreshed by cyclic telemetry and additionally by valid property
  # frames during discovery.
  - id: last_can_rx_2
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Timestamp (millis) of the most recent valid CAN activity from Unit 3.
  # Normally refreshed by cyclic telemetry and additionally by valid property
  # frames during discovery.
  - id: last_can_rx_3
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # --------------------------------------------------------------------------
  # Per-rectifier control states
  # --------------------------------------------------------------------------
  # These states are intentionally separate from can_com_ok_x.
  #
  # can_com_ok_x answers:
  #   "Have valid CAN frames been received recently?"
  #
  # rectifier_control_state_x answers:
  #   "Where is this rectifier in the controller lifecycle?"
  #
  # State values:
  #   0 = OFFLINE
  #   1 = DISCOVERING
  #   2 = ONLINE
  #
  # The states now participate in CAN polling decisions:
  #
  # OFFLINE:
  #   excluded from normal fast telemetry/fan polling
  #
  # DISCOVERING:
  #   receives cyclic telemetry heartbeat only
  #
  # ONLINE:
  #   receives normal cyclic telemetry and fan polling
  #
  # Other control and setpoint paths are intentionally migrated in later
  # implementation steps.
  - id: rectifier_control_state_1
    type: uint8_t
    restore_value: false
    initial_value: "${rectifier_state_offline}"

  - id: rectifier_control_state_2
    type: uint8_t
    restore_value: false
    initial_value: "${rectifier_state_offline}"

  - id: rectifier_control_state_3
    type: uint8_t
    restore_value: false
    initial_value: "${rectifier_state_offline}"

  # --------------------------------------------------------------------------
  # Offline probe round-robin selector
  # --------------------------------------------------------------------------
  # Selects which rectifier is considered by the next slow offline-probe slot.
  #
  # The selector rotates continuously:
  #
  #   Unit 1 -> Unit 2 -> Unit 3 -> Unit 1 ...
  #
  # A probe frame is transmitted only when the selected unit is currently
  # OFFLINE. ONLINE and DISCOVERING units are skipped.
  - id: offline_probe_next_unit
    type: uint8_t
    restore_value: false
    initial_value: "1"

  # Current-command scaling factor.
  #
  # The R4875G1 reports a maximum output current of 75 A, therefore the
  # correct model-specific fallback is:
  #
  #     1024 / 75 A = 13.653333...
  #
  # This value is available immediately after boot so local blackstart remains
  # usable even before capability discovery has completed.
  #
  # The value is not restored from flash because it is a hardware-derived
  # parameter. Unit 1 capability discovery refreshes it automatically whenever
  # Unit 1 becomes available on the CAN bus.
  - id: current_scaling_factor
    type: float
    initial_value: "static_cast<float>(${protocol_value_scale}) / ${project_max_dc_current_a}f"
    restore_value: false

  # Effective maximum DC current command used by all current-control paths.
  #
  # 75 A is the absolute project ceiling for the intended R4875G1 installation.
  # As rectifier capability data becomes available, this value is reduced to
  # the lowest valid capability reported by any of the three units.
  #
  # This prevents the shared current command from exceeding the weakest known
  # rectifier capability.
  - id: effective_dc_current_limit
    type: float
    initial_value: "${project_max_dc_current_a}f"
    restore_value: false

  # Fixed-point protocol scale used by voltage and most telemetry fields.
  # This is a protocol constant and must always start from protocol_value_scale;
  # it is therefore never restored from persistent storage.
  - id: voltage_scaling_factor
    type: int
    initial_value: "${protocol_value_scale}"
    restore_value: false

  # Discovery flag: maximum-current capability for Unit 1
  # has been received during the current search.
  - id: max_current_found_1
    type: bool
    restore_value: false
    initial_value: "false"

  # Discovery flag for Unit 2 maximum-current capability.
  - id: max_current_found_2
    type: bool
    restore_value: false
    initial_value: "false"

  # Discovery flag for Unit 3 maximum-current capability.
  - id: max_current_found_3
    type: bool
    restore_value: false
    initial_value: "false"

  # Discovery flag: valid shelf/slot addressing data for Unit 1
  # has been received.
  - id: data_found_1
    type: bool
    restore_value: false
    initial_value: "false"

  # Discovery flag for Unit 2 addressing data.
  - id: data_found_2
    type: bool
    restore_value: false
    initial_value: "false"

  # Discovery flag for Unit 3 addressing data.
  - id: data_found_3
    type: bool
    restore_value: false
    initial_value: "false"

  # Temporary ASCII buffer used to assemble Unit 1's
  # multi-frame property response before parsing it into text sensors.
  - id: unit_properties_1
    type: std::string
    restore_value: false
    initial_value: '""'

  # Temporary property-message buffer for Unit 2.
  - id: unit_properties_2
    type: std::string
    restore_value: false
    initial_value: '""'

  # Temporary property-message buffer for Unit 3.
  - id: unit_properties_3
    type: std::string
    restore_value: false
    initial_value: '""'

  # True only after all expected Unit 1 property
  # keys were parsed successfully; discovery retries until this becomes true.
  - id: unit_properties_complete_1
    type: bool
    restore_value: false
    initial_value: "false"

  # Completion flag for Unit 2 properties.
  - id: unit_properties_complete_2
    type: bool
    restore_value: false
    initial_value: "false"

  # Completion flag for Unit 3 properties.
  - id: unit_properties_complete_3
    type: bool
    restore_value: false
    initial_value: "false"

  # Fail-safe retry counter for Unit 1 property requests.
  - id: frame_counter_bp_1
    type: int
    restore_value: false
    initial_value: "0"

  # Fail-safe retry counter for Unit 2 property requests.
  - id: frame_counter_bp_2
    type: int
    restore_value: false
    initial_value: "0"

  # Fail-safe retry counter for Unit 3 property requests.
  - id: frame_counter_bp_3
    type: int
    restore_value: false
    initial_value: "0"

  # Counts Unit 1 property payload frames for
  # diagnostic logging while a multi-frame message is being assembled.
  - id: frame_counter_msg_start_1
    type: int
    restore_value: false
    initial_value: "0"

  # Property payload-frame counter for Unit 2.
  - id: frame_counter_msg_start_2
    type: int
    restore_value: false
    initial_value: "0"

  # Property payload-frame counter for Unit 3.
  - id: frame_counter_msg_start_3
    type: int
    restore_value: false
    initial_value: "0"

  # Fail-safe retry counter for Unit 1 capability/address search.
  - id: search_counter_1
    type: int
    restore_value: false
    initial_value: "0"

  # Fail-safe retry counter for Unit 2 capability/address search.
  - id: search_counter_2
    type: int
    restore_value: false
    initial_value: "0"

  # Fail-safe retry counter for Unit 3 capability/address search.
  - id: search_counter_3
    type: int
    restore_value: false
    initial_value: "0"

  # Overtemperature lockout for Unit 1. Set when output temperature exceeds
  # 90 °C; cleared only once it drops below the 80 °C hysteresis threshold.
  # While set, this unit is excluded from ON commands.
  - id: overtemp_lockout_1
    type: bool
    restore_value: false
    initial_value: "false"

  # Overtemperature lockout for Unit 2 (see overtemp_lockout_1).
  - id: overtemp_lockout_2
    type: bool
    restore_value: false
    initial_value: "false"

  # Overtemperature lockout for Unit 3 (see overtemp_lockout_1).
  - id: overtemp_lockout_3
    type: bool
    restore_value: false
    initial_value: "false"

# ==============================================================================
# REUSABLE AUTOMATION SCRIPTS
# ==============================================================================
# Multi-step operations for discovery, power-to-current conversion, blackstart
# sequencing and backlight timeout handling.
script:
  # --------------------------------------------------------------------------
  # set_rectifier_control_state
  # --------------------------------------------------------------------------
  # Centralized lifecycle-state handler for all three rectifiers.
  #
  # States:
  #   0 = OFFLINE
  #   1 = DISCOVERING
  #   2 = ONLINE
  #
  # The state is published for diagnostics and is also used by the CAN polling
  # scheduler. Other operational control paths are migrated separately.
  - id: set_rectifier_control_state
    mode: queued
    max_runs: 12

    parameters:
      unit: int
      state: int

    then:
      - lambda: |-
          const uint8_t offline =
              ${rectifier_state_offline};

          const uint8_t discovering =
              ${rectifier_state_discovering};

          const uint8_t online =
              ${rectifier_state_online};


          if (state != offline &&
              state != discovering &&
              state != online) {

            ESP_LOGW(
              "rectifier_state",
              "Ignoring invalid rectifier control state %d for Unit %d.",
              state,
              unit
            );

            return;
          }

          const auto state_name =
              [offline, discovering, online](uint8_t value) -> const char * {

            if (value == offline) {
              return "OFFLINE";
            }

            if (value == discovering) {
              return "DISCOVERING";
            }

            if (value == online) {
              return "ONLINE";
            }

            return "UNKNOWN";
          };

          if (unit == 1) {

            const uint8_t previous =
                id(rectifier_control_state_1);

            id(rectifier_control_state_1) =
                static_cast<uint8_t>(state);

            id(rectifier_control_state_text_1).publish_state(
              state_name(static_cast<uint8_t>(state))
            );

            if (previous != state) {

              ESP_LOGI(
                "rectifier_state",
                "Unit 1 control state: %s -> %s",
                state_name(previous),
                state_name(static_cast<uint8_t>(state))
              );
            }

            return;
          }

          if (unit == 2) {

            const uint8_t previous =
                id(rectifier_control_state_2);

            id(rectifier_control_state_2) =
                static_cast<uint8_t>(state);

            id(rectifier_control_state_text_2).publish_state(
              state_name(static_cast<uint8_t>(state))
            );

            if (previous != state) {

              ESP_LOGI(
                "rectifier_state",
                "Unit 2 control state: %s -> %s",
                state_name(previous),
                state_name(static_cast<uint8_t>(state))
              );
            }

            return;
          }

          if (unit == 3) {

            const uint8_t previous =
                id(rectifier_control_state_3);

            id(rectifier_control_state_3) =
                static_cast<uint8_t>(state);

            id(rectifier_control_state_text_3).publish_state(
              state_name(static_cast<uint8_t>(state))
            );

            if (previous != state) {

              ESP_LOGI(
                "rectifier_state",
                "Unit 3 control state: %s -> %s",
                state_name(previous),
                state_name(static_cast<uint8_t>(state))
              );
            }

            return;
          }

          ESP_LOGW(
            "rectifier_state",
            "Ignoring control-state update for invalid Unit %d.",
            unit
          );

  # --------------------------------------------------------------------------
  # detect_unit_1_properties
  # --------------------------------------------------------------------------
  # Requests Unit 1's static multi-frame property block.
  # Up to three requests are sent. CAN handlers assemble the answer and set
  # unit_properties_complete_1 when all required fields are present.
  - id: detect_unit_1_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_1) = false;
          id(frame_counter_bp_1) = 0;
          id(frame_counter_msg_start_1) = 0;
          id(unit_properties_1).clear();

      - delay: ${property_bus_quiet_delay}

      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_1) &&
                     id(frame_counter_bp_1) < ${property_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x1081D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

            - delay: ${discovery_retry_delay}

            - lambda: |-
                id(frame_counter_bp_1) += 1;

                ESP_LOGI(
                  "unit_properties",
                  "Unit 1 Frame Counter: %d",
                  id(frame_counter_bp_1)
                );

      - lambda: |-
          if (id(unit_properties_complete_1)) {
            ESP_LOGI(
              "unit_properties",
              "Unit 1 properties detected successfully."
            );
          } else {
            ESP_LOGW(
              "unit_properties",
              "Unit 1 Fail-safe triggered: Loop stopped after %d attempts.",
              ${property_discovery_attempts}
            );
          }

  # --------------------------------------------------------------------------
  # detect_unit_2_properties
  # --------------------------------------------------------------------------
  # Same static-property discovery sequence for Unit 2.
  - id: detect_unit_2_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_2) = false;
          id(frame_counter_bp_2) = 0;
          id(frame_counter_msg_start_2) = 0;
          id(unit_properties_2).clear();

      - delay: ${property_bus_quiet_delay}

      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_2) &&
                     id(frame_counter_bp_2) < ${property_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x1082D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

            - delay: ${discovery_retry_delay}

            - lambda: |-
                id(frame_counter_bp_2) += 1;

                ESP_LOGI(
                  "unit_properties",
                  "Unit 2 Frame Counter: %d",
                  id(frame_counter_bp_2)
                );

      - lambda: |-
          if (id(unit_properties_complete_2)) {
            ESP_LOGI(
              "unit_properties",
              "Unit 2 properties detected successfully."
            );
          } else {
            ESP_LOGW(
              "unit_properties",
              "Unit 2 Fail-safe triggered: Loop stopped after %d attempts.",
              ${property_discovery_attempts}
            );
          }

  # --------------------------------------------------------------------------
  # detect_unit_3_properties
  # --------------------------------------------------------------------------
  # Same static-property discovery sequence for Unit 3.
  - id: detect_unit_3_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_3) = false;
          id(frame_counter_bp_3) = 0;
          id(frame_counter_msg_start_3) = 0;
          id(unit_properties_3).clear();

      - delay: ${property_bus_quiet_delay}

      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_3) &&
                     id(frame_counter_bp_3) < ${property_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x1083D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

            - delay: ${discovery_retry_delay}

            - lambda: |-
                id(frame_counter_bp_3) += 1;

                ESP_LOGI(
                  "unit_properties",
                  "Unit 3 Frame Counter: %d",
                  id(frame_counter_bp_3)
                );

      - lambda: |-
          if (id(unit_properties_complete_3)) {
            ESP_LOGI(
              "unit_properties",
              "Unit 3 properties detected successfully."
            );
          } else {
            ESP_LOGW(
              "unit_properties",
              "Unit 3 Fail-safe triggered: Loop stopped after %d attempts.",
              ${property_discovery_attempts}
            );
          }

  # --------------------------------------------------------------------------
  # detect_data_unit_1
  # --------------------------------------------------------------------------
  # Requests Unit 1 capability/address data until both the
  # maximum-current and shelf/slot information have been found or retries are
  # exhausted.
  - id: detect_data_unit_1
    mode: single
    then:
      - lambda: |-
          id(max_current_found_1) = false; // Reset the flag before starting
          id(data_found_1) = false; // Reset the flag before starting
          id(search_counter_1) = 0; // Initialize a fail-safe counter
      - binary_sensor.invalidate_state: rectifier_capability_mismatch
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_1) && id(data_found_1)) && id(search_counter_1) < ${capability_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x108150FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: ${discovery_retry_delay}
            - lambda: |-
                id(search_counter_1) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_1) && id(data_found_1)) {
            ESP_LOGI(
              "canbus",
              "Unit 1 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_1)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 1 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_1),
              id(max_current_found_1) ? "yes" : "no",
              id(data_found_1) ? "yes" : "no"
            );
          }
  # --------------------------------------------------------------------------
  # detect_data_unit_2
  # --------------------------------------------------------------------------
  # Capability/address discovery for Unit 2.
  - id: detect_data_unit_2
    mode: single
    then:
      - lambda: |-
          id(max_current_found_2) = false; // Reset the flag before starting
          id(data_found_2) = false; // Reset the flag before starting
          id(search_counter_2) = 0; // Initialize a fail-safe counter
      - binary_sensor.invalidate_state: rectifier_capability_mismatch
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_2) && id(data_found_2)) && id(search_counter_2) < ${capability_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x108250FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: ${discovery_retry_delay}
            - lambda: |-
                id(search_counter_2) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_2) && id(data_found_2)) {
            ESP_LOGI(
              "canbus",
              "Unit 2 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_2)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 2 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_2),
              id(max_current_found_2) ? "yes" : "no",
              id(data_found_2) ? "yes" : "no"
            );
          }
  # --------------------------------------------------------------------------
  # detect_data_unit_3
  # --------------------------------------------------------------------------
  # Capability/address discovery for Unit 3.
  - id: detect_data_unit_3
    mode: single
    then:
      - lambda: |-
          id(max_current_found_3) = false; // Reset the flag before starting
          id(data_found_3) = false; // Reset the flag before starting
          id(search_counter_3) = 0; // Initialize a fail-safe counter
      - binary_sensor.invalidate_state: rectifier_capability_mismatch
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_3) && id(data_found_3)) && id(search_counter_3) < ${capability_discovery_attempts};
          then:
            - canbus.send:
                can_id: 0x108350FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: ${discovery_retry_delay}
            - lambda: |-
                id(search_counter_3) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_3) && id(data_found_3)) {
            ESP_LOGI(
              "canbus",
              "Unit 3 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_3)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 3 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_3),
              id(max_current_found_3) ? "yes" : "no",
              id(data_found_3) ? "yes" : "no"
            );
          }

  # --------------------------------------------------------------------------
  # discover_unit_1
  # --------------------------------------------------------------------------
  # Runs the complete discovery sequence for Unit 1.
  # Static properties are queried first, followed by capability/address data.
  - id: discover_unit_1
    mode: single
    then:
      - script.execute: detect_unit_1_properties
      - script.wait: detect_unit_1_properties

      - script.execute: detect_data_unit_1
      - script.wait: detect_data_unit_1

  # --------------------------------------------------------------------------
  # discover_unit_2
  # --------------------------------------------------------------------------
  - id: discover_unit_2
    mode: single
    then:
      - script.execute: detect_unit_2_properties
      - script.wait: detect_unit_2_properties

      - script.execute: detect_data_unit_2
      - script.wait: detect_data_unit_2

  # --------------------------------------------------------------------------
  # discover_unit_3
  # --------------------------------------------------------------------------
  - id: discover_unit_3
    mode: single
    then:
      - script.execute: detect_unit_3_properties
      - script.wait: detect_unit_3_properties

      - script.execute: detect_data_unit_3
      - script.wait: detect_data_unit_3

  # --------------------------------------------------------------------------
  # update_effective_dc_current_limit
  # --------------------------------------------------------------------------
  # Maintains one common runtime current ceiling for every DC current command.
  #
  # The project ceiling is 75 A. Any valid detected rectifier capability below
  # that value lowers the effective limit. The lowest known capability wins.
  #
  # Existing active and fallback current settings are reduced immediately when
  # a newly detected capability lowers the permitted current.
  - id: update_effective_dc_current_limit
    mode: restart
    then:
      - lambda: |-
          constexpr float project_max_current =
              ${project_max_dc_current_a}f;

          float effective_limit = project_max_current;
          bool capability_available = false;

          const float capability_1 =
              id(max_dc_current_1).state;

          const float capability_2 =
              id(max_dc_current_2).state;

          const float capability_3 =
              id(max_dc_current_3).state;


          // Unit 1
          if (!isnan(capability_1) &&
              capability_1 > 0.0f) {

            capability_available = true;

            if (capability_1 < effective_limit) {
              effective_limit = capability_1;
            }
          }


          // Unit 2
          if (!isnan(capability_2) &&
              capability_2 > 0.0f) {

            capability_available = true;

            if (capability_2 < effective_limit) {
              effective_limit = capability_2;
            }
          }


          // Unit 3
          if (!isnan(capability_3) &&
              capability_3 > 0.0f) {

            capability_available = true;

            if (capability_3 < effective_limit) {
              effective_limit = capability_3;
            }
          }


          const float previous_limit =
              id(effective_dc_current_limit);

          id(effective_dc_current_limit) =
              effective_limit;

          id(effective_dc_current_limit_sensor).publish_state(
            effective_limit
          );


          if (fabsf(previous_limit - effective_limit) > 0.01f) {

            ESP_LOGI(
              "current_limit",
              "Effective DC current limit changed from %.1f A to %.1f A.",
              previous_limit,
              effective_limit
            );
          }


          if (capability_available) {

            ESP_LOGI(
              "current_limit",
              "Effective DC current limit: %.1f A "
              "(project ceiling %.1f A, lowest valid detected capability).",
              effective_limit,
              ${project_max_dc_current_a}f
            );

          } else {

            ESP_LOGI(
              "current_limit",
              "No rectifier capability available yet. "
              "Using %.1f A R4875G1 fallback.",
              ${project_max_dc_current_a}f
            );
          }


          // If a newly detected capability lowered the safe limit, immediately
          // reduce the active DC-current command.
          if (!isnan(id(set_dc_current_limit).state) &&
              id(set_dc_current_limit).state > effective_limit) {

            ESP_LOGW(
              "current_limit",
              "Active DC current %.1f A exceeds new effective limit %.1f A. "
              "Reducing setpoint.",
              id(set_dc_current_limit).state,
              effective_limit
            );

            auto current_call =
                id(set_dc_current_limit).make_call();

            current_call.set_value(effective_limit);
            current_call.perform();
          }


          // Apply the same protection to the rectifier fallback-current value.
          if (!isnan(id(set_dc_current_limit_fallback).state) &&
              id(set_dc_current_limit_fallback).state > effective_limit) {

            ESP_LOGW(
              "current_limit",
              "Fallback DC current %.1f A exceeds new effective limit %.1f A. "
              "Reducing setpoint.",
              id(set_dc_current_limit_fallback).state,
              effective_limit
            );

            auto fallback_call =
                id(set_dc_current_limit_fallback).make_call();

            fallback_call.set_value(effective_limit);
            fallback_call.perform();
          }

  # --------------------------------------------------------------------------
  # evaluate_rectifier_capabilities
  # --------------------------------------------------------------------------
  # Compares the maximum-current capability reported by all three rectifiers.
  #
  # The diagnostic becomes valid only after all three capability responses have
  # been received. Until then the binary sensor remains UNKNOWN.
  #
  # Huawei capability data is encoded in 0.5 A steps, therefore a tolerance of
  # 0.25 A reliably distinguishes equal capabilities from an actual mismatch.
  - id: evaluate_rectifier_capabilities
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return
                id(max_current_found_1) &&
                id(max_current_found_2) &&
                id(max_current_found_3) &&

                !isnan(id(max_dc_current_1).state) &&
                !isnan(id(max_dc_current_2).state) &&
                !isnan(id(max_dc_current_3).state);

          then:
            - lambda: |-
                const float capability_1 =
                    id(max_dc_current_1).state;

                const float capability_2 =
                    id(max_dc_current_2).state;

                const float capability_3 =
                    id(max_dc_current_3).state;

                // Capability values are reported in 0.5 A steps.
                // 0.25 A therefore safely separates equal values from
                // different reported hardware capabilities.
                constexpr float tolerance_a = 0.25f;

                const bool mismatch =
                    fabsf(capability_1 - capability_2) > tolerance_a ||
                    fabsf(capability_1 - capability_3) > tolerance_a ||
                    fabsf(capability_2 - capability_3) > tolerance_a;

                id(rectifier_capability_mismatch).publish_state(mismatch);

                if (mismatch) {
                  ESP_LOGE(
                    "capability",
                    "RECTIFIER CAPABILITY MISMATCH: "
                    "Unit 1 = %.1f A, Unit 2 = %.1f A, Unit 3 = %.1f A. "
                    "Shared current scaling remains based on Unit 1.",
                    capability_1,
                    capability_2,
                    capability_3
                  );
                } else {
                  ESP_LOGI(
                    "capability",
                    "Rectifier capabilities match: "
                    "Unit 1 = %.1f A, Unit 2 = %.1f A, Unit 3 = %.1f A.",
                    capability_1,
                    capability_2,
                    capability_3
                  );
                }

          else:
            - binary_sensor.invalidate_state: rectifier_capability_mismatch

  # --------------------------------------------------------------------------
  # send_active_voltage_to_unit
  # --------------------------------------------------------------------------
  # Sends the configured active DC voltage to exactly one rectifier.
  #
  # Unit-specific addressing prevents OFFLINE or DISCOVERING rectifiers from
  # receiving normal operating setpoints intended for already ONLINE units.
  - id: send_active_voltage_to_unit
    mode: queued
    max_runs: 12
    parameters:
      unit: int

    then:
      - if:
          condition:
            lambda: |-
              const float voltage =
                  id(set_dc_voltage_limit).state;

              return
                unit >= 1 &&
                unit <= 3 &&
                !isnan(voltage) &&
                voltage >= ${dc_voltage_min_v}f &&
                voltage <= ${dc_voltage_max_v}f;

          then:
            # Unit 1
            - if:
                condition:
                  lambda: 'return unit == 1;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108180FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_voltage_limit).state *
                              id(voltage_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

            # Unit 2
            - if:
                condition:
                  lambda: 'return unit == 2;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108280FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_voltage_limit).state *
                              id(voltage_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

            # Unit 3
            - if:
                condition:
                  lambda: 'return unit == 3;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108380FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_voltage_limit).state *
                              id(voltage_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

          else:
            - lambda: |-
                ESP_LOGW(
                  "setpoint",
                  "Active DC voltage not sent: invalid Unit %d "
                  "or voltage %.2f V.",
                  unit,
                  id(set_dc_voltage_limit).state
                );


  # --------------------------------------------------------------------------
  # send_active_current_to_unit
  # --------------------------------------------------------------------------
  # Sends the configured active DC current limit to exactly one rectifier.
  - id: send_active_current_to_unit
    mode: queued
    max_runs: 12
    parameters:
      unit: int

    then:
      - if:
          condition:
            lambda: |-
              const float current =
                  id(set_dc_current_limit).state;

              const float effective_limit =
                  id(effective_dc_current_limit);

              return
                unit >= 1 &&
                unit <= 3 &&
                !isnan(current) &&
                current >= ${minimum_dc_current_a}f &&
                !isnan(effective_limit) &&
                current <= effective_limit + 0.01f &&
                !isnan(id(current_scaling_factor)) &&
                id(current_scaling_factor) > 0.0f;

          then:
            # Unit 1
            - if:
                condition:
                  lambda: 'return unit == 1;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108180FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;
                        can_data[1] = 0x03;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_current_limit).state *
                              id(current_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

            # Unit 2
            - if:
                condition:
                  lambda: 'return unit == 2;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108280FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;
                        can_data[1] = 0x03;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_current_limit).state *
                              id(current_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

            # Unit 3
            - if:
                condition:
                  lambda: 'return unit == 3;'
                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108380FE
                      data: !lambda |-
                        std::vector<uint8_t> can_data(8, 0x00);

                        can_data[0] = 0x01;
                        can_data[1] = 0x03;

                        const int scaled_value =
                            static_cast<int>(
                              id(set_dc_current_limit).state *
                              id(current_scaling_factor)
                            );

                        can_data[6] = (scaled_value >> 8) & 0xFF;
                        can_data[7] = scaled_value & 0xFF;

                        return can_data;

          else:
            - lambda: |-
                ESP_LOGW(
                  "setpoint",
                  "Active DC current not sent to Unit %d because the "
                  "current/scaling state is invalid. Current=%.2f A.",
                  unit,
                  id(set_dc_current_limit).state
                );


  # --------------------------------------------------------------------------
  # send_active_voltage_to_online_units
  # --------------------------------------------------------------------------
  - id: send_active_voltage_to_online_units
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_1) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_1).state;
          then:
            - lambda: 'id(send_active_voltage_to_unit)->execute(1);'
            - script.wait: send_active_voltage_to_unit

      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_2) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_2).state;
          then:
            - lambda: 'id(send_active_voltage_to_unit)->execute(2);'
            - script.wait: send_active_voltage_to_unit

      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_3) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_3).state;
          then:
            - lambda: 'id(send_active_voltage_to_unit)->execute(3);'
            - script.wait: send_active_voltage_to_unit


  # --------------------------------------------------------------------------
  # send_active_current_to_online_units
  # --------------------------------------------------------------------------
  - id: send_active_current_to_online_units
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_1) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_1).state;
          then:
            - lambda: 'id(send_active_current_to_unit)->execute(1);'
            - script.wait: send_active_current_to_unit

      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_2) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_2).state;
          then:
            - lambda: 'id(send_active_current_to_unit)->execute(2);'
            - script.wait: send_active_current_to_unit

      - if:
          condition:
            lambda: |-
              return
                id(rectifier_control_state_3) ==
                  ${rectifier_state_online} &&
                id(can_com_ok_3).state;
          then:
            - lambda: 'id(send_active_current_to_unit)->execute(3);'
            - script.wait: send_active_current_to_unit


  # --------------------------------------------------------------------------
  # refresh_active_setpoints_online
  # --------------------------------------------------------------------------
  # Periodically reasserts active voltage/current only to fully ONLINE units.
  - id: refresh_active_setpoints_online
    mode: restart
    then:
      - script.execute: send_active_voltage_to_online_units
      - script.wait: send_active_voltage_to_online_units

      - delay: 50ms

      - script.execute: send_active_current_to_online_units
      - script.wait: send_active_current_to_online_units

  # --------------------------------------------------------------------------
  # reapply_active_setpoints
  # --------------------------------------------------------------------------
  # Restores the currently configured active voltage and current to one
  # specifically verified rectifier after discovery.
  #
  # The unit is still DISCOVERING while these commands are sent. It is marked
  # ONLINE by the discovery queue only after this script has completed.
  - id: reapply_active_setpoints
    mode: queued
    max_runs: 8

    parameters:
      unit: int

    then:
      - if:
          condition:
            lambda: |-
              const float voltage =
                  id(set_dc_voltage_limit).state;

              const float current =
                  id(set_dc_current_limit).state;

              return
                unit >= 1 &&
                unit <= 3 &&

                !isnan(voltage) &&
                voltage >= ${dc_voltage_min_v}f &&
                voltage <= ${dc_voltage_max_v}f &&

                !isnan(current) &&
                current >= ${minimum_dc_current_a}f &&
                current <= id(effective_dc_current_limit) + 0.01f &&

                !isnan(id(current_scaling_factor)) &&
                id(current_scaling_factor) > 0.0f;

          then:
            - lambda: |-
                ESP_LOGI(
                  "setpoint_restore",
                  "Reapplying active DC setpoints to Unit %d after discovery: "
                  "%.1f V, %.1f A/unit.",
                  unit,
                  id(set_dc_voltage_limit).state,
                  id(set_dc_current_limit).state
                );

                id(send_active_voltage_to_unit)->execute(unit);

            - script.wait: send_active_voltage_to_unit

            - delay: 50ms

            - lambda: |-
                id(send_active_current_to_unit)->execute(unit);

            - script.wait: send_active_current_to_unit

            - lambda: |-
                ESP_LOGI(
                  "setpoint_restore",
                  "Active DC setpoints reapplied successfully to Unit %d.",
                  unit
                );

          else:
            - lambda: |-
                ESP_LOGW(
                  "setpoint_restore",
                  "Active DC setpoints were not reapplied to Unit %d because "
                  "the stored voltage/current/scaling state is invalid. "
                  "Voltage=%.2f V, current=%.2f A, scaling=%.6f.",
                  unit,
                  id(set_dc_voltage_limit).state,
                  id(set_dc_current_limit).state,
                  id(current_scaling_factor)
                );

  # --------------------------------------------------------------------------
  # setup_sequence
  # --------------------------------------------------------------------------
  # Manually runs complete discovery for all three rectifiers.
  # Each unit is processed sequentially and the next unit starts immediately
  # after the previous unit has completed or exhausted its retry limit.
  - id: setup_sequence
    mode: single
    then:
      - logger.log:
          level: INFO
          format: "Starting full rectifier discovery sequence."

      - script.execute: discover_unit_1
      - script.wait: discover_unit_1

      - script.execute: discover_unit_2
      - script.wait: discover_unit_2

      - script.execute: discover_unit_3
      - script.wait: discover_unit_3

      - logger.log:
          level: INFO
          format: "Full rectifier discovery sequence completed."

  # --------------------------------------------------------------------------
  # discovery_queue
  # --------------------------------------------------------------------------
  # Global serialized discovery worker.
  #
  # All automatic per-unit discovery requests and the manual full discovery
  # sequence are routed through this queue so only one discovery operation can
  # use the CAN bus at a time.
  #
  # After a fully successful discovery, the currently configured active DC
  # voltage and current setpoints are immediately reapplied. This restores
  # normal operation after a rectifier has temporarily operated from its
  # internal fallback settings during a CAN outage.
  #
  # unit:
  #   0 = full manual discovery sequence
  #   1 = Unit 1 only
  #   2 = Unit 2 only
  #   3 = Unit 3 only
  - id: discovery_queue
    mode: queued
    max_runs: 8
    parameters:
      unit: int
    then:
      # Full three-unit discovery sequence.
      - if:
          condition:
            lambda: |-
              return unit == 0;
          then:
            - logger.log:
                level: INFO
                format: "Discovery queue: Unit 1 verified after full discovery - restoring active DC setpoints."
            - lambda: 'id(reapply_active_setpoints)->execute(1);'
            - script.wait: reapply_active_setpoints
            - script.execute:
                id: set_rectifier_control_state
                unit: 1
                state: ${rectifier_state_online}

            - lambda: 'id(reapply_active_setpoints)->execute(2);'
            - script.wait: reapply_active_setpoints
            - script.execute:
                id: set_rectifier_control_state
                unit: 2
                state: ${rectifier_state_online}

            - lambda: 'id(reapply_active_setpoints)->execute(3);'
            - script.wait: reapply_active_setpoints
            - script.execute:
                id: set_rectifier_control_state
                unit: 3
                state: ${rectifier_state_online}

            - script.execute: setup_sequence
            - script.wait: setup_sequence

            # A manual full discovery may be performed while fewer than three
            # units are available. Reapply the shared active setpoints when at
            # least one currently reachable unit completed a fully verified
            # discovery.
            - if:
                condition:
                  lambda: |-
                    const bool unit_1_ok =
                        id(can_com_ok_1).state &&
                        id(unit_properties_complete_1) &&
                        id(max_current_found_1) &&
                        id(data_found_1);

                    const bool unit_2_ok =
                        id(can_com_ok_2).state &&
                        id(unit_properties_complete_2) &&
                        id(max_current_found_2) &&
                        id(data_found_2);

                    const bool unit_3_ok =
                        id(can_com_ok_3).state &&
                        id(unit_properties_complete_3) &&
                        id(max_current_found_3) &&
                        id(data_found_3);

                    return unit_1_ok ||
                           unit_2_ok ||
                           unit_3_ok;

                then:
                  - logger.log:
                      level: INFO
                      format: "Discovery queue: verified discovery available - restoring active DC setpoints."

                  - script.execute: reapply_active_setpoints
                  - script.wait: reapply_active_setpoints

                else:
                  - logger.log:
                      level: WARN
                      format: "Discovery queue: no fully verified reachable unit after full discovery - immediate setpoint restore skipped."

            # Publish the resulting control state independently for every unit.
            - if:
                condition:
                  lambda: |-
                    return
                      id(can_com_ok_1).state &&
                      id(unit_properties_complete_1) &&
                      id(max_current_found_1) &&
                      id(data_found_1);

                then:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 1
                      state: ${rectifier_state_online}

                else:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 1
                      state: ${rectifier_state_offline}

            - if:
                condition:
                  lambda: |-
                    return
                      id(can_com_ok_2).state &&
                      id(unit_properties_complete_2) &&
                      id(max_current_found_2) &&
                      id(data_found_2);

                then:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 2
                      state: ${rectifier_state_online}

                else:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 2
                      state: ${rectifier_state_offline}

            - if:
                condition:
                  lambda: |-
                    return
                      id(can_com_ok_3).state &&
                      id(unit_properties_complete_3) &&
                      id(max_current_found_3) &&
                      id(data_found_3);

                then:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 3
                      state: ${rectifier_state_online}

                else:
                  - script.execute:
                      id: set_rectifier_control_state
                      unit: 3
                      state: ${rectifier_state_offline}

            - logger.log:
                level: INFO
                format: "Discovery queue: full three-unit discovery completed."

          else:
            # Unit 1
            - if:
                condition:
                  lambda: |-
                    return unit == 1;
                then:
                  - logger.log:
                      level: INFO
                      format: "Discovery queue: starting Unit 1 discovery."

                  - script.execute: discover_unit_1
                  - script.wait: discover_unit_1

                  - if:
                      condition:
                        lambda: |-
                          return
                            id(can_com_ok_1).state &&
                            id(unit_properties_complete_1) &&
                            id(max_current_found_1) &&
                            id(data_found_1);

                      then:
                        - logger.log:
                            level: INFO
                            format: "Discovery queue: Unit 1 discovery verified - restoring active DC setpoints."

                        - lambda: 'id(reapply_active_setpoints)->execute(1);'
                        - script.wait: reapply_active_setpoints

                        - script.execute:
                            id: set_rectifier_control_state
                            unit: 1
                            state: ${rectifier_state_online}

                      else:
                        - logger.log:
                            level: WARN
                            format: "Discovery queue: Unit 1 discovery incomplete - immediate setpoint restore skipped."

                        - script.execute:
                            id: set_rectifier_control_state
                            unit: 1
                            state: ${rectifier_state_offline}

                  - logger.log:
                      level: INFO
                      format: "Discovery queue: Unit 1 discovery completed."

                else:
                  # Unit 2
                  - if:
                      condition:
                        lambda: |-
                          return unit == 2;
                      then:
                        - logger.log:
                            level: INFO
                            format: "Discovery queue: starting Unit 2 discovery."

                        - script.execute: discover_unit_2
                        - script.wait: discover_unit_2

                        - if:
                            condition:
                              lambda: |-
                                return
                                  id(can_com_ok_2).state &&
                                  id(unit_properties_complete_2) &&
                                  id(max_current_found_2) &&
                                  id(data_found_2);

                            then:
                              - logger.log:
                                  level: INFO
                                  format: "Discovery queue: Unit 2 discovery verified - restoring active DC setpoints."

                              - lambda: 'id(reapply_active_setpoints)->execute(2);'
                              - script.wait: reapply_active_setpoints

                              - script.execute:
                                  id: set_rectifier_control_state
                                  unit: 2
                                  state: ${rectifier_state_online}

                            else:
                              - logger.log:
                                  level: WARN
                                  format: "Discovery queue: Unit 2 discovery incomplete - immediate setpoint restore skipped."

                              - script.execute:
                                  id: set_rectifier_control_state
                                  unit: 2
                                  state: ${rectifier_state_offline}

                        - logger.log:
                            level: INFO
                            format: "Discovery queue: Unit 2 discovery completed."

                      else:
                        # Unit 3
                        - if:
                            condition:
                              lambda: |-
                                return unit == 3;
                            then:
                              - logger.log:
                                  level: INFO
                                  format: "Discovery queue: starting Unit 3 discovery."

                              - script.execute: discover_unit_3
                              - script.wait: discover_unit_3

                              - if:
                                  condition:
                                    lambda: |-
                                      return
                                        id(can_com_ok_3).state &&
                                        id(unit_properties_complete_3) &&
                                        id(max_current_found_3) &&
                                        id(data_found_3);

                                  then:
                                    - logger.log:
                                        level: INFO
                                        format: "Discovery queue: Unit 3 discovery verified - restoring active DC setpoints."

                                    - lambda: 'id(reapply_active_setpoints)->execute(3);'
                                    - script.wait: reapply_active_setpoints

                                    - script.execute:
                                        id: set_rectifier_control_state
                                        unit: 3
                                        state: ${rectifier_state_online}

                                  else:
                                    - logger.log:
                                        level: WARN
                                        format: "Discovery queue: Unit 3 discovery incomplete - immediate setpoint restore skipped."

                                    - script.execute:
                                        id: set_rectifier_control_state
                                        unit: 3
                                        state: ${rectifier_state_offline}

                              - logger.log:
                                  level: INFO
                                  format: "Discovery queue: Unit 3 discovery completed."

                            else:
                              - lambda: |-
                                  ESP_LOGW(
                                    "discovery",
                                    "Discovery queue received invalid unit number: %d",
                                    unit
                                  );

  # --------------------------------------------------------------------------
  # apply_dc_sum_power
  # --------------------------------------------------------------------------
  # Converts the configured nominal three-unit DC power target into one common
  # current command for all rectifiers:
  #
  #     I_each = P_target / (3 * V_DC)
  #
  # The divisor intentionally remains fixed at three. The controller does not
  # increase the current of remaining units when another rectifier is offline,
  # unavailable or excluded by an overtemperature lockout.
  #
  # Therefore partial operation produces proportionally less total power:
  #   3 active units -> approximately 100% of the configured target
  #   2 active units -> approximately  67% of the configured target
  #   1 active unit  -> approximately  33% of the configured target
  #
  # This conservative behavior avoids automatically increasing current when a
  # rectifier's actual physical state cannot be determined reliably.
  #
  # The calculated per-unit current is limited to at least 1 A and at most the
  # current effective_dc_current_limit derived from detected capabilities.
  - id: apply_dc_sum_power
    mode: restart
    then:
      - lambda: |-
          const float voltage =
              id(set_dc_voltage_limit).state;

          const float power_kw =
              id(set_dc_sum_power).state;

          const float max_current =
              id(effective_dc_current_limit);


          if (isnan(voltage) || voltage < 49.0f) {

            ESP_LOGW(
              "encoder",
              "Invalid DC voltage - cannot calculate current."
            );

            return;
          }

          if (isnan(max_current) ||
              max_current <= 0.0f) {

            ESP_LOGE(
              "current_limit",
              "Invalid effective DC current limit - "
              "cannot calculate current."
            );

            return;
          }

          const float requested_current_per_rectifier =
              (power_kw * 1000.0f) /
              (voltage * 3.0f);

          float current_per_rectifier =
              requested_current_per_rectifier;

          if (current_per_rectifier > max_current) {

          ESP_LOGW(
            "encoder",
            "Nominal 3-unit target %.2f kW requires %.1f A/unit, "
            "but effective current limit is %.1f A. Clamping.",
            power_kw,
            requested_current_per_rectifier,
            max_current
          );

            current_per_rectifier =
                max_current;
          }

          if (current_per_rectifier < ${minimum_dc_current_a}f) {
            current_per_rectifier = ${minimum_dc_current_a}f;
          }

          ESP_LOGI(
            "encoder",
            "Nominal 3-unit DC target %.2f kW @ %.2f V -> "
            "%.1f A per rectifier "
            "(effective maximum %.1f A)",
            power_kw,
            voltage,
            current_per_rectifier,
            max_current
          );

          auto call =
              id(set_dc_current_limit).make_call();

          call.set_value(
            current_per_rectifier
          );

          call.perform();

  # --------------------------------------------------------------------------
  # blackstart_start
  # --------------------------------------------------------------------------
  # Offline START sequence. Recalculates current, explicitly sends voltage and
  # current setpoints, then evaluates each rectifier independently.
  # A unit is eligible for START only when:
  # - fresh cyclic CAN communication is available,
  # - the CAN-reported power state is explicitly OFF,
  # - a valid output temperature has been received,
  # - the output temperature is not above the configured trip threshold,
  # - no overtemperature lockout is active.
  - id: blackstart_start
    mode: single
    then:
      # Calculate per-unit current from voltage and the nominal three-unit power target.
      - script.execute: apply_dc_sum_power
      - script.wait: apply_dc_sum_power

      # Send voltage explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;

            int scaled_value =
                (int)(id(set_dc_voltage_limit).state *
                      id(voltage_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 50ms

      # Send calculated current explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;
            can_data[1] = 0x03;

            int scaled_value =
                (int)(id(set_dc_current_limit).state *
                      id(current_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 250ms

      # Start each rectifier individually.
      #
      # A unit is eligible for START only when:
      # - fresh cyclic CAN communication is available,
      # - a valid output temperature has been received,
      # - the output temperature is not above the 90 °C trip threshold,
      # - no overtemperature lockout is active.
      #
      # This also makes startup fail-safe after an ESP32 reboot: a unit cannot
      # be started before its first valid temperature telemetry has arrived.

      # Unit 1
      - if:
          condition:
            lambda: |-
              return id(can_com_ok_1).state &&
                     id(power_state_1).state == "OFF" &&
                     !isnan(id(output_temperature_1).state) &&
                     id(output_temperature_1).state <= ${overtemp_trip_c}f &&
                     !id(overtemp_lockout_1);
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108180FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - lambda: |-
                if (!id(can_com_ok_1).state) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 1 skipped - CAN communication unavailable."
                  );
                } else if (id(power_state_1).state != "OFF") {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 1 skipped - power state is %s, expected OFF.",
                    id(power_state_1).state.c_str()
                  );
                } else if (isnan(id(output_temperature_1).state)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 1 skipped - output temperature unavailable."
                  );
                } else if (id(output_temperature_1).state > ${overtemp_trip_c}f) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 1 skipped - output temperature too high (%.1f°C).",
                    id(output_temperature_1).state
                  );
                } else if (id(overtemp_lockout_1)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 1 skipped - overtemperature lockout active."
                  );
                }

      # Unit 2
      - if:
          condition:
            lambda: |-
              return id(can_com_ok_2).state &&
                     id(power_state_2).state == "OFF" &&
                     !isnan(id(output_temperature_2).state) &&
                     id(output_temperature_2).state <= ${overtemp_trip_c}f &&
                     !id(overtemp_lockout_2);
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108280FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - lambda: |-
                if (!id(can_com_ok_2).state) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 2 skipped - CAN communication unavailable."
                  );
                } else if (id(power_state_2).state != "OFF") {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 2 skipped - power state is %s, expected OFF.",
                    id(power_state_2).state.c_str()
                  );
                } else if (isnan(id(output_temperature_2).state)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 2 skipped - output temperature unavailable."
                  );
                } else if (id(output_temperature_2).state > ${overtemp_trip_c}f) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 2 skipped - output temperature too high (%.1f°C).",
                    id(output_temperature_2).state
                  );
                } else if (id(overtemp_lockout_2)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 2 skipped - overtemperature lockout active."
                  );
                }

      # Unit 3
      - if:
          condition:
            lambda: |-
              return id(can_com_ok_3).state &&
                     id(power_state_3).state == "OFF" &&
                     !isnan(id(output_temperature_3).state) &&
                     id(output_temperature_3).state <= ${overtemp_trip_c}f &&
                     !id(overtemp_lockout_3);
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108380FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - lambda: |-
                if (!id(can_com_ok_3).state) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 3 skipped - CAN communication unavailable."
                  );
                } else if (id(power_state_3).state != "OFF") {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 3 skipped - power state is %s, expected OFF.",
                    id(power_state_3).state.c_str()
                  );
                } else if (isnan(id(output_temperature_3).state)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 3 skipped - output temperature unavailable."
                  );
                } else if (id(output_temperature_3).state > ${overtemp_trip_c}f) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 3 skipped - output temperature too high (%.1f°C).",
                    id(output_temperature_3).state
                  );
                } else if (id(overtemp_lockout_3)) {
                  ESP_LOGW(
                    "blackstart",
                    "Unit 3 skipped - overtemperature lockout active."
                  );
                }

      - logger.log:
          level: INFO
          format: "BLACKSTART: Start sequence completed; only units passing CAN, power-state, temperature and lockout checks were commanded ON."

  # --------------------------------------------------------------------------
  # blackstart_stop
  # --------------------------------------------------------------------------
  # Offline STOP sequence. Broadcasts the OFF command to all units.
  - id: blackstart_stop
    mode: single
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

      - logger.log:
          level: INFO
          format: "BLACKSTART: Rectifiers switched OFF"

  # --------------------------------------------------------------------------
  # display_inactivity_timer
  # --------------------------------------------------------------------------
  # Restartable inactivity timer. Any encoder movement or
  # button press restarts it and wakes the backlight. After five minutes without
  # input, the backlight fades out over ten seconds.
  - id: display_inactivity_timer
    mode: restart
    then:
      # Wake display / keep backlight on
      - light.turn_on:
          id: back_light
          brightness: 100%
          transition_length: 200ms

      # Wait for 5 minutes without user input
      - delay: 5min

      # Slowly fade out backlight
      - light.turn_off:
          id: back_light
          transition_length: 10s


# ==============================================================================
# CAN BUS INTERFACE AND FRAME DECODERS
# ==============================================================================
# Uses the ESP32-S3 native CAN/TWAI peripheral at 125 kbit/s. The R4875G1
# protocol uses extended 29-bit CAN IDs. Unit number is encoded in the ID.
# Typical SN65HVD230 wiring:
#
# ESP32 GPIO15  -> CAN module CTX
# ESP32 GPIO16  -> CAN module CRX
# ESP32 3.3 V   -> 3V3
# ESP32 GND     -> GND
# CAN-H         -> CAN-H bus
# CAN-L         -> CAN-L bus
canbus:
  - platform: esp32_can
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0xE5F32E5
    bit_rate: 125kbps
    use_extended_id: true
    rx_queue_len: ${can_rx_queue_len}
    on_frame:
      # Handler for CAN ID 0x1081D27F (Packet x)
      # Handle unit 1 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1081D27F
      # Unit 1 property-message START/DATA frame. Six payload bytes are appended to the ASCII property buffer.
      - can_id: 0x1081D27F
        use_extended_id: true
        then:
          - lambda: |-
              // Any valid property frame confirms that Unit 1 is reachable.
              id(last_can_rx_1) = millis();

              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_1) = "";  // Clear existing string
                  id(unit_properties_complete_1) = false;
                  message_started = true;
                  id(frame_counter_msg_start_1) = 0;  // Reset global frame counter
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 1: Message Start Detected"
                  );
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_1) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_1)++;

                  // Log for debugging purposes
                  ESP_LOGD(
                    "unit_properties",
                    "Unit 1: Captured Frame #%d: %s",
                    id(frame_counter_msg_start_1),
                    frame_data.c_str()
                  );
                }
              }

      # Handler for CAN ID 0x1082D27F (Packet x)
      # Handle unit 2 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1082D27F
      # Unit 2 property-message START/DATA frame.
      - can_id: 0x1082D27F
        use_extended_id: true
        then:
          - lambda: |-
              // Any valid property frame confirms that Unit 2 is reachable.
              id(last_can_rx_2) = millis();

              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_2) = "";  // Clear existing string
                  id(unit_properties_complete_2) = false;
                  message_started = true;
                  id(frame_counter_msg_start_2) = 0;  // Reset global frame counter
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 2: Message Start Detected"
                  );
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_2) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_2)++;

                  // Log for debugging purposes
                  ESP_LOGD(
                    "unit_properties",
                    "Unit 2: Captured Frame #%d: %s",
                    id(frame_counter_msg_start_2),
                    frame_data.c_str()
                  );
                }
              }

      # Handler for CAN ID 0x1083D27F (Packet x)
      # Handle unit 3 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1083D27F
      # Unit 3 property-message START/DATA frame.
      - can_id: 0x1083D27F
        use_extended_id: true
        then:
          - lambda: |-
              // Any valid property frame confirms that Unit 3 is reachable.
              id(last_can_rx_3) = millis();

              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_3) = "";  // Clear existing string
                  id(unit_properties_complete_3) = false;
                  message_started = true;
                  id(frame_counter_msg_start_3) = 0;  // Reset global frame counter
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 3: Message Start Detected"
                  );
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_3) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_3)++;

                  // Log for debugging purposes
                  ESP_LOGD(
                    "unit_properties",
                    "Unit 3: Captured Frame #%d: %s",
                    id(frame_counter_msg_start_3),
                    frame_data.c_str()
                  );
                }
              }

      # Handler for CAN ID 0x1081D27E (Packet x)
      # Signal end of unit 1 properties message
      # ----------------------------------------------------------------------
      # CAN RX 0x1081D27E
      # Unit 1 property-message END frame. Final bytes are appended, key/value fields are parsed and text sensors are published.
      - can_id: 0x1081D27E
        use_extended_id: true
        then:
          - lambda: |-
              // The property END frame also confirms active CAN communication.
              id(last_can_rx_1) = millis();

              // Check if this frame contains additional payload data
              if (x.size() > 2) {  // Payload starts at x[2], so size must be > 2
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI(
                  "unit_properties",
                  "Unit 1: End Message Frame Data: %s",
                  frame_data.c_str()
                );
                // Append any remaining data to unit_properties_1
                id(unit_properties_1) += frame_data;
              }
              ESP_LOGI(
                "unit_properties",
                "Unit 1: Total Frames Captured: %d",
                id(frame_counter_msg_start_1)
              );
              if (id(frame_counter_msg_start_1) == 0) {
                ESP_LOGW(
                  "unit_properties",
                  "Unit 1: Property end frame received without a valid start/data frame. "
                  "Discarding incomplete response."
                );

                id(unit_properties_1).clear();
                id(unit_properties_complete_1) = false;
                return;
              }
              ESP_LOGD(
                "unit_properties",
                "Unit 1: Final Unit Properties: %s",
                id(unit_properties_1).c_str()
              );

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              // Map ASCII protocol keys to ESPHome text sensors. The final
              // Manufactured field is also used as a completion marker so the
              // discovery script can tell whether the property set was complete.
              KeySensorPair mappings[] = {
                {"BoardType=", id(unit_type_1), nullptr},
                {"BarCode=", id(barcode_1), nullptr},
                {"Item=", id(item_no_1), nullptr},
                {"Description=", id(description_1), nullptr},
                {"Manufactured=", id(manufactured_1), &id(unit_properties_complete_1)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(unit_properties_1), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 1: Extracted %s: %s",
                    mapping.key,
                    value.c_str()
                  );
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW(
                    "unit_properties",
                    "Unit 1: Key %s not found or empty",
                    mapping.key
                  );
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false; // Reset the flag for missing keys
                  }
                }
              }

              if (all_keys_found) {
                id(unit_properties_complete_1) = true; // Mark completion only if all keys are found
                ESP_LOGI(
                  "unit_properties",
                  "Unit 1: All required keys found. Marking as complete."
                );
              } else {
                id(unit_properties_complete_1) = false; // Explicitly reset the flag if keys are missing
                ESP_LOGI(
                  "unit_properties",
                  "Unit 1: Not all keys found. Will continue processing."
                );
              }

      # Handler for CAN ID 0x1082D27E (Packet x)
      # Signal end of unit 2 properties message
      # ----------------------------------------------------------------------
      # CAN RX 0x1082D27E
      # Unit 2 property-message END frame and parser.
      - can_id: 0x1082D27E
        use_extended_id: true
        then:
          - lambda: |-
              // The property END frame also confirms active CAN communication.
              id(last_can_rx_2) = millis();

              // Check if this frame contains additional payload data
              if (x.size() > 2) {  // Payload starts at x[2], so size must be > 2
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI(
                  "unit_properties",
                  "Unit 2: End Message Frame Data: %s",
                  frame_data.c_str()
                );
                // Append any remaining data to unit_properties_2
                id(unit_properties_2) += frame_data;
              }
              ESP_LOGI(
                "unit_properties",
                "Unit 2: Total Frames Captured: %d",
                id(frame_counter_msg_start_2)
              );
              if (id(frame_counter_msg_start_2) == 0) {
                ESP_LOGW(
                  "unit_properties",
                  "Unit 2: Property end frame received without a valid start/data frame. "
                  "Discarding incomplete response."
                );

                id(unit_properties_2).clear();
                id(unit_properties_complete_2) = false;
                return;
              }
              ESP_LOGD(
                "unit_properties",
                "Unit 2: Final Unit Properties: %s",
                id(unit_properties_2).c_str()
              );

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              // Map ASCII protocol keys to ESPHome text sensors. The final
              // Manufactured field is also used as a completion marker so the
              // discovery script can tell whether the property set was complete.
              KeySensorPair mappings[] = {
                {"BoardType=", id(unit_type_2), nullptr},
                {"BarCode=", id(barcode_2), nullptr},
                {"Item=", id(item_no_2), nullptr},
                {"Description=", id(description_2), nullptr},
                {"Manufactured=", id(manufactured_2), &id(unit_properties_complete_2)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(unit_properties_2), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 2: Extracted %s: %s",
                    mapping.key,
                    value.c_str()
                  );
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW(
                    "unit_properties",
                    "Unit 2: Key %s not found or empty",
                    mapping.key
                  );
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false; // Reset the flag for missing keys
                  }
                }
              }

              if (all_keys_found) {
                id(unit_properties_complete_2) = true; // Mark completion only if all keys are found
                ESP_LOGI(
                  "unit_properties",
                  "Unit 2: All required keys found. Marking as complete."
                );
              } else {
                id(unit_properties_complete_2) = false; // Explicitly reset the flag if keys are missing
                ESP_LOGI(
                  "unit_properties",
                  "Unit 2: Not all keys found. Will continue processing."
                );
              }

      # Handler for CAN ID 0x1083D27E (Packet x)
      # Signal end of unit 3 properties message
      # ----------------------------------------------------------------------
      # CAN RX 0x1083D27E
      # Unit 3 property-message END frame and parser.
      - can_id: 0x1083D27E
        use_extended_id: true
        then:
          - lambda: |-
              // The property END frame also confirms active CAN communication.
              id(last_can_rx_3) = millis();

              // Check if this frame contains additional payload data
              if (x.size() > 2) {  // Payload starts at x[2], so size must be > 2
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI(
                  "unit_properties",
                  "Unit 3: End Message Frame Data: %s",
                  frame_data.c_str()
                );
                // Append any remaining data to unit_properties_2
                id(unit_properties_3) += frame_data;
              }
              ESP_LOGI(
                "unit_properties",
                "Unit 3: Total Frames Captured: %d",
                id(frame_counter_msg_start_3)
              );
              if (id(frame_counter_msg_start_3) == 0) {
                ESP_LOGW(
                  "unit_properties",
                  "Unit 3: Property end frame received without a valid start/data frame. "
                  "Discarding incomplete response."
                );

                id(unit_properties_3).clear();
                id(unit_properties_complete_3) = false;
                return;
              }
              ESP_LOGD(
                "unit_properties",
                "Unit 3: Final Unit Properties: %s",
                id(unit_properties_3).c_str()
              );

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              // Map ASCII protocol keys to ESPHome text sensors. The final
              // Manufactured field is also used as a completion marker so the
              // discovery script can tell whether the property set was complete.
              KeySensorPair mappings[] = {
                {"BoardType=", id(unit_type_3), nullptr},
                {"BarCode=", id(barcode_3), nullptr},
                {"Item=", id(item_no_3), nullptr},
                {"Description=", id(description_3), nullptr},
                {"Manufactured=", id(manufactured_3), &id(unit_properties_complete_3)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(unit_properties_3), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI(
                    "unit_properties",
                    "Unit 3: Extracted %s: %s",
                    mapping.key,
                    value.c_str()
                  );
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW(
                    "unit_properties",
                    "Unit 3: Key %s not found or empty", mapping.key
                  );
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false; // Reset the flag for missing keys
                  }
                }
              }

              if (all_keys_found) {
                id(unit_properties_complete_3) = true; // Mark completion only if all keys are found
                ESP_LOGI(
                  "unit_properties",
                  "Unit 3: All required keys found. Marking as complete."
                );
              } else {
                id(unit_properties_complete_3) = false; // Explicitly reset the flag if keys are missing
                ESP_LOGI(
                  "unit_properties",
                  "Unit 3: Not all keys found. Will continue processing."
                );
              }

      # Handler for CAN ID 0x1081407F (Packet x)
      # Handle messages from Unit 1
      # ----------------------------------------------------------------------
      # CAN RX 0x1081407F
      # Unit 1 cyclic telemetry. Also refreshes last_can_rx_1, making this frame family the Unit 1 communication heartbeat.
      - can_id: 0x1081407F
        use_extended_id: true
        then:
          - lambda: |-
              if (x.size() >= 8) {
                // Valid cyclic telemetry received: refresh CAN communication watchdog.
                id(last_can_rx_1) = millis();

                // Cyclic telemetry frame layout used below:
                //   x[0]    = message class (0x01 for decoded measurement data)
                //   x[1]    = parameter selector (power/frequency/current/etc.)
                //   x[4..7] = unsigned 32-bit big-endian raw value
                // The destination template sensor applies the engineering scale.
                const uint8_t byte_0 = static_cast<uint8_t>(x[0]);
                const uint8_t byte_1 = static_cast<uint8_t>(x[1]);
                const uint32_t value = (static_cast<uint32_t>(x[4]) << 24) |
                                       (static_cast<uint32_t>(x[5]) << 16) |
                                       (static_cast<uint32_t>(x[6]) << 8) |
                                       static_cast<uint32_t>(x[7]);
                switch (byte_0) {
                  case 0x01:
                    switch (byte_1) {
                      case 0x70: id(ac_power_1).publish_state(value); break;
                      case 0x71: id(ac_frequency_1).publish_state(value); break;
                      case 0x72: id(ac_current_1).publish_state(value); break;
                      case 0x73: id(dc_power_1).publish_state(value); break;
                      case 0x75: id(dc_voltage_1).publish_state(value); break;
                      case 0x76: id(max_dc_current_setpoint_1).publish_state(value); break;
                      case 0x78: id(ac_voltage_1).publish_state(value); break;
                      case 0x7F: id(output_temperature_1).publish_state(value); break;
                      case 0x81: id(dc_current_1).publish_state(value); break;
                      case 0x80: id(input_temperature_1).publish_state(value); break;
                      case 0x0E: id(operating_hours_1).publish_state(value); break;
                    }
                    break;
                }
              }

