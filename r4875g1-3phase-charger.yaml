                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI("module_properties_1", "End Message Frame Data: %s", frame_data.c_str());

                // Append any remaining data to module_properties_1
                id(module_properties_1) += frame_data;
              }
              ESP_LOGI("module_properties_1", "Total Frames Captured: %d", id(frame_counter_msg_start_1));
              ESP_LOGI("module_properties_1", "Final Module Properties: %s", id(module_properties_1).c_str());

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              KeySensorPair mappings[] = {
                {"ModuleType=", id(module_type_sensor_1), nullptr},
                {"BarCode=", id(barcode_sensor_1), nullptr},
                {"Item=", id(item_no_sensor_1), nullptr},
                {"Description=", id(description_sensor_1), nullptr},
                {"Manufactured=", id(manufactured_sensor_1), &id(module_properties_complete_1)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(module_properties_1), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI("module_properties_1", "Extracted %s: %s", mapping.key, value.c_str());
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW("module_properties_1", "Key %s not found or empty", mapping.key);
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false; // Reset the flag for missing keys
                  }
                }
              }

              if (all_keys_found) {
                id(module_properties_complete_1) = true; // Mark completion only if all keys are found
                ESP_LOGI("module_properties_1", "All required keys found. Marking as complete.");
              } else {
                id(module_properties_complete_1) = false; // Explicitly reset the flag if keys are missing
                ESP_LOGI("module_properties_1", "Not all keys found. Will continue processing.");
              }

