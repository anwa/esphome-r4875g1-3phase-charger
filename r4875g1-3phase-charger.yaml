# ==============================================================================
# USER-ADJUSTABLE SETPOINTS
# ==============================================================================
# Canonical voltage/current/fallback/power controls. Web, Home Assistant, MQTT
# and the encoder ultimately update these entities so CAN encoding remains
# centralized in one place.
number:
  # --------------------------------------------------------------------------
  # Set Fan Minimum Speed
  # Configures the minimum fan duty cycle for all rectifier units.
  # The requested percentage value is converted to the rectifier's fixed-point
  # representation using:
  #
  #     raw_value = fan_percent * 256
  #
  # The 16-bit value is transmitted in big-endian format using broadcast
  # CAN ID 0x108080FE with command selector 0x14.
  #
  # Because the command is broadcast, the setting applies to all connected
  # rectifier units at the same time.
  #
  # Range:
  #   0%   = minimum fan duty disabled / lowest supported fan command
  #   100% = maximum requested minimum fan duty
  #
  # The value is restored after reboot and can be adjusted through ESPHome,
  # Home Assistant or the web interface.
  - platform: template
    name: "Set Fan Minimum Speed"
    id: set_fan_min_speed
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: SLIDER
    restore_value: true
    initial_value: 0
    icon: "mdi:fan"
    on_value:
      then:
        # Allow the optimistic number entity to finish updating before reading
        # its new state and constructing the CAN command.
        - delay: 0.01s
        - lambda: |-
            // Log the requested engineering value before CAN encoding.
            float fan_value = id(set_fan_min_speed).state;
            ESP_LOGI(
              "custom",
              "Received fan minimum speed: %.0f%%",
              fan_value
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              // Build an 8-byte broadcast command frame initialized to zero.
              std::vector<uint8_t> can_data(8, 0x00);
              // Command group 0x01 with selector 0x14 addresses the
              // minimum fan duty-cycle setting.
              can_data[0] = 0x01;
              can_data[1] = 0x14;
              // Convert percentage to the rectifier fixed-point format.
              // Example:
              //   25% * 256 = 6400 = 0x1900
              const int scaled_value =
                  static_cast<int>(
                    id(set_fan_min_speed).state *
                    ${fan_duty_counts_per_percent}f
                  );
              // Store the 16-bit value in big-endian format.
              can_data[2] = (scaled_value >> 8) & 0xFF;
              can_data[3] = scaled_value & 0xFF;
              // Bytes 4..7 remain zero.
              return can_data;

  # DC Voltage Setting
  # --------------------------------------------------------------------------
  # Set DC Voltage Limit
  # Primary broadcast DC voltage setpoint using the centralized project
  # voltage range and 0.1 V steps.
  # The value is encoded as V * voltage_scaling_factor and sent in bytes 6..7 of
  # broadcast CAN ID 0x108080FE.
  - platform: template
    name: "Set DC Voltage Limit"
    id: set_dc_voltage_limit
    min_value: ${dc_voltage_min_v}
    max_value: ${dc_voltage_max_v}
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: ${dc_voltage_default_v}
    command_topic: "${mqtt_command_prefix}/set_dc_voltage"
    on_value:
      then:
        - lambda: |-
            // Encode engineering volts into the rectifier's fixed-point CAN format.
            float voltage_value = id(set_dc_voltage_limit).state;
            ESP_LOGI(
              "custom",
              "Received DC voltage limit: %.1f V",
              voltage_value
            );

        - script.execute: send_active_voltage_to_online_units

  # DC Current Setting
  # --------------------------------------------------------------------------
  # Set DC Current Limit
  # Secondary all-rectifier current setpoint. The requested current is
  # validated against the detected unit model/capability, encoded using
  # current_scaling_factor and broadcast with command selector 0x03.
  - platform: template
    name: "Set DC Current Limit"
    id: set_dc_current_limit
    min_value: ${minimum_dc_current_a}
    # Absolute project/UI ceiling. The runtime effective limit may be lower.
    max_value: ${project_max_dc_current_a}
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: ${minimum_dc_current_a}
    command_topic: "${mqtt_command_prefix}/set_dc_current"
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float current_value =
                id(set_dc_current_limit).state;

            const float max_current =
                id(effective_dc_current_limit);


            if (current_value > max_current) {

              ESP_LOGW(
                "current_limit",
                "Requested DC current %.1f A exceeds effective limit %.1f A. "
                "Clamping setpoint.",
                current_value,
                max_current
              );

              id(set_dc_current_limit).publish_state(
                max_current
              );

              current_value = max_current;
            }


            ESP_LOGI(
              "custom",
              "DC Current Limit set to %.1f A "
              "(effective maximum %.1f A).",
              current_value,
              max_current
            );

        - script.execute: send_active_current_to_online_units

  # DC Current Fallback Setting
  # --------------------------------------------------------------------------
  # Set DC Current Limit Fallback
  # Fallback current parameter. Uses the same model-dependent
  # current validation but command selector 0x04.
  - platform: template
    name: "Set DC Current Limit Fallback"
    id: set_dc_current_limit_fallback
    min_value: ${minimum_dc_current_a}
    # Absolute project/UI ceiling. The runtime effective limit may be lower.
    max_value: ${project_max_dc_current_a}
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: ${minimum_dc_current_a}
    command_topic: "${mqtt_command_prefix}/set_dc_current_fallback"
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float fallback_current_value =
                id(set_dc_current_limit_fallback).state;

            const float max_current =
                id(effective_dc_current_limit);


            if (fallback_current_value > max_current) {

              ESP_LOGW(
                "current_limit",
                "Requested fallback DC current %.1f A exceeds "
                "effective limit %.1f A. Clamping setpoint.",
                fallback_current_value,
                max_current
              );

              id(set_dc_current_limit_fallback).publish_state(
                max_current
              );

              fallback_current_value = max_current;
            }


            ESP_LOGI(
              "custom",
              "DC Current Limit fallback set to %.1f A "
              "(effective maximum %.1f A).",
              fallback_current_value,
              max_current
            );

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x04;
              int scaled_value = (int)(id(set_dc_current_limit_fallback).state * id(current_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # DC Voltage Fallback Setting
  # --------------------------------------------------------------------------
  # Set DC Voltage Limit Fallback
  # Fallback voltage parameter using the same centralized project voltage
  # range as the active DC voltage setting.
  - platform: template
    name: "Set DC Voltage Limit Fallback"
    id: set_dc_voltage_limit_fallback
    min_value: ${dc_voltage_min_v}
    max_value: ${dc_voltage_max_v}
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: ${dc_voltage_default_v}
    command_topic: "${mqtt_command_prefix}/set_dc_voltage_fallback"
    on_value:
      then:
        - lambda: |-
            // Fallback voltage uses the same V * 1024 representation as active voltage.
            float fallback_voltage_value = id(set_dc_voltage_limit_fallback).state;  // Get the fallback voltage value
            ESP_LOGI(
              "custom",
              "Received fallback DC voltage limit: %.1f V",
              fallback_voltage_value
            );

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
              can_data[0] = 0x01;  // First byte is always 0x01
              can_data[1] = 0x01;  // Second byte is 0x01 for the Fallback Voltage setting
              int fallback_scaled_value = (int)(id(set_dc_voltage_limit_fallback).state * id(voltage_scaling_factor));  // Scale the voltage value
              can_data[6] = (fallback_scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
              can_data[7] = fallback_scaled_value & 0xFF;         // Encode the low byte in the 8th byte
              return can_data;

  # AC Current Setting
  # --------------------------------------------------------------------------
  # Set AC Current Limit
  # Broadcast AC input-current limit for all rectifiers.
  # A model-dependent maximum is derived from current_scaling_factor.
  # The requested amperage is encoded using voltage_scaling_factor
  # (1024 counts per ampere) and sent with command selector 0x09.
  # Byte 3 enables the limit when the requested value is greater than zero.
  - platform: template
    name: "Set AC Current Limit"
    id: set_ac_current_limit
    min_value: 0
    max_value: 21
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    initial_value: 0
    icon: "mdi:current-ac"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float current_value = id(set_ac_current_limit).state;
            float max_current = 10.0; // default
            if (id(current_scaling_factor) >= 18 && id(current_scaling_factor) <= 22) {
              max_current = 17.0;
            } else if (id(current_scaling_factor) >= 13 && id(current_scaling_factor) <= 15) {
              max_current = 21.0;
            } else if (id(current_scaling_factor) >= 25 && id(current_scaling_factor) <= 35) {
              max_current = 13.0;
            }
            if (current_value > max_current) {
              ESP_LOGW(
                "custom",
                "Entered AC Current %.1f exceeds model limit %.1f, resetting.",
                current_value,
                max_current
              );
              id(set_ac_current_limit).publish_state(max_current);
              current_value = max_current;
            }
            if (current_value == 0) {
              ESP_LOGI(
                "custom",
                "AC Current Limit disabled."
              );
            } else {
              ESP_LOGI(
                "custom",
                "AC Current Limit set to %.1f A.",
                current_value
              );
            }
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              int scaled_value = (int)(id(set_ac_current_limit).state * id(voltage_scaling_factor));
              can_data[0] = 0x01;
              can_data[1] = 0x09;
              can_data[3] = (id(set_ac_current_limit).state > 0) ? 0x01 : 0x00;
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # --------------------------------------------------------------------------
  # Set DC Sum Power
  # Nominal total DC power target for the complete three-rectifier system.
  #
  # This is not a native rectifier parameter. Changing it runs
  # apply_dc_sum_power, which always calculates the common current command as:
  #
  #     I_each = P_target / (3 * V_DC)
  #
  # The target is intentionally not redistributed across fewer available units.
  # If only one or two rectifiers operate, actual total output power will be
  # proportionally lower than this nominal three-unit target.
  - platform: template
    name: "Set DC Sum Power"
    id: set_dc_sum_power
    unit_of_measurement: "kW"
    min_value: 0.25
    max_value: 12.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    mode: BOX

    on_value:
      then:
        - script.execute: apply_dc_sum_power

# ==============================================================================
# LOCAL BUTTON AND CAN CONNECTIVITY
# ==============================================================================
# Includes the rotary encoder push button and three connectivity watchdogs that
# indicate whether fresh cyclic telemetry is arriving from each rectifier.
binary_sensor:
  # --------------------------------------------------------------------------
  # local_encoder_button
  # Physical encoder push button on GPIO2. The internal pull-up makes the input active-low. A 30 ms delayed_on_off filter debounces the switch. on_press wakes the display; short press changes encoder mode; >=3 s long press starts/stops the rectifiers.
  - platform: gpio
    id: local_encoder_button
    internal: true

    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 30ms

    # Every physical button press wakes the display
    # and resets the 5-minute inactivity timer.
    on_press:
      then:
        - script.execute: display_inactivity_timer

    on_multi_click:

      # Short press:
      # Toggle encoder editing mode: DC Voltage <-> Total DC Power.
      - timing:
          - ON for 50ms to 2800ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(encoder_mode) = !id(encoder_mode);

              ESP_LOGI(
                "encoder",
                "Selected: %s",
                id(encoder_mode) == 0
                  ? "DC Voltage"
                  : "DC Sum Power"
              );
          - component.update: tft
      # Long press:
      # Toggle rectifier units ON/OFF for local blackstart control.
      #
      # Safety rules:
      # - If at least one reachable unit reports ON, send STOP.
      # - If CAN communication exists and no reachable unit reports ON, START.
      # - If no unit is reachable at all, do nothing because the actual charger
      #   state cannot be determined safely.
      - timing:
          - ON for at least 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return
                    (id(can_com_ok_1).state &&
                     id(power_state_1).state == "ON") ||
                    (id(can_com_ok_2).state &&
                     id(power_state_2).state == "ON") ||
                    (id(can_com_ok_3).state &&
                     id(power_state_3).state == "ON");
              then:
                - script.execute: blackstart_stop

              else:
                - if:
                    condition:
                      lambda: |-
                        return
                          id(can_com_ok_1).state ||
                          id(can_com_ok_2).state ||
                          id(can_com_ok_3).state;
                    then:
                      - script.execute: blackstart_start

                    else:
                      - logger.log:
                          level: WARN
                          format: "BLACKSTART: Start/stop ignored - no rectifier CAN communication available."

  # CAN communication watchdogs
  #
  # The charger units are queried several times per second. A unit is
  # considered online while valid per-unit CAN activity has been received
  # within the configured can_watchdog_timeout_ms period.
  # Unsigned subtraction keeps the calculation safe across millis() wrap-around.
  # --------------------------------------------------------------------------
  # CAN Communication Unit 1
  # Per-unit connectivity watchdog using the centralized CAN timeout.
  - platform: template
    id: can_com_ok_1
    name: "CAN Communication Unit 1"
    device_class: connectivity
    entity_category: diagnostic

    lambda: |-
      return id(last_can_rx_1) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_1)) < ${can_watchdog_timeout_ms}U;

    # Whenever Unit 1 becomes reachable, refresh its capability/address data.
    # Unit 1 is the canonical source for current_scaling_factor, so this also
    # verifies or corrects the model-specific fallback automatically.
    on_press:
      then:
        # Raw CAN communication is allowed to start a reconnect/discovery
        # sequence only while the lifecycle state is OFFLINE.
        #
        # CAN watchdog transitions occurring during an already-running
        # discovery must not queue another discovery request.
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_1) ==
                    ${rectifier_state_offline};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 1
                  state: ${rectifier_state_discovering}

              - logger.log:
                  level: INFO
                  format: "Unit 1 CAN communication detected - entering discovery stabilization."

              - delay: ${discovery_startup_delay}

              - if:
                  condition:
                    lambda: |-
                      return
                        id(rectifier_control_state_1) ==
                          ${rectifier_state_discovering};

                  then:
                    - logger.log:
                        level: INFO
                        format: "Unit 1 discovery stabilization complete - starting automatic discovery."

                    - script.execute:
                        id: discovery_queue
                        unit: 1

    on_release:
      then:
        # Only a fully ONLINE unit is demoted immediately when the normal CAN
        # watchdog expires.
        #
        # During DISCOVERING the raw watchdog is allowed to expire because
        # normal cyclic polling is intentionally suspended. The discovery
        # process itself decides whether the unit returns ONLINE or OFFLINE.
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_1) ==
                    ${rectifier_state_online};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 1
                  state: ${rectifier_state_offline}

        - lambda: |-
            if (id(power_state_1).state != "UNKNOWN") {
              id(power_state_1).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 1: CAN communication lost - power state set to UNKNOWN."
              );
            }

  # --------------------------------------------------------------------------
  # CAN Communication Unit 2
  # Per-unit connectivity watchdog using the centralized CAN timeout.
  - platform: template
    id: can_com_ok_2
    name: "CAN Communication Unit 2"
    device_class: connectivity
    entity_category: diagnostic

    lambda: |-
      return id(last_can_rx_2) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_2)) < ${can_watchdog_timeout_ms}U;

    # Whenever Unit 2 becomes reachable, refresh its capability/address data.
    # Unit 2's detected scaling factor is exposed for diagnostics only; the shared
    # current_scaling_factor remains based on Unit 1.
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_2) ==
                    ${rectifier_state_offline};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 2
                  state: ${rectifier_state_discovering}

              - logger.log:
                  level: INFO
                  format: "Unit 2 CAN communication detected - entering discovery stabilization."

              - delay: ${discovery_startup_delay}

              - if:
                  condition:
                    lambda: |-
                      return
                        id(rectifier_control_state_2) ==
                          ${rectifier_state_discovering};

                  then:
                    - logger.log:
                        level: INFO
                        format: "Unit 2 discovery stabilization complete - starting automatic discovery."

                    - script.execute:
                        id: discovery_queue
                        unit: 2

    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_2) ==
                    ${rectifier_state_online};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 2
                  state: ${rectifier_state_offline}

        - lambda: |-
            if (id(power_state_2).state != "UNKNOWN") {
              id(power_state_2).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 2: CAN communication lost - power state set to UNKNOWN."
              );
            }

  # --------------------------------------------------------------------------
  # CAN Communication Unit 3
  # Per-unit connectivity watchdog using the centralized CAN timeout.
  - platform: template
    id: can_com_ok_3
    name: "CAN Communication Unit 3"
    device_class: connectivity
    entity_category: diagnostic

    lambda: |-
      return id(last_can_rx_3) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_3)) < ${can_watchdog_timeout_ms}U;

    # Whenever Unit 3 becomes reachable, refresh its capability/address data.
    # Unit 3's detected scaling factor is exposed for diagnostics only; the shared
    # current_scaling_factor remains based on Unit 1.
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_3) ==
                    ${rectifier_state_offline};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 3
                  state: ${rectifier_state_discovering}

              - logger.log:
                  level: INFO
                  format: "Unit 3 CAN communication detected - entering discovery stabilization."

              - delay: ${discovery_startup_delay}

              - if:
                  condition:
                    lambda: |-
                      return
                        id(rectifier_control_state_3) ==
                          ${rectifier_state_discovering};

                  then:
                    - logger.log:
                        level: INFO
                        format: "Unit 3 discovery stabilization complete - starting automatic discovery."

                    - script.execute:
                        id: discovery_queue
                        unit: 3

    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return
                  id(rectifier_control_state_3) ==
                    ${rectifier_state_online};

            then:
              - script.execute:
                  id: set_rectifier_control_state
                  unit: 3
                  state: ${rectifier_state_offline}

        - lambda: |-
            if (id(power_state_3).state != "UNKNOWN") {
              id(power_state_3).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 3: CAN communication lost - power state set to UNKNOWN."
              );
            }

  # --------------------------------------------------------------------------
  # Rectifier Capability Mismatch
  # Diagnostic problem indicator comparing the maximum-current capability
  # reported by all three rectifiers.
  #
  # State:
  #   unknown = not all three current capabilities have been confirmed
  #   OFF     = all three capabilities match
  #   ON      = at least one rectifier reports a different capability
  #
  # The state is published by evaluate_rectifier_capabilities whenever fresh
  # capability data is received.
  - platform: template
    name: "Rectifier Capability Mismatch"
    id: rectifier_capability_mismatch
    device_class: problem
    entity_category: diagnostic
    icon: "mdi:alert-circle-outline"

# ==============================================================================
# PERIODIC CAN TRAFFIC
# ==============================================================================
# Polls live telemetry frequently and periodically reasserts active voltage and
# current setpoints so units that restart can recover the requested settings.
interval:
  # --------------------------------------------------------------------------
  # Periodic task: TWAI controller recovery
  #
  # If every physical CAN peer disappears, transmitted frames are no longer
  # acknowledged. Repeated transmission errors can eventually place the
  # ESP32 TWAI controller into BUS_OFF state.
  #
  # ESP-IDF requires bus recovery to be initiated explicitly. The legacy TWAI
  # driver enters STOPPED state when recovery completes and must then be
  # started again before normal CAN communication can resume.
  #
  # Once the controller is running again, the normal telemetry polling below
  # automatically detects returning rectifiers. The existing can_com_ok_x
  # OFF->ON transition then launches automatic unit discovery.
  - interval: ${can_recovery_check_interval}
    then:
      - lambda: |-
          twai_status_info_t status_info{};

          const esp_err_t status_result =
              twai_get_status_info(&status_info);

          if (status_result != ESP_OK) {
            ESP_LOGW(
              "can_recovery",
              "Unable to read TWAI controller status: %s",
              esp_err_to_name(status_result)
            );

            return;
          }

          // --------------------------------------------------------------
          // BUS_OFF
          // --------------------------------------------------------------
          //
          // The controller has disabled itself after excessive CAN errors.
          // Start the ESP-IDF bus-recovery sequence.
          if (status_info.state == TWAI_STATE_BUS_OFF) {

            ESP_LOGW(
              "can_recovery",
              "TWAI controller BUS_OFF "
              "(TX errors: %lu, bus errors: %lu). "
              "Starting recovery.",
              static_cast<unsigned long>(status_info.tx_error_counter),
              static_cast<unsigned long>(status_info.bus_error_count)
            );

            const esp_err_t recovery_result =
                twai_initiate_recovery();

            if (recovery_result == ESP_OK) {

              ESP_LOGI(
                "can_recovery",
                "TWAI bus recovery initiated."
              );

            } else {

              ESP_LOGW(
                "can_recovery",
                "Failed to initiate TWAI recovery: %s",
                esp_err_to_name(recovery_result)
              );
            }

            return;
          }

          // --------------------------------------------------------------
          // STOPPED
          // --------------------------------------------------------------
          //
          // The legacy ESP-IDF TWAI driver returns to STOPPED state after
          // successful bus recovery. Restart it so normal RX/TX can resume.
          if (status_info.state == TWAI_STATE_STOPPED) {

            const esp_err_t start_result =
                twai_start();

            if (start_result == ESP_OK) {

              ESP_LOGI(
                "can_recovery",
                "TWAI controller restarted after recovery."
              );

            } else {

              ESP_LOGW(
                "can_recovery",
                "Failed to restart TWAI controller: %s",
                esp_err_to_name(start_result)
              );
            }

            return;
          }

  # --------------------------------------------------------------------------
  # Periodic task: slow offline rectifier probing
  #
  # Offline rectifiers are not included in the normal high-rate polling cycle.
  #
  # Instead, one unit is considered every five seconds in round-robin order:
  #
  #   Unit 1 -> Unit 2 -> Unit 3 -> Unit 1 ...
  #
  # A telemetry request is transmitted only when the selected unit is OFFLINE.
  # Therefore each continuously offline unit is probed approximately every
  # 15 seconds.
  #
  # Only the normal cyclic telemetry request is used as the probe. Fan
  # telemetry is deliberately not requested from an offline unit.
  #
  # Offline probing is suspended while the serialized discovery worker is
  # active so reconnect probes cannot interfere with discovery traffic.
  - interval: ${offline_probe_slot_interval}
    then:
      - if:
          condition:
            lambda: |-
              return !id(discovery_queue).is_running();

          then:
            # --------------------------------------------------------------
            # Unit 1 probe slot
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(offline_probe_next_unit) == 1 &&
                      id(rectifier_control_state_1) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108140FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            # --------------------------------------------------------------
            # Unit 2 probe slot
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(offline_probe_next_unit) == 2 &&
                      id(rectifier_control_state_2) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108240FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            # --------------------------------------------------------------
            # Unit 3 probe slot
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(offline_probe_next_unit) == 3 &&
                      id(rectifier_control_state_3) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108340FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            # Advance to the next unit for the following probe slot.
            - lambda: |-
                id(offline_probe_next_unit)++;

                if (id(offline_probe_next_unit) > 3) {
                  id(offline_probe_next_unit) = 1;
                }

  # --------------------------------------------------------------------------
  # Periodic task: 577 ms
  #
  # State-aware fast CAN polling.
  #
  # ONLINE:
  #   cyclic telemetry + fan telemetry
  #
  # DISCOVERING:
  #   cyclic telemetry only
  #
  # OFFLINE:
  #   excluded completely; reconnect detection is handled by the slow probe
  #   scheduler above.
  #
  # During property discovery the complete fast-polling cycle is suspended so
  # the multi-frame property response has exclusive access to the CAN bus.
  - interval: ${telemetry_poll_interval}
    then:
      - if:
          condition:
            lambda: |-
              return
                !id(detect_unit_1_properties).is_running() &&
                !id(detect_unit_2_properties).is_running() &&
                !id(detect_unit_3_properties).is_running();

          then:
            # --------------------------------------------------------------
            # Unit 1 cyclic telemetry
            #
            # ONLINE and DISCOVERING both receive this request.
            # DISCOVERING still needs the cyclic heartbeat during the current
            # 5-second stabilization delay because the CAN watchdog expires
            # after 3 seconds.
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_1) !=
                        ${rectifier_state_offline};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108140FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            - delay: ${fan_query_delay}

            # Fan telemetry is normal operational polling and therefore runs
            # only when Unit 1 is fully ONLINE.
            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_1) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108182FE
                      data:
                        - 0x01
                        - 0x87
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            - delay: ${unit_2_poll_gap}

            # --------------------------------------------------------------
            # Unit 2 cyclic telemetry
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_2) !=
                        ${rectifier_state_offline};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108240FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            - delay: ${fan_query_delay}

            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_2) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108282FE
                      data:
                        - 0x01
                        - 0x87
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            - delay: ${unit_3_poll_gap}

            # --------------------------------------------------------------
            # Unit 3 cyclic telemetry
            # --------------------------------------------------------------
            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_3) !=
                        ${rectifier_state_offline};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108340FE
                      data:
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

            - delay: ${fan_query_delay}

            - if:
                condition:
                  lambda: |-
                    return
                      id(rectifier_control_state_3) ==
                        ${rectifier_state_online};

                then:
                  - canbus.send:
                      use_extended_id: true
                      can_id: 0x108382FE
                      data:
                        - 0x01
                        - 0x87
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00
                        - 0x00

  # --------------------------------------------------------------------------
  # Periodic task: active setpoint refresh
  #
  # Active voltage/current are periodically reasserted only to rectifiers that
  # completed discovery and are currently ONLINE.
  #
  # OFFLINE and DISCOVERING units deliberately receive no normal active
  # setpoints. A successfully rediscovered unit receives its configured active
  # values through reapply_active_setpoints before transitioning to ONLINE.
  - interval: ${setpoint_refresh_interval}
    then:
      - script.execute: refresh_active_setpoints_online

# ==============================================================================
# MANUAL CONTROL BUTTON ENTITIES
# ==============================================================================
# Home Assistant/web controls for broadcast and individual ON/OFF commands,
# fan overrides and manual unit discovery.
button:
  # Broadcast ON command to all three rectifiers.
  # Because this command cannot exclude individual units, all three rectifiers
  # must have valid CAN communication, valid safe temperature telemetry and no
  # active overtemperature lockout.
  - platform: template
    name: "Turn On All Units"
    id: on_button_all
    icon: "mdi:power"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "All Unit ON button pressed."
            );
        - if:
            condition:
              lambda: |-
                return
                  id(can_com_ok_1).state &&
                  id(can_com_ok_2).state &&
                  id(can_com_ok_3).state &&

                  id(power_state_1).state == "OFF" &&
                  id(power_state_2).state == "OFF" &&
                  id(power_state_3).state == "OFF" &&

                  !isnan(id(output_temperature_1).state) &&
                  !isnan(id(output_temperature_2).state) &&
                  !isnan(id(output_temperature_3).state) &&

                  id(output_temperature_1).state <= ${overtemp_trip_c}f &&
                  id(output_temperature_2).state <= ${overtemp_trip_c}f &&
                  id(output_temperature_3).state <= ${overtemp_trip_c}f &&

                  !id(overtemp_lockout_1) &&
                  !id(overtemp_lockout_2) &&
                  !id(overtemp_lockout_3);

            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108080FE
                  data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

            else:
              - logger.log:
                  level: WARN
                  format: "All ON blocked - all three units require valid CAN communication, explicit OFF state, valid safe temperature and no overtemperature lockout."

  # Individual ON command for one rectifier; useful for diagnostics and service.
  # Blocked while Unit 1 is in overtemperature lockout (see output_temperature_1).
  - platform: template
    name: "Turn On Unit 1"
    icon: "mdi:power"
    id: on_button_1
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 1 ON Button pressed."
            );
        - if:
            condition:
              lambda: |-
                return id(can_com_ok_1).state &&
                       id(power_state_1).state == "OFF" &&
                       !isnan(id(output_temperature_1).state) &&
                       id(output_temperature_1).state <= ${overtemp_trip_c}f &&
                       !id(overtemp_lockout_1);
            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108180FE
                  data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            else:
              - logger.log:
                  level: WARN
                  format: "Unit 1 ON blocked - CAN communication, explicit OFF state, valid safe temperature and cleared overtemperature lockout are required."

  # Individual ON command for one rectifier; useful for diagnostics and service.
  # Blocked while Unit 2 is in overtemperature lockout (see output_temperature_2).
  - platform: template
    name: "Turn On Unit 2"
    icon: "mdi:power"
    id: on_button_2
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 2 ON Button pressed."
            );
        - if:
            condition:
              lambda: |-
                return id(can_com_ok_2).state &&
                       id(power_state_2).state == "OFF" &&
                       !isnan(id(output_temperature_2).state) &&
                       id(output_temperature_2).state <= ${overtemp_trip_c}f &&
                       !id(overtemp_lockout_2);
            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108280FE
                  data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            else:
              - logger.log:
                  level: WARN
                  format: "Unit 2 ON blocked - CAN communication, explicit OFF state, valid safe temperature and cleared overtemperature lockout are required."

  # Individual ON command for one rectifier; useful for diagnostics and service.
  # Blocked while Unit 3 is in overtemperature lockout (see output_temperature_3).
  - platform: template
    name: "Turn On Unit 3"
    icon: "mdi:power"
    id: on_button_3
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 3 ON Button pressed."
            );
        - if:
            condition:
              lambda: |-
                return id(can_com_ok_3).state &&
                       id(power_state_3).state == "OFF" &&
                       !isnan(id(output_temperature_3).state) &&
                       id(output_temperature_3).state <= ${overtemp_trip_c}f &&
                       !id(overtemp_lockout_3);
            then:
              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108380FE
                  data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            else:
              - logger.log:
                  level: WARN
                  format: "Unit 3 ON blocked - CAN communication, explicit OFF state, valid safe temperature and cleared overtemperature lockout are required."

  # Broadcast OFF command to all three rectifiers.
  - platform: template
    name: "Turn Off All Units"
    id: off_button_all
    icon: "mdi:power"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "All Units OFF Button pressed."
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Individual OFF command for one rectifier.
  - platform: template
    name: "Turn Off Unit 1"
    id: off_button_1
    icon: "mdi:power"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 1 OFF Button pressed."
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108180FE
            data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Individual OFF command for one rectifier.
  - platform: template
    name: "Turn Off Unit 2"
    id: off_button_2
    icon: "mdi:power"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 2 OFF Button pressed."
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108280FE
            data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Individual OFF command for one rectifier.
  - platform: template
    name: "Turn Off Unit 3"
    id: off_button_3
    icon: "mdi:power"
    on_press:
      then:
        - lambda: |-
            ESP_LOGI(
              "custom",
              "Unit 3 OFF Button pressed."
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108380FE
            data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Broadcast fan override: force full fan speed on all rectifiers.
  - platform: template
    name: "Set Fan Full Speed All Units"
    id: fan_full_speed_button_all
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x34, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Per-unit full-speed fan override.
  - platform: template
    name: "Set Fan Full Speed Unit 1"
    id: fan_full_speed_button_1
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108180FE
            data: [0x01, 0x34, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Per-unit full-speed fan override.
  - platform: template
    name: "Set Fan Full Speed Unit 2"
    id: fan_full_speed_button_2
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108280FE
            data: [0x01, 0x34, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Per-unit full-speed fan override.
  - platform: template
    name: "Set Fan Full Speed Unit 3"
    id: fan_full_speed_button_3
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108380FE
            data: [0x01, 0x34, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

  # Broadcast command returning all rectifier fans to automatic control.
  - platform: template
    name: "Set Fan Auto Mode All Units"
    id: fan_auto_mode_button_all
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: [0x01, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Set Fan Auto Mode Unit 1"
    id: fan_auto_mode_button_1
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108180FE
            data: [0x01, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Set Fan Auto Mode Unit 2"
    id: fan_auto_mode_button_2
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108280FE
            data: [0x01, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - platform: template
    name: "Set Fan Auto Mode Unit 3"
    id: fan_auto_mode_button_3
    icon: "mdi:fan"
    on_press:
      then:
        - canbus.send:
            use_extended_id: true
            can_id: 0x108380FE
            data: [0x01, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # Manually launches the full unit property/capability discovery sequence.
  - platform: template
    name: "Discover Rectifier Units"
    id: setup_button
    on_press:
      then:
        - script.execute:
            id: discovery_queue
            unit: 0

# ==============================================================================
# TEXT / STATUS SENSORS
# ==============================================================================
# Publishes controller diagnostics, rectifier status and static unit
# identification information.
text_sensor:
  # Network diagnostic used by the TFT footer.
  - platform: wifi_info
    ip_address:
      id: ip_address
      entity_category: diagnostic

  # Running ESPHome firmware version.
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

  # ESPHome device information and last reset reason.
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic

    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

  # --------------------------------------------------------------------------
  # Rectifier Control State Unit 1
  # Controller lifecycle state:
  # OFFLINE -> DISCOVERING -> ONLINE.
  #
  # This state is independent of the raw CAN-connectivity watchdog and will
  # later control fast polling, slow probing and operational release.
