    filters:
      - lambda: |-
          return x / id(voltage_scaling_factor);
      - timeout: ${live_telemetry_timeout}
    icon: "mdi:thermometer"
    on_value:
      then:
        # --------------------------------------------------------------
        # Overtemperature trip
        # --------------------------------------------------------------
        - if:
            condition:
              lambda: |-
                return !isnan(x) &&
                       !id(overtemp_lockout_1) &&
                       x > ${overtemp_trip_c}f;
            then:
              - lambda: |-
                  id(overtemp_lockout_1) = true;

                  ESP_LOGW(
                    "overtemp",
                    "Unit 1 exceeded configured trip threshold %.1f°C "
                    "(actual %.1f°C). "
                    "Sending CAN OFF and engaging overtemperature lockout.",
                    ${overtemp_trip_c}f,
                    x
                  );

              - canbus.send:
                  use_extended_id: true
                  can_id: 0x108180FE
                  data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

        # --------------------------------------------------------------
        # Overtemperature recovery
        # --------------------------------------------------------------
        - if:
            condition:
              lambda: |-
                return !isnan(x) &&
                       id(overtemp_lockout_1) &&
                       x < ${overtemp_reset_c}f;
            then:
              - lambda: |-
                  id(overtemp_lockout_1) = false;

                  ESP_LOGI(
                    "overtemp",
                    "Unit 1 cooled below configured reset threshold %.1f°C "
                    "(actual %.1f°C). "
                    "Overtemperature lockout cleared.",
                    ${overtemp_reset_c}f,
                    x
                  );

