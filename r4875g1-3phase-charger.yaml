  # Combined AC Power sensor
  # Only units with valid CAN communication are included.
  # --------------------------------------------------------------------------
  # Combined AC Power All Units
  # CAN-aware AC power total. Only currently reachable units with numeric values are summed. If none are valid, NAN is returned so the entity becomes unavailable instead of reporting a false 0 kW.
  - platform: template
    name: "Combined AC Power All Units"
    id: combined_ac_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    update_interval: 1s
    lambda: |-
      float power = 0.0f;
      int valid_units = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(ac_power_1).state)) {
        power += id(ac_power_1).state;
        valid_units++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(ac_power_2).state)) {
        power += id(ac_power_2).state;
        valid_units++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(ac_power_3).state)) {
        power += id(ac_power_3).state;
        valid_units++;
      }

      // No valid CAN data available
      if (valid_units == 0) {
        return NAN;
      }

      return power;
    icon: "mdi:flash"

