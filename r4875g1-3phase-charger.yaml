# ==============================================================================
# USER-ADJUSTABLE SETPOINTS
# ==============================================================================
# Canonical voltage/current/fallback/power controls. Web, Home Assistant, MQTT
# and the encoder ultimately update these entities so CAN encoding remains
# centralized in one place.
number:
  # --------------------------------------------------------------------------
  # Set Fan Minimum Speed
  # Configures the minimum fan duty cycle for all rectifier units.
  # The requested percentage value is converted to the rectifier's fixed-point
  # representation using:
  #
  #     raw_value = fan_percent * 256
  #
  # The 16-bit value is transmitted in big-endian format using broadcast
  # CAN ID 0x108080FE with command selector 0x14.
  #
  # Because the command is broadcast, the setting applies to all connected
  # rectifier units at the same time.
  #
  # Range:
  #   0%   = minimum fan duty disabled / lowest supported fan command
  #   100% = maximum requested minimum fan duty
  #
  # The value is restored after reboot and can be adjusted through ESPHome,
  # Home Assistant or the web interface.
  - platform: template
    name: "Set Fan Minimum Speed"
    id: set_fan_min_speed
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    mode: SLIDER
    restore_value: true
    icon: "mdi:fan"
    on_value:
      then:
        # Allow the optimistic number entity to finish updating before reading
        # its new state and constructing the CAN command.
        - delay: 0.01s
        - lambda: |-
            // Log the requested engineering value before CAN encoding.
            float fan_value = id(set_fan_min_speed).state;
            ESP_LOGI(
              "custom",
              "Received fan minimum speed: %.0f%%",
              fan_value
            );
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              // Build an 8-byte broadcast command frame initialized to zero.
              std::vector<uint8_t> can_data(8, 0x00);
              // Command group 0x01 with selector 0x14 addresses the
              // minimum fan duty-cycle setting.
              can_data[0] = 0x01;
              can_data[1] = 0x14;
              // Convert percentage to the rectifier fixed-point format.
              // Example:
              //   25% * 256 = 6400 = 0x1900
              int scaled_value =
                  (int)(id(set_fan_min_speed).state * 256);
              // Store the 16-bit value in big-endian format.
              can_data[2] = (scaled_value >> 8) & 0xFF;
              can_data[3] = scaled_value & 0xFF;
              // Bytes 4..7 remain zero.
              return can_data;

  # DC Voltage Setting
  # --------------------------------------------------------------------------
  # Set DC Voltage Limit
  # Primary broadcast DC voltage setpoint (49..58 V, 0.1 V steps).
  # The value is encoded as V * voltage_scaling_factor and sent in bytes 6..7 of
  # broadcast CAN ID 0x108080FE.
  - platform: template
    name: "Set DC Voltage Limit"
    id: set_dc_voltage_limit
    min_value: 49
    max_value: 58
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: True
    on_value:
      then:
        - lambda: |-
            // Encode engineering volts into the rectifier's fixed-point CAN format.
            float voltage_value = id(set_dc_voltage_limit).state;
            ESP_LOGI(
              "custom",
              "Received dc voltage  limit: %.0fV",
              voltage_value
            );

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              int scaled_value = (int)(id(set_dc_voltage_limit).state * id(voltage_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # DC Current Setting
  # --------------------------------------------------------------------------
  # Set DC Current Limit
  # Secondary all-rectifier current setpoint. The requested current is
  # validated against the detected unit model/capability, encoded using
  # current_scaling_factor and broadcast with command selector 0x03.
  - platform: template
    name: "Set DC Current Limit"
    id: set_dc_current_limit
    min_value: 1
    max_value: 75 
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            // Validate the requested current against the detected rectifier model before
            // creating the raw CAN setpoint.
            float current_value = id(set_dc_current_limit).state;
            float max_current = 75;  // Default max currnet
            if (id(current_scaling_factor) <= 18) {
              max_current = 75;
            } else if (id(current_scaling_factor) <= 25) {
              max_current = 50;
            } else if (id(current_scaling_factor) > 25) {
              max_current = 30;
            }

            if (current_value > max_current) {
              ESP_LOGW("custom", "Entered DC Current %.1f exceeds max limit %.1f for model, resetting.", current_value, max_current);
              id(set_dc_current_limit).publish_state(max_current);  // Reset to max value
            }
            ESP_LOGI("custom", "DC Current Limit set to %.1fA.", current_value);

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x03;
              int scaled_value = (int)(id(set_dc_current_limit).state * id(current_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # DC Current Fallback Setting
  # --------------------------------------------------------------------------
  # Set DC Current Limit Fallback
  # Fallback current parameter. Uses the same model-dependent
  # current validation but command selector 0x04.
  - platform: template
    name: "Set DC Current Limit Fallback"
    id: set_dc_current_limit_fallback
    min_value: 1
    max_value: 75  
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            // Fallback current uses the same model-dependent current limit.
            float fallback_current_value = id(set_dc_current_limit_fallback).state;
            float max_current = 75;  // Default max current
            if (id(current_scaling_factor) <= 18) {
              max_current = 75;
            } else if (id(current_scaling_factor) <= 25) {
              max_current = 50;
            } else if (id(current_scaling_factor) > 25) {
              max_current = 30;
            }

            if (fallback_current_value > max_current) {
              ESP_LOGW("custom", "Entered Fallback DC Current %.1f exceeds max limit %.1f for model, resetting.", fallback_current_value, max_current);
              id(set_dc_current_limit_fallback).publish_state(max_current);  // Reset to max value
            }
            ESP_LOGI("custom", "DC Current Limit fallback set to %.1fA.", fallback_current_value);

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x04;
              int scaled_value = (int)(id(set_dc_current_limit_fallback).state * id(current_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  #  DC Voltage Fallback Setting
  # --------------------------------------------------------------------------
  # Set DC Voltage Limit Fallback
  # Fallback voltage parameter. Encoded with the same
  # V * 1024 fixed-point representation and command selector 0x01.
  - platform: template
    name: "Set DC Voltage Limit Fallback"
    id: set_dc_voltage_limit_fallback
    min_value: 49
    max_value: 58  # Adjust as needed for your voltage range
    step: 0.1  # 0.1V steps
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: True
    on_value:
      then:
        - lambda: |-
            // Fallback voltage uses the same V * 1024 representation as active voltage.
            float fallback_voltage_value = id(set_dc_voltage_limit_fallback).state;  // Get the fallback voltage value
            ESP_LOGI(
              "custom",
              "Received fallback voltage setpoint: %.0fV",
              fallback_voltage_value
            );

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
              can_data[0] = 0x01;  // First byte is always 0x01
              can_data[1] = 0x01;  // Second byte is 0x01 for the Fallback Voltage setting
              int fallback_scaled_value = (int)(id(set_dc_voltage_limit_fallback).state * id(voltage_scaling_factor));  // Scale the voltage value
              can_data[6] = (fallback_scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
              can_data[7] = fallback_scaled_value & 0xFF;         // Encode the low byte in the 8th byte
              return can_data;

  # AC Current Setting
  # --------------------------------------------------------------------------
  # Set AC Current Limit
  # Primary all-rectifier current setpoint. The requested current is
  # validated against the detected unit model/capability, encoded using
  # current_scaling_factor and broadcast with command selector 0x03.
  - platform: template
    name: "Set AC Current Limit"
    id: set_ac_current_limit
    min_value: 0
    max_value: 21
    step: 0.1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: True
    icon: "mdi:current-ac"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float current_value = id(set_ac_current_limit).state;
            float max_current = 10.0; // default
            if (id(current_scaling_factor) >= 18 && id(current_scaling_factor) <= 22) {
              max_current = 17.0;
            } else if (id(current_scaling_factor) >= 13 && id(current_scaling_factor) <= 15) {
              max_current = 21.0;
            } else if (id(current_scaling_factor) >= 25 && id(current_scaling_factor) <= 35) {
              max_current = 13.0;
            }
            if (current_value > max_current) {
              ESP_LOGW("custom", "Entered AC Current %.1f exceeds model limit %.1f, resetting.", current_value, max_current);
              id(set_ac_current_limit).publish_state(max_current);
              current_value = max_current;
            }
            if (current_value == 0) {
              ESP_LOGI("custom", "AC Current Limit disabled.");
            } else {
              ESP_LOGI("custom", "AC Current Limit set to %.1fA.", current_value);
            }
        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              int scaled_value = (int)(id(set_ac_current_limit).state * id(voltage_scaling_factor));
              can_data[0] = 0x01;
              can_data[1] = 0x09;
              can_data[3] = (id(set_ac_current_limit).state > 0) ? 0x01 : 0x00; 
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # --------------------------------------------------------------------------
  # DC Sum Power Set
  # Convenience total-power target for local operation. This is
  # not a native rectifier parameter; changing it runs apply_dc_sum_power, which
  # derives an equal current target for all three units.
  - platform: template
    name: "DC Sum Power Set"
    id: dc_sum_power_set
    unit_of_measurement: "kW"
    min_value: 0.25
    max_value: 12.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    mode: BOX

    on_value:
      then:
        - script.execute: apply_dc_sum_power

# ==============================================================================
# LOCAL BUTTON AND CAN CONNECTIVITY
# ==============================================================================
# Includes the rotary encoder push button and three connectivity watchdogs that
# indicate whether fresh cyclic telemetry is arriving from each rectifier.
binary_sensor:
  # --------------------------------------------------------------------------
  # local_encoder_button
  # Physical encoder push button on GPIO2. The internal pull-up makes the input active-low. A 30 ms delayed_on_off filter debounces the switch. on_press wakes the display; short press changes encoder mode; >=3 s long press starts/stops the rectifiers.
  - platform: gpio
    id: local_encoder_button
    internal: true

    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 30ms

    # Every physical button press wakes the display
    # and resets the 5-minute inactivity timer.
    on_press:
      then:
        - script.execute: display_inactivity_timer

    on_multi_click:

      # Short press:
      # Toggle encoder editing mode: DC Voltage <-> Total DC Power.
      - timing:
          - ON for 50ms to 2800ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(encoder_mode) = !id(encoder_mode);

              ESP_LOGI(
                "encoder",
                "Selected: %s",
                id(encoder_mode) == 0
                  ? "DC Voltage"
                  : "DC Sum Power"
              );
          - component.update: tft
      # Long press:
      # Toggle rectifier units ON/OFF for local blackstart control.
      #
      # Safety rules:
      # - If at least one reachable unit reports ON, send STOP.
      # - If CAN communication exists and no reachable unit reports ON, START.
      # - If no unit is reachable at all, do nothing because the actual charger
      #   state cannot be determined safely.
      - timing:
          - ON for at least 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return
                    (id(can_com_ok_1).state &&
                     id(power_state_1).state == "ON") ||
                    (id(can_com_ok_2).state &&
                     id(power_state_2).state == "ON") ||
                    (id(can_com_ok_3).state &&
                     id(power_state_3).state == "ON");
              then:
                - script.execute: blackstart_stop

              else:
                - if:
                    condition:
                      lambda: |-
                        return
                          id(can_com_ok_1).state ||
                          id(can_com_ok_2).state ||
                          id(can_com_ok_3).state;
                    then:
                      - script.execute: blackstart_start

                    else:
                      - logger.log:
                          level: WARN
                          format: "BLACKSTART: Start/stop ignored - no rectifier CAN communication available."

  # CAN communication watchdogs
  #
  # The charger units are queried several times per second. A unit is
  # considered online when a valid cyclic telemetry frame was received within
  # the last 3 seconds. Unsigned subtraction keeps this safe across millis()
  # wrap-around.
  # --------------------------------------------------------------------------
  # CAN Communication Unit-1
  # CAN connectivity watchdog for Unit 1. True only when a valid cyclic telemetry frame was received within the last 3000 ms. Unsigned millis() subtraction remains correct across wrap-around.
  - platform: template
    id: can_com_ok_1
    name: "CAN Communication Unit-1"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_1) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_1)) < 3000U;

    on_release:
      then:
        - lambda: |-
            // The last reported power state is no longer trustworthy once
            // communication with the rectifier has timed out.
            if (id(power_state_1).state != "UNKNOWN") {
              id(power_state_1).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 1: CAN communication lost - power state set to UNKNOWN."
              );
            }

  # --------------------------------------------------------------------------
  # CAN Communication Unit-2
  # CAN connectivity watchdog for Unit 2. True only when a valid cyclic telemetry frame was received within the last 3000 ms. Unsigned millis() subtraction remains correct across wrap-around.
  - platform: template
    id: can_com_ok_2
    name: "CAN Communication Unit-2"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_2) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_2)) < 3000U;

    on_release:
      then:
        - lambda: |-
            if (id(power_state_2).state != "UNKNOWN") {
              id(power_state_2).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 2: CAN communication lost - power state set to UNKNOWN."
              );
            }

  # --------------------------------------------------------------------------
  # CAN Communication Unit-3
  # CAN connectivity watchdog for Unit 3. True only when a valid cyclic telemetry frame was received within the last 3000 ms. Unsigned millis() subtraction remains correct across wrap-around.
  - platform: template
    id: can_com_ok_3
    name: "CAN Communication Unit-3"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_3) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_3)) < 3000U;

    on_release:
      then:
        - lambda: |-
            if (id(power_state_3).state != "UNKNOWN") {
              id(power_state_3).publish_state("UNKNOWN");

              ESP_LOGW(
                "canbus",
                "Unit 3: CAN communication lost - power state set to UNKNOWN."
              );
            }

# ==============================================================================
# PERIODIC CAN TRAFFIC
# ==============================================================================
# Polls live telemetry frequently and periodically reasserts active voltage and
# current setpoints so units that restart can recover the requested settings.
interval:
  # Interval for sending the first CAN message every 05 seconds
  # --------------------------------------------------------------------------
  # Periodic task: 577ms
  # Fast cyclic telemetry polling. Unit 1 is requested first; Units 2 and 3 are staggered by 183 ms and 193 ms to spread CAN traffic instead of creating one large burst.
  - interval: 577ms
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108140FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 183ms
      - canbus.send:
          use_extended_id: true
          can_id: 0x108240FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 193ms
      - canbus.send:
          use_extended_id: true
          can_id: 0x108340FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # Interval for sending voltage CAN message every 30 seconds
  # --------------------------------------------------------------------------
  # Periodic task: 30s
  # Reasserts the broadcast DC voltage setpoint every 30 seconds so restarted/late units recover it.
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
            can_data[0] = 0x01;  // First byte is always 0x01
            int scaled_value = (int)(id(set_dc_voltage_limit).state * id(voltage_scaling_factor));  // Scale the voltage value
            can_data[6] = (scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
            can_data[7] = scaled_value & 0xFF;         // Encode the low byte in the 8th byte
            return can_data;

  # Interval for sending Current setting CAN message every 10 seconds
  # --------------------------------------------------------------------------
  # Periodic task: 30s
  # Reasserts the broadcast current setpoint every 30 seconds for the same recovery reason.
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
            can_data[0] = 0x01;  // First byte is always 0x01
            can_data[1] = 0x03;  // Second byte is 0x03
            int scaled_value = (int)(id(set_dc_current_limit).state * id(current_scaling_factor));  // Scale the Current value
            can_data[6] = (scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
            can_data[7] = scaled_value & 0xFF;         // Encode the low byte in the 8th byte
            return can_data;


