number:
  - platform: template
    name: "CAN Voltage Set"
    id: can_voltage_set
    min_value: 49
    max_value: 58
    step: 0.1
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: True
    on_value:
      then:
        - lambda: |-
            float voltage_value = id(can_voltage_set).state;
            int scaled_value = (int)(voltage_value * id(voltage_scaling_factor));
            
            uint8_t high_byte = (scaled_value >> 8) & 0xFF;
            uint8_t low_byte = scaled_value & 0xFF;

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              int scaled_value = (int)(id(can_voltage_set).state * id(voltage_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # Amp Setting
  - platform: template
    name: "CAN Amp Set"
    id: can_amp_set
    min_value: 1
    max_value: 75 
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float amp_value = id(can_amp_set).state;
            float max_amps = 75;  // Default max amps
            if (id(amp_scaling_factor) == 15) {
              max_amps = 75;
            } else if (id(amp_scaling_factor) == 20) {
              max_amps = 50;
            } else if (id(amp_scaling_factor) == 30) {
              max_amps = 30;
            }

            if (amp_value > max_amps) {
              ESP_LOGW("custom", "Entered Amp %.1f exceeds max limit %.1f for model, resetting.", amp_value, max_amps);
              id(can_amp_set).publish_state(max_amps);  // Reset to max value
              return;
            }

            int scaled_value = (int)(amp_value * id(amp_scaling_factor));

            uint8_t high_byte = (scaled_value >> 8) & 0xFF;
            uint8_t low_byte = scaled_value & 0xFF;

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x03;
              int scaled_value = (int)(id(can_amp_set).state * id(amp_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # Fallback Amp Setting
  - platform: template
    name: "Fallback Amp Set"
    id: fallback_amp_set
    min_value: 1
    max_value: 75  
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    mode: BOX
    restore_value: true
    icon: "mdi:current-dc"
    on_value:
      then:
        - delay: 0.01s
        - lambda: |-
            float fallback_amp_value = id(fallback_amp_set).state;
            float max_amps = 75;  // Default max amps
            if (id(amp_scaling_factor) == 15) {
              max_amps = 75;
            } else if (id(amp_scaling_factor) == 20) {
              max_amps = 50;
            } else if (id(amp_scaling_factor) == 30) {
              max_amps = 30;
            }

            if (fallback_amp_value > max_amps) {
              ESP_LOGW("custom", "Entered Fallback Amp %.1f exceeds max limit %.1f for model, resetting.", fallback_amp_value, max_amps);
              id(fallback_amp_set).publish_state(max_amps);  // Reset to max value
              return;
            }

            int fallback_scaled_value = (int)(fallback_amp_value * id(amp_scaling_factor));

            uint8_t high_byte = (fallback_scaled_value >> 8) & 0xFF;
            uint8_t low_byte = fallback_scaled_value & 0xFF;

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);
              can_data[0] = 0x01;
              can_data[1] = 0x04;
              int scaled_value = (int)(id(fallback_amp_set).state * id(amp_scaling_factor));
              can_data[6] = (scaled_value >> 8) & 0xFF;
              can_data[7] = scaled_value & 0xFF;
              return can_data;

  # Fallback Voltage Setting
  - platform: template
    name: "Fallback Voltage Set"
    id: fallback_voltage_set
    min_value: 49
    max_value: 58  # Adjust as needed for your voltage range
    step: 0.1  # 0.1V steps
    unit_of_measurement: "V"
    optimistic: true
    mode: BOX
    restore_value: True
    on_value:
      then:
        - lambda: |-
            float fallback_voltage_value = id(fallback_voltage_set).state;  // Get the fallback voltage value
            int fallback_scaled_value = (int)(fallback_voltage_value * id(voltage_scaling_factor));  // Scale the voltage value
            
            uint8_t high_byte = (fallback_scaled_value >> 8) & 0xFF;  // Get high byte
            uint8_t low_byte = fallback_scaled_value & 0xFF;  // Get low byte

        - canbus.send:
            use_extended_id: true
            can_id: 0x108080FE
            data: !lambda |-
              std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
              can_data[0] = 0x01;  // First byte is always 0x01
              can_data[1] = 0x01;  // Second byte is 0x01 for the Fallback Voltage setting
              int fallback_scaled_value = (int)(id(fallback_voltage_set).state * id(voltage_scaling_factor));  // Scale the voltage value
              can_data[6] = (fallback_scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
              can_data[7] = fallback_scaled_value & 0xFF;         // Encode the low byte in the 8th byte
              return can_data;

  - platform: template
    name: "DC Sum Power Set"
    id: dc_sum_power_set
    unit_of_measurement: "kW"
    min_value: 0.25
    max_value: 12.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    mode: BOX

    on_value:
      then:
        - script.execute: apply_dc_sum_power

binary_sensor:
  - platform: gpio
    id: local_encoder_button
    internal: true

    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 30ms

    # Every physical button press wakes the display
    # and resets the 5-minute inactivity timer.
    on_press:
      then:
        - script.execute: display_inactivity_timer

    on_multi_click:

      # Kurzer Druck:
      # Auswahl Voltage <-> Power
      - timing:
          - ON for 50ms to 2800ms
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(encoder_mode) = !id(encoder_mode);

              ESP_LOGI(
                "encoder",
                "Selected: %s",
                id(encoder_mode) == 0
                  ? "DC Voltage"
                  : "DC Sum Power"
              );
          - component.update: my_tft
      # Langer Druck:
      # Charger ON/OFF
      - timing:
          - ON for at least 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return
                    id(power_state_sensor_1).state == "ON" ||
                    id(power_state_sensor_2).state == "ON" ||
                    id(power_state_sensor_3).state == "ON";
              then:
                - script.execute: blackstart_stop
              else:
                - script.execute: blackstart_start

  # CAN communication watchdogs
  #
  # The charger modules are queried several times per second. A module is
  # considered online when a valid cyclic telemetry frame was received within
  # the last 3 seconds. Unsigned subtraction keeps this safe across millis()
  # wrap-around.
  - platform: template
    id: can_com_ok_1
    name: "CAN Communication Module-1"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_1) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_1)) < 3000U;

  - platform: template
    id: can_com_ok_2
    name: "CAN Communication Module-2"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_2) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_2)) < 3000U;

  - platform: template
    id: can_com_ok_3
    name: "CAN Communication Module-3"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_can_rx_3) != 0 &&
             (uint32_t) (millis() - id(last_can_rx_3)) < 3000U;

interval:
  # Interval for sending the first CAN message every 05 seconds
  - interval: 577ms
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108140FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 183ms
      - canbus.send:
          use_extended_id: true
          can_id: 0x108240FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 193ms
      - canbus.send:
          use_extended_id: true
          can_id: 0x108340FE
          data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # Interval for sending voltage CAN message every 30 seconds
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
            can_data[0] = 0x01;  // First byte is always 0x01
            int scaled_value = (int)(id(can_voltage_set).state * id(voltage_scaling_factor));  // Scale the voltage value
            can_data[6] = (scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
            can_data[7] = scaled_value & 0xFF;         // Encode the low byte in the 8th byte
            return can_data;

  # Interval for sending Amp setting CAN message every 10 seconds
  - interval: 30s
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);  // Initialize with 8 zeros
            can_data[0] = 0x01;  // First byte is always 0x01
            can_data[1] = 0x03;  // Second byte is 0x03
            int scaled_value = (int)(id(can_amp_set).state * id(amp_scaling_factor));  // Scale the Amp value
            can_data[6] = (scaled_value >> 8) & 0xFF;  // Encode the high byte in the 7th byte
            can_data[7] = scaled_value & 0xFF;         // Encode the low byte in the 8th byte
            return can_data;


