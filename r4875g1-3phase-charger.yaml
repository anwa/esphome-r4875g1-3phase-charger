# ==============================================================================
# ILI9488 480x320 LOCAL TFT
# ==============================================================================
# Main local user interface. It is intentionally usable without Wi-Fi and shows
# CAN-aware telemetry, per-unit communication faults, rectifier state and the
# rotary-encoder setpoints. The 500 ms refresh interval balances responsiveness
# against SPI/display workload.
display:
  - platform: mipi_spi
    model: ILI9488
    id: tft

    cs_pin: GPIO5
    dc_pin: GPIO7
    reset_pin: GPIO6

    # Keep the same effective memory usage as the previous
    # ili9xxx "color_palette: 8BIT" configuration.
    color_depth: 8
    buffer_size: 100%

    invert_colors: false

    # ili9xxx used 40 MHz by default.
    # mipi_spi defaults to only 10 MHz, so explicitly keep 40 MHz
    # to avoid making display refreshes significantly slower.
    data_rate: 40MHz

    # Previous hardware transform:
    #   swap_xy: true
    #   mirror_x: true
    # corresponds to a 90-degree rotation.
    dimensions:
      width: 480
      height: 320

    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

    update_interval: 500ms

    lambda: |-
      // Full-screen redraw: clear the framebuffer first so shorter new values
      // cannot leave pixels from a previous longer string behind.
      it.fill(Color::WHITE);
      it.print(
        10, 10,
        id(font_large),
        id(color_black),
        "3 Phase Battery Charger R4875G1"
      );

      it.strftime(
        10, 40,
        id(font_small),
        id(color_black),
        "%d.%m.%Y %H:%M",
        id(sntp_time).now()
      );

      // -----------------------------------------------------------------
      // AC Input - use all units with valid CAN communication
      // -----------------------------------------------------------------

      // Build the AC summary only from units that are both CAN-online and have
      // all required numeric AC telemetry values. This allows clean 3/3, 2/3 or
      // 1/3 operation when individual rectifiers disappear from the CAN bus.
      int ac_units_ok = 0;

      float ac_voltage_sum = 0.0f;
      float ac_current_sum = 0.0f;
      float ac_frequency_sum = 0.0f;
      float ac_power_sum = 0.0f;


      // Unit 1
      if (id(can_com_ok_1).state) {

        if (!isnan(id(ac_voltage_1).state) &&
            !isnan(id(ac_current_1).state) &&
            !isnan(id(ac_frequency_1).state) &&
            !isnan(id(ac_power_1).state)) {

          ac_voltage_sum += id(ac_voltage_1).state;
          ac_current_sum += id(ac_current_1).state;
          ac_frequency_sum += id(ac_frequency_1).state;
          ac_power_sum += id(ac_power_1).state;

          ac_units_ok++;
        }
      }

      // Unit 2
      if (id(can_com_ok_2).state) {

        if (!isnan(id(ac_voltage_2).state) &&
            !isnan(id(ac_current_2).state) &&
            !isnan(id(ac_frequency_2).state) &&
            !isnan(id(ac_power_2).state)) {

          ac_voltage_sum += id(ac_voltage_2).state;
          ac_current_sum += id(ac_current_2).state;
          ac_frequency_sum += id(ac_frequency_2).state;
          ac_power_sum += id(ac_power_2).state;

          ac_units_ok++;
        }
      }

      // Unit 3
      if (id(can_com_ok_3).state) {

        if (!isnan(id(ac_voltage_3).state) &&
            !isnan(id(ac_current_3).state) &&
            !isnan(id(ac_frequency_3).state) &&
            !isnan(id(ac_power_3).state)) {

          ac_voltage_sum += id(ac_voltage_3).state;
          ac_current_sum += id(ac_current_3).state;
          ac_frequency_sum += id(ac_frequency_3).state;
          ac_power_sum += id(ac_power_3).state;

          ac_units_ok++;
        }
      }

      // -----------------------------------------------------------------
      // Display AC values
      // -----------------------------------------------------------------

      if (ac_units_ok > 0) {

        float ac_voltage_avg =
            ac_voltage_sum / ac_units_ok;

        float ac_current_avg =
            ac_current_sum / ac_units_ok;

        float ac_frequency_avg =
            ac_frequency_sum / ac_units_ok;

        float ac_power_kw =
            ac_power_sum / 1000.0f;


        // Header
        it.printf(
          10, 70,
          id(font_small_bold),
          id(color_blue),
          "AC Input: %.3f kW  (%d/3)",
          ac_power_kw,
          ac_units_ok
        );


        // Details
        it.printf(
          10, 95,
          id(font_small),
          id(color_black),
          "%.1f V - %.1f A - %.1f Hz",
          ac_voltage_avg,
          ac_current_avg,
          ac_frequency_avg
        );

      } else {

        it.print(
          10, 70,
          id(font_small_bold),
          id(color_red),
          "AC Input: CAN bus communication fault!"
        );

        it.print(
          10, 95,
          id(font_small),
          id(color_red),
          "No charger unit reachable"
        );
      }
      // -----------------------------------------------------------------
      // DC Output - use only units with valid CAN communication
      // -----------------------------------------------------------------
      //
      // combined_dc_power already excludes stale values from disconnected
      // rectifiers. Count the same valid units here so the display can show
      // whether the total currently represents 1/3, 2/3 or all 3 units.
      int dc_units_ok = 0;
      
      if (id(can_com_ok_1).state &&
          !isnan(id(dc_power_1).state)) {
        dc_units_ok++;
      }
      
      if (id(can_com_ok_2).state &&
          !isnan(id(dc_power_2).state)) {
        dc_units_ok++;
      }
      
      if (id(can_com_ok_3).state &&
          !isnan(id(dc_power_3).state)) {
        dc_units_ok++;
      }
      
      
      // Display the CAN-aware combined DC power only when at least one
      // rectifier has valid telemetry. If no unit is available, show a
      // clear communication fault instead of formatting NAN as "nan kW".
      if (dc_units_ok > 0 &&
          !isnan(id(combined_dc_power).state)) {
      
        it.printf(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: %.3f kW  (%d/3)",
          id(combined_dc_power).state,
          dc_units_ok
        );
      
      } else {
      
        it.print(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: CAN bus communication fault!"
        );
      }
      if (id(can_com_ok_1).state) {
        it.printf(
          10, 150,
          id(font_small),
          id(color_black),
          "L1: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_1).state,
          id(dc_current_1).state,
          id(dc_power_1).state,
          id(input_temperature_1).state,
          id(output_temperature_1).state
        );
      } else {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: CAN bus communication fault!"
        );
      }

      if (id(can_com_ok_2).state) {
        it.printf(
          10, 170,
          id(font_small),
          id(color_black),
          "L2: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_2).state,
          id(dc_current_2).state,
          id(dc_power_2).state,
          id(input_temperature_2).state,
          id(output_temperature_2).state
        );
      } else {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: CAN bus communication fault!"
        );
      }

      if (id(can_com_ok_3).state) {
        it.printf(
          10, 190,
          id(font_small),
          id(color_black),
          "L3: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_3).state,
          id(dc_current_3).state,
          id(dc_power_3).state,
          id(input_temperature_3).state,
          id(output_temperature_3).state
        );
      } else {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: CAN bus communication fault!"
        );
      }

      // -----------------------------------------------------------------
      // Local / Blackstart setpoints
      // -----------------------------------------------------------------
      it.print(
        10, 220,
        id(font_small_bold),
        id(color_green),
        "Setpoints:"
      );

      // Actual rectifier status
      // Count actual ON states reported by the units. This value is also useful
      // to show partial operation such as 1/3 or 2/3 units running.
      int rectifiers_on = 0;

      if (id(can_com_ok_1).state &&
          id(power_state_1).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_2).state &&
          id(power_state_2).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_3).state &&
          id(power_state_3).state == "ON") {
        rectifiers_on++;
      }

      if (rectifiers_on == 3) {

        it.print(
          375, 220,
          id(font_small_bold),
          id(color_green),
          "3/3 ON"
        );

      } else if (rectifiers_on == 0) {

        it.print(
          410, 220,
          id(font_small_bold),
          id(color_red),
          "OFF"
        );

      } else {

        it.printf(
          375, 220,
          id(font_small_bold),
          id(color_blue),
          "%d/3 ON",
          rectifiers_on
        );
      }

      // -----------------------------------------------------------------
      // Encoder selection
      // -----------------------------------------------------------------

      // The active encoder-edit field is rendered bold/blue; the inactive field
      // remains visible in normal black text for context.
      if (id(encoder_mode) == 0) {

        // Voltage selected
        it.printf(
          10, 245,
          id(font_small_bold),
          id(color_blue),
          "> DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small),
          id(color_black),
          "  DC Power: %.2f kW  -  %.1f A/unit",
          id(dc_sum_power_set).state,
          id(set_dc_current_limit).state
        );

      } else {

        // Sum power selected
        it.printf(
          10, 245,
          id(font_small),
          id(color_black),
          "  DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small_bold),
          id(color_blue),
          "> DC Power: %.2f kW  -  %.1f A/unit",
          id(dc_sum_power_set).state,
          id(set_dc_current_limit).state
        );
      }
      // Footer diagnostics are controller-side values and remain useful even if
      // every rectifier is offline.
      it.printf(10, 300, id(font_footer), id(color_black), "IP: %s", id(ip_address).state.c_str());
      it.printf(200, 300, id(font_footer), id(color_black), "CPU Temp: %.1f °C", id(cpu_temp).state);
      it.printf(390, 300, id(font_footer), id(color_black), "WiFi: %.1f dBm", id(wifi_sig).state);

# ==============================================================================
# GLOBAL RUNTIME STATE
# ==============================================================================
# Non-entity state used by protocol decoding, discovery, watchdog timing and
# local UI logic. None of these variables independently transmit CAN frames.
globals:
  # Selects what the rotary encoder edits locally.
  # 0 = DC voltage, 1 = total DC power. It is not restored so the UI starts in a
  # known mode after boot.
  - id: encoder_mode
    type: int
    restore_value: no
    initial_value: '0'

  # Local/legacy charger-state flag. Actual long-press start/stop
  # decisions currently use the live power_state_1..3 values instead.
  - id: charger_local_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # Last valid cyclic CAN telemetry frame received from each charger unit.
  # Used by can_com_ok_1..3 to detect stale/lost communication.
  # Timestamp (millis) of the last valid cyclic telemetry frame from
  # Unit 1. Used only by the communication watchdog.
  - id: last_can_rx_1
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Same watchdog timestamp for Unit 2.
  - id: last_can_rx_2
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Same watchdog timestamp for Unit 3.
  - id: last_can_rx_3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Current-command scale factor. It is initialized to 15 and
  # updated from the detected Unit 1 current capability.
  - id: current_scaling_factor
    type: float
    initial_value: "15.0"
    restore_value: True
    
  # Fixed-point protocol scale used by voltage and most
  # telemetry fields. 1024 means one engineering unit equals 1024 raw counts.
  - id: voltage_scaling_factor
    type: int
    initial_value: "1024"
    restore_value: True

  # Discovery flag: maximum-current capability for Unit 1
  # has been received during the current search.
  - id: max_current_found_1
    type: bool
    restore_value: no
    initial_value: "false"

  # Discovery flag for Unit 2 maximum-current capability.
  - id: max_current_found_2
    type: bool
    restore_value: no
    initial_value: "false"

  # Discovery flag for Unit 3 maximum-current capability.
  - id: max_current_found_3
    type: bool
    restore_value: no
    initial_value: "false"

  # Discovery flag: valid shelf/slot addressing data for Unit 1
  # has been received.
  - id: data_found_1
    type: bool
    restore_value: no
    initial_value: "false"

  # Discovery flag for Unit 2 addressing data.
  - id: data_found_2
    type: bool
    restore_value: no
    initial_value: "false"

  # Discovery flag for Unit 3 addressing data.
  - id: data_found_3
    type: bool
    restore_value: no
    initial_value: "false"

  # Temporary ASCII buffer used to assemble Unit 1's
  # multi-frame property response before parsing it into text sensors.
  - id: unit_properties_1
    type: std::string
    restore_value: no
    initial_value: '""'

  # Temporary property-message buffer for Unit 2.
  - id: unit_properties_2
    type: std::string
    restore_value: no
    initial_value: '""'

  # Temporary property-message buffer for Unit 3.
  - id: unit_properties_3
    type: std::string
    restore_value: no
    initial_value: '""'

  # True only after all expected Unit 1 property
  # keys were parsed successfully; discovery retries until this becomes true.
  - id: unit_properties_complete_1
    type: bool
    restore_value: no
    initial_value: 'false'

  # Completion flag for Unit 2 properties.
  - id: unit_properties_complete_2
    type: bool
    restore_value: no
    initial_value: "false"

  # Completion flag for Unit 3 properties.
  - id: unit_properties_complete_3
    type: bool
    restore_value: no
    initial_value: "false"

  # Fail-safe retry counter for Unit 1 property requests.
  - id: frame_counter_bp_1
    type: int
    restore_value: no
    initial_value: '0'

  # Fail-safe retry counter for Unit 2 property requests.
  - id: frame_counter_bp_2
    type: int
    restore_value: no
    initial_value: '0'

  # Fail-safe retry counter for Unit 3 property requests.
  - id: frame_counter_bp_3
    type: int
    restore_value: no
    initial_value: '0'

  # Counts Unit 1 property payload frames for
  # diagnostic logging while a multi-frame message is being assembled.
  - id: frame_counter_msg_start_1
    type: int
    restore_value: no
    initial_value: '0'

  # Property payload-frame counter for Unit 2.
  - id: frame_counter_msg_start_2
    type: int
    restore_value: no
    initial_value: '0'

  # Property payload-frame counter for Unit 3.
  - id: frame_counter_msg_start_3
    type: int
    restore_value: no
    initial_value: '0'

  # Fail-safe retry counter for Unit 1 capability/address search.
  - id: search_counter_1
    type: int
    restore_value: no
    initial_value: '0'

  # Fail-safe retry counter for Unit 2 capability/address search.
  - id: search_counter_2
    type: int
    restore_value: no
    initial_value: '0'

  # Fail-safe retry counter for Unit 3 capability/address search.
  - id: search_counter_3
    type: int
    restore_value: no
    initial_value: '0'

  # Overtemperature lockout for Unit 1. Set when output temperature exceeds
  # 90 °C; cleared only once it drops below the 80 °C hysteresis threshold.
  # While set, this unit is excluded from ON commands.
  - id: overtemp_lockout_1
    type: bool
    restore_value: no
    initial_value: 'false'

  # Overtemperature lockout for Unit 2 (see overtemp_lockout_1).
  - id: overtemp_lockout_2
    type: bool
    restore_value: no
    initial_value: 'false'

  # Overtemperature lockout for Unit 3 (see overtemp_lockout_1).
  - id: overtemp_lockout_3
    type: bool
    restore_value: no
    initial_value: 'false'

# ==============================================================================
# REUSABLE AUTOMATION SCRIPTS
# ==============================================================================
# Multi-step operations for discovery, power-to-current conversion, blackstart
# sequencing and backlight timeout handling.
script:
  # --------------------------------------------------------------------------
  # detect_unit_1_properties
  # --------------------------------------------------------------------------
  # Requests Unit 1's static multi-frame property block.
  # Up to three requests are sent. CAN handlers assemble the answer and set
  # unit_properties_complete_1 when all required fields are present.
  - id: detect_unit_1_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_1) = false; // Reset the completion flag before starting
          id(frame_counter_bp_1) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_1) && id(frame_counter_bp_1) < 3;
          then:
            - canbus.send:
                can_id: 0x1081D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_1) += 1; // Increment the frame counter
                ESP_LOGI("unit_properties", "Unit 1 Frame Counter: %d", id(frame_counter_bp_1));
      - lambda: |-
          if (id(unit_properties_complete_1)) {
            ESP_LOGI("unit_properties", "Unit 1 properties detected successfully.");
          } else {
            ESP_LOGW("unit_properties_1", "Unit 1 Fail-safe triggered: Loop stopped after 3 attempts.");
          }
        
  # --------------------------------------------------------------------------
  # detect_unit_2_properties
  # --------------------------------------------------------------------------
  # Same static-property discovery sequence for Unit 2.
  - id: detect_unit_2_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_2) = false; // Reset the completion flag before starting
          id(frame_counter_bp_2) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_2) && id(frame_counter_bp_2) < 3;
          then:
            - canbus.send:
                can_id: 0x1082D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_2) += 1; // Increment the frame counter
                ESP_LOGI("unit_properties_2", "Unit 2 Frame Counter: %d", id(frame_counter_bp_2));
      - lambda: |-
          if (id(unit_properties_complete_2)) {
            ESP_LOGI("unit_properties_2", "Unit 2 properties detected successfully.");
          } else {
            ESP_LOGW("unit_properties_2", "Unit 2 Fail-safe triggered: Loop stopped after 3 attempts.");
          }

  # --------------------------------------------------------------------------
  # detect_unit_3_properties
  # --------------------------------------------------------------------------
  # Same static-property discovery sequence for Unit 3.
  - id: detect_unit_3_properties
    mode: single
    then:
      - lambda: |-
          id(unit_properties_complete_3) = false; // Reset the completion flag before starting
          id(frame_counter_bp_3) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(unit_properties_complete_3) && id(frame_counter_bp_3) < 3;
          then:
            - canbus.send:
                can_id: 0x1083D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_3) += 1; // Increment the frame counter
                ESP_LOGI("unit_properties_3", "Unit 3 Frame Counter: %d", id(frame_counter_bp_3));
      - lambda: |-
          if (id(unit_properties_complete_3)) {
            ESP_LOGI("unit_properties_3", "Unit 3 properties detected successfully.");
          } else {
            ESP_LOGW("unit_properties_3", "Unit 3 Fail-safe triggered: Loop stopped after 3 attempts.");
          }

  # --------------------------------------------------------------------------
  # detect_data_unit_1
  # --------------------------------------------------------------------------
  # Requests Unit 1 capability/address data until both the
  # maximum-current and shelf/slot information have been found or retries are
  # exhausted.
  - id: detect_data_unit_1
    then:
      - lambda: |-
          id(max_current_found_1) = false; // Reset the flag before starting
          id(data_found_1) = false; // Reset the flag before starting
          id(search_counter_1) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_1) && id(data_found_1)) && id(search_counter_1) < 10;
          then:
            - canbus.send:
                can_id: 0x108150fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_1) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_1) && id(data_found_1)) {
            ESP_LOGI(
              "canbus",
              "Unit 1 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_1)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 1 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_1),
              id(max_current_found_1) ? "yes" : "no",
              id(data_found_1) ? "yes" : "no"
            );
          }
  # --------------------------------------------------------------------------
  # detect_data_unit_2
  # --------------------------------------------------------------------------
  # Capability/address discovery for Unit 2.
  - id: detect_data_unit_2
    then:
      - lambda: |-
          id(max_current_found_2) = false; // Reset the flag before starting
          id(data_found_2) = false; // Reset the flag before starting
          id(search_counter_2) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_2) && id(data_found_2)) && id(search_counter_2) < 10;
          then:
            - canbus.send:
                can_id: 0x108250fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_2) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_2) && id(data_found_2)) {
            ESP_LOGI(
              "canbus",
              "Unit 2 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_2)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 2 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_2),
              id(max_current_found_2) ? "yes" : "no",
              id(data_found_2) ? "yes" : "no"
            );
          }
  # --------------------------------------------------------------------------
  # detect_data_unit_3
  # --------------------------------------------------------------------------
  # Capability/address discovery for Unit 3.
  - id: detect_data_unit_3
    then:
      - lambda: |-
          id(max_current_found_3) = false; // Reset the flag before starting
          id(data_found_3) = false; // Reset the flag before starting
          id(search_counter_3) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_3) && id(data_found_3)) && id(search_counter_3) < 10;
          then:
            - canbus.send:
                can_id: 0x108350fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_3) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(max_current_found_3) && id(data_found_3)) {
            ESP_LOGI(
              "canbus",
              "Unit 3 capability/address discovery completed successfully after %d attempt(s).",
              id(search_counter_3)
            );
          } else {
            ESP_LOGW(
              "canbus",
              "Unit 3 capability/address discovery failed after %d attempt(s). "
              "Max current found: %s, address data found: %s",
              id(search_counter_3),
              id(max_current_found_3) ? "yes" : "no",
              id(data_found_3) ? "yes" : "no"
            );
          }
  # --------------------------------------------------------------------------
  # setup_sequence
  # --------------------------------------------------------------------------
  # Runs full discovery in a controlled order: properties for all
  # three units, then capability/address data. Delays reduce overlapping replies
  # and make the sequence easier to diagnose on the CAN bus.
  - id: setup_sequence
    mode: single
    then:
      # Detect unit properties for all three rectifiers, with delays to avoid overlapping replies.
      - script.execute: detect_unit_1_properties
      - delay: 5s
      - script.execute: detect_unit_2_properties
      - delay: 5s
      - script.execute: detect_unit_3_properties
      - delay: 5s      
      # Detect unit data for all three rectifiers, with delays to avoid overlapping replies.
      - script.execute: detect_data_unit_1
      - delay: 20s
      - script.execute: detect_data_unit_2
      - delay: 20s
      - script.execute: detect_data_unit_3

  # --------------------------------------------------------------------------
  # apply_dc_sum_power
  # --------------------------------------------------------------------------
  # Converts the requested total DC power into an equal current
  # target for each of the three parallel rectifiers:
  # I_each = P_total / (3 * V_DC).
  # The result is limited to 1..75 A and applied through set_dc_current_limit.
  - id: apply_dc_sum_power
    mode: restart
    then:
      - lambda: |-
          // Read the canonical setpoint entities shared by local encoder, web/API and
          // MQTT control paths.
          float voltage = id(set_dc_voltage_limit).state;
          float power_kw = id(dc_sum_power_set).state;

          if (isnan(voltage) || voltage < 49.0) {
            ESP_LOGW("encoder", "Invalid DC voltage - cannot calculate current");
            return;
          }

          // Total DC power distributed equally across 3 rectifiers
          // Three parallel units are expected to share the total requested power
          // equally, hence the division by both voltage and unit count (3).
          float current_per_rectifier =
              (power_kw * 1000.0f) / (voltage * 3.0f);

          // Existing configuration allows max. 75 A
          if (current_per_rectifier > 75.0f)
            current_per_rectifier = 75.0f;

          if (current_per_rectifier < 1.0f)
            current_per_rectifier = 1.0f;

          ESP_LOGI(
            "encoder",
            "DC Sum Power %.2f kW @ %.2f V -> %.1f A per rectifier",
            power_kw,
            voltage,
            current_per_rectifier
          );

          // Use NumberCall so the normal set_dc_current_limit automation performs the final
          // validation and CAN transmission; do not bypass that centralized path.
          auto call = id(set_dc_current_limit).make_call();
          call.set_value(current_per_rectifier);
          call.perform();

  # --------------------------------------------------------------------------
  # blackstart_start
  # --------------------------------------------------------------------------
  # Offline START sequence. Recalculates current, explicitly sends
  # voltage, explicitly sends current, waits for the setpoints to be accepted and
  # then broadcasts the ON command. No network connection is required.
  - id: blackstart_start
    mode: single
    then:
      # Calculate current from voltage and total power
      - script.execute: apply_dc_sum_power
      - script.wait: apply_dc_sum_power

      # Send voltage explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;

            int scaled_value =
                (int)(id(set_dc_voltage_limit).state *
                      id(voltage_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 50ms

      # Send calculated current explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;
            can_data[1] = 0x03;

            int scaled_value =
                (int)(id(set_dc_current_limit).state *
                      id(current_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 250ms

      # Start each rectifier individually, skipping any unit that is still
      # in overtemperature lockout instead of blindly broadcasting ON to all.
      - if:
          condition:
            lambda: 'return !id(overtemp_lockout_1);'
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108180FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - logger.log:
                level: WARN
                format: "BLACKSTART: Unit 1 skipped - overtemperature lockout active."

      - if:
          condition:
            lambda: 'return !id(overtemp_lockout_2);'
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108280FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - logger.log:
                level: WARN
                format: "BLACKSTART: Unit 2 skipped - overtemperature lockout active."

      - if:
          condition:
            lambda: 'return !id(overtemp_lockout_3);'
          then:
            - canbus.send:
                use_extended_id: true
                can_id: 0x108380FE
                data: [0x01, 0x32, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
          else:
            - logger.log:
                level: WARN
                format: "BLACKSTART: Unit 3 skipped - overtemperature lockout active."

      - logger.log:
          level: INFO
          format: "BLACKSTART: Rectifiers switched ON (excluding any overtemperature-locked units)"


  # --------------------------------------------------------------------------
  # blackstart_stop
  # --------------------------------------------------------------------------
  # Offline STOP sequence. Broadcasts the OFF command to all units.
  - id: blackstart_stop
    mode: single
    then:
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: [0x01, 0x32, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00]

      - logger.log:
          level: INFO
          format: "BLACKSTART: Rectifiers switched OFF"

  # ------------------------------------------------------------------
  # Display backlight inactivity timer
  # ------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # display_inactivity_timer
  # --------------------------------------------------------------------------
  # Restartable inactivity timer. Any encoder movement or
  # button press restarts it and wakes the backlight. After five minutes without
  # input, the backlight fades out over ten seconds.
  - id: display_inactivity_timer
    mode: restart
    then:
      # Wake display / keep backlight on
      - light.turn_on:
          id: back_light
          brightness: 100%
          transition_length: 200ms

      # Wait for 5 minutes without user input
      - delay: 5min

      # Slowly fade out backlight
      - light.turn_off:
          id: back_light
          transition_length: 10s
          

# ==============================================================================
# CAN BUS INTERFACE AND FRAME DECODERS
# ==============================================================================
# Uses the ESP32-S3 native CAN/TWAI peripheral at 125 kbit/s. The R4875G1
# protocol uses extended 29-bit CAN IDs. Unit number is encoded in the ID.
# Typical SN65HVD230 wiring:
#
# ESP32 GPIO15  -> CAN module CTX
# ESP32 GPIO16  -> CAN module CRX
# ESP32 3.3 V   -> 3V3
# ESP32 GND     -> GND
# CAN-H         -> CAN-H bus
# CAN-L         -> CAN-L bus
canbus:
  - platform: esp32_can
    tx_pin: GPIO15
    rx_pin: GPIO16
    can_id: 0xE5F32E5
    bit_rate: 125kbps
    use_extended_id: true
    on_frame:
      # Handler for CAN ID 0x1081D27F (Packet x)
      # Handle unit 1 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1081D27F
      # Unit 1 property-message START/DATA frame. Six payload bytes are appended to the ASCII property buffer.
      - can_id: 0x1081D27F
        use_extended_id: true
        then:
          - lambda: |-
              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_1) = "";  // Clear existing string
                  id(unit_properties_complete_1) = false;
                  message_started = true;
                  id(frame_counter_msg_start_1) = 0;  // Reset global frame counter
                  ESP_LOGI("unit_properties_1", "Unit 1: Message Start Detected");
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_1) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_1)++;

                  // Log for debugging purposes
                  ESP_LOGD("unit_properties_1", "Unit 1: Captured Frame #%d: %s", id(frame_counter_msg_start_1), frame_data.c_str());
                }
              }

      # Handler for CAN ID 0x1082D27F (Packet x)
      # Handle unit 2 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1082D27F
      # Unit 2 property-message START/DATA frame.
      - can_id: 0x1082D27F
        use_extended_id: true
        then:
          - lambda: |-
              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_2) = "";  // Clear existing string
                  id(unit_properties_complete_2) = false;
                  message_started = true;
                  id(frame_counter_msg_start_2) = 0;  // Reset global frame counter
                  ESP_LOGI("unit_properties_2", "Unit 2: Message Start Detected");
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_2) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_2)++;

                  // Log for debugging purposes
                  ESP_LOGD("unit_properties_2", "Unit 2: Captured Frame #%d: %s", id(frame_counter_msg_start_2), frame_data.c_str());
                }
              }

      # Handler for CAN ID 0x1083D27F (Packet x)
      # Handle unit 3 properties message start
      # ----------------------------------------------------------------------
      # CAN RX 0x1083D27F
      # Unit 3 property-message START/DATA frame.
      - can_id: 0x1083D27F
        use_extended_id: true
        then:
          - lambda: |-
              static bool message_started = false;

              if (x.size() == 8) {
                if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
                  id(unit_properties_3) = "";  // Clear existing string
                  id(unit_properties_complete_3) = false;
                  message_started = true;
                  id(frame_counter_msg_start_3) = 0;  // Reset global frame counter
                  ESP_LOGI("unit_properties_3", "Unit 3: Message Start Detected");
                }

                if (message_started) {
                  // Extract and append all payload bytes starting from x[2]
                  std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
                  id(unit_properties_3) += frame_data;

                  // Increment global frame counter
                  id(frame_counter_msg_start_3)++;

                  // Log for debugging purposes
                  ESP_LOGD("unit_properties_3", "Unit 3: Captured Frame #%d: %s", id(frame_counter_msg_start_3), frame_data.c_str());
                }
              }

      # Handler for CAN ID 0x1081D27E (Packet x)
      # Signal end of unit 1 properties message
      # ----------------------------------------------------------------------
      # CAN RX 0x1081D27E
      # Unit 1 property-message END frame. Final bytes are appended, key/value fields are parsed and text sensors are published.
      - can_id: 0x1081D27E
        use_extended_id: true
        then:
          - lambda: |-
              // Check if this frame contains additional payload data
              if (x.size() > 2) {  // Payload starts at x[2], so size must be > 2
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI("unit_properties_1", "Unit 1: End Message Frame Data: %s", frame_data.c_str());

                // Append any remaining data to unit_properties_1
                id(unit_properties_1) += frame_data;
              }
              ESP_LOGI("unit_properties_1", "Unit 1: Total Frames Captured: %d", id(frame_counter_msg_start_1));
              ESP_LOGI("unit_properties_1", "Unit 1: Final Unit Properties: %s", id(unit_properties_1).c_str());

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
                if (end == std::string::npos) {
                  end = data.size();
                }
                return data.substr(start, end - start);
              };

              struct KeySensorPair {
                const char* key;
                esphome::template_::TemplateTextSensor* sensor;
                bool* flag;
              };

              // Map ASCII protocol keys to ESPHome text sensors. The final
              // Manufactured field is also used as a completion marker so the
              // discovery script can tell whether the property set was complete.
              KeySensorPair mappings[] = {
                {"UnitType=", id(unit_type_1), nullptr},
                {"BarCode=", id(barcode_1), nullptr},
                {"Item=", id(item_no_1), nullptr},
                {"Description=", id(description_1), nullptr},
                {"Manufactured=", id(manufactured_1), &id(unit_properties_complete_1)}
              };

              bool all_keys_found = true;

              for (const auto& mapping : mappings) {
                std::string value = extract_value(id(unit_properties_1), mapping.key);
                if (!value.empty()) {
                  ESP_LOGI("unit_properties_1", "Unit 1: Extracted %s: %s", mapping.key, value.c_str());
                  mapping.sensor->publish_state(value.c_str());
                  if (mapping.flag) {
                    *(mapping.flag) = true;
                  }
                } else {
                  ESP_LOGW("unit_properties_1", "Unit 1: Key %s not found or empty", mapping.key);
                  all_keys_found = false;
                  if (mapping.flag) {
                    *(mapping.flag) = false; // Reset the flag for missing keys
                  }
                }
              }

              if (all_keys_found) {
                id(unit_properties_complete_1) = true; // Mark completion only if all keys are found
                ESP_LOGI("unit_properties_1", "Unit 1: All required keys found. Marking as complete.");
              } else {
                id(unit_properties_complete_1) = false; // Explicitly reset the flag if keys are missing
                ESP_LOGI("unit_properties_1", "Unit 1: Not all keys found. Will continue processing.");
              }

      # Handler for CAN ID 0x1082D27E (Packet x)
      # Signal end of unit 2 properties message
      # ----------------------------------------------------------------------
      # CAN RX 0x1082D27E
      # Unit 2 property-message END frame and parser.
      - can_id: 0x1082D27E
        use_extended_id: true
        then:
          - lambda: |-
              // Check if this frame contains additional payload data
              if (x.size() > 2) {  // Payload starts at x[2], so size must be > 2
                std::string frame_data((char*)&x[2], x.size() - 2);
                ESP_LOGI("unit_properties_2", "Unit 2: End Message Frame Data: %s", frame_data.c_str());

                // Append any remaining data to unit_properties_2
                id(unit_properties_2) += frame_data;
              }
              ESP_LOGI("unit_properties_2", "Unit 2: Total Frames Captured: %d", id(frame_counter_msg_start_2));
              ESP_LOGI("unit_properties_2", "Unit 2: Final Unit Properties: %s", id(unit_properties_2).c_str());

              auto extract_value = [](const std::string &data, const std::string &key) -> std::string {
                size_t start = data.find(key);
                if (start == std::string::npos) return "";
                start += key.size();
                size_t end = data.find_first_of("\r\n", start);
