display:
  - platform: ili9xxx
    model: ili9488
    id: my_tft
    cs_pin: GPIO5    # CS
    dc_pin: GPIO7    # DC/RS
    reset_pin: GPIO6 # RESET
    color_palette: 8BIT
    invert_colors: false
    dimensions:
      height: 320
      width: 480
    transform:
      swap_xy: true
      mirror_x: true
    update_interval: 500ms
    lambda: |-
      it.fill(Color::WHITE);
      it.print(
        10, 10,
        id(font_large),
        id(color_black),
        "3 Phase Battery Charger R4875G1"
      );

      it.strftime(
        10, 40,
        id(font_small),
        id(color_black),
        "%d.%m.%Y %H:%M",
        id(sntp_time).now()
      );

      // -----------------------------------------------------------------
      // AC Input - use all modules with valid CAN communication
      // -----------------------------------------------------------------

      int ac_modules_ok = 0;

      float ac_voltage_sum = 0.0f;
      float ac_current_sum = 0.0f;
      float ac_frequency_sum = 0.0f;
      float ac_power_sum = 0.0f;


      // Module 1
      if (id(can_com_ok_1).state) {

        if (!isnan(id(input_grid_voltage_sensor_1).state) &&
            !isnan(id(input_current_sensor_1).state) &&
            !isnan(id(grid_frequency_sensor_1).state) &&
            !isnan(id(ac_power_in_sensor_1).state)) {

          ac_voltage_sum += id(input_grid_voltage_sensor_1).state;
          ac_current_sum += id(input_current_sensor_1).state;
          ac_frequency_sum += id(grid_frequency_sensor_1).state;
          ac_power_sum += id(ac_power_in_sensor_1).state;

          ac_modules_ok++;
        }
      }

      // Module 2
      if (id(can_com_ok_2).state) {

        if (!isnan(id(input_grid_voltage_sensor_2).state) &&
            !isnan(id(input_current_sensor_2).state) &&
            !isnan(id(grid_frequency_sensor_2).state) &&
            !isnan(id(ac_power_in_sensor_2).state)) {

          ac_voltage_sum += id(input_grid_voltage_sensor_2).state;
          ac_current_sum += id(input_current_sensor_2).state;
          ac_frequency_sum += id(grid_frequency_sensor_2).state;
          ac_power_sum += id(ac_power_in_sensor_2).state;

          ac_modules_ok++;
        }
      }

      // Module 3
      if (id(can_com_ok_3).state) {

        if (!isnan(id(input_grid_voltage_sensor_3).state) &&
            !isnan(id(input_current_sensor_3).state) &&
            !isnan(id(grid_frequency_sensor_3).state) &&
            !isnan(id(ac_power_in_sensor_3).state)) {

          ac_voltage_sum += id(input_grid_voltage_sensor_3).state;
          ac_current_sum += id(input_current_sensor_3).state;
          ac_frequency_sum += id(grid_frequency_sensor_3).state;
          ac_power_sum += id(ac_power_in_sensor_3).state;

          ac_modules_ok++;
        }
      }

      // -----------------------------------------------------------------
      // Display AC values
      // -----------------------------------------------------------------

      if (ac_modules_ok > 0) {

        float ac_voltage_avg =
            ac_voltage_sum / ac_modules_ok;

        float ac_current_avg =
            ac_current_sum / ac_modules_ok;

        float ac_frequency_avg =
            ac_frequency_sum / ac_modules_ok;

        float ac_power_kw =
            ac_power_sum / 1000.0f;


        // Header
        it.printf(
          10, 70,
          id(font_small_bold),
          id(color_blue),
          "AC Input: %.3f kW  (%d/3)",
          ac_power_kw,
          ac_modules_ok
        );


        // Details
        it.printf(
          10, 95,
          id(font_small),
          id(color_black),
          "%.1f V - %.1f A - %.1f Hz",
          ac_voltage_avg,
          ac_current_avg,
          ac_frequency_avg
        );

      } else {

        it.print(
          10, 70,
          id(font_small_bold),
          id(color_red),
          "AC Input: CAN bus communication fault!"
        );

        it.print(
          10, 95,
          id(font_small),
          id(color_red),
          "No charger module reachable"
        );
      }
      it.printf(10, 125,
        id(font_small_bold),
        id(color_red),
        "DC Output: %.3f kW",
        id(combined_dc_power_sensor).state
      );

      if (id(can_com_ok_1).state) {
        it.printf(
          10, 150,
          id(font_small),
          id(color_black),
          "L1: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(output_voltage_sensor_1).state,
          id(output_current_sensor_1).state,
          id(dc_power_out_sensor_1).state,
          id(input_temperature_sensor_1).state,
          id(output_temperature_sensor_1).state
        );
      } else {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: CAN bus communication fault!"
        );
      }

      if (id(can_com_ok_2).state) {
        it.printf(
          10, 170,
          id(font_small),
          id(color_black),
          "L2: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(output_voltage_sensor_2).state,
          id(output_current_sensor_2).state,
          id(dc_power_out_sensor_2).state,
          id(input_temperature_sensor_2).state,
          id(output_temperature_sensor_2).state
        );
      } else {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: CAN bus communication fault!"
        );
      }

      if (id(can_com_ok_3).state) {
        it.printf(
          10, 190,
          id(font_small),
          id(color_black),
          "L3: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(output_voltage_sensor_3).state,
          id(output_current_sensor_3).state,
          id(dc_power_out_sensor_3).state,
          id(input_temperature_sensor_3).state,
          id(output_temperature_sensor_3).state
        );
      } else {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: CAN bus communication fault!"
        );
      }

      // -----------------------------------------------------------------
      // Local / Blackstart setpoints
      // -----------------------------------------------------------------
      it.print(
        10, 220,
        id(font_small_bold),
        id(color_green),
        "Setpoints:"
      );

      // Actual rectifier status
      int rectifiers_on = 0;

      if (id(power_state_sensor_1).state == "ON") rectifiers_on++;
      if (id(power_state_sensor_2).state == "ON") rectifiers_on++;
      if (id(power_state_sensor_3).state == "ON") rectifiers_on++;

      if (rectifiers_on == 3) {

        it.print(
          375, 220,
          id(font_small_bold),
          id(color_green),
          "3/3 ON"
        );

      } else if (rectifiers_on == 0) {

        it.print(
          410, 220,
          id(font_small_bold),
          id(color_red),
          "OFF"
        );

      } else {

        it.printf(
          375, 220,
          id(font_small_bold),
          id(color_blue),
          "%d/3 ON",
          rectifiers_on
        );
      }

      // -----------------------------------------------------------------
      // Encoder selection
      // -----------------------------------------------------------------

      if (id(encoder_mode) == 0) {

        // Voltage selected
        it.printf(
          10, 245,
          id(font_small_bold),
          id(color_blue),
          "> DC Voltage: %.1f V",
          id(can_voltage_set).state
        );

        it.printf(
          10, 270,
          id(font_small),
          id(color_black),
          "  DC Power: %.2f kW  -  %.1f A/unit",
          id(dc_sum_power_set).state,
          id(can_amp_set).state
        );

      } else {

        // Sum power selected
        it.printf(
          10, 245,
          id(font_small),
          id(color_black),
          "  DC Voltage: %.1f V",
          id(can_voltage_set).state
        );

        it.printf(
          10, 270,
          id(font_small_bold),
          id(color_blue),
          "> DC Power: %.2f kW  -  %.1f A/unit",
          id(dc_sum_power_set).state,
          id(can_amp_set).state
        );
      }
      it.printf(10, 300, id(font_footer), id(color_black), "IP: %s", id(ip_address).state.c_str());
      it.printf(200, 300, id(font_footer), id(color_black), "CPU Temp: %.1f °C", id(cpu_temp).state);
      it.printf(390, 300, id(font_footer), id(color_black), "WiFi: %.1f dBm", id(wifi_sig).state);

globals:
  - id: encoder_mode
    type: int
    restore_value: no
    initial_value: '0'

  - id: charger_local_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # Last valid cyclic CAN telemetry frame received from each charger module.
  # Used by can_com_ok_1..3 to detect stale/lost communication.
  - id: last_can_rx_1
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_can_rx_2
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_can_rx_3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: amp_scaling_factor
    type: float
    initial_value: "15.0"
    restore_value: True
    
  - id: voltage_scaling_factor
    type: int
    initial_value: "1024"
    restore_value: True

  - id: max_current_found_1
    type: bool
    restore_value: no
    initial_value: "false"

  - id: max_current_found_2
    type: bool
    restore_value: no
    initial_value: "false"

  - id: max_current_found_3
    type: bool
    restore_value: no
    initial_value: "false"

  - id: data_found_1
    type: bool
    restore_value: no
    initial_value: "false"

  - id: data_found_2
    type: bool
    restore_value: no
    initial_value: "false"

  - id: data_found_3
    type: bool
    restore_value: no
    initial_value: "false"

  - id: module_properties_1
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: module_properties_2
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: module_properties_3
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: module_properties_complete_1
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: module_properties_complete_2
    type: bool
    restore_value: no
    initial_value: "false"

  - id: module_properties_complete_3
    type: bool
    restore_value: no
    initial_value: "false"

  - id: frame_counter_bp_1
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_bp_2
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_bp_3
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_msg_start_1
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_msg_start_2
    type: int
    restore_value: no
    initial_value: '0'

  - id: frame_counter_msg_start_3
    type: int
    restore_value: no
    initial_value: '0'

  - id: search_counter_1
    type: int
    restore_value: no
    initial_value: '0'

  - id: search_counter_2
    type: int
    restore_value: no
    initial_value: '0'

  - id: search_counter_3
    type: int
    restore_value: no
    initial_value: '0'

script:
  - id: detect_module_1_properties
    mode: single
    then:
      - lambda: |-
          id(module_properties_complete_1) = false; // Reset the completion flag before starting
          id(frame_counter_bp_1) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(module_properties_complete_1) && id(frame_counter_bp_1) < 3;
          then:
            - canbus.send:
                can_id: 0x1081D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_1) += 1; // Increment the frame counter
                ESP_LOGI("module_properties", "Frame Counter: %d", id(frame_counter_bp_1));
      - lambda: |-
          if (id(module_properties_complete_1)) {
            ESP_LOGI("module_properties", "Module properties detected successfully.");
          } else {
            ESP_LOGW("module_properties_1", "Fail-safe triggered: Loop stopped after 3 attempts.");
          }
        
  - id: detect_module_2_properties
    mode: single
    then:
      - lambda: |-
          id(module_properties_complete_2) = false; // Reset the completion flag before starting
          id(frame_counter_bp_2) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(module_properties_complete_2) && id(frame_counter_bp_2) < 3;
          then:
            - canbus.send:
                can_id: 0x1082D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_2) += 1; // Increment the frame counter
                ESP_LOGI("module_properties_2", "Frame Counter: %d", id(frame_counter_bp_2));
      - lambda: |-
          if (id(module_properties_complete_2)) {
            ESP_LOGI("module_properties_2", "Module properties detected successfully.");
          } else {
            ESP_LOGW("module_properties_2", "Fail-safe triggered: Loop stopped after 3 attempts.");
          }

  - id: detect_module_3_properties
    mode: single
    then:
      - lambda: |-
          id(module_properties_complete_3) = false; // Reset the completion flag before starting
          id(frame_counter_bp_3) = 0; // Reset the frame counter
      - while:
          condition:
            lambda: |-
              return !id(module_properties_complete_3) && id(frame_counter_bp_3) < 3;
          then:
            - canbus.send:
                can_id: 0x1083D2FE
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(frame_counter_bp_3) += 1; // Increment the frame counter
                ESP_LOGI("module_properties_3", "Frame Counter: %d", id(frame_counter_bp_3));
      - lambda: |-
          if (id(module_properties_complete_3)) {
            ESP_LOGI("module_properties_3", "Module properties detected successfully.");
          } else {
            ESP_LOGW("module_properties_3", "Fail-safe triggered: Loop stopped after 3 attempts.");
          }

  - id: detect_data_module_1
    then:
      - lambda: |-
          id(max_current_found_1) = false; // Reset the flag before starting
          id(data_found_1) = false; // Reset the flag before starting
          id(search_counter_1) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_1) && id(data_found_1)) && id(search_counter_1) < 10;
          then:
            - canbus.send:
                can_id: 0x108150fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_1) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(search_counter_1) >= 20) {
            ESP_LOGW("canbus", "Fail-safe triggered: Loop stopped after 20 attempts.");
          }

  - id: detect_data_module_2
    then:
      - lambda: |-
          id(max_current_found_2) = false; // Reset the flag before starting
          id(data_found_2) = false; // Reset the flag before starting
          id(search_counter_2) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_2) && id(data_found_2)) && id(search_counter_2) < 10;
          then:
            - canbus.send:
                can_id: 0x108250fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_2) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(search_counter_2) >= 20) {
            ESP_LOGW("canbus", "Fail-safe triggered: Loop stopped after 20 attempts.");
          }

  - id: detect_data_module_3
    then:
      - lambda: |-
          id(max_current_found_3) = false; // Reset the flag before starting
          id(data_found_3) = false; // Reset the flag before starting
          id(search_counter_3) = 0; // Initialize a fail-safe counter
      - while:
          condition:
            lambda: |-
              return !(id(max_current_found_3) && id(data_found_3)) && id(search_counter_3) < 10;
          then:
            - canbus.send:
                can_id: 0x108350fe
                use_extended_id: true
                data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
            - delay: 1s
            - lambda: |-
                id(search_counter_3) += 1; // Increment the fail-safe counter
      - lambda: |-
          if (id(search_counter_3) >= 20) {
            ESP_LOGW("canbus", "Fail-safe triggered: Loop stopped after 20 attempts.");
          }

  - id: setup_sequence
    mode: single
    then:
      - script.execute: detect_module_1_properties
      - delay: 5s
      - script.execute: detect_module_2_properties
      - delay: 5s
      - script.execute: detect_module_3_properties
      - delay: 5s      
      # Detect Data Module-1
      - script.execute: detect_data_module_1
      - delay: 20s
      # Detect Data Module-2
      - script.execute: detect_data_module_2
      - delay: 20s
      # Detect Data Module-3
      - script.execute: detect_data_module_3

  - id: apply_dc_sum_power
    mode: restart
    then:
      - lambda: |-
          float voltage = id(can_voltage_set).state;
          float power_kw = id(dc_sum_power_set).state;

          if (isnan(voltage) || voltage < 1.0) {
            ESP_LOGW("encoder", "Invalid DC voltage - cannot calculate current");
            return;
          }

          // Total DC power distributed equally across 3 rectifiers
          float current_per_rectifier =
              (power_kw * 1000.0f) / (voltage * 3.0f);

          // Existing configuration allows max. 75 A
          if (current_per_rectifier > 75.0f)
            current_per_rectifier = 75.0f;

          if (current_per_rectifier < 1.0f)
            current_per_rectifier = 1.0f;

          ESP_LOGI(
            "encoder",
            "DC Sum Power %.2f kW @ %.2f V -> %.1f A per rectifier",
            power_kw,
            voltage,
            current_per_rectifier
          );

          auto call = id(can_amp_set).make_call();
          call.set_value(current_per_rectifier);
          call.perform();

  - id: blackstart_start
    mode: single
    then:
      # Calculate current from voltage and total power
      - script.execute: apply_dc_sum_power
      - script.wait: apply_dc_sum_power

      # Send voltage explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;

            int scaled_value =
                (int)(id(can_voltage_set).state *
                      id(voltage_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 50ms

      # Send calculated current explicitly
      - canbus.send:
          use_extended_id: true
          can_id: 0x108080FE
          data: !lambda |-
            std::vector<uint8_t> can_data(8, 0x00);

            can_data[0] = 0x01;
            can_data[1] = 0x03;

            int scaled_value =
                (int)(id(can_amp_set).state *
                      id(amp_scaling_factor));

            can_data[6] = (scaled_value >> 8) & 0xFF;
            can_data[7] = scaled_value & 0xFF;

            return can_data;

      - delay: 250ms

      # Start all rectifiers
      - canbus.send:
          use_extended_id: true
