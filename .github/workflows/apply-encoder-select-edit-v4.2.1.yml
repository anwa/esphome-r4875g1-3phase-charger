name: Apply encoder Select/Edit v4.2.1
on:
  push:
    branches: [feature/encoder-select-edit]
    paths: [.github/workflows/apply-encoder-select-edit-v4.2.1.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/encoder-select-edit
          fetch-depth: 0
      - name: Apply v4.2.1
        shell: python
        run: |
          from pathlib import Path
          root=Path('r4875g1-3phase-charger.yaml')
          s=root.read_text()
          old='''  # local_encoder\n  # Physical local rotary encoder; pins are defined in substitutions. In voltage mode it changes set_dc_voltage_limit and recalculates current to preserve total power; in power mode it changes set_dc_sum_power. Every movement wakes/restarts the backlight timer.\n'''
          new='''  # local_encoder\n  # Global Select/Edit controller. SELECT rotates through the editable parameters\n  # on the current page. EDIT changes only a temporary value; the real number\n  # entity (and therefore CAN command) is updated only by the confirming click.\n'''
          assert old in s; s=s.replace(old,new,1)
          start=s.index('  - platform: rotary_encoder\n    id: local_encoder')
          end=s.index('\n  # --------------------------------------------------------------------------\n  # Effective DC Current Limit',start)
          enc='''  - platform: rotary_encoder\n    id: local_encoder\n    pin_a:\n      number: ${pin_encoder_a}\n      mode: {input: true, pullup: true}\n    pin_b:\n      number: ${pin_encoder_b}\n      mode: {input: true, pullup: true}\n    resolution: 1\n    internal: true\n    on_clockwise:\n      then:\n        - script.execute: display_inactivity_timer\n        - lambda: |-\n            if (!id(encoder_edit_mode)) {\n              id(encoder_selection) = (id(encoder_selection) + 1) % 2;\n            } else if (id(encoder_selection) == 0) {\n              id(encoder_edit_value) = std::min(${dc_voltage_max_v}f, id(encoder_edit_value) + 0.1f);\n            } else {\n              id(encoder_edit_value) = std::min(12.0f, id(encoder_edit_value) + 0.1f);\n            }\n    on_anticlockwise:\n      then:\n        - script.execute: display_inactivity_timer\n        - lambda: |-\n            if (!id(encoder_edit_mode)) {\n              id(encoder_selection) = (id(encoder_selection) + 1) % 2;\n            } else if (id(encoder_selection) == 0) {\n              id(encoder_edit_value) = std::max(${dc_voltage_min_v}f, id(encoder_edit_value) - 0.1f);\n            } else {\n              id(encoder_edit_value) = std::max(0.0f, id(encoder_edit_value) - 0.1f);\n            }\n'''
          s=s[:start]+enc+s[end:]
          bs=s.index('    on_multi_click:',s.index('id: local_encoder_button'))
          be=s.index('\n  # --------------------------------------------------------------------------\n  # Rectifier Capability Mismatch',bs)
          clicks='''    on_multi_click:\n      - timing:\n          - ON for 50ms to 700ms\n          - OFF for 50ms to 350ms\n          - ON for 50ms to 700ms\n          - OFF for at least 50ms\n        then:\n          - if:\n              condition:\n                lambda: 'return !id(encoder_edit_mode);'\n              then:\n                - lvgl.page.next:\n                    animation: OUT_LEFT\n                    time: 180ms\n      - timing:\n          - ON for 50ms to 700ms\n          - OFF for at least 350ms\n        then:\n          - lambda: |-\n              if (!id(encoder_edit_mode)) {\n                id(encoder_edit_mode) = true;\n                id(encoder_edit_value) = id(encoder_selection) == 0 ? id(set_dc_voltage_limit).state : id(set_dc_sum_power).state;\n                ESP_LOGI("encoder", "EDIT entered for parameter %d", id(encoder_selection));\n              } else {\n                if (id(encoder_selection) == 0) {\n                  auto call=id(set_dc_voltage_limit).make_call(); call.set_value(id(encoder_edit_value)); call.perform();\n                  id(apply_dc_sum_power).execute();\n                } else {\n                  auto call=id(set_dc_sum_power).make_call(); call.set_value(id(encoder_edit_value)); call.perform();\n                }\n                id(encoder_edit_mode) = false;\n                ESP_LOGI("encoder", "EDIT committed; returning to SELECT");\n              }\n      - timing:\n          - ON for at least 3000ms\n        then:\n          - if:\n              condition:\n                lambda: 'return !id(encoder_edit_mode);'\n              then:\n                - if:\n                    condition:\n                      lambda: 'return id(power_state_1).state == "ON" || id(power_state_2).state == "ON" || id(power_state_3).state == "ON";'\n                    then:\n                      - script.execute: blackstart_stop\n                    else:\n                      - if:\n                          condition:\n                            lambda: 'return (id(rectifier_control_state_1)==${rectifier_state_online} && id(can_com_ok_1).state) || (id(rectifier_control_state_2)==${rectifier_state_online} && id(can_com_ok_2).state) || (id(rectifier_control_state_3)==${rectifier_state_online} && id(can_com_ok_3).state);'\n                          then:\n                            - script.execute: blackstart_start\n                          else:\n                            - logger.log:\n                                level: WARN\n                                format: "BLACKSTART: START ignored - no fully ONLINE rectifier with fresh CAN communication is available."\n'''
          s=s[:bs]+clicks+s[be:]
          root.write_text(s)

          rs=Path('packages/rectifier-shared.yaml'); t=rs.read_text()
          old='''  # Selects what the rotary encoder edits locally.\n  # 0 = DC voltage, 1 = total DC power. It is not restored so the UI starts in a\n  # known mode after boot.\n  - id: encoder_mode\n    type: int\n    restore_value: false\n    initial_value: "0"\n'''
          new='''  # Global encoder UI state. Page-specific selectable parameter lists are\n  # introduced incrementally; v4.2.1 starts with Dashboard Voltage and Power.\n  - id: encoder_selection\n    type: int\n    restore_value: false\n    initial_value: "0"\n  - id: encoder_edit_mode\n    type: bool\n    restore_value: false\n    initial_value: "false"\n  - id: encoder_edit_value\n    type: float\n    restore_value: false\n    initial_value: "0.0f"\n'''
          assert old in t; rs.write_text(t.replace(old,new,1))

          d=Path('packages/display/pages/dashboard.yaml'); t=d.read_text()
          t=t.replace('id(encoder_mode) == 0 ? ">" : " "','!id(encoder_edit_mode) && id(encoder_selection) == 0 ? ">" : " "')
          t=t.replace('id(encoder_mode) == 1 ? ">" : " "','!id(encoder_edit_mode) && id(encoder_selection) == 1 ? ">" : " "')
          t=t.replace('id(set_dc_voltage_limit).state);\'','id(encoder_edit_mode) && id(encoder_selection) == 0 ? id(encoder_edit_value) : id(set_dc_voltage_limit).state);\'')
          t=t.replace('id(set_dc_sum_power).state);\'','id(encoder_edit_mode) && id(encoder_selection) == 1 ? id(encoder_edit_value) : id(set_dc_sum_power).state);\'')
          t=t.replace("return id(encoder_mode) == 0 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);","return !id(encoder_edit_mode) && id(encoder_selection) == 0 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);")
          t=t.replace("return id(encoder_mode) == 1 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);","return !id(encoder_edit_mode) && id(encoder_selection) == 1 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);")
          # Invert the selected value line during EDIT as a first visual distinction.
          t=t.replace("text_color: !lambda 'return !id(encoder_edit_mode) && id(encoder_selection) == 0 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);'","text_color: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 0 ? lv_color_hex(0xFFFFFF) : (!id(encoder_edit_mode) && id(encoder_selection) == 0 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433));'\n          bg_color: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 0 ? lv_color_hex(0x182433) : lv_color_hex(0xFFFFFF);'\n          bg_opa: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 0 ? LV_OPA_COVER : LV_OPA_TRANSP;' ")
          t=t.replace("text_color: !lambda 'return !id(encoder_edit_mode) && id(encoder_selection) == 1 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433);'","text_color: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 1 ? lv_color_hex(0xFFFFFF) : (!id(encoder_edit_mode) && id(encoder_selection) == 1 ? lv_color_hex(0x1769AA) : lv_color_hex(0x182433));'\n          bg_color: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 1 ? lv_color_hex(0x182433) : lv_color_hex(0xFFFFFF);'\n          bg_opa: !lambda 'return id(encoder_edit_mode) && id(encoder_selection) == 1 ? LV_OPA_COVER : LV_OPA_TRANSP;' ")
          d.write_text(t)

          Path('packages/version.yaml').write_text('substitutions:\n  # Single source of truth for the firmware release version.\n  # Every repository commit increments PATCH by one.\n  firmware_version: "4.2.1"\n')
          for fn in ['README.md','packages/README.md']:
            p=Path(fn); x=p.read_text(); x=x.replace('4.2.0', '4.2.1')
            x += '\n\n## Encoder Select/Edit development\n\nv4.2.1 introduces the global Select/Edit state machine. SELECT rotates through Dashboard Voltage/Power, short press enters EDIT, EDIT changes a temporary value, and short press commits it. Double-click page navigation and long-press rectifier START/STOP are accepted only in SELECT. The selected parameter uses `>` in SELECT; the edited value is inverted in EDIT. Page-specific editable parameters beyond Dashboard are added in subsequent commits.\n'
            p.write_text(x)
          Path('.github/workflows/apply-encoder-select-edit-v4.2.1.yml').unlink()
      - name: Commit clean v4.2.1 from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check --cached
          TREE=$(git write-tree)
          PARENT=$(git rev-parse origin/main)
          COMMIT=$(printf '%s\n\n%s\n' 'Introduce global encoder Select/Edit state machine in v4.2.1' '- add explicit SELECT and EDIT states for local encoder operation
          - make encoder rotation select Dashboard parameters in SELECT instead of changing values immediately
          - enter EDIT with a short press and copy the selected parameter into a temporary edit buffer
          - change only the temporary buffer while rotating in EDIT so CAN setpoints are not transmitted during adjustment
          - commit the edited Voltage or Power value only on the confirming short press and return to SELECT
          - suppress double-click page navigation and long-press rectifier START/STOP while EDIT is active
          - preserve double-click page navigation and blackstart START/STOP behavior in SELECT
          - show the selected Dashboard parameter with > in SELECT and invert the active value line in EDIT
          - establish page-independent encoder state globals as the basis for adding page-specific editable parameters next
          - synchronize README.md and packages/README.md with the new interaction model and staged rollout
          - bump the centralized firmware version from v4.2.0 to v4.2.1' | git commit-tree "$TREE" -p "$PARENT")
          git push --force origin "$COMMIT":feature/encoder-select-edit
