name: Apply v4.1.4 explicit scrollbar cleanup

on:
  push:
    branches:
      - v4-lvgl-menu
    paths:
      - .github/workflows/apply-v4.1.4-scrollbars.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-lvgl-menu
          fetch-depth: 0

      - name: Apply explicit no-scroll settings
        shell: python
        run: |
          from pathlib import Path

          page_paths = [
              Path('packages/display/pages/dashboard.yaml'),
              Path('packages/display/pages/rectifiers.yaml'),
              Path('packages/display/pages/cooling.yaml'),
              Path('packages/display/pages/system.yaml'),
          ]

          for path in page_paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              out = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  out.append(line)

                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip(' '))

                  # Every LVGL page root already has scrollable:false. Ensure
                  # its scrollbar mode is explicit as well.
                  if stripped == 'scrollable: false':
                      next_line = lines[i + 1].strip() if i + 1 < len(lines) else ''
                      if next_line != 'scrollbar_mode: "OFF"':
                          out.append(' ' * indent + 'scrollbar_mode: "OFF"')

                  # Every generic object container must explicitly disable both
                  # scrolling and scrollbar rendering. Insert immediately after
                  # the obj declaration only if the local block does not already
                  # contain the settings before widgets/next sibling.
                  if stripped == '- obj:':
                      base_indent = indent + 4
                      j = i + 1
                      has_scrollable = False
                      has_scrollbar = False
                      while j < len(lines):
                          probe = lines[j]
                          probe_indent = len(probe) - len(probe.lstrip(' '))
                          if probe.strip() and probe_indent <= indent:
                              break
                          if probe.strip() == 'scrollable: false':
                              has_scrollable = True
                          if probe.strip() == 'scrollbar_mode: "OFF"':
                              has_scrollbar = True
                          if probe.strip() == 'widgets:':
                              break
                          j += 1
                      if not has_scrollable:
                          out.append(' ' * base_indent + 'scrollable: false')
                      if not has_scrollbar:
                          out.append(' ' * base_indent + 'scrollbar_mode: "OFF"')

                  i += 1

              path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          version = Path('packages/version.yaml')
          text = version.read_text(encoding='utf-8')
          assert text.count('firmware_version: "4.1.3"') == 1
          version.write_text(text.replace('firmware_version: "4.1.3"', 'firmware_version: "4.1.4"', 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Current UI development firmware: 4.1.3', 'Current UI development firmware: 4.1.4')
          text = text.replace('Development v4.1.3', 'Development v4.1.4')
          text = text.replace('This README documents development firmware **v4.1.3**', 'This README documents development firmware **v4.1.4**')
          old = 'The installation has no touchscreen. Generic LVGL container objects therefore have scrolling disabled and `scrollbar_mode: OFF` globally in the shared theme. Page roots are also non-scrollable. New cards inherit this behavior automatically and must not rely on touch scrolling.'
          new = 'The installation has no touchscreen. Scrolling and `scrollbar_mode: OFF` are configured both globally in the shared LVGL theme and explicitly on every page/header/card container. The explicit per-container settings avoid LVGL scrollbar-part inheritance differences and guarantee that no unusable horizontal or vertical scrollbars are rendered. New cards must follow the same rule and must not rely on touch scrolling.'
          assert old in text
          text = text.replace(old, new)
          readme.write_text(text, encoding='utf-8')

          preadme = Path('packages/README.md')
          text = preadme.read_text(encoding='utf-8')
          text = text.replace('development firmware **v4.1.3**', 'development firmware **v4.1.4**')
          text = text.replace('Firmware **4.1.3** on `v4-lvgl-menu`', 'Firmware **4.1.4** on `v4-lvgl-menu`')
          old = 'The ILI9488 uses ESPHome LVGL with separate hardware, theme, page aggregation and page files. The controller has no touchscreen, so `display/theme.yaml` globally disables scrolling and scrollbars for generic LVGL `obj` containers. Page roots are non-scrollable as well. New cards must fit their content rather than depend on touch scrolling.'
          new = 'The ILI9488 uses ESPHome LVGL with separate hardware, theme, page aggregation and page files. The controller has no touchscreen, so scrolling and scrollbar rendering are disabled twice: globally in `display/theme.yaml` and explicitly on every page/header/card `obj` container. The explicit local settings avoid scrollbar-part inheritance differences in LVGL. New cards must fit their content rather than depend on touch scrolling.'
          assert old in text
          text = text.replace(old, new)
          preadme.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-v4.1.4-scrollbars.yml').unlink()

      - name: Validate patch
        shell: python
        run: |
          from pathlib import Path
          import re
          for path in Path('packages/display/pages').glob('*.yaml'):
              text = path.read_text(encoding='utf-8')
              assert 'scrollable: false' in text, path
              for match in re.finditer(r'(?m)^(\s*)- obj:\s*$', text):
                  start = match.end()
                  block = text[start:start + 500]
                  assert 'scrollable: false' in block, f'{path}: obj missing scrollable false'
                  assert 'scrollbar_mode: "OFF"' in block, f'{path}: obj missing scrollbar OFF'
          assert 'firmware_version: "4.1.4"' in Path('packages/version.yaml').read_text()
          assert not Path('.github/workflows/apply-v4.1.4-scrollbars.yml').exists()

      - name: Commit v4.1.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "Eliminate residual LVGL scrollbars in v4.1.4" -m "- explicitly disable scrolling and scrollbar rendering on every Dashboard, Rectifiers, Cooling and System page container
          - apply the same explicit settings to all header and card objects instead of relying only on LVGL theme inheritance
          - retain the global non-touch theme policy as an additional safeguard for future UI containers
          - remove the horizontal Rectifiers card scrollbars and vertical System page/card scrollbar reported during hardware testing
          - preserve the v4.1.3 compact PWR / CAN / lifecycle status presentation and aligned telemetry rows
          - keep page navigation, display data sources and all charger/CAN/discovery/blackstart behavior unchanged
          - document the explicit per-container no-scrollbar policy in README.md and packages/README.md
          - remove this one-shot feature-branch patch workflow after applying the change
          - bump the centralized firmware version from v4.1.3 to v4.1.4"
          git push origin HEAD:v4-lvgl-menu
