name: Finalize centralized firmware version

on:
  push:
    paths:
      - .github/workflows/patch-v4.0.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Centralize version and synchronize documentation
        shell: python
        run: |
          from pathlib import Path

          root = Path("r4875g1-3phase-charger.yaml")
          text = root.read_text(encoding="utf-8")
          assert text.count('substitutions:\n') >= 1
          marker = 'substitutions:\n  mqtt_command_prefix:'
          assert text.count(marker) == 1
          text = text.replace(marker, 'substitutions:\n  # Firmware version is defined once in packages/version.yaml.\n  mqtt_command_prefix:', 1)
          old = '    version: "4.0.1"'
          assert text.count(old) == 1
          text = text.replace(old, '    version: "${firmware_version}"', 1)
          # Load the central version package before all consumers.
          packages_marker = 'packages:\n  core: !include packages/core.yaml'
          assert text.count(packages_marker) == 1
          text = text.replace(packages_marker, 'packages:\n  version: !include packages/version.yaml\n  core: !include packages/core.yaml', 1)
          root.write_text(text, encoding="utf-8", newline="\n")

          version = Path("packages/version.yaml")
          version.write_text(
              'substitutions:\n'
              '  # Single source of truth for the firmware release version.\n'
              '  # Every repository commit increments PATCH by one.\n'
              '  firmware_version: "4.0.4"\n',
              encoding="utf-8", newline="\n"
          )

          display = Path("packages/display.yaml")
          d = display.read_text(encoding="utf-8")
          old_display = '  display_rotation: "90"\n  firmware_version: "4.0.1"'
          assert d.count(old_display) == 1
          d = d.replace(old_display, '  display_rotation: "90"', 1)
          display.write_text(d, encoding="utf-8", newline="\n")

          readme = Path("README.md")
          r = readme.read_text(encoding="utf-8")
          r = r.replace('**Current firmware: 4.0.0**', '**Current firmware: 4.0.4**')
          old_block = '''The authoritative ESPHome project metadata is:\n\n```yaml\nesphome:\n  project:\n    name: "anwa.3phase-charger"\n    version: "4.0.0"\n```\n\nThe TFT header also displays `v4.0.0`; these values must remain synchronized.\n\nThe project uses `MAJOR.MINOR.PATCH`. Major/minor milestones reset PATCH to zero; subsequent firmware commits increment PATCH as appropriate.'''
          new_block = '''The firmware version has one source of truth in `packages/version.yaml`:\n\n```yaml\nsubstitutions:\n  firmware_version: "4.0.4"\n```\n\n`esphome.project.version` and the TFT header both consume `${firmware_version}`. The project uses `MAJOR.MINOR.PATCH`; every repository commit increments PATCH by one.'''
          assert old_block in r
          r = r.replace(old_block, new_block)
          r = r.replace('firmware **4.0.0** on `main`', 'firmware **4.0.4** on `main`')
          readme.write_text(r, encoding="utf-8", newline="\n")

          flows = Path("R4875G1_CONTROL_FLOWS.md")
          f = flows.read_text(encoding="utf-8")
          f = f.replace('firmware **4.0.0**', 'firmware **4.0.4**')
          f = f.replace('`v4.0.0`', '`v4.0.4`')
          f = f.replace('| Raw CAN watchdog | 3 s |', '| Raw CAN watchdog | 3 s ONLINE/OFFLINE; 7 s while DISCOVERING |')
          f = f.replace('Communication is fresh for 3 seconds.', 'Communication is fresh for 3 seconds during normal operation and for 7 seconds while the unit is DISCOVERING, so the intentional 5-second stabilization window cannot expire the watchdog.')
          flows.write_text(f, encoding="utf-8", newline="\n")

          pkg = Path("packages/README.md")
          p = pkg.read_text(encoding="utf-8")
          p = p.replace('firmware **v4.0.0**', 'firmware **v4.0.4**')
          p = p.replace('| `core.yaml` |', '| `version.yaml` | single source of truth for firmware version; every commit increments PATCH |\n| `core.yaml` |')
          p = p.replace('The firmware version displayed in the header is `4.0.0` and must remain synchronized with `esphome.project.version` in the root YAML.', 'The TFT header and `esphome.project.version` both consume `${firmware_version}` from `version.yaml`, so the version is maintained in exactly one place.')
          p = p.replace('Firmware **4.0.0**', 'Firmware **4.0.4**')
          pkg.write_text(p, encoding="utf-8", newline="\n")

      - name: Remove one-shot workflow and verify
        run: |
          git rm .github/workflows/patch-v4.0.1.yml
          git diff --check
          grep -q 'firmware_version: "4.0.4"' packages/version.yaml
          grep -q 'version: "${firmware_version}"' r4875g1-3phase-charger.yaml
          test "$(grep -R --include='*.yaml' -h 'firmware_version: "4.0.4"' . | wc -l)" -eq 1
          ! grep -q 'firmware_version:' packages/display.yaml

      - name: Commit v4.0.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize firmware version at v4.0.4"
          git push origin HEAD:main
