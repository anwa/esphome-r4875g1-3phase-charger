# ==============================================================================
# EXAMPLE SECRETS FOR LOCAL VALIDATION
# ==============================================================================
#
# Dummy values that allow `esphome config` and `esphome compile` to run locally.
# scripts/validate.ps1 copies this file to secrets.yaml when no secrets.yaml
# exists. Firmware built with these values cannot join the real network.
#
# Never commit a real secrets.yaml.
# ==============================================================================

wifi_ssid: "example-ssid"
wifi_password: "example-wifi-password"
fallback_ap_password: "example-fallback"

# Bytes 0x01..0x20, base64-encoded. ESPHome requires a valid 32-byte key and
# rejects the all-zeros key. This public key provides no protection.
api_encryption_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="

web_server_username: "admin"
web_server_password: "example-web-password"

mqtt_host: "192.0.2.10"
mqtt_username: "example-mqtt-user"
mqtt_password: "example-mqtt-password"
