# ==============================================================================
# LOCAL DISPLAY PACKAGE
# ==============================================================================
# TFT backlight PWM/light entity, display renderer, fonts and colors.
# The restartable inactivity timer remains shared because it is called by the
# local encoder/button logic in the main assembled configuration.

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    icon: "mdi:brightness-6"
    restore_mode: ALWAYS_ON

# ==============================================================================
# ILI9488 480x320 LOCAL TFT
# ==============================================================================
# Main local user interface. It is intentionally usable without Wi-Fi and shows
# CAN-aware telemetry, per-unit communication faults, rectifier state and the
# rotary-encoder setpoints. The 500 ms refresh interval balances responsiveness
# against SPI/display workload.

display:
  - platform: mipi_spi
    model: ILI9488
    id: tft

    cs_pin: ${pin_tft_cs}
    dc_pin: ${pin_tft_dc}
    reset_pin: ${pin_tft_reset}

    # Keep the same effective memory usage as the previous
    # ili9xxx "color_palette: 8BIT" configuration.
    color_depth: 8
    buffer_size: 100%

    invert_colors: false

    # ili9xxx used 40 MHz by default.
    # mipi_spi defaults to only 10 MHz, so explicitly keep 40 MHz
    # to avoid making display refreshes significantly slower.
    data_rate: 40MHz

    # Previous hardware transform:
    #   swap_xy: true
    #   mirror_x: true
    # corresponds to a 90-degree rotation.
    dimensions:
      width: 480
      height: 320

    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

    update_interval: 500ms

    lambda: |-
      // Full-screen redraw: clear the framebuffer first so shorter new values
      // cannot leave pixels from a previous longer string behind.
      it.fill(Color::WHITE);
      it.print(
        10, 10,
        id(font_large),
        id(color_black),
        "3 Phase Battery Charger R4875G1"
      );

      it.strftime(
        10, 40,
        id(font_small),
        id(color_black),
        "%d.%m.%Y %H:%M",
        id(sntp_time).now()
      );

      // -----------------------------------------------------------------
      // AC Input - use all units with valid CAN communication
      // -----------------------------------------------------------------

      // Build the AC summary only from units that are both CAN-online and have
      // all required numeric AC telemetry values. This allows clean 3/3, 2/3 or
      // 1/3 operation when individual rectifiers disappear from the CAN bus.
      int ac_units_ok = 0;

      float ac_voltage_sum = 0.0f;
      float ac_current_sum = 0.0f;
      float ac_frequency_sum = 0.0f;
      float ac_power_sum = 0.0f;


      // Unit 1
      if (id(can_com_ok_1).state) {

        if (!isnan(id(ac_voltage_1).state) &&
            !isnan(id(ac_current_1).state) &&
            !isnan(id(ac_frequency_1).state) &&
            !isnan(id(ac_power_1).state)) {

          ac_voltage_sum += id(ac_voltage_1).state;
          ac_current_sum += id(ac_current_1).state;
          ac_frequency_sum += id(ac_frequency_1).state;
          ac_power_sum += id(ac_power_1).state;

          ac_units_ok++;
        }
      }

      // Unit 2
      if (id(can_com_ok_2).state) {

        if (!isnan(id(ac_voltage_2).state) &&
            !isnan(id(ac_current_2).state) &&
            !isnan(id(ac_frequency_2).state) &&
            !isnan(id(ac_power_2).state)) {

          ac_voltage_sum += id(ac_voltage_2).state;
          ac_current_sum += id(ac_current_2).state;
          ac_frequency_sum += id(ac_frequency_2).state;
          ac_power_sum += id(ac_power_2).state;

          ac_units_ok++;
        }
      }

      // Unit 3
      if (id(can_com_ok_3).state) {

        if (!isnan(id(ac_voltage_3).state) &&
            !isnan(id(ac_current_3).state) &&
            !isnan(id(ac_frequency_3).state) &&
            !isnan(id(ac_power_3).state)) {

          ac_voltage_sum += id(ac_voltage_3).state;
          ac_current_sum += id(ac_current_3).state;
          ac_frequency_sum += id(ac_frequency_3).state;
          ac_power_sum += id(ac_power_3).state;

          ac_units_ok++;
        }
      }

      // -----------------------------------------------------------------
      // Display AC values
      // -----------------------------------------------------------------

      if (ac_units_ok > 0) {

        float ac_voltage_avg =
            ac_voltage_sum / ac_units_ok;

        float ac_current_avg =
            ac_current_sum / ac_units_ok;

        float ac_frequency_avg =
            ac_frequency_sum / ac_units_ok;

        float ac_power_kw =
            ac_power_sum / 1000.0f;


        // Header
        it.printf(
          10, 70,
          id(font_small_bold),
          id(color_blue),
          "AC Input: %.3f kW  (%d/3)",
          ac_power_kw,
          ac_units_ok
        );


        // Details
        it.printf(
          10, 95,
          id(font_small),
          id(color_black),
          "%.1f V - %.1f A - %.1f Hz",
          ac_voltage_avg,
          ac_current_avg,
          ac_frequency_avg
        );

      } else {

        it.print(
          10, 70,
          id(font_small_bold),
          id(color_red),
          "AC Input: CAN bus communication fault!"
        );

        it.print(
          10, 95,
          id(font_small),
          id(color_red),
          "No charger unit reachable"
        );
      }
      // -----------------------------------------------------------------
      // DC Output - use only units with valid CAN communication
      // -----------------------------------------------------------------
      //
      // combined_dc_power already excludes stale values from disconnected
      // rectifiers. Count the same valid units here so the display can show
      // whether the total currently represents 1/3, 2/3 or all 3 units.
      int dc_units_ok = 0;

      if (id(can_com_ok_1).state &&
          !isnan(id(dc_power_1).state)) {
        dc_units_ok++;
      }

      if (id(can_com_ok_2).state &&
          !isnan(id(dc_power_2).state)) {
        dc_units_ok++;
      }

      if (id(can_com_ok_3).state &&
          !isnan(id(dc_power_3).state)) {
        dc_units_ok++;
      }

      // Display the CAN-aware combined DC power only when at least one
      // rectifier has valid telemetry. If no unit is available, show a
      // clear communication fault instead of formatting NAN as "nan kW".
      if (dc_units_ok > 0 &&
          !isnan(id(combined_dc_power).state)) {

        it.printf(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: %.3f kW  (%d/3)",
          id(combined_dc_power).state,
          dc_units_ok
        );

      } else {

        it.print(
          10, 125,
          id(font_small_bold),
          id(color_red),
          "DC Output: CAN bus communication fault!"
        );
      }
      // -----------------------------------------------------------------
      // Per-unit DC telemetry
      // -----------------------------------------------------------------
      //
      // CAN communication and live telemetry freshness are evaluated
      // separately. Property/discovery frames can keep a unit CAN-online
      // while individual live telemetry sensors have already timed out.
      //
      // Never format non-numeric sensor states because printf() would render
      // them as "nan" on the TFT.

      const bool unit_1_telemetry_ok =
          !isnan(id(dc_voltage_1).state) &&
          !isnan(id(dc_current_1).state) &&
          !isnan(id(dc_power_1).state) &&
          !isnan(id(input_temperature_1).state) &&
          !isnan(id(output_temperature_1).state);

      const bool unit_2_telemetry_ok =
          !isnan(id(dc_voltage_2).state) &&
          !isnan(id(dc_current_2).state) &&
          !isnan(id(dc_power_2).state) &&
          !isnan(id(input_temperature_2).state) &&
          !isnan(id(output_temperature_2).state);

      const bool unit_3_telemetry_ok =
          !isnan(id(dc_voltage_3).state) &&
          !isnan(id(dc_current_3).state) &&
          !isnan(id(dc_power_3).state) &&
          !isnan(id(input_temperature_3).state) &&
          !isnan(id(output_temperature_3).state);

      // Unit 1
      if (!id(can_com_ok_1).state) {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: CAN bus communication fault!"
        );

      } else if (!unit_1_telemetry_ok) {
        it.print(
          10, 150,
          id(font_small_bold),
          id(color_red),
          "L1: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 150,
          id(font_small),
          id(color_black),
          "L1: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_1).state,
          id(dc_current_1).state,
          id(dc_power_1).state,
          id(input_temperature_1).state,
          id(output_temperature_1).state
        );
      }

      // Unit 2
      if (!id(can_com_ok_2).state) {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: CAN bus communication fault!"
        );

      } else if (!unit_2_telemetry_ok) {
        it.print(
          10, 170,
          id(font_small_bold),
          id(color_red),
          "L2: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 170,
          id(font_small),
          id(color_black),
          "L2: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_2).state,
          id(dc_current_2).state,
          id(dc_power_2).state,
          id(input_temperature_2).state,
          id(output_temperature_2).state
        );
      }

      // Unit 3
      if (!id(can_com_ok_3).state) {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: CAN bus communication fault!"
        );

      } else if (!unit_3_telemetry_ok) {
        it.print(
          10, 190,
          id(font_small_bold),
          id(color_red),
          "L3: Telemetry incomplete!"
        );

      } else {
        it.printf(
          10, 190,
          id(font_small),
          id(color_black),
          "L3: %.2f V - %.1f A - %.0f W - %.1f °C / %.1f °C",
          id(dc_voltage_3).state,
          id(dc_current_3).state,
          id(dc_power_3).state,
          id(input_temperature_3).state,
          id(output_temperature_3).state
        );
      }
      // -----------------------------------------------------------------
      // Local / Blackstart setpoints
      // -----------------------------------------------------------------
      it.print(
        10, 220,
        id(font_small_bold),
        id(color_green),
        "Setpoints:"
      );

      // Actual rectifier status
      // Count actual ON states reported by the units. This value is also useful
      // to show partial operation such as 1/3 or 2/3 units running.
      int rectifiers_on = 0;

      if (id(can_com_ok_1).state &&
          id(power_state_1).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_2).state &&
          id(power_state_2).state == "ON") {
        rectifiers_on++;
      }

      if (id(can_com_ok_3).state &&
          id(power_state_3).state == "ON") {
        rectifiers_on++;
      }

      if (rectifiers_on == 3) {

        it.print(
          375, 220,
          id(font_small_bold),
          id(color_green),
          "3/3 ON"
        );

      } else if (rectifiers_on == 0) {

        it.print(
          410, 220,
          id(font_small_bold),
          id(color_red),
          "OFF"
        );

      } else {

        it.printf(
          375, 220,
          id(font_small_bold),
          id(color_blue),
          "%d/3 ON",
          rectifiers_on
        );
      }

      // -----------------------------------------------------------------
      // Encoder selection
      // -----------------------------------------------------------------

      // The active encoder-edit field is rendered bold/blue; the inactive field
      // remains visible in normal black text for context.
      if (id(encoder_mode) == 0) {

        // Voltage selected
        it.printf(
          10, 245,
          id(font_small_bold),
          id(color_blue),
          "> DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small),
          id(color_black),
          "  DC Target(3U): %.2f kW - %.1f A/u",
          id(set_dc_sum_power).state,
          id(set_dc_current_limit).state
        );

      } else {

        // Sum power selected
        it.printf(
          10, 245,
          id(font_small),
          id(color_black),
          "  DC Voltage: %.1f V",
          id(set_dc_voltage_limit).state
        );

        it.printf(
          10, 270,
          id(font_small_bold),
          id(color_blue),
          "> DC Target(3U): %.2f kW - %.1f A/u",
          id(set_dc_sum_power).state,
          id(set_dc_current_limit).state
        );
      }
      // Footer diagnostics are controller-side values and remain useful even if
      // every rectifier is offline.
      it.printf(10, 300, id(font_footer), id(color_black), "IP: %s", id(ip_address).state.c_str());
      it.printf(200, 300, id(font_footer), id(color_black), "CPU Temp: %.1f °C", id(cpu_temp).state);
      it.printf(390, 300, id(font_footer), id(color_black), "WiFi: %.1f dBm", id(wifi_sig).state);

# ==============================================================================
# GLOBAL RUNTIME STATE
# ==============================================================================
# Non-entity state used by protocol decoding, discovery, watchdog timing and
# local UI logic. None of these variables independently transmit CAN frames.

font:
  - file:
      type: gfonts
      family: Roboto
    # 12 px footer font for IP address, CPU temperature and Wi-Fi RSSI.
    id: font_footer
    size: 12
    glyphs: "äöüÄÖÜßabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!§$%&=?<> .,:-_/()°µ@€²³"

  - file:
      type: gfonts
      family: Roboto
    # 20 px normal UI font for telemetry and labels.
    id: font_small
    size: 20
    glyphs: "äöüÄÖÜßabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!§$%&=?<> .,:-_/()°µ@€²³"

  - file:
      type: gfonts
      family: Roboto
      weight: bold
    # 20 px bold UI font for headings, selected values and fault messages.
    id: font_small_bold
    size: 20
    glyphs: "äöüÄÖÜßabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!§$%&=?<> .,:-_/()°µ@€²³"

  - file:
      type: gfonts
      family: Roboto
    # 28 px title font.
    id: font_large
    size: 28
    glyphs: "äöüÄÖÜßabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!§$%&=?<> .,:-_/()°µ@€²³"

# ==============================================================================
# DISPLAY COLORS
# ==============================================================================
# Named colors used by the TFT lambda for normal text, warnings, healthy state
# and the currently selected encoder parameter.

color:
  # Normal text on the white background.
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
  # Faults/warnings and DC-output emphasis.
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  # Healthy/running state and the setpoint-section heading.
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  # AC emphasis, partial-state information and active encoder selection.
  - id: color_blue
    red: 0%
    green: 0%
    blue: 100%

output:
  # TFT backlight PWM.
  - platform: ledc
    pin: ${pin_tft_backlight}
    id: backlight_pwm
