# ==============================================================================
# V6 CHARGER CONTROLLER DISPLAY PACKAGE AGGREGATOR
# ==============================================================================
#
# Composes the complete shared V6 HMI presentation used by the Charger
# Controller. Target-specific state acquisition and command execution remain
# outside the display packages behind the shared UI-model and command boundaries.
# ==============================================================================

packages:

  # ---------------------------------------------------------------------------
  # SHARED PRESENTATION
  # ---------------------------------------------------------------------------

  display_shared_hmi: !include display/shared-hmi.yaml
  display_shared_dashboard: !include display/shared-dashboard.yaml
  display_shared_rectifiers: !include display/shared-rectifiers.yaml
  display_shared_battery: !include display/shared-battery.yaml
  display_shared_cooling: !include display/shared-cooling.yaml
  display_shared_system: !include display/shared-system.yaml
  display_shared_trends: !include display/shared-trends.yaml
  display_shared_navigation: !include display/shared-navigation.yaml
