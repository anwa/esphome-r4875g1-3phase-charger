# ==============================================================================
# V5 DISPLAY PACKAGE AGGREGATOR
# ==============================================================================
# The v5 display implementation is split into focused packages:
#
#   hardware.yaml  - RGB panel and LVGL runtime configuration
#   theme.yaml     - shared visual styles
#   ui.yaml        - pages, persistent header and navigation
#
# Page-specific UI definitions live below display/pages/.

packages:
  display_hardware: !include display/hardware.yaml
  display_theme: !include display/theme.yaml
  display_ui: !include display/ui.yaml
  display_trends: !include display/trends.yaml
  display_rectifier_detail: !include display/rectifier-detail.yaml
  display_battery: !include display/battery.yaml