# ==============================================================================
# LOCAL DISPLAY PACKAGE AGGREGATOR
# ==============================================================================
# v4 display implementation. The LVGL UI is deliberately split into three
# focused packages so hardware transport, visual styling and screen logic can
# evolve independently.
#
# Portrait (0 deg) is the default. Set display_rotation to 90 in the main YAML
# substitutions to use the same widget tree in landscape mode.

substitutions:
  display_rotation: "0"
  firmware_version: "4.0.0"

packages:
  display_hardware: !include packages/display/hardware.yaml
  display_theme: !include packages/display/theme.yaml
  display_ui: !include packages/display/ui.yaml
