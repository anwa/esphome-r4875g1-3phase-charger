# ==============================================================================
# V6 CHARGER CONTROLLER DISPLAY PACKAGE AGGREGATOR
# ==============================================================================
#
# Composes the shared Dashboard and Rectifiers presentation together with the
# remaining display components that exist only on the Charger Controller.
# ==============================================================================

packages:

  # ---------------------------------------------------------------------------
  # SHARED PRESENTATION
  # ---------------------------------------------------------------------------

  display_shared_hmi: !include display/shared-hmi.yaml
  display_shared_dashboard: !include display/shared-dashboard.yaml
  display_shared_rectifiers: !include display/shared-rectifiers.yaml

  # ---------------------------------------------------------------------------
  # CHARGER CONTROLLER PRESENTATION
  # ---------------------------------------------------------------------------

  display_ui: !include display/ui.yaml

  # ---------------------------------------------------------------------------
  # CHARGER CONTROLLER GLOBAL RUNTIMES
  # ---------------------------------------------------------------------------

  display_controller_battery: !include display/controller-battery.yaml

  # ---------------------------------------------------------------------------
  # CHARGER CONTROLLER PAGE RUNTIMES
  # ---------------------------------------------------------------------------

  display_battery: !include display/battery.yaml
  display_cooling: !include display/cooling.yaml
  display_system: !include display/system.yaml
  display_trends: !include display/trends.yaml
