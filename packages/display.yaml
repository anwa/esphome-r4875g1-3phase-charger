# ==============================================================================
# V5 LVGL DISPLAY BRING-UP
# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7
# 800x480 RGB display
#
# This stage verifies the complete input/output chain:
#
#   GT911 -> ESPHome touchscreen -> LVGL -> RGB display
#
# Charger UI pages are intentionally not included yet.

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: charger_display

    auto_clear_enabled: false
    update_interval: never


# ==============================================================================
# LVGL
# ==============================================================================

lvgl:
  displays:
    - charger_display

  touchscreens:
    - touchscreen_id: charger_touchscreen

  buffer_size: 100%
  color_depth: 16
  log_level: WARN

  pages:
    - id: page_touch_test
      bg_color: 0x101418

      widgets:

        # ----------------------------------------------------------------------
        # Header
        # ----------------------------------------------------------------------
        - label:
            x: 0
            y: 30
            width: 800
            text_align: CENTER
            text: "R4875G1 CHARGER v5"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            x: 0
            y: 78
            width: 800
            text_align: CENTER
            text: "LVGL + GT911 TOUCH TEST"
            text_font: montserrat_24
            text_color: 0xA0A8B0


        # ----------------------------------------------------------------------
        # Touch buttons
        # ----------------------------------------------------------------------
        - button:
            id: touch_test_left
            x: 55
            y: 155
            width: 210
            height: 150

            widgets:
              - label:
                  align: CENTER
                  text: "LEFT"
                  text_font: montserrat_28

            on_press:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "LEFT pressed"

            on_release:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "Touch ready"


        - button:
            id: touch_test_center
            x: 295
            y: 155
            width: 210
            height: 150

            widgets:
              - label:
                  align: CENTER
                  text: "CENTER"
                  text_font: montserrat_28

            on_press:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "CENTER pressed"

            on_release:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "Touch ready"


        - button:
            id: touch_test_right
            x: 535
            y: 155
            width: 210
            height: 150

            widgets:
              - label:
                  align: CENTER
                  text: "RIGHT"
                  text_font: montserrat_28

            on_press:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "RIGHT pressed"

            on_release:
              - lvgl.label.update:
                  id: touch_test_status
                  text: "Touch ready"


        # ----------------------------------------------------------------------
        # Status
        # ----------------------------------------------------------------------
        - obj:
            x: 155
            y: 350
            width: 490
            height: 80
            radius: 12
            bg_color: 0x202830
            border_width: 1
            border_color: 0x505860

            widgets:
              - label:
                  id: touch_test_status
                  align: CENTER
                  text: "Touch ready"
                  text_font: montserrat_24
                  text_color: 0xFFFFFF