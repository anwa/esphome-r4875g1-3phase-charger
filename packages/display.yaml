# ==============================================================================
# V5 DISPLAY PACKAGE AGGREGATOR
# ==============================================================================
#
# Collects the complete LVGL display implementation.
#
# Core display packages:
#   hardware.yaml       -> RGB panel and LVGL runtime configuration
#   theme.yaml          -> shared visual styles
#   ui.yaml             -> pages, navigation, dialogs and persistent widgets
#   header.yaml         -> persistent header runtime
#   command-state.yaml  -> global START/STOP pending-state handling
#
# Page layouts:
#   display/pages/*.yaml
#
# Page-specific runtimes:
#   dashboard.yaml
#   rectifiers.yaml
#   rectifier-detail.yaml
#   cooling.yaml
#   system.yaml
#   trends.yaml
#
# Battery display updates are handled independently by battery.yaml.
# ==============================================================================

packages:
  # ---------------------------------------------------------------------------
  # Core display infrastructure
  # ---------------------------------------------------------------------------
  display_hardware: !include display/hardware.yaml
  display_theme: !include display/theme.yaml
  display_ui: !include display/ui.yaml

  # ---------------------------------------------------------------------------
  # Persistent/global runtimes
  # ---------------------------------------------------------------------------
  display_header: !include display/header.yaml
  display_command_state: !include display/command-state.yaml
  display_battery: !include display/battery.yaml

  # ---------------------------------------------------------------------------
  # Page-specific runtimes
  # ---------------------------------------------------------------------------
  display_dashboard: !include display/dashboard.yaml
  display_rectifiers: !include display/rectifiers.yaml
  display_rectifier_detail: !include display/rectifier-detail.yaml
  display_cooling: !include display/cooling.yaml
  display_system: !include display/system.yaml
  display_trends: !include display/trends.yaml
