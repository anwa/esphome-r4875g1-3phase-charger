# ==============================================================================
# V5 DISPLAY BRING-UP
# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7
# 800x480 RGB565
#
# This first v5 display stage deliberately uses the native ESPHome display
# component only. LVGL and touch input will be added after basic panel operation
# has been verified on real hardware.

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: charger_display

    update_interval: 1s
    auto_clear_enabled: true

    lambda: |-
      it.fill(Color(0, 0, 0));

      it.printf(
        400,
        190,
        id(display_font_large),
        Color(255, 255, 255),
        TextAlign::CENTER,
        "R4875G1 CHARGER"
      );

      it.printf(
        400,
        245,
        id(display_font_medium),
        Color(0, 200, 0),
        TextAlign::CENTER,
        "v%s",
        "${firmware_version}"
      );

      it.printf(
        400,
        295,
        id(display_font_medium),
        Color(255, 255, 255),
        TextAlign::CENTER,
        "800 x 480 RGB DISPLAY OK"
      );

      it.printf(
        20,
        20,
        id(display_font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_LEFT,
        "0,0"
      );

      it.printf(
        780,
        20,
        id(display_font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_RIGHT,
        "800,0"
      );

      it.printf(
        20,
        460,
        id(display_font_medium),
        Color(255, 255, 255),
        TextAlign::BOTTOM_LEFT,
        "0,480"
      );

      it.printf(
        780,
        460,
        id(display_font_medium),
        Color(255, 255, 255),
        TextAlign::BOTTOM_RIGHT,
        "800,480"
      );

font:
  - file: "gfonts://Roboto"
    id: display_font_large
    size: 38

  - file: "gfonts://Roboto"
    id: display_font_medium
    size: 24