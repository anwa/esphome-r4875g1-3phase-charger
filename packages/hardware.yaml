# ==============================================================================
# V5 HARDWARE BUS PACKAGE
# ==============================================================================

i2c:
  - id: i2c_bus
    sda: ${pin_i2c_sda}
    scl: ${pin_i2c_scl}
    scan: true
    frequency: 400kHz

# ==============================================================================
# EXTERNAL I2C MULTIPLEXER
# ==============================================================================
# TCA9548A on the shared onboard I2C bus.
#
# Channel allocation:
#   CH0 -> MCP23017 external I/O expander
#   CH1 -> AHT10 rectifier compartment temperature/humidity
#
# Remaining channels are reserved for future external I2C devices.

tca9548a:
  - id: external_i2c_mux
    i2c_id: i2c_bus
    address: 0x70

    channels:
      - bus_id: external_i2c_ch0
        channel: 0

      - bus_id: external_i2c_ch1
        channel: 1


# ==============================================================================
# EXTERNAL I/O EXPANDER
# ==============================================================================
# MCP23017 on TCA9548A channel 0.
#
# Planned allocation:
#   GPA0 / pin 0 -> rotary encoder A
#   GPA1 / pin 1 -> rotary encoder B
#   GPA2 / pin 2 -> rotary encoder button
#
# GPIO6 is used for controller battery voltage measurement via J8 AD.
# MCP23017 interrupt operation is therefore not used.

mcp23017:
  - id: external_io_expander
    i2c_id: external_i2c_ch0
    address: 0x20

# ==============================================================================
# BACKUP ROTARY ENCODER INPUTS
# ==============================================================================
# Mechanical rotary encoder connected to the MCP23017 on TCA9548A channel 0.
#
# Pin allocation:
#   GPA0 / pin 0 -> Encoder A
#   GPA1 / pin 1 -> Encoder B
#   GPA2 / pin 2 -> Encoder push button
#
# All inputs use the MCP23017 internal pull-ups. The mechanical encoder
# therefore switches the inputs to GND.
#
# GPIO6 is dedicated to controller battery voltage measurement.
# Encoder decoding and button actions will be implemented separately.

binary_sensor:
  - platform: gpio
    id: backup_encoder_a
    internal: true

    pin:
      mcp23xxx: external_io_expander
      number: 0
      mode:
        input: true
        pullup: true
      inverted: true


  - platform: gpio
    id: backup_encoder_b
    internal: true

    pin:
      mcp23xxx: external_io_expander
      number: 1
      mode:
        input: true
        pullup: true
      inverted: true


  - platform: gpio
    id: backup_encoder_button
    internal: true

    pin:
      mcp23xxx: external_io_expander
      number: 2
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 20ms

# ==============================================================================
# CONTROLLER BATTERY VOLTAGE
# ==============================================================================
#
# A 1S lithium battery is connected to J3.
#
# The Waveshare board already provides a battery-voltage divider:
#
#   VBAT -> 200 kΩ -> TP1 -> 100 kΩ -> GND
#
# TP1 is wired externally to:
#
#   J8 pin 3 / AD -> GPIO6
#
# Divider ratio:
#
#   VADC = VBAT * 100 / (200 + 100)
#        = VBAT / 3
#
# Therefore the ADC result is multiplied by 3.0 to recover the actual
# battery voltage.
#
# No SOC calculation is performed here. Battery voltage will first be
# calibrated against a multimeter measurement.

sensor:
  - platform: adc
    pin: ${pin_battery_adc}
    id: controller_battery_voltage
    name: "Controller Battery Voltage"

    attenuation: 6db
    update_interval: 5s

    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    icon: "mdi:battery"

    filters:
      # Restore the actual battery voltage from the onboard 1:3 divider.
      - multiply: 3.0

      # Smooth ADC noise while still reacting quickly enough for a battery
      # monitor. Five 5-second samples represent a 25-second window.
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # ---------------------------------------------------------------------------
  # Controller Battery State of Charge
  # ---------------------------------------------------------------------------
  #
  # Voltage-based estimate for the onboard 1S lithium backup battery.
  #
  # This is intentionally only an estimate. A lithium cell has a nonlinear
  # voltage/SOC relationship and its terminal voltage also depends on charge
  # current, load and relaxation time.
  #
  # The piecewise curve is therefore intended for useful local monitoring,
  # not precision coulomb counting.

  - platform: template
    id: controller_battery_soc
    name: "Controller Battery State of Charge"

    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    icon: "mdi:battery"

    update_interval: 5s

    lambda: |-
      const float v =
        id(controller_battery_voltage).state;

      if (isnan(v))
        return NAN;

      // Approximate resting-voltage curve for a 1S Li-ion cell.
      //
      // Voltage   SOC
      // 4.20 V    100 %
      // 4.10 V     90 %
      // 4.00 V     80 %
      // 3.90 V     65 %
      // 3.80 V     45 %
      // 3.70 V     25 %
      // 3.60 V     10 %
      // 3.50 V      5 %
      // 3.30 V      0 %

      struct Point {
        float voltage;
        float soc;
      };

      static const Point curve[] = {
        {3.30f,   0.0f},
        {3.50f,   5.0f},
        {3.60f,  10.0f},
        {3.70f,  25.0f},
        {3.80f,  45.0f},
        {3.90f,  65.0f},
        {4.00f,  80.0f},
        {4.10f,  90.0f},
        {4.20f, 100.0f}
      };

      if (v <= curve[0].voltage)
        return 0.0f;

      const size_t count =
        sizeof(curve) / sizeof(curve[0]);

      if (v >= curve[count - 1].voltage)
        return 100.0f;

      for (size_t i = 1; i < count; i++) {
        if (v <= curve[i].voltage) {

          const float v0 =
            curve[i - 1].voltage;

          const float v1 =
            curve[i].voltage;

          const float s0 =
            curve[i - 1].soc;

          const float s1 =
            curve[i].soc;

          return s0 +
            (v - v0) *
            (s1 - s0) /
            (v1 - v0);
        }
      }

      return NAN;

# ==============================================================================
# INTERNAL I/O EXPANDER
# ==============================================================================

ch422g:
  - id: io_expander
    i2c_id: i2c_bus

# ==============================================================================
# GT911 TOUCH CONTROLLER
# ==============================================================================
# Onboard capacitive touchscreen.
#
# Wiring:
#   SDA   -> GPIO8
#   SCL   -> GPIO9
#   IRQ   -> GPIO4
#   RESET -> CH422G EXIO1

touchscreen:
  - platform: gt911
    id: charger_touchscreen
    i2c_id: i2c_bus

    interrupt_pin:
      number: ${pin_touch_irq}
      mode:
        input: true

    reset_pin:
      ch422g: io_expander
      number: 1
      mode:
        output: true

    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d"
          args:
            - touch.x
            - touch.y
          level: INFO

switch:
  - platform: gpio
    id: can_mode_select
    internal: true
    restore_mode: ALWAYS_ON

    pin:
      ch422g: io_expander
      number: 5
      mode:
        output: true

canbus:
  - platform: esp32_can
    id: charger_can
    tx_pin: ${pin_can_tx}
    rx_pin: ${pin_can_rx}
    bit_rate: 125kbps
    can_id: 0xE5F32E5
    use_extended_id: true
    rx_queue_len: ${can_rx_queue_len}
