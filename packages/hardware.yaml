# ==============================================================================
# V5 HARDWARE BUS PACKAGE
# ==============================================================================

i2c:
  - id: i2c_bus
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  - id: io_expander
    i2c_id: i2c_bus

# ==============================================================================
# GT911 TOUCH CONTROLLER
# ==============================================================================
# Onboard capacitive touchscreen.
#
# Wiring:
#   SDA   -> GPIO8
#   SCL   -> GPIO9
#   IRQ   -> GPIO4
#   RESET -> CH422G EXIO1

touchscreen:
  - platform: gt911
    id: charger_touchscreen
    i2c_id: i2c_bus

    interrupt_pin:
      number: GPIO4
      mode:
        input: true

    reset_pin:
      ch422g: io_expander
      number: 1
      mode:
        output: true

    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d"
          args:
            - touch.x
            - touch.y
          level: INFO

switch:
  - platform: gpio
    id: can_mode_select
    internal: true
    restore_mode: ALWAYS_ON

    pin:
      ch422g: io_expander
      number: 5
      mode:
        output: true

canbus:
  - platform: esp32_can
    id: charger_can

    tx_pin: GPIO20
    rx_pin: GPIO19
    bit_rate: 125kbps

    can_id: 0x00000001
    use_extended_id: true
