# ==============================================================================
# EXTERNAL COOLING-FAN PACKAGE
# ==============================================================================
#
# Controls the three external chassis fans surrounding the rectifier assembly.
#
# These external fans are independent of the internal Huawei rectifier fans,
# whose speed, target duty and minimum duty are handled through CAN.
#
# Hardware:
#   - MCP23017 GPA3 controls the common fan-supply enable
#   - MCP23017 GPA4 monitors Cooling Fan 1 tachometer
#   - MCP23017 GPA5 monitors Cooling Fan 2 tachometer
#   - EMC2101 provides the common four-pin fan PWM signal
#   - EMC2101 monitors Cooling Fan 3 tachometer
#
# Cooling Fan 3 ventilates the rear rectifier compartment monitored by AHT10.
#
# Supported operation:
#   - common switched fan supply
#   - hardware-generated approximately 25.7 kHz PWM
#   - three independent tachometer signals
#   - automatic compartment-temperature control
#   - manual override when automatic mode is disabled
# ==============================================================================

# ==============================================================================
# EMC2101 FAN CONTROLLER
# ==============================================================================
#
# The EMC2101 is connected through TCA9548A channel 2.
#
# It provides the common PWM signal for all connected four-pin chassis fans.
# Its dedicated tachometer input monitors Cooling Fan 3, which ventilates the
# rear rectifier compartment monitored by the AHT10.
#
# PWM configuration:
#   360 kHz / (2 × 7 × 1) ≈ 25.7 kHz
# ==============================================================================

emc2101:
  id: cooling_fan_controller
  i2c_id: external_i2c_ch2
  address: 0x4C
  inverted: false

  pwm:
    resolution: ${cooling_fan_pwm_resolution}
    divider: ${cooling_fan_pwm_divider}


# ==============================================================================
# PWM OUTPUT
# ==============================================================================

output:
  - platform: emc2101
    id: cooling_fan_pwm_output

# ==============================================================================
# AUTOMATIC CONTROL STATE
# ==============================================================================

globals:
  # Automatic cooling stage:
  #   0 = OFF
  #   1 = 35 %
  #   2 = 45 %
  #   3 = 60 %
  #   4 = 80 %
  #   5 = 100 %
  - id: cooling_fan_auto_stage
    type: int
    restore_value: no
    initial_value: '0'

  # Pulse counters for the two tachometer signals connected through the
  # MCP23017. Each logical rising edge represents one tachometer pulse.
  - id: cooling_fan_1_tach_pulses
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: cooling_fan_2_tach_pulses
    type: uint32_t
    restore_value: false
    initial_value: "0"

# ==============================================================================
# FAN CONTROL SWITCHES
# ==============================================================================

switch:
  # Common external fan-supply enable. Three-pin fans are controlled only by
  # this power switch; they do not use the PWM command below.
  - platform: gpio
    name: "Cooling Fan Power"
    id: cooling_fan_enable
    icon: "mdi:fan"
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: external_io_expander
      number: ${mcp_fan_enable_pin}
      mode:
        output: true
      inverted: false

  # Automatic compartment-temperature control. Disable this switch to regain
  # direct manual control of Cooling Fan Power and Cooling Fan PWM.
  - platform: template
    name: "Cooling Fan Automatic"
    id: cooling_fan_auto
    icon: "mdi:fan-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - script.execute: apply_cooling_fan_automatic

# ==============================================================================
# MCP23017 FAN TACHOMETER INPUTS
# ==============================================================================
#
# Cooling Fans 1 and 2 provide independent tachometer signals through the
# MCP23017. The inputs use pull-ups and are inverted so each active-low
# tachometer pulse generates one logical press event.
#
# The pulse events are accumulated and converted to RPM by the template sensors
# below.
# ==============================================================================

binary_sensor:
  - platform: gpio
    id: cooling_fan_1_tach
    internal: true

    pin:
      mcp23xxx: external_io_expander
      number: ${mcp_fan1_tach_pin}
      mode:
        input: true
        pullup: true
      inverted: true

    on_press:
      then:
        - lambda: |-
            id(cooling_fan_1_tach_pulses)++;


  - platform: gpio
    id: cooling_fan_2_tach
    internal: true

    pin:
      mcp23xxx: external_io_expander
      number: ${mcp_fan2_tach_pin}
      mode:
        input: true
        pullup: true
      inverted: true

    on_press:
      then:
        - lambda: |-
            id(cooling_fan_2_tach_pulses)++;

# ==============================================================================
# FAN TACHOMETERS
# ==============================================================================

sensor:
  # ---------------------------------------------------------------------------
  # COOLING FAN 1 RPM
  # ---------------------------------------------------------------------------
  #
  # Fan 1 tachometer pulses are counted through MCP23017 GPA4.
  # ---------------------------------------------------------------------------

  - platform: template
    name: "Cooling Fan 1 RPM"
    id: cooling_fan_1_rpm
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: 5s
    icon: "mdi:fan"

    lambda: |-
      const uint32_t pulses =
        id(cooling_fan_1_tach_pulses);

      id(cooling_fan_1_tach_pulses) = 0;

      return
        static_cast<float>(pulses) *
        (60.0f / 5.0f) /
        ${cooling_fan_tach_pulses_per_revolution}f;


  # ---------------------------------------------------------------------------
  # COOLING FAN 2 RPM
  # ---------------------------------------------------------------------------
  #
  # Fan 2 tachometer pulses are counted through MCP23017 GPA5.
  # ---------------------------------------------------------------------------

  - platform: template
    name: "Cooling Fan 2 RPM"
    id: cooling_fan_2_rpm
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: 5s
    icon: "mdi:fan"

    lambda: |-
      const uint32_t pulses =
        id(cooling_fan_2_tach_pulses);

      id(cooling_fan_2_tach_pulses) = 0;

      return
        static_cast<float>(pulses) *
        (60.0f / 5.0f) /
        ${cooling_fan_tach_pulses_per_revolution}f;


  # ---------------------------------------------------------------------------
  # COOLING FAN 3 RPM
  # ---------------------------------------------------------------------------
  #
  # Fan 3 ventilates the rear rectifier compartment and uses the dedicated
  # EMC2101 tachometer input.
  # ---------------------------------------------------------------------------

  - platform: emc2101
    speed:
      name: "Cooling Fan 3 RPM"
      id: cooling_fan_3_rpm
      unit_of_measurement: "RPM"
      accuracy_decimals: 0
      icon: "mdi:fan"

    update_interval: 5s

# ==============================================================================
# PWM COMMAND
# ==============================================================================

number:
  # Manual PWM command and the visible commanded PWM value. While automatic
  # mode is enabled, the controller updates this value from the temperature
  # curve. Disable Cooling Fan Automatic to use it as a manual override.
  - platform: template
    name: "Cooling Fan PWM"
    id: cooling_fan_pwm_percent
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: ${cooling_fan_default_pwm_percent}
    mode: SLIDER
    icon: "mdi:fan-speed-3"
    on_value:
      then:
        - lambda: |-
            const float duty = std::max(0.0f, std::min(100.0f, x));
            id(cooling_fan_pwm_output).set_level(duty / 100.0f);

# ==============================================================================
# AUTOMATIC TEMPERATURE CONTROL
# ==============================================================================

script:
  # Temperature curve with 2 C hysteresis on downward transitions:
  #   <30 C   -> OFF / 0%
  #   30 C    -> 35%
  #   35 C    -> 45%
  #   40 C    -> 60%
  #   45 C    -> 80%
  #   >=50 C  -> 100%
  # A missing/invalid compartment temperature is fail-safe: power ON / 100%.
  - id: apply_cooling_fan_automatic
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: cooling_fan_auto
          then:
            - lambda: |-
                const float t = id(rectifier_compartment_temperature).state;
                int stage = id(cooling_fan_auto_stage);

                if (isnan(t)) {
                  stage = 5;
                  ESP_LOGW("cooling", "Compartment temperature unavailable; forcing external fans to 100%%.");
                } else if (t >= 50.0f) {
                  stage = 5;
                } else if (t >= 45.0f) {
                  stage = (stage >= 5 && t >= 48.0f) ? 5 : 4;
                } else if (t >= 40.0f) {
                  stage = (stage >= 4 && t >= 43.0f) ? 4 : 3;
                } else if (t >= 35.0f) {
                  stage = (stage >= 3 && t >= 38.0f) ? 3 : 2;
                } else if (t >= 30.0f) {
                  stage = (stage >= 2 && t >= 33.0f) ? 2 : 1;
                } else {
                  stage = (stage >= 1 && t >= 28.0f) ? 1 : 0;
                }

                id(cooling_fan_auto_stage) = stage;

                static const float duty_by_stage[] = {0.0f, 35.0f, 45.0f, 60.0f, 80.0f, 100.0f};
                const float duty = duty_by_stage[stage];

                if (stage == 0) {
                  id(cooling_fan_enable).turn_off();
                } else {
                  id(cooling_fan_enable).turn_on();
                }

                if (fabsf(id(cooling_fan_pwm_percent).state - duty) > 0.5f) {
                  auto call = id(cooling_fan_pwm_percent).make_call();
                  call.set_value(duty);
                  call.perform();
                }

# ==============================================================================
# PERIODIC AUTOMATIC CONTROL
# ==============================================================================

interval:
  - interval: 5s
    then:
      - script.execute: apply_cooling_fan_automatic
