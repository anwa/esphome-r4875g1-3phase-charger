# ==============================================================================
# CORE PLATFORM AND NETWORK PACKAGE
# ==============================================================================
#
# Defines the ESP32-S3 platform, memory configuration and all controller-wide
# network services.
#
# Core charger operation is intentionally independent of Wi-Fi, MQTT and
# Home Assistant so the controller remains usable during offline blackstart.
# ==============================================================================

esp32:
  variant: esp32s3

  flash_size: 16MB
  flash_mode: qio
  flash_frequency: 80MHz
  cpu_frequency: 240MHz

  toolchain: esp-idf

  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true

# ==============================================================================
# EXTERNAL PSRAM
# ==============================================================================
#
# Enables the ESP32-S3 N16R8 module's 8 MB Octal PSRAM at 80 MHz.
#
# LVGL framebuffer allocations and other large runtime buffers may use this
# external memory.
# ==============================================================================

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# ==============================================================================
# LOGGING
# ==============================================================================
#
# Debug logging is enabled for charger diagnostics, CAN troubleshooting and
# controller runtime analysis.
# ==============================================================================

logger:
  level: DEBUG

# ==============================================================================
# LOCAL ESPHOME WEB SERVER
# ==============================================================================
#
# Provides direct browser access to charger entities and controls whenever
# local IP networking is available.
#
# All web assets are stored locally so the interface does not depend on
# internet access.
# ==============================================================================

web_server:
  version: 3
  port: 80

  # Keep all web UI assets on the ESP32 so the interface remains usable
  # without internet access, including during blackstart scenarios.
  local: true

  # Internal helper entities are implementation details and should not be
  # exposed through the browser UI.
  include_internal: false

  # Protect browser access to charger controls and diagnostics.
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest

  # Native ESPHome OTA is already configured separately. Do not expose
  # firmware upload through the normal web interface.
  ota: false

# ==============================================================================
# HOME ASSISTANT NATIVE API
# ==============================================================================
#
# Provides the encrypted native ESPHome integration for Home Assistant.
#
# reboot_timeout is deliberately disabled because loss of Home Assistant must
# never restart or disable an otherwise operational charger.
# ==============================================================================

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ==============================================================================
# OVER-THE-AIR FIRMWARE UPDATE
# ==============================================================================
#
# Enables authenticated ESPHome OTA updates after the initial USB installation.
# ==============================================================================

ota:
  - platform: esphome

# ==============================================================================
# WI-FI
# ==============================================================================
#
# Wi-Fi credentials are provided through secrets.yaml.
#
# Power saving and automatic reboot on connection loss are disabled to keep
# controller networking responsive without making charger operation dependent
# on infrastructure Wi-Fi.
# ==============================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # The device is permanently powered: disable Wi-Fi power saving for maximum link stability.
  power_save_mode: none

  # Allow Wi-Fi buffers/allocations to use the available 8 MB PSRAM.
  use_psram: true
  reboot_timeout: 0s

  ap:
    ssid: Charger Fallback Hotspot
    password: !secret fallback_ap_password

# ==============================================================================
# FALLBACK CAPTIVE PORTAL
# ==============================================================================
#
# Works with the fallback access point above if the configured infrastructure
# Wi-Fi cannot be reached.
# ==============================================================================

captive_portal:

# ==============================================================================
# TIME SYNCHRONIZATION
# ==============================================================================
#
# SNTP provides Europe/Berlin local time for the persistent display header and
# any time-dependent controller functions.
#
# Header rendering is handled separately by display/header.yaml.
# ==============================================================================

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - 2.de.pool.ntp.org

    on_time_sync:
      then:
        - lambda: |-
            auto now = id(sntp_time).now();

            ESP_LOGI(
              "time",
              "SNTP synchronized: %02d.%02d.%04d %02d:%02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute,
              now.second
            );

# ==============================================================================
# ESPHOME DEBUG METRICS
# ==============================================================================
#
# Enables internal runtime diagnostics including heap usage, maximum free block,
# loop time, PSRAM availability and CPU frequency.
# ==============================================================================

debug:
  update_interval: 5s

# ==============================================================================
# MQTT CLIENT
# ==============================================================================
#
# Provides additional command and state transport alongside the native ESPHome
# API.
#
# MQTT discovery is disabled because Home Assistant uses the native ESPHome API
# as the canonical integration. Broker availability must never affect local
# charger operation.
# ==============================================================================

mqtt:
  id: mqtt_client
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password

  # Home Assistant uses the native ESPHome API as the canonical integration.
  # Keep MQTT available for external command/state transport without creating
  # duplicate MQTT-discovered entities in Home Assistant.
  discovery: false
  discover_ip: true

  # MQTT availability must never affect local charger operation.
  reboot_timeout: 0s
