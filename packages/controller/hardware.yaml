# ==============================================================================
# CHARGER CONTROLLER HARDWARE
# ==============================================================================
#
# Defines hardware that exists only on the Charger Controller target.
#
# Charger-side hardware:
#   - dedicated external I2C bus
#   - MCP23017 external I/O expander
#   - direct-GPIO backup rotary encoder
#   - USB/CAN routing selection
#   - ESP32-S3 CAN controller
#
# Target-neutral Waveshare board hardware is owned by shared/hardware.yaml.
# ==============================================================================

# ==============================================================================
# EXTERNAL I2C BUS
# ==============================================================================
#
# Charger-side external peripherals use a dedicated physical bus so their
# addresses remain isolated from the onboard CH422G.
# ==============================================================================

i2c:
  - id: external_i2c_bus
    sda: ${pin_external_i2c_sda}
    scl: ${pin_external_i2c_scl}
    scan: true
    frequency: 400kHz

# ==============================================================================
# EXTERNAL I/O EXPANDER
# ==============================================================================
#
# MCP23017 on the dedicated charger-side external I2C bus.
#
# Pin allocation:
#   GPA0 / pin 0 -> external cooling-fan enable
#   GPA1 / pin 1 -> cooling fan 1 tachometer
#   GPA2 / pin 2 -> cooling fan 2 tachometer
#
# INTA/INTB are intentionally left unconnected. The MCP23017 is used without
# a dedicated ESP32-S3 interrupt line.
# ==============================================================================

mcp23017:
  - id: external_io_expander
    i2c_id: external_i2c_bus
    address: 0x20

# ==============================================================================
# BACKUP ROTARY ENCODER
# ==============================================================================
#
# The complete mechanical encoder is wired directly to ESP32-S3 GPIOs so the
# native interrupt-driven rotary_encoder component can decode A/B without I2C.
#
# Wiring:
#   GPIO11 -> Encoder S1 / A
#   GPIO12 -> Encoder S2 / B
#   GPIO13 -> Encoder KEY / push button
#
# GPIO11/GPIO12/GPIO13 are the Waveshare TF-card SPI pins. The TF interface is
# unavailable while the backup encoder uses these pins.
# ==============================================================================

sensor:
  - platform: rotary_encoder
    id: backup_encoder
    internal: true
    resolution: ${backup_encoder_resolution}

    pin_a:
      number: ${pin_backup_encoder_a}
      mode:
        input: true
        pullup: true

    pin_b:
      number: ${pin_backup_encoder_b}
      mode:
        input: true
        pullup: true

    on_clockwise:
      - script.execute:
          id: backup_encoder_apply_detent
          direction: -1

    on_anticlockwise:
      - script.execute:
          id: backup_encoder_apply_detent
          direction: 1

binary_sensor:
  - platform: gpio
    id: backup_encoder_button
    internal: true

    pin:
      number: ${pin_backup_encoder_button}
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on_off: 20ms

    on_click:
      - min_length: 50ms
        max_length: 600ms
        then:
          - script.execute: backup_encoder_short_click

      - min_length: 2s
        max_length: 10s
        then:
          - script.execute: backup_encoder_power_long_click

# ==============================================================================
# USB / CAN MODE SELECTION
# ==============================================================================
#
# CH422G EXIO5 selects the onboard transceiver routing required for CAN mode.
# ==============================================================================

switch:
  - platform: gpio
    id: can_mode_select
    internal: true
    restore_mode: ALWAYS_ON

    pin:
      ch422g: io_expander
      number: 5
      mode:
        output: true

# ==============================================================================
# CAN BUS
# ==============================================================================
#
# ESP32-S3 TWAI controller connected to the onboard CAN transceiver.
#
# Huawei R4875G1 communication uses extended 29-bit frames at 125 kbit/s.
# ==============================================================================

canbus:
  - platform: esp32_can
    id: charger_can
    tx_pin: ${pin_can_tx}
    rx_pin: ${pin_can_rx}
    bit_rate: 125kbps
    can_id: 0xE5F32E5
    use_extended_id: true
    rx_queue_len: ${can_rx_queue_len}
