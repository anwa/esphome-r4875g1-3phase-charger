# ==============================================================================
# SHARED V6 BOTTOM NAVIGATION
# ==============================================================================
#
# Defines the complete six-page bottom navigation shared by both V6 firmware
# targets: Dashboard, Rectifiers, Battery, System, Cooling and Trends.
#
# Button size and positions follow the navigation geometry of the shared
# Waveshare base. display/header.yaml marks the active button.
# ==============================================================================

lvgl:
  top_layer:
    widgets:

      - button:
          id: ui_nav_dashboard
          x: ${ ui_nav_x0 + 0 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 0;

            - lvgl.page.show: page_dashboard

      - button:
          id: ui_nav_rectifiers
          x: ${ ui_nav_x0 + 1 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 1;

            - lvgl.page.show: page_rectifiers

      - button:
          id: ui_nav_battery
          x: ${ ui_nav_x0 + 2 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Battery"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;

            - lvgl.page.show: page_battery

      - button:
          id: ui_nav_system
          x: ${ ui_nav_x0 + 3 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "System"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;

            - lvgl.page.show: page_system

      - button:
          id: ui_nav_cooling
          x: ${ ui_nav_x0 + 4 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Cooling"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 4;

            - lvgl.page.show: page_cooling

      - button:
          id: ui_nav_trends
          x: ${ ui_nav_x0 + 5 * ui_nav_step }
          y: ${ui_nav_y}
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Trends"

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 6;

            - lvgl.page.show: page_trends
