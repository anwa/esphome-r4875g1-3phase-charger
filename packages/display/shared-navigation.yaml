# ==============================================================================
# SHARED V6 BOTTOM NAVIGATION
# ==============================================================================
#
# Defines the Dashboard, Rectifiers, Battery and System navigation shared by
# both V6 firmware targets.
#
# Controller-only pages append their own navigation entries separately.
# ==============================================================================

lvgl:
  top_layer:
    widgets:

      - button:
          x: 10
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 0;

            - lvgl.page.show: page_dashboard

      - button:
          x: 142
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 1;

            - lvgl.page.show: page_rectifiers

      - button:
          x: 274
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Battery"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;

            - lvgl.page.show: page_battery

      - button:
          x: 406
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;

            - lvgl.page.show: page_system
