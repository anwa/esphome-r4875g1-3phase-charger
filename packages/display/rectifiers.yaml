# ==============================================================================
# RECTIFIERS DISPLAY RUNTIME
# ==============================================================================
#
# Runtime updates for the three-unit Rectifiers overview.
#
# The overview is refreshed only while page_rectifiers is visible.
# The shared Rectifier Detail page has its own runtime in rectifier-detail.yaml.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 1;

          then:

            # ---------------------------------------------------------------------------
            # RECTIFIER 1
            # ---------------------------------------------------------------------------

            # Lifecycle state.
            - lvgl.label.update:
                id: ui_rectifier_1_lifecycle

                text: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string state =
                    id(ui_model_rectifier_1_lifecycle).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return lv_color_hex(0x8B96A0);
                  }

                  if (id(ui_model_rectifier_1_online).state) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(ui_model_rectifier_1_lifecycle).state ==
                      "DISCOVERING"
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            # Power state
            - lvgl.label.update:
                id: ui_rectifier_1_power_state

                text: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return std::string("--");
                  }

                  const std::string state =
                    id(ui_model_rectifier_1_power_state).state;

                  if (
                    state.empty() ||
                    state == "UNKNOWN"
                  ) {
                    return std::string("--");
                  }

                  return state;

                text_color: !lambda |-
                  if (
                    id(ui_model_rectifier_1_connected).state &&
                    id(ui_model_rectifier_1_power_state).state == "ON"
                  ) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(ui_model_rectifier_1_connected).state &&
                    id(ui_model_rectifier_1_power_state).state == "OFF"
                  ) {
                    return lv_color_hex(0xDDE3E8);
                  }

                  return lv_color_hex(0x8B96A0);

            # AC voltage
            - lvgl.label.update:
                id: ui_rectifier_1_ac_voltage

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_ac_voltage).state)
                  ) {
                    return std::string("--- V");
                  }

                  return str_sprintf(
                    "%.0f V",
                    id(ui_model_rectifier_1_ac_voltage).state
                  );

            # AC current
            - lvgl.label.update:
                id: ui_rectifier_1_ac_current

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_ac_current).state)
                  ) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_rectifier_1_ac_current).state
                  );

            # DC voltage
            - lvgl.label.update:
                id: ui_rectifier_1_dc_voltage

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_dc_voltage).state)
                  ) {
                    return std::string("--.- V");
                  }

                  return str_sprintf(
                    "%.1f V",
                    id(ui_model_rectifier_1_dc_voltage).state
                  );

            # DC current
            - lvgl.label.update:
                id: ui_rectifier_1_dc_current

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_dc_current).state)
                  ) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_rectifier_1_dc_current).state
                  );

            # DC power
            - lvgl.label.update:
                id: ui_rectifier_1_dc_power

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_dc_power).state)
                  ) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(ui_model_rectifier_1_dc_power).state
                  );

            # Output temperature
            - lvgl.label.update:
                id: ui_rectifier_1_temperature

                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_output_temperature).state)
                  ) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_rectifier_1_output_temperature).state
                  );

            # Power button label
            - lvgl.label.update:
                id: ui_rectifier_1_power_button_label

                text: !lambda |-
                  if (id(ui_rectifier_1_power_pending) == 1) {
                    return std::string("STARTING...");
                  }

                  if (id(ui_rectifier_1_power_pending) == 2) {
                    return std::string("STOPPING...");
                  }

                  if (
                    !id(ui_model_data_available).state ||
                    !id(ui_model_rectifier_1_online).state
                  ) {
                    return std::string("UNAVAILABLE");
                  }

                  return
                    id(ui_model_rectifier_1_power_state).state == "ON"
                      ? std::string("STOP")
                      : std::string("START");

            # Power button availability
            - if:
                condition:
                  lambda: |-
                    return
                      id(ui_model_data_available).state &&
                      id(ui_charger_power_pending) == 0 &&
                      id(ui_rectifier_1_power_pending) == 0 &&
                      id(ui_model_rectifier_1_online).state;

                then:
                  - lvgl.widget.enable:
                      id: ui_rectifier_1_power_button

                else:
                  - lvgl.widget.disable:
                      id: ui_rectifier_1_power_button

