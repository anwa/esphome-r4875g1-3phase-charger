# LVGL PAGE: SYSTEM
lvgl:
  pages:
    - id: system_page
      bg_color: 0xF3F5F8
      bg_opa: COVER
      scrollable: false
      widgets:
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 64
            styles: style_header
            pad_all: 0
            widgets:
              - label:
                  x: 10
                  y: 8
                  width: 300
                  text_align: CENTER
                  text: "SYSTEM"
                  text_font: ui_font_26_bold
              - label:
                  x: 10
                  y: 42
                  width: 300
                  text_align: CENTER
                  text: "Firmware v${firmware_version}"
                  text_font: ui_font_14
                  text_color: 0xFFFFFF
        - obj:
            x: 8
            y: 72
            width: 304
            height: 104
            styles: style_card
            widgets:
              - label:
                  text: "NETWORK"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_system_ip
                  x: 0
                  y: 28
                  text: "IP --"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_system_wifi
                  x: 0
                  y: 62
                  text: "WiFi -- dBm"
                  text_font: ui_font_18_bold
        - obj:
            x: 8
            y: 184
            width: 304
            height: 104
            styles: style_card
            widgets:
              - label:
                  text: "CONTROLLER"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_system_cpu
                  x: 0
                  y: 28
                  text: "CPU --.- C"
                  text_font: ui_font_18_bold
              - label:
                  x: 0
                  y: 62
                  text: "ESP32-S3 / ESPHome"
                  text_font: ui_font_18_bold
        - obj:
            x: 8
            y: 296
            width: 304
            height: 124
            styles: style_card
            widgets:
              - label:
                  text: "CAN COMMUNICATION"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_system_can1
                  x: 0
                  y: 28
                  text: "L1 --"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_system_can2
                  x: 0
                  y: 58
                  text: "L2 --"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_system_can3
                  x: 0
                  y: 88
                  text: "L3 --"
                  text_font: ui_font_18_bold
        - label:
            x: 8
            y: 448
            width: 304
            text_align: CENTER
            text: "Double page | Hold START/STOP"
            text_font: ui_font_14
            text_color: 0x657080
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: ui_system_ip
          text: !lambda 'return std::string("IP ") + (id(ip_address).state.empty() ? "--" : id(ip_address).state);'
      - lvgl.label.update:
          id: ui_system_wifi
          text: !lambda |-
            if (isnan(id(wifi_sig).state)) return std::string("WiFi -- dBm");
            return str_sprintf("WiFi %.0f dBm", id(wifi_sig).state);
      - lvgl.label.update:
          id: ui_system_cpu
          text: !lambda |-
            if (isnan(id(cpu_temp).state)) return std::string("CPU --.- C");
            return str_sprintf("CPU %.1f C", id(cpu_temp).state);
      - lvgl.label.update:
          id: ui_system_can1
          text: !lambda 'return std::string("L1 ") + (id(can_com_ok_1).state ? "OK" : "FAULT");'
      - lvgl.label.update:
          id: ui_system_can2
          text: !lambda 'return std::string("L2 ") + (id(can_com_ok_2).state ? "OK" : "FAULT");'
      - lvgl.label.update:
          id: ui_system_can3
          text: !lambda 'return std::string("L3 ") + (id(can_com_ok_3).state ? "OK" : "FAULT");'
