# ==============================================================================
# V5 LVGL PAGE: SYSTEM
# ==============================================================================
#
# Controller, network, memory/runtime and rectifier communication diagnostics.
#
# Runtime updates are handled by display/system.yaml. Controller battery values
# are updated independently by display/battery.yaml.
# ==============================================================================

id: page_system
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # NETWORK
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 385
      height: 110
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "NETWORK"

        - label:
            x: 10
            y: 44
            width: 180
            styles: style_desc_label
            text: "IP Address"

        - label:
            id: ui_system_ip
            x: 195
            y: 41
            width: 180
            styles: style_value_label
            text: "--"

        - label:
            x: 10
            y: 76
            styles: style_desc_label
            text: "WiFi RSSI"

        - label:
            id: ui_system_wifi
            x: 195
            y: 73
            width: 180
            styles: style_value_label
            text: "-- dBm"

  # ---------------------------------------------------------------------------
  # CONTROLLER
  # ---------------------------------------------------------------------------

  - obj:
      x: 405
      y: 70
      width: 385
      height: 160
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "CONTROLLER"

        - label:
            x: 10
            y: 44
            width: 180
            styles: style_desc_label
            text: "Uptime"

        - label:
            id: ui_system_uptime
            x: 195
            y: 41
            width: 180
            styles: style_value_label
            text: "--"

        - label:
            x: 10
            y: 76
            width: 180
            styles: style_desc_label
            text: "CPU Temp"

        - label:
            id: ui_system_cpu
            x: 195
            y: 73
            width: 180
            styles: style_value_label
            text: "--.- °C"

        - label:
            x: 10
            y: 108
            width: 180
            styles: style_desc_label
            text: "Battery"

        - label:
            id: ui_system_battery
            x: 195
            y: 106
            width: 180
            styles: style_value_label
            text: "--.-- V / -- %"

  # ---------------------------------------------------------------------------
  # MEMORY AND RUNTIME DEBUG
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 190
      width: 385
      height: 210
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "MEMORY / RUNTIME"

        - label:
            x: 10
            y: 44
            width: 180
            styles: style_desc_label
            text: "Heap Free"

        - label:
            id: ui_system_heap
            x: 190
            y: 41
            width: 180
            styles: style_value_label
            text: "---- kB"

        - label:
            x: 10
            y: 76
            width: 180
            styles: style_desc_label
            text: "Heap Max Block"

        - label:
            id: ui_system_heap_block
            x: 190
            y: 73
            width: 180
            styles: style_value_label
            text: "---- kB"

        - label:
            x: 10
            y: 108
            width: 180
            styles: style_desc_label
            text: "PSRAM Free"

        - label:
            id: ui_system_psram
            x: 190
            y: 106
            width: 180
            styles: style_value_label
            text: "---- kB"

        - label:
            x: 10
            y: 140
            width: 180
            styles: style_desc_label
            text: "Loop Time"

        - label:
            id: ui_system_loop_time
            x: 190
            y: 137
            styles: style_value_label
            text: "-- ms"

        - label:
            x: 10
            y: 172
            width: 180
            styles: style_desc_label
            text: "CPU Frequency"

        - label:
            id: ui_system_cpu_frequency
            x: 190
            y: 169
            width: 180
            styles: style_value_label
            text: "--- MHz"

  # ---------------------------------------------------------------------------
  # CAN AND RECTIFIER STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 405
      y: 240
      width: 385
      height: 160
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "CAN / RECTIFIERS"

        - label:
            x: 10
            y: 44
            width: 180
            styles: style_desc_label
            text: "Unit 1"

        - label:
            id: ui_system_unit_1
            x: 190
            y: 41
            width: 180
            styles: style_value_label
            text: "OFFLINE"

        - label:
            x: 10
            y: 76
            width: 180
            styles: style_desc_label
            text: "Unit 2"

        - label:
            id: ui_system_unit_2
            x: 190
            y: 73
            width: 180
            styles: style_value_label
            text: "OFFLINE"

        - label:
            x: 10
            y: 108
            width: 180
            styles: style_desc_label
            text: "Unit 3"

        - label:
            id: ui_system_unit_3
            x: 190
            y: 106
            width: 180
            styles: style_value_label
            text: "OFFLINE"
