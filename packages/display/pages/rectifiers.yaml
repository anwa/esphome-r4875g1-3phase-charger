# ==============================================================================
# V5 LVGL PAGE: RECTIFIERS
# ==============================================================================
#
# Three-column overview of the individual Huawei rectifiers.
#
# Each card shows the current lifecycle, power state and primary AC/DC
# telemetry and provides START/STOP and detail-page access for that unit.
#
# Runtime updates are handled by display/rectifiers.yaml.
# ==============================================================================

id: page_rectifiers
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # RECTIFIER 1
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 253
      height: 330
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "RECTIFIER 1"

        - label:
            id: ui_rectifier_1_lifecycle
            x: 10
            y: 43
            text: "OFFLINE"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_1_power_state
            x: 165
            y: 43
            width: 65
            text_align: RIGHT
            text: "--"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - label:
            x: 10
            y: 82
            styles: style_desc_label
            text: "AC"

        - label:
            id: ui_rectifier_1_ac_voltage
            x: 65
            y: 80
            text: "230 V"
            text_font: montserrat_18
            text_color: 0xDDE3E8

        - label:
            id: ui_rectifier_1_ac_current
            x: 150
            y: 80
            text: "5.2 A"
            text_font: montserrat_18
            text_color: 0xDDE3E8

        - label:
            x: 10
            y: 122
            styles: style_desc_label
            text: "DC"

        - label:
            id: ui_rectifier_1_dc_voltage
            x: 65
            y: 120
            text: "53.1 V"
            text_font: montserrat_18
            text_color: 0xDDE3E8

        - label:
            id: ui_rectifier_1_dc_current
            x: 150
            y: 120
            text: "22.4 A"
            text_font: montserrat_18
            text_color: 0xDDE3E8

        - label:
            id: ui_rectifier_1_dc_power
            x: 65
            y: 151
            text: "--.-- kW"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 10
            y: 194
            styles: style_desc_label
            text: "OUT"

        - label:
            id: ui_rectifier_1_temperature
            x: 65
            y: 192
            text: "--.- °C"
            text_font: montserrat_18
            text_color: 0xDDE3E8

        - button:
            id: ui_rectifier_1_power_button
            x: 10
            y: 270
            width: 143
            styles: style_dialog_button

            widgets:
              - label:
                  id: ui_rectifier_1_power_button_label
                  align: CENTER
                  text: "UNAVAILABLE"
                  text_font: montserrat_16

            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      return
                        id(can_com_ok_1).state &&
                        id(power_state_1).state == "ON";

                  then:
                    - lvgl.widget.show: ui_stop_rectifier_1_dialog

                  else:
                    - lvgl.widget.show: ui_start_rectifier_1_dialog

        - button:
            x: 163
            y: 270
            width: 80
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "DETAIL"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(rectifier_detail_unit) = 1;
                  id(ui_active_page) = 2;

              - lvgl.page.show: page_rectifier_detail

              - script.execute:
                  id: refresh_rectifier_detail

