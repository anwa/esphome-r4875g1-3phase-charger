# LVGL PAGE: RECTIFIERS
lvgl:
  pages:
    - id: rectifiers_page
      bg_color: 0xF3F5F8
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            scrollable: false
            scrollbar_mode: "OFF"
            x: 0
            y: 0
            width: 100%
            height: 64
            styles: style_header
            pad_all: 0
            widgets:
              - label:
                  x: 10
                  y: 8
                  width: 300
                  text_align: CENTER
                  text: "RECTIFIERS"
                  text_font: ui_font_26_bold
              - label:
                  x: 10
                  y: 42
                  width: 300
                  text_align: CENTER
                  text: "L1 / L2 / L3 status"
                  text_font: ui_font_14
                  text_color: 0xFFFFFF

        - obj:
            scrollable: false
            scrollbar_mode: "OFF"
            x: 8
            y: 72
            width: 304
            height: 112
            styles: style_card
            widgets:
              - label:
                  id: ui_rectifier_title_1
                  text: "> L1"
                  text_font: ui_font_18_bold
                  text_color: 0x1769AA
              - label:
                  id: ui_rectifier_status_1
                  x: 45
                  y: 0
                  width: 245
                  text: "PWR -- | CAN -- | --"
                  text_font: ui_font_14
              - label:
                  id: ui_rectifier_1
                  x: 45
                  y: 23
                  width: 245
                  text: "DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A"
                  text_font: ui_font_14

        - obj:
            scrollable: false
            scrollbar_mode: "OFF"
            x: 8
            y: 190
            width: 304
            height: 112
            styles: style_card
            widgets:
              - label:
                  id: ui_rectifier_title_2
                  text: "> L2"
                  text_font: ui_font_18_bold
                  text_color: 0x1769AA
              - label:
                  id: ui_rectifier_status_2
                  x: 45
                  y: 0
                  width: 245
                  text: "PWR -- | CAN -- | --"
                  text_font: ui_font_14
              - label:
                  id: ui_rectifier_2
                  x: 45
                  y: 23
                  width: 245
                  text: "DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A"
                  text_font: ui_font_14

        - obj:
            scrollable: false
            scrollbar_mode: "OFF"
            x: 8
            y: 308
            width: 304
            height: 112
            styles: style_card
            widgets:
              - label:
                  id: ui_rectifier_title_3
                  text: "> L3"
                  text_font: ui_font_18_bold
                  text_color: 0x1769AA
              - label:
                  id: ui_rectifier_status_3
                  x: 45
                  y: 0
                  width: 245
                  text: "PWR -- | CAN -- | --"
                  text_font: ui_font_14
              - label:
                  id: ui_rectifier_3
                  x: 45
                  y: 23
                  width: 245
                  text: "DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A"
                  text_font: ui_font_14

        - label:
            id: ui_rectifiers_footer
            x: 8
            y: 448
            width: 304
            text_align: CENTER
            text: "Turn select | Press details | Double page | Hold ON/OFF"
            text_font: ui_font_14
            text_color: 0x657080

interval:
  - interval: 500ms
    then:
      # ----------------------------------------------------------------------
      # Rectifier SELECT indication
      # ----------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_rectifier_title_1
          text: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 0
                ? std::string("> L1")
                : std::string("  L1");

          text_color: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 0
                ? lv_color_hex(0x1769AA)
                : lv_color_hex(0x657080);

      - lvgl.label.update:
          id: ui_rectifier_title_2
          text: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 1
                ? std::string("> L2")
                : std::string("  L2");

          text_color: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 1
                ? lv_color_hex(0x1769AA)
                : lv_color_hex(0x657080);

      - lvgl.label.update:
          id: ui_rectifier_title_3
          text: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 2
                ? std::string("> L3")
                : std::string("  L3");

          text_color: !lambda |-
            return
              id(encoder_page) == 1 &&
              id(rectifier_detail_unit) == 0 &&
              id(encoder_selection) == 2
                ? lv_color_hex(0x1769AA)
                : lv_color_hex(0x657080);

      - lvgl.label.update:
          id: ui_rectifier_status_1
          text: !lambda |-
            const std::string lifecycle = id(rectifier_control_state_text_1).state.empty() ? "--" : id(rectifier_control_state_text_1).state;
            const std::string power = id(power_state_1).state == "UNKNOWN" ? "?" : (id(power_state_1).state.empty() ? "--" : id(power_state_1).state);
            return str_sprintf("PWR %s | CAN %s | %s", power.c_str(), id(can_com_ok_1).state ? "OK" : "FAULT", lifecycle.c_str());
          text_color: !lambda |-
            if (!id(can_com_ok_1).state) return lv_color_hex(0xC62828);
            if (id(rectifier_control_state_1) == ${rectifier_state_discovering}) return lv_color_hex(0xC27A00);
            if (id(rectifier_control_state_1) == ${rectifier_state_online}) return lv_color_hex(0x198754);
            return lv_color_hex(0x657080);
      - lvgl.label.update:
          id: ui_rectifier_1
          text: !lambda |-
            if (!id(can_com_ok_1).state) return std::string("DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A");
            return str_sprintf("DC    %.1f V   %.1f A   %.0f W\nTemp  IN %.1f   OUT %.1f C\nFan   %.0f RPM   Cap %.1f A", id(dc_voltage_1).state, id(dc_current_1).state, id(dc_power_1).state, id(input_temperature_1).state, id(output_temperature_1).state, id(fan_rpm_1).state, id(max_dc_current_1).state);

      - lvgl.label.update:
          id: ui_rectifier_status_2
          text: !lambda |-
            const std::string lifecycle = id(rectifier_control_state_text_2).state.empty() ? "--" : id(rectifier_control_state_text_2).state;
            const std::string power = id(power_state_2).state == "UNKNOWN" ? "?" : (id(power_state_2).state.empty() ? "--" : id(power_state_2).state);
            return str_sprintf("PWR %s | CAN %s | %s", power.c_str(), id(can_com_ok_2).state ? "OK" : "FAULT", lifecycle.c_str());
          text_color: !lambda |-
            if (!id(can_com_ok_2).state) return lv_color_hex(0xC62828);
            if (id(rectifier_control_state_2) == ${rectifier_state_discovering}) return lv_color_hex(0xC27A00);
            if (id(rectifier_control_state_2) == ${rectifier_state_online}) return lv_color_hex(0x198754);
            return lv_color_hex(0x657080);
      - lvgl.label.update:
          id: ui_rectifier_2
          text: !lambda |-
            if (!id(can_com_ok_2).state) return std::string("DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A");
            return str_sprintf("DC    %.1f V   %.1f A   %.0f W\nTemp  IN %.1f   OUT %.1f C\nFan   %.0f RPM   Cap %.1f A", id(dc_voltage_2).state, id(dc_current_2).state, id(dc_power_2).state, id(input_temperature_2).state, id(output_temperature_2).state, id(fan_rpm_2).state, id(max_dc_current_2).state);

      - lvgl.label.update:
          id: ui_rectifier_status_3
          text: !lambda |-
            const std::string lifecycle = id(rectifier_control_state_text_3).state.empty() ? "--" : id(rectifier_control_state_text_3).state;
            const std::string power = id(power_state_3).state == "UNKNOWN" ? "?" : (id(power_state_3).state.empty() ? "--" : id(power_state_3).state);
            return str_sprintf("PWR %s | CAN %s | %s", power.c_str(), id(can_com_ok_3).state ? "OK" : "FAULT", lifecycle.c_str());
          text_color: !lambda |-
            if (!id(can_com_ok_3).state) return lv_color_hex(0xC62828);
            if (id(rectifier_control_state_3) == ${rectifier_state_discovering}) return lv_color_hex(0xC27A00);
            if (id(rectifier_control_state_3) == ${rectifier_state_online}) return lv_color_hex(0x198754);
            return lv_color_hex(0x657080);
      - lvgl.label.update:
          id: ui_rectifier_3
          text: !lambda |-
            if (!id(can_com_ok_3).state) return std::string("DC    --.- V   --.- A   ---- W\nTemp  IN --.-   OUT --.- C\nFan   ---- RPM   Cap --.- A");
            return str_sprintf("DC    %.1f V   %.1f A   %.0f W\nTemp  IN %.1f   OUT %.1f C\nFan   %.0f RPM   Cap %.1f A", id(dc_voltage_3).state, id(dc_current_3).state, id(dc_power_3).state, id(input_temperature_3).state, id(output_temperature_3).state, id(fan_rpm_3).state, id(max_dc_current_3).state);
