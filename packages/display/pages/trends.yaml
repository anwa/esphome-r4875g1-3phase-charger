# ==============================================================================
# SHARED V6 LVGL PAGE: TRENDS
# ==============================================================================
#
# Displays a shared chart for charger power, current, voltage and temperature
# history.
#
# The chart runtime and trend-buffer handling are implemented in
# display/trends.yaml.
# ==============================================================================

id: page_trends
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # TREND SELECTOR
  # ---------------------------------------------------------------------------
  #
  # The TabView is intentionally only as high as its tab bar.
  # Its page content is unused. The chart lives independently below the TabView
  # and therefore remains visible for every selected trend.
  # ---------------------------------------------------------------------------

  - tabview:
      id: ui_trend_tabview
      x: 10
      y: 70
      width: 780
      height: 42

      position: TOP
      size: 42

      bg_color: 0x11171C
      border_width: 0
      pad_all: 0

      tab_style:
        bg_color: 0x202830
        text_color: 0xDDE3E8
        border_width: 0

        items:
          text_font: montserrat_14
          text_color: 0xDDE3E8
          bg_color: 0x202830

          checked:
            text_color: 0x5CFF7A
            bg_color: 0x36505A

      content_style:
        bg_color: 0x11171C
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0

      on_change:
        - lambda: |-
            if (tab == id(ui_trend_tab_power)) {
              id(trend_selection) = 0;
            } else if (tab == id(ui_trend_tab_dc_iv)) {
              id(trend_selection) = 1;
            } else if (tab == id(ui_trend_tab_output_temp)) {
              id(trend_selection) = 2;
            } else if (tab == id(ui_trend_tab_compartment)) {
              id(trend_selection) = 3;
            }

        - script.execute: trend_chart_refresh

      tabs:
        - name: "Power"
          id: ui_trend_tab_power
          widgets: []

        - name: "DC I/V"
          id: ui_trend_tab_dc_iv
          widgets: []

        - name: "Output Temp"
          id: ui_trend_tab_output_temp
          widgets: []

        - name: "Compartment"
          id: ui_trend_tab_compartment
          widgets: []

  # ---------------------------------------------------------------------------
  # CHART
  # ---------------------------------------------------------------------------

  - obj:
      id: ui_trend_chart_host
      x: 10
      y: 117
      width: 780
      height: 228
      styles: style_card
      pad_all: 0

      widgets:

        # Dynamic Y-axis labels
        - label:
            id: ui_trend_y_max
            x: 4
            y: 8
            width: 45
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_mid
            x: 4
            y: 86
            width: 45
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_min
            x: 4
            y: 162
            width: 45
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        # Secondary Y-axis labels are shown only by the combined DC I/V trend.
        - label:
            id: ui_trend_y2_max
            x: 725
            y: 8
            width: 48
            text_align: LEFT
            text: "--"
            text_font: montserrat_14
            text_color: 0x4DB8FF
            hidden: true

        - label:
            id: ui_trend_y2_mid
            x: 725
            y: 86
            width: 48
            text_align: LEFT
            text: "--"
            text_font: montserrat_14
            text_color: 0x4DB8FF
            hidden: true

        - label:
            id: ui_trend_y2_min
            x: 725
            y: 162
            width: 48
            text_align: LEFT
            text: "--"
            text_font: montserrat_14
            text_color: 0x4DB8FF
            hidden: true

        # Fixed X-axis labels aligned with the seven vertical chart divisions.
        - label:
            x: 55
            y: 204
            width: 80
            text_align: LEFT
            text: "-60 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 125
            y: 204
            width: 80
            text_align: CENTER
            text: "-50 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 235
            y: 204
            width: 80
            text_align: CENTER
            text: "-40 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 345
            y: 204
            width: 80
            text_align: CENTER
            text: "-30 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 455
            y: 204
            width: 80
            text_align: CENTER
            text: "-20 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 565
            y: 204
            width: 80
            text_align: CENTER
            text: "-10 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 640
            y: 204
            width: 75
            text_align: RIGHT
            text: "now"
            text_font: montserrat_14
            text_color: 0x8B96A0

  # ---------------------------------------------------------------------------
  # CURRENT, MINIMUM AND MAXIMUM
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 350
      width: 780
      height: 55
      styles: style_card
      pad_all: 0

      widgets:
        # Shared column headings for the primary and optional secondary series.
        - label:
            x: 130
            y: 1
            width: 140
            text_align: CENTER
            styles: style_desc_label
            text: "NOW"

        - label:
            x: 340
            y: 1
            width: 140
            text_align: CENTER
            styles: style_desc_label
            text: "MIN"

        - label:
            x: 550
            y: 1
            width: 140
            text_align: CENTER
            styles: style_desc_label
            text: "MAX"

        - label:
            id: ui_trend_primary_name
            x: 10
            y: 17
            width: 110
            styles: style_desc_label
            text: "POWER"

        - label:
            id: ui_trend_current
            x: 120
            y: 15
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"

        - label:
            id: ui_trend_min
            x: 330
            y: 15
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"

        - label:
            id: ui_trend_max
            x: 540
            y: 15
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"

        # The secondary row is used only by the combined DC current/voltage tab.
        - label:
            id: ui_trend_secondary_name
            x: 10
            y: 34
            width: 110
            styles: style_desc_label
            text: "VOLTAGE"
            hidden: true

        - label:
            id: ui_trend_secondary_current
            x: 120
            y: 32
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"
            hidden: true

        - label:
            id: ui_trend_secondary_min
            x: 330
            y: 32
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"
            hidden: true

        - label:
            id: ui_trend_secondary_max
            x: 540
            y: 32
            width: 160
            styles: style_value_label
            text_align: CENTER
            text: "--"
            hidden: true
