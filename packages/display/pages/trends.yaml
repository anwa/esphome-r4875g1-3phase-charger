# ==============================================================================
# V5 LVGL PAGE: TRENDS
# ==============================================================================
#
# Local 10-minute trend display.
#
# Five trends are sampled continuously every 5 seconds in rectifier-shared.yaml:
#
#   0 = Combined DC Power
#   1 = Combined DC Current
#   2 = Average DC Voltage
#   3 = Highest Rectifier Output Temperature
#   4 = Rectifier Compartment Temperature
#
# 120 samples x 5 seconds = 10 minutes.
#
# The chart uses the native LVGL chart API, as already proven in v4.
# trend_helpers.h provides the required LVGL include.
#
# Data acquisition remains completely independent from this display page.

id: page_trends
styles: style_page

widgets:

  # ============================================================================
  # CHART CARD
  # ============================================================================

  - obj:
      id: ui_trend_chart_host
      x: 20
      y: 75
      width: 550
      height: 250
      styles: style_card
      pad_all: 0

      widgets:

        # ----------------------------------------------------------------------
        # Dynamic Y-axis labels
        # ----------------------------------------------------------------------
        - label:
            id: ui_trend_y_max
            x: 4
            y: 8
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_mid
            x: 4
            y: 104
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_min
            x: 4
            y: 198
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        # ----------------------------------------------------------------------
        # Fixed X-axis labels
        # ----------------------------------------------------------------------
        - label:
            x: 65
            y: 224
            width: 70
            text_align: LEFT
            text: "-10 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 270
            y: 224
            width: 70
            text_align: CENTER
            text: "-5 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 460
            y: 224
            width: 70
            text_align: RIGHT
            text: "now"
            text_font: montserrat_14
            text_color: 0x8B96A0


  # ============================================================================
  # CURRENT / MIN / MAX
  # ============================================================================

  - obj:
      x: 20
      y: 335
      width: 550
      height: 60
      styles: style_card
      pad_all: 4

      widgets:

        - label:
            id: ui_trend_current
            x: 0
            y: 4
            width: 180
            text_align: CENTER
            text: "CURRENT\n--"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_trend_min
            x: 180
            y: 4
            width: 180
            text_align: CENTER
            text: "MIN\n--"
            text_font: montserrat_16
            text_color: 0xDDE3E8

        - label:
            id: ui_trend_max
            x: 360
            y: 4
            width: 180
            text_align: CENTER
            text: "MAX\n--"
            text_font: montserrat_16
            text_color: 0xDDE3E8


  # ============================================================================
  # TREND SELECTION
  # ============================================================================

  - obj:
      x: 585
      y: 75
      width: 195
      height: 320
      styles: style_card

      widgets:

        - label:
            id: ui_trend_title
            x: 5
            y: 8
            width: 155
            text_align: CENTER
            text: "DC POWER"
            text_font: montserrat_18
            text_color: 0xFFFFFF


        - button:
            id: ui_trend_select_power
            x: 5
            y: 42
            width: 155
            height: 46

            widgets:
              - label:
                  align: CENTER
                  text: "DC Power"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(trend_selection) = 0;

              - script.execute: trend_chart_refresh


        - button:
            id: ui_trend_select_current
            x: 5
            y: 94
            width: 155
            height: 46

            widgets:
              - label:
                  align: CENTER
                  text: "DC Current"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(trend_selection) = 1;

              - script.execute: trend_chart_refresh


        - button:
            id: ui_trend_select_voltage
            x: 5
            y: 146
            width: 155
            height: 46

            widgets:
              - label:
                  align: CENTER
                  text: "DC Voltage"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(trend_selection) = 2;

              - script.execute: trend_chart_refresh


        - button:
            id: ui_trend_select_output_temp
            x: 5
            y: 198
            width: 155
            height: 46

            widgets:
              - label:
                  align: CENTER
                  text: "Output Temp"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(trend_selection) = 3;

              - script.execute: trend_chart_refresh


        - button:
            id: ui_trend_select_compartment
            x: 5
            y: 250
            width: 155
            height: 46

            widgets:
              - label:
                  align: CENTER
                  text: "Compartment"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(trend_selection) = 4;

              - script.execute: trend_chart_refresh

