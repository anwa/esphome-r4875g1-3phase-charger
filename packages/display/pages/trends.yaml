# ==============================================================================
# V5 LVGL PAGE: TRENDS
# ==============================================================================
#
# Displays a shared chart for charger power, current, voltage and temperature
# history.
#
# The chart runtime and trend-buffer handling are implemented in
# display/trends.yaml.
# ==============================================================================

id: page_trends
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # TREND SELECTOR
  # ---------------------------------------------------------------------------
  #
  # The TabView is intentionally only as high as its tab bar.
  # Its page content is unused. The chart lives independently below the TabView
  # and therefore remains visible for every selected trend.
  # ---------------------------------------------------------------------------

  - tabview:
      id: ui_trend_tabview
      x: 10
      y: 70
      width: 780
      height: 42

      position: TOP
      size: 42

      bg_color: 0x11171C
      border_width: 0
      pad_all: 0

      tab_style:
        bg_color: 0x202830
        text_color: 0xDDE3E8
        border_width: 0

        items:
          text_font: montserrat_14
          text_color: 0xDDE3E8
          bg_color: 0x202830

          checked:
            text_color: 0x5CFF7A
            bg_color: 0x36505A

      content_style:
        bg_color: 0x11171C
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0

      on_change:
        - lambda: |-
            if (tab == id(ui_trend_tab_power)) {
              id(trend_selection) = 0;
            } else if (tab == id(ui_trend_tab_current)) {
              id(trend_selection) = 1;
            } else if (tab == id(ui_trend_tab_voltage)) {
              id(trend_selection) = 2;
            } else if (tab == id(ui_trend_tab_output_temp)) {
              id(trend_selection) = 3;
            } else if (tab == id(ui_trend_tab_compartment)) {
              id(trend_selection) = 4;
            }

        - script.execute: trend_chart_refresh

      tabs:
        - name: "Power"
          id: ui_trend_tab_power
          widgets: []

        - name: "Current"
          id: ui_trend_tab_current
          widgets: []

        - name: "Voltage"
          id: ui_trend_tab_voltage
          widgets: []

        - name: "Output Temp"
          id: ui_trend_tab_output_temp
          widgets: []

        - name: "Compartment"
          id: ui_trend_tab_compartment
          widgets: []

  # ---------------------------------------------------------------------------
  # CHART
  # ---------------------------------------------------------------------------

  - obj:
      id: ui_trend_chart_host
      x: 10
      y: 117
      width: 780
      height: 228
      styles: style_card
      pad_all: 0

      widgets:

        # Dynamic Y-axis labels
        - label:
            id: ui_trend_y_max
            x: 4
            y: 8
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_mid
            x: 4
            y: 82
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_trend_y_min
            x: 4
            y: 154
            width: 55
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        # Fixed X-axis labels
        - label:
            x: 65
            y: 194
            width: 80
            text_align: LEFT
            text: "-10 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 345
            y: 194
            width: 80
            text_align: CENTER
            text: "-5 min"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            x: 665
            y: 194
            width: 75
            text_align: RIGHT
            text: "now"
            text_font: montserrat_14
            text_color: 0x8B96A0

  # ---------------------------------------------------------------------------
  # CURRENT, MINIMUM AND MAXIMUM
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 355
      width: 780
      height: 45
      styles: style_card
      pad_all: 0

      widgets:
        - label:
            x: 10
            y: 12
            width: 100
            styles: style_desc_label
            text: "CURRENT:"

        - label:
            id: ui_trend_current
            x: 110
            y: 11
            width: 120
            styles: style_value_label
            text_align: CENTER
            text: "--"

        - label:
            x: 265
            y: 13
            width: 100
            styles: style_desc_label
            text: "MINIMUM:"

        - label:
            id: ui_trend_min
            x: 365
            y: 11
            width: 120
            styles: style_value_label
            text_align: CENTER
            text: "MIN --"

        - label:
            x: 517
            y: 14
            width: 100
            styles: style_desc_label
            text: "MAXIMUM:"

        - label:
            id: ui_trend_max
            x: 617
            y: 11
            width: 120
            styles: style_value_label
            text_align: CENTER
            text: "MAX --"
