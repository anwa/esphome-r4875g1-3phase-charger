# ==============================================================================
# V5 LVGL PAGE: RECTIFIER DETAIL
# ==============================================================================
#
# Shared detail page for all three rectifiers.
#
# rectifier_detail_unit selects the active unit:
#   1 = Unit 1 / L1
#   2 = Unit 2 / L2
#   3 = Unit 3 / L3
#
# Runtime updates are handled by display/rectifier-detail.yaml.
# ==============================================================================

id: page_rectifier_detail
skip: true
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # HEADER AND STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 780
      height: 60
      styles: style_card

      widgets:
        - label:
            id: ui_rectifier_detail_title
            x: 10
            align: LEFT_MID
            width: 330
            text: "RECTIFIER --    ---- h"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_status
            x: -10
            align: RIGHT_MID
            width: 380
            text_align: RIGHT
            text: "CAN -- | PWR -- | --"
            text_font: montserrat_16
            text_color: 0x8B96A0

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 140
      width: 385
      height: 110
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "AC INPUT"

        - label:
            x: 10
            y: 44
            width: 85
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_rectifier_detail_ac_voltage
            x: 97
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- V"

        - label:
            x: 203
            y: 44
            width: 85
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_rectifier_detail_ac_current
            x: 290
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- A"

        - label:
            x: 10
            y: 76
            width: 85
            styles: style_desc_label
            text: "Power"

        - label:
            id: ui_rectifier_detail_ac_power
            x: 97
            y: 73
            width: 85
            styles: style_value_label
            text: "---- W"

        - label:
            x: 203
            y: 76
            width: 85
            styles: style_desc_label
            text: "Frequency"

        - label:
            id: ui_rectifier_detail_ac_frequency
            x: 290
            y: 73
            width: 85
            styles: style_value_label
            text: "--.-- Hz"

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 405
      y: 140
      width: 385
      height: 110
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "DC OUTPUT"

        - label:
            x: 10
            y: 44
            width: 85
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_rectifier_detail_dc_voltage
            x: 97
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- V"

        - label:
            x: 203
            y: 44
            width: 85
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_rectifier_detail_dc_current
            x: 290
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- A"

        - label:
            x: 10
            y: 76
            width: 85
            styles: style_desc_label
            text: "Power"

        - label:
            id: ui_rectifier_detail_dc_power
            x: 97
            y: 73
            width: 85
            styles: style_value_label
            text: "---- W"

        - label:
            x: 203
            y: 76
            width: 85
            styles: style_desc_label
            text: "Setpoint"

        - label:
            id: ui_rectifier_detail_dc_setpoint
            x: 290
            y: 73
            width: 85
            styles: style_value_label
            text: "--.- A"

  # ---------------------------------------------------------------------------
  # THERMAL AND INTERNAL FAN
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 260
      width: 385
      height: 140
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "THERMAL / INTERNAL FAN"

        - label:
            x: 10
            y: 44
            width: 85
            styles: style_desc_label
            text: "IN"

        - label:
            id: ui_rectifier_detail_input_temp
            x: 97
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- °C"

        - label:
            x: 203
            y: 44
            width: 85
            styles: style_desc_label
            text: "OUT"

        - label:
            id: ui_rectifier_detail_output_temp
            x: 290
            y: 41
            width: 85
            styles: style_value_label
            text: "--.- °C"

        - label:
            x: 10
            y: 76
            width: 85
            styles: style_desc_label
            text: "FAN RPM"

        - label:
            id: ui_rectifier_detail_fan_rpm
            x: 97
            y: 73
            width: 85
            styles: style_value_label
            text: "----"

        - label:
            x: 203
            y: 76
            width: 85
            styles: style_desc_label
            text: "MIN"

        - label:
            id: ui_rectifier_detail_fan_duty
            x: 290
            y: 73
            width: 85
            styles: style_value_label
            text: "--.- %"

        - label:
            x: 10
            y: 108
            width: 85
            styles: style_desc_label
            text: "TARGET"

        - label:
            id: ui_rectifier_detail_fan_min
            x: 97
            y: 105
            width: 85
            styles: style_value_label
            text: "--.- %"

        - label:
            x: 203
            y: 108
            width: 85
            styles: style_desc_label
            text: "CAP"

        - label:
            id: ui_rectifier_detail_capability
            x: 290
            y: 105
            width: 85
            styles: style_value_label
            text: "--.- A"

  # ---------------------------------------------------------------------------
  # FALLBACK AND CONTROL
  # ---------------------------------------------------------------------------

  - obj:
      x: 405
      y: 260
      width: 385
      height: 140
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "FALLBACK / CONTROL"

        - label:
            x: 10
            y: 47
            width: 85
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_rectifier_detail_fallback_voltage
            x: 97
            y: 44
            width: 85
            styles: style_value_label
            text: "--.- V"

        - label:
            x: 10
            y: 82
            width: 85
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_rectifier_detail_fallback_current
            x: 97
            y: 79
            width: 85
            styles: style_value_label
            text: "--.- A"

        - button:
            id: ui_rectifier_detail_fallback_edit
            x: 235
            y: 46
            width: 110
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "EDIT"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(ui_fallback_voltage_edit) =
                    id(set_dc_voltage_limit_fallback).state;

                  id(ui_fallback_current_edit) =
                    id(set_dc_current_limit_fallback).state;

              - lvgl.spinbox.update:
                  id: ui_fallback_voltage_spinbox
                  value: !lambda |-
                    return id(ui_fallback_voltage_edit);

              - lvgl.spinbox.update:
                  id: ui_fallback_current_spinbox
                  value: !lambda |-
                    return id(ui_fallback_current_edit);

              - lvgl.widget.show: ui_fallback_dialog
