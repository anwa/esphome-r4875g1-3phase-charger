# ==============================================================================
# LVGL PAGE: RECTIFIER DETAIL
# ==============================================================================
# Hierarchical child page of the Rectifiers overview.
#
# rectifier_detail_unit:
#   1 = L1
#   2 = L2
#   3 = L3
#
# The page is excluded from the normal main-page rotation with skip:true.

lvgl:
  pages:
    - id: rectifier_detail_page
      skip: true
      bg_color: 0xF3F5F8
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: "OFF"

      widgets:

        # --------------------------------------------------------------------
        # HEADER
        # --------------------------------------------------------------------
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 64
            styles: style_header
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  id: ui_rectifier_detail_title
                  x: 10
                  y: 8
                  width: 300
                  text_align: CENTER
                  text: "RECTIFIER L-"
                  text_font: ui_font_26_bold

              - label:
                  id: ui_rectifier_detail_subtitle
                  x: 10
                  y: 42
                  width: 300
                  text_align: CENTER
                  text: "Unit -"
                  text_font: ui_font_14
                  text_color: 0xFFFFFF

        # --------------------------------------------------------------------
        # NAVIGATION TEST / SUMMARY CARD
        # --------------------------------------------------------------------
        - obj:
            x: 8
            y: 72
            width: 304
            height: 112
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  text: "RECTIFIER DETAIL"
                  text_font: ui_font_14
                  text_color: 0x657080

              - label:
                  id: ui_rectifier_detail_status
                  x: 0
                  y: 28
                  width: 280
                  text: "PWR -- | CAN -- | --"
                  text_font: ui_font_18_bold

              - label:
                  id: ui_rectifier_detail_summary
                  x: 0
                  y: 60
                  width: 280
                  text: "DC --.- V   --.- A   ---- W"
                  text_font: ui_font_18_bold

        # --------------------------------------------------------------------
        # PLACEHOLDER FOR v4.3.2
        # --------------------------------------------------------------------
        - obj:
            x: 8
            y: 192
            width: 304
            height: 160
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"

            widgets:
              - label:
                  x: 0
                  y: 0
                  width: 280
                  text: "DETAIL CONTENT"
                  text_font: ui_font_14
                  text_color: 0x657080

              - label:
                  x: 0
                  y: 35
                  width: 280
                  text_align: CENTER
                  text: "Full per-unit electrical,\nthermal, fan and capability\ndata follows in v4.3.2"
                  text_font: ui_font_18_bold
                  text_color: 0x657080

        # --------------------------------------------------------------------
        # FOOTER
        # --------------------------------------------------------------------
        - label:
            x: 8
            y: 448
            width: 304
            text_align: CENTER
            text: "Double back | Hold ON/OFF"
            text_font: ui_font_14
            text_color: 0x657080


interval:
  - interval: 500ms
    then:

      # ----------------------------------------------------------------------
      # Header
      # ----------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_rectifier_detail_title
          text: !lambda |-
            switch (id(rectifier_detail_unit)) {
              case 1:
                return std::string("RECTIFIER L1");
              case 2:
                return std::string("RECTIFIER L2");
              case 3:
                return std::string("RECTIFIER L3");
              default:
                return std::string("RECTIFIER");
            }

      - lvgl.label.update:
          id: ui_rectifier_detail_subtitle
          text: !lambda |-
            return str_sprintf(
              "Unit %d",
              id(rectifier_detail_unit)
            );

      # ----------------------------------------------------------------------
      # PWR / CAN / lifecycle
      # ----------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_rectifier_detail_status

          text: !lambda |-
            int unit = id(rectifier_detail_unit);

            if (unit == 1) {
              const std::string lifecycle =
                id(rectifier_control_state_text_1).state.empty()
                  ? "--"
                  : id(rectifier_control_state_text_1).state;

              const std::string power =
                id(power_state_1).state == "UNKNOWN"
                  ? "?"
                  : (
                      id(power_state_1).state.empty()
                        ? "--"
                        : id(power_state_1).state
                    );

              return str_sprintf(
                "PWR %s | CAN %s | %s",
                power.c_str(),
                id(can_com_ok_1).state ? "OK" : "FAULT",
                lifecycle.c_str()
              );
            }

            if (unit == 2) {
              const std::string lifecycle =
                id(rectifier_control_state_text_2).state.empty()
                  ? "--"
                  : id(rectifier_control_state_text_2).state;

              const std::string power =
                id(power_state_2).state == "UNKNOWN"
                  ? "?"
                  : (
                      id(power_state_2).state.empty()
                        ? "--"
                        : id(power_state_2).state
                    );

              return str_sprintf(
                "PWR %s | CAN %s | %s",
                power.c_str(),
                id(can_com_ok_2).state ? "OK" : "FAULT",
                lifecycle.c_str()
              );
            }

            if (unit == 3) {
              const std::string lifecycle =
                id(rectifier_control_state_text_3).state.empty()
                  ? "--"
                  : id(rectifier_control_state_text_3).state;

              const std::string power =
                id(power_state_3).state == "UNKNOWN"
                  ? "?"
                  : (
                      id(power_state_3).state.empty()
                        ? "--"
                        : id(power_state_3).state
                    );

              return str_sprintf(
                "PWR %s | CAN %s | %s",
                power.c_str(),
                id(can_com_ok_3).state ? "OK" : "FAULT",
                lifecycle.c_str()
              );
            }

            return std::string(
              "PWR -- | CAN -- | --"
            );

          text_color: !lambda |-
            int unit = id(rectifier_detail_unit);

            if (unit == 1) {
              if (!id(can_com_ok_1).state)
                return lv_color_hex(0xC62828);

              if (
                id(rectifier_control_state_1) ==
                ${rectifier_state_discovering}
              )
                return lv_color_hex(0xC27A00);

              if (
                id(rectifier_control_state_1) ==
                ${rectifier_state_online}
              )
                return lv_color_hex(0x198754);
            }

            if (unit == 2) {
              if (!id(can_com_ok_2).state)
                return lv_color_hex(0xC62828);

              if (
                id(rectifier_control_state_2) ==
                ${rectifier_state_discovering}
              )
                return lv_color_hex(0xC27A00);

              if (
                id(rectifier_control_state_2) ==
                ${rectifier_state_online}
              )
                return lv_color_hex(0x198754);
            }

            if (unit == 3) {
              if (!id(can_com_ok_3).state)
                return lv_color_hex(0xC62828);

              if (
                id(rectifier_control_state_3) ==
                ${rectifier_state_discovering}
              )
                return lv_color_hex(0xC27A00);

              if (
                id(rectifier_control_state_3) ==
                ${rectifier_state_online}
              )
                return lv_color_hex(0x198754);
            }

            return lv_color_hex(0x657080);

      # ----------------------------------------------------------------------
      # Small DC summary
      # ----------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_rectifier_detail_summary

          text: !lambda |-
            int unit = id(rectifier_detail_unit);

            if (unit == 1) {
              if (!id(can_com_ok_1).state)
                return std::string(
                  "DC --.- V   --.- A   ---- W"
                );

              return str_sprintf(
                "DC %.1f V   %.1f A   %.0f W",
                id(dc_voltage_1).state,
                id(dc_current_1).state,
                id(dc_power_1).state
              );
            }

            if (unit == 2) {
              if (!id(can_com_ok_2).state)
                return std::string(
                  "DC --.- V   --.- A   ---- W"
                );

              return str_sprintf(
                "DC %.1f V   %.1f A   %.0f W",
                id(dc_voltage_2).state,
                id(dc_current_2).state,
                id(dc_power_2).state
              );
            }

            if (unit == 3) {
              if (!id(can_com_ok_3).state)
                return std::string(
                  "DC --.- V   --.- A   ---- W"
                );

              return str_sprintf(
                "DC %.1f V   %.1f A   %.0f W",
                id(dc_voltage_3).state,
                id(dc_current_3).state,
                id(dc_power_3).state
              );
            }

            return std::string(
              "DC --.- V   --.- A   ---- W"
            );