# ==============================================================================
# V5 LVGL PAGE: RECTIFIER DETAIL
# ==============================================================================
#
# Shared detail page for all three rectifiers.
#
# rectifier_detail_unit:
#   1 = Unit 1 / L1
#   2 = Unit 2 / L2
#   3 = Unit 3 / L3
#
# Live updates are handled from the common v5 UI runtime.

id: page_rectifier_detail
skip: true
styles: style_page

widgets:

  # ============================================================================
  # HEADER / STATUS
  # ============================================================================

  - obj:
      x: 20
      y: 75
      width: 760
      height: 60
      styles: style_card

      widgets:
        - label:
            id: ui_rectifier_detail_title
            x: 16
            align: LEFT_MID
            text: "RECTIFIER --"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_status
            x: -16
            align: RIGHT_MID
            width: 430
            text_align: RIGHT
            text: "CAN -- | PWR -- | --"
            text_font: montserrat_16
            text_color: 0x8B96A0


  # ============================================================================
  # AC INPUT
  # ============================================================================

  - obj:
      x: 20
      y: 145
      width: 370
      height: 112
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "AC INPUT"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 44
            width: 75
            text: "Voltage"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_voltage
            x: 92
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- V"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 44
            width: 75
            text: "Current"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_current
            x: 266
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 76
            width: 75
            text: "Power"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_power
            x: 92
            y: 73
            width: 80
            text_align: RIGHT
            text: "---- W"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 76
            width: 75
            text: "Frequency"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_frequency
            x: 266
            y: 73
            width: 80
            text_align: RIGHT
            text: "--.-- Hz"
            text_font: montserrat_18
            text_color: 0xFFFFFF

  # ============================================================================
  # DC OUTPUT
  # ============================================================================

  - obj:
      x: 410
      y: 145
      width: 370
      height: 112
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "DC OUTPUT"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 44
            width: 75
            text: "Voltage"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_voltage
            x: 92
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- V"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 44
            width: 75
            text: "Current"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_current
            x: 266
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 76
            width: 75
            text: "Power"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_power
            x: 92
            y: 73
            width: 80
            text_align: RIGHT
            text: "---- W"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 76
            width: 75
            text: "Setpoint"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_setpoint
            x: 266
            y: 73
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

  # ============================================================================
  # THERMAL / FAN
  # ============================================================================

  - obj:
      x: 20
      y: 267
      width: 370
      height: 128
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "THERMAL / INTERNAL FAN"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_input_temp
            x: 16
            y: 45
            width: 150
            text: "IN  --.- °C"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_output_temp
            x: 190
            y: 45
            width: 155
            text_align: RIGHT
            text: "OUT  --.- °C"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_rpm
            x: 16
            y: 75
            width: 150
            text: "FAN  ---- RPM"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_duty
            x: 190
            y: 75
            width: 155
            text_align: RIGHT
            text: "DUTY --.- %"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_min
            x: 16
            y: 102
            width: 150
            text: "MIN  --.- %"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_capability
            x: 190
            y: 102
            width: 155
            text_align: RIGHT
            text: "CAP  --.- A"
            text_font: montserrat_16
            text_color: 0xFFFFFF


  # ============================================================================
  # RUNTIME / ACTION
  # ============================================================================

  - obj:
      x: 410
      y: 267
      width: 370
      height: 128
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "RUNTIME / CONTROL"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_runtime
            x: 16
            y: 48
            width: 180
            text: "Operating ---- h"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - button:
            id: ui_rectifier_detail_power_button
            x: 215
            y: 42
            width: 130
            height: 48

            disabled:
              bg_color: 0x30343A
              border_color: 0x44484E

            widgets:
              - label:
                  id: ui_rectifier_detail_power_button_label
                  align: CENTER
                  text: "UNAVAILABLE"
                  text_font: montserrat_14

            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      return id(rectifier_detail_unit) == 1;

                  then:
                    - if:
                        condition:
                          lambda: |-
                            return id(power_state_1).state == "ON";

                        then:
                          - lvgl.widget.show:
                              id: ui_stop_rectifier_1_dialog

                        else:
                          - lvgl.widget.show:
                              id: ui_start_rectifier_1_dialog


              - if:
                  condition:
                    lambda: |-
                      return id(rectifier_detail_unit) == 2;

                  then:
                    - if:
                        condition:
                          lambda: |-
                            return id(power_state_2).state == "ON";

                        then:
                          - lvgl.widget.show:
                              id: ui_stop_rectifier_2_dialog

                        else:
                          - lvgl.widget.show:
                              id: ui_start_rectifier_2_dialog


              - if:
                  condition:
                    lambda: |-
                      return id(rectifier_detail_unit) == 3;

                  then:
                    - if:
                        condition:
                          lambda: |-
                            return id(power_state_3).state == "ON";

                        then:
                          - lvgl.widget.show:
                              id: ui_stop_rectifier_3_dialog

                        else:
                          - lvgl.widget.show:
                              id: ui_start_rectifier_3_dialog
