# ==============================================================================
# V5 LVGL PAGE: RECTIFIER DETAIL
# ==============================================================================
#
# Shared detail page for all three rectifiers.
#
# rectifier_detail_unit selects the active unit:
#   1 = Unit 1 / L1
#   2 = Unit 2 / L2
#   3 = Unit 3 / L3
#
# Runtime updates are handled by display/rectifier-detail.yaml.
# ==============================================================================

id: page_rectifier_detail
skip: true
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # HEADER AND STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 20
      y: 75
      width: 760
      height: 60
      styles: style_card

      widgets:
        - label:
            id: ui_rectifier_detail_title
            x: 16
            align: LEFT_MID
            width: 330
            text: "RECTIFIER --    ---- h"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_status
            x: -16
            align: RIGHT_MID
            width: 380
            text_align: RIGHT
            text: "CAN -- | PWR -- | --"
            text_font: montserrat_16
            text_color: 0x8B96A0

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 20
      y: 145
      width: 370
      height: 112
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "AC INPUT"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 44
            width: 75
            text: "Voltage"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_voltage
            x: 92
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- V"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 44
            width: 75
            text: "Current"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_current
            x: 266
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 76
            width: 75
            text: "Power"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_power
            x: 92
            y: 73
            width: 80
            text_align: RIGHT
            text: "---- W"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 76
            width: 75
            text: "Frequency"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_ac_frequency
            x: 266
            y: 73
            width: 80
            text_align: RIGHT
            text: "--.-- Hz"
            text_font: montserrat_18
            text_color: 0xFFFFFF

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 410
      y: 145
      width: 370
      height: 112
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "DC OUTPUT"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 44
            width: 75
            text: "Voltage"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_voltage
            x: 92
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- V"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 44
            width: 75
            text: "Current"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_current
            x: 266
            y: 41
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 76
            width: 75
            text: "Power"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_power
            x: 92
            y: 73
            width: 80
            text_align: RIGHT
            text: "---- W"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 190
            y: 76
            width: 75
            text: "Setpoint"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_dc_setpoint
            x: 266
            y: 73
            width: 80
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

  # ---------------------------------------------------------------------------
  # THERMAL AND INTERNAL FAN
  # ---------------------------------------------------------------------------

  - obj:
      x: 20
      y: 267
      width: 370
      height: 128
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "THERMAL / INTERNAL FAN"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_input_temp
            x: 16
            y: 45
            width: 150
            text: "IN  --.- °C"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_output_temp
            x: 190
            y: 45
            width: 155
            text_align: RIGHT
            text: "OUT  --.- °C"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_rpm
            x: 16
            y: 75
            width: 150
            text: "FAN  ---- RPM"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_duty
            x: 190
            y: 75
            width: 155
            text_align: RIGHT
            text: "MIN  --.- %"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_fan_min
            x: 16
            y: 102
            width: 150
            text: "TARGET --.- %"
            text_font: montserrat_16
            text_color: 0xFFFFFF

        - label:
            id: ui_rectifier_detail_capability
            x: 190
            y: 102
            width: 155
            text_align: RIGHT
            text: "CAP  --.- A"
            text_font: montserrat_16
            text_color: 0xFFFFFF

  # ---------------------------------------------------------------------------
  # FALLBACK AND CONTROL
  # ---------------------------------------------------------------------------

  - obj:
      x: 410
      y: 267
      width: 370
      height: 128
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "FALLBACK / CONTROL"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 47
            text: "Voltage"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_fallback_voltage
            x: 120
            y: 44
            width: 90
            text_align: RIGHT
            text: "--.- V"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 82
            text: "Current"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - label:
            id: ui_rectifier_detail_fallback_current
            x: 120
            y: 79
            width: 90
            text_align: RIGHT
            text: "--.- A"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - button:
            id: ui_rectifier_detail_fallback_edit
            x: 235
            y: 47
            width: 110
            height: 48

            widgets:
              - label:
                  align: CENTER
                  text: "EDIT"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(ui_fallback_voltage_edit) =
                    id(set_dc_voltage_limit_fallback).state;

                  id(ui_fallback_current_edit) =
                    id(set_dc_current_limit_fallback).state;

              - lvgl.spinbox.update:
                  id: ui_fallback_voltage_spinbox
                  value: !lambda |-
                    return id(ui_fallback_voltage_edit);

              - lvgl.spinbox.update:
                  id: ui_fallback_current_spinbox
                  value: !lambda |-
                    return id(ui_fallback_current_edit);

              - lvgl.widget.show: ui_fallback_dialog
