# ==============================================================================
# V5 LVGL PAGE: COOLING
# ==============================================================================
#
# Real cooling telemetry from the three Huawei R4875G1 rectifiers plus the
# shared compartment AHT10 sensor.
#
# External chassis-fan hardware is intentionally not shown here until the
# corresponding v5 hardware has been implemented.

id: page_cooling
styles: style_page

widgets:

  # ============================================================================
  # COMPARTMENT ENVIRONMENT
  # ============================================================================

  - obj:
      x: 20
      y: 75
      width: 760
      height: 75
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "RECTIFIER COMPARTMENT"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_cooling_compartment_temperature
            x: 260
            y: 21
            width: 180
            text_align: CENTER
            text: "--.- °C"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            id: ui_cooling_compartment_humidity
            x: 520
            y: 21
            width: 180
            text_align: CENTER
            text: "--.- %"
            text_font: montserrat_24
            text_color: 0xFFFFFF


  # ============================================================================
  # RECTIFIER 1 FAN
  # ============================================================================

  - obj:
      x: 20
      y: 165
      width: 235
      height: 230
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "RECTIFIER 1 FAN"
            text_font: montserrat_18
            text_color: 0xFFFFFF

        - label:
            id: ui_cooling_r1_state
            x: 16
            y: 38
            width: 203
            text: "OFFLINE"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_cooling_r1_rpm
            x: 16
            y: 68
            width: 203
            text_align: CENTER
            text: "---- RPM"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 108
            text: "Minimum"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_cooling_r1_min_duty
            x: 115
            y: 106
            width: 100
            text_align: RIGHT
            text: "--.- %"
            text_font: montserrat_16
            text_color: 0xDDE3E8

        - label:
            x: 16
            y: 134
            text: "Target"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_cooling_r1_target_duty
            x: 115
            y: 132
            width: 100
            text_align: RIGHT
            text: "--.- %"
            text_font: montserrat_16
            text_color: 0xDDE3E8

        - label:
            id: ui_cooling_r1_temperature
            x: 16
            y: 160
            width: 95
            text: "--.- °C"
            text_font: montserrat_16
            text_color: 0xDDE3E8

        - label:
            id: ui_cooling_r1_thermal
            x: 115
            y: 160
            width: 100
            text_align: RIGHT
            text: "--"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - button:
            id: ui_cooling_r1_auto_button
            x: 16
            y: 188
            width: 94
            height: 32

            disabled:
              bg_color: 0x30343A
              border_color: 0x44484E

            widgets:
              - label:
                  align: CENTER
                  text: "AUTO"
                  text_font: montserrat_14

            on_short_click:
              - button.press: fan_auto_mode_button_1

        - button:
            id: ui_cooling_r1_full_button
            x: 125
            y: 188
            width: 94
            height: 32

            disabled:
              bg_color: 0x30343A
              border_color: 0x44484E

            widgets:
              - label:
                  align: CENTER
                  text: "FULL"
                  text_font: montserrat_14

            on_short_click:
              - button.press: fan_full_speed_button_1


