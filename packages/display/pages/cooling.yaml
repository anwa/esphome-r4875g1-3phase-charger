# ==============================================================================
# V5 LVGL PAGE: COOLING
# ==============================================================================
#
# Cooling overview for the three internal Huawei rectifier fans and the shared
# rear-compartment temperature and humidity measurement.
#
# External chassis-fan control is implemented separately in packages/cooling.yaml
# and is not currently exposed as a dedicated card on this page.
#
# Runtime updates are handled by display/cooling.yaml.
# ==============================================================================

id: page_cooling
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # COMPARTMENT ENVIRONMENT
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 780
      height: 55
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "COMPARTMENT"

        - label:
            id: ui_cooling_compartment_temperature
            x: 270
            y: 13
            width: 180
            text_align: CENTER
            text: "--.- °C"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            id: ui_cooling_compartment_humidity
            x: 530
            y: 13
            width: 180
            text_align: CENTER
            text: "--.- %"
            text_font: montserrat_24
            text_color: 0xFFFFFF

  # ---------------------------------------------------------------------------
  # RECTIFIER 1 FAN
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 135
      width: 253
      height: 265
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "RECTIFIER 1 FAN"

        - label:
            id: ui_cooling_r1_state
            x: 10
            y: 38
            width: 230
            text: "OFFLINE"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_cooling_r1_rpm
            x: 10
            y: 68
            width: 230
            text_align: CENTER
            text: "---- RPM"
            text_font: montserrat_24
            text_color: 0xFFFFFF

        - label:
            x: 10
            y: 108
            styles: style_desc_label
            text: "Minimum"

        - label:
            id: ui_cooling_r1_min_duty
            x: 130
            y: 106
            width: 110
            styles: style_value_label
            text: "--.- %"

        - label:
            x: 10
            y: 136
            styles: style_desc_label
            text: "Target"

        - label:
            id: ui_cooling_r1_target_duty
            x: 130
            y: 134
            width: 110
            styles: style_value_label
            text: "--.- %"

        - label:
            id: ui_cooling_r1_temperature
            x: 10
            y: 164
            width: 110
            text: "--.- °C"
            text_font: montserrat_16
            text_color: 0xDDE3E8

        - label:
            id: ui_cooling_r1_thermal
            x: 130
            y: 164
            width: 110
            text_align: RIGHT
            text: "--"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - button:
            id: ui_cooling_r1_auto_button
            x: 10
            y: 205
            width: 110
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "AUTO"
                  text_font: montserrat_16

            on_short_click:
              - button.press: fan_auto_mode_button_1

        - button:
            id: ui_cooling_r1_full_button
            x: 130
            y: 205
            width: 110
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "FULL"
                  text_font: montserrat_16

            on_short_click:
              - button.press: fan_full_speed_button_1

