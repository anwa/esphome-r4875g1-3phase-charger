# ==============================================================================
# V5 LVGL PAGE: DASHBOARD
# ==============================================================================
#
# Main charger overview with aggregate AC/DC telemetry, charger status and
# charger-wide setpoint controls.
#
# Runtime updates are handled by display/dashboard.yaml.
# ==============================================================================

id: page_dashboard
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 20
      y: 75
      width: 235
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "AC INPUT"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_ac_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_ac_voltage
            align: TOP_MID
            y: 105
            text: "--- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_ac_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 270
      y: 75
      width: 235
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "DC OUTPUT"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_dc_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_dc_voltage
            align: TOP_MID
            y: 105
            text: "--.-- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_dc_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8

  # ---------------------------------------------------------------------------
  # CHARGER STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 520
      y: 75
      width: 260
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "CHARGER"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 48
            text: "Units"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_units
            x: 145
            y: 48
            text: "- / 3"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 83
            text: "Max Temp"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_temperature
            x: 145
            y: 83
            text: "--.- °C"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 118
            text: "Efficiency"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_efficiency
            x: 145
            y: 118
            text: "--.- %"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        # Charger-wide START/STOP control.
        - button:
            id: ui_dashboard_power_button
            x: 16
            y: 145
            styles: style_dialog_button
            width: 228

            widgets:
              - label:
                  id: ui_dashboard_power_button_label
                  align: CENTER
                  text: "START CHARGER"
                  text_font: montserrat_16
                  text_color: 0xFFFFFF

            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      return
                        !isnan(id(running_units).state) &&
                        id(running_units).state > 0.0f;

                  then:
                    - lvgl.widget.show: ui_stop_charger_dialog

                  else:
                    - lvgl.widget.show: ui_start_charger_dialog

  # ---------------------------------------------------------------------------
  # SETPOINTS
  # ---------------------------------------------------------------------------

  - obj:
      x: 20
      y: 295
      width: 760
      height: 100
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 8
            text: "SETPOINTS"
            text_font: montserrat_18
            text_color: 0x8B96A0

        # DC voltage setpoint.
        - label:
            x: 35
            y: 45
            text: "Voltage"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - button:
            x: 114
            y: 30
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: montserrat_20

            on_short_click:
              - number.decrement:
                  id: set_dc_voltage_limit
                  cycle: false

        - label:
            id: ui_dashboard_set_voltage
            x: 170
            y: 44
            width: 85
            text_align: CENTER
            text: "--.- V"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - button:
            x: 259
            y: 30
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: montserrat_20

            on_short_click:
              - number.increment:
                  id: set_dc_voltage_limit
                  cycle: false


        # Total DC power setpoint.
        - label:
            x: 335
            y: 45
            text: "Power"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - button:
            x: 394
            y: 30
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: montserrat_20

            on_short_click:
              - number.decrement:
                  id: set_dc_sum_power
                  cycle: false

        - label:
            id: ui_dashboard_set_power
            x: 450
            y: 44
            width: 95
            text_align: CENTER
            text: "--.-- kW"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - button:
            x: 549
            y: 30
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: montserrat_20

            on_short_click:
              - number.increment:
                  id: set_dc_sum_power
                  cycle: false

        # Applied per-unit DC current limit.
        - label:
            x: 625
            y: 25
            text: "Applied"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_set_current
            x: 615
            y: 52
            width: 120
            text_align: CENTER
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xFFFFFF
