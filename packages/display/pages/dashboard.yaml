# ==============================================================================
# V5 LVGL PAGE: DASHBOARD
# ==============================================================================
#
# Main charger overview with aggregate AC/DC telemetry, charger status and
# charger-wide setpoint controls.
#
# Runtime updates are handled by display/dashboard.yaml.
# ==============================================================================

id: page_dashboard
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 253
      height: 220
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "AC INPUT"

        - label:
            id: ui_dashboard_ac_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_ac_voltage
            align: TOP_MID
            y: 105
            text: "--- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_ac_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 273
      y: 70
      width: 253
      height: 220
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "DC OUTPUT"

        - label:
            id: ui_dashboard_dc_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_dc_voltage
            align: TOP_MID
            y: 105
            text: "--.-- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_dc_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8

  # ---------------------------------------------------------------------------
  # CHARGER STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 536
      y: 70
      width: 253
      height: 220
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "CHARGER"

        - label:
            x: 10
            y: 44
            styles: style_desc_label
            text: "Units"

        - label:
            id: ui_dashboard_units
            x: 145
            y: 41
            styles: style_value_label
            text: "- / 3"

        - label:
            x: 10
            y: 76
            styles: style_desc_label
            text: "Max Temp"

        - label:
            id: ui_dashboard_temperature
            x: 145
            y: 73
            styles: style_value_label
            text: "--.- °C"

        - label:
            x: 10
            y: 108
            styles: style_desc_label
            text: "Efficiency"

        - label:
            id: ui_dashboard_efficiency
            x: 145
            y: 106
            styles: style_value_label
            text: "--.- %"

        # Charger-wide START/STOP control.
        - button:
            id: ui_dashboard_power_button
            x: 10
            y: 160
            styles: style_dialog_button
            width: 233

            widgets:
              - label:
                  id: ui_dashboard_power_button_label
                  align: CENTER
                  text: "START CHARGER"
                  text_font: montserrat_16
                  text_color: 0xFFFFFF

            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      return
                        !isnan(id(running_units).state) &&
                        id(running_units).state > 0.0f;

                  then:
                    - lvgl.widget.show: ui_stop_charger_dialog

                  else:
                    - lvgl.widget.show: ui_start_charger_dialog

  # ---------------------------------------------------------------------------
  # SETPOINTS
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 300
      width: 780
      height: 100
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "SETPOINTS"

        # DC voltage setpoint.
        - label:
            x: 20
            y: 55
            text: "Voltage"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - button:
            x: 100
            y: 40
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: montserrat_20

            on_short_click:
              - number.decrement:
                  id: set_dc_voltage_limit
                  cycle: false

        - label:
            id: ui_dashboard_set_voltage
            x: 150
            y: 55
            width: 90
            text_align: CENTER
            text: "--.- V"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - button:
            x: 240
            y: 40
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: montserrat_20

            on_short_click:
              - number.increment:
                  id: set_dc_voltage_limit
                  cycle: false


        # Total DC power setpoint.
        - label:
            x: 310
            y: 55
            text: "Power"
            text_font: montserrat_16
            text_color: 0x8B96A0

        - button:
            x: 380
            y: 40
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: montserrat_20

            on_short_click:
              - number.decrement:
                  id: set_dc_sum_power
                  cycle: false

        - label:
            id: ui_dashboard_set_power
            x: 430
            y: 55
            width: 105
            text_align: CENTER
            text: "--.-- kW"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - button:
            x: 535
            y: 40
            styles: style_dialog_step_button

            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: montserrat_20

            on_short_click:
              - number.increment:
                  id: set_dc_sum_power
                  cycle: false

        # Applied per-unit DC current limit.
        - label:
            x: 625
            y: 25
            width: 120
            text_align: CENTER
            text: "Applied"
            text_font: montserrat_14
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_set_current
            x: 625
            y: 55
            width: 120
            text_align: CENTER
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xFFFFFF
