# ==============================================================================
# LVGL PAGE: DASHBOARD
# ==============================================================================
# Main blackstart/offline overview. Detailed rectifier, cooling and controller
# diagnostics live on separate pages.

lvgl:
  pages:
    - id: charger_dashboard
      bg_color: 0xF3F5F8
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 64
            styles: style_header
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  x: 10
                  y: 8
                  width: 300
                  text_align: CENTER
                  text: "R4875G1 Charger"
                  text_font: ui_font_26_bold
              - label:
                  id: ui_clock
                  x: 10
                  y: 42
                  width: 145
                  text: "--.--.---- --:--"
                  text_font: ui_font_14
                  text_color: 0xFFFFFF
              - label:
                  x: 145
                  y: 42
                  width: 70
                  text_align: CENTER
                  text: "v${firmware_version}"
                  text_font: ui_font_14
                  text_color: 0xFFFFFF
              - label:
                  id: ui_run_state
                  x: 215
                  y: 40
                  width: 95
                  text_align: RIGHT
                  text: "OFF"
                  text_font: ui_font_18_bold
                  text_color: 0xFF3030

        - obj:
            x: 8
            y: 72
            width: 148
            height: 82
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "AC INPUT"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_ac_power
                  x: 0
                  y: 17
                  text: "--.-- kW"
                  text_font: ui_font_26_bold
                  text_color: 0x1769AA
              - label:
                  id: ui_ac_detail
                  x: 0
                  y: 49
                  text: "-- V  -- A"
                  text_font: ui_font_14

        - obj:
            x: 164
            y: 72
            width: 148
            height: 82
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "DC OUTPUT"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_dc_power
                  x: 0
                  y: 17
                  text: "--.-- kW"
                  text_font: ui_font_26_bold
                  text_color: 0x198754
              - label:
                  id: ui_dc_detail
                  x: 0
                  y: 49
                  text: "-- V  -- A"
                  text_font: ui_font_14

        - obj:
            x: 8
            y: 162
            width: 304
            height: 78
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "CHARGER"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_dashboard_status
                  x: 0
                  y: 22
                  text: "Units --/3   Temp --.- C"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_dashboard_efficiency
                  x: 0
                  y: 48
                  text: "Efficiency --.- %"
                  text_font: ui_font_14
                  text_color: 0x657080

        - obj:
            x: 8
            y: 248
            width: 304
            height: 128
            styles: style_card
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  text: "LOCAL SETPOINTS"
                  text_font: ui_font_14
                  text_color: 0x657080
              - label:
                  id: ui_set_voltage
                  x: 0
                  y: 26
                  text: "> Voltage  --.- V"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_set_power
                  x: 0
                  y: 55
                  text: "  Power    --.-- kW"
                  text_font: ui_font_18_bold
              - label:
                  id: ui_set_current
                  x: 0
                  y: 86
                  text: "Applied --.- A/unit"
                  text_font: ui_font_14
                  text_color: 0x657080

        - label:
            x: 8
            y: 448
            width: 304
            text_align: CENTER
            text: "Press select | Double page | Hold START/STOP"
            text_font: ui_font_14
            text_color: 0x657080

interval:
  - interval: 500ms
    then:
      - lvgl.label.update:
          id: ui_clock
          text: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return std::string("--.--.---- --:--");
            return str_sprintf("%02d.%02d.%04d %02d:%02d", now.day_of_month, now.month, now.year, now.hour, now.minute);
      - lvgl.label.update:
          id: ui_ac_power
          text: !lambda |-
            if (isnan(id(combined_ac_power).state)) return std::string("--.-- kW");
            return str_sprintf("%.2f kW", id(combined_ac_power).state);
      - lvgl.label.update:
          id: ui_ac_detail
          text: !lambda |-
            float v = 0.0f, a = 0.0f; int n = 0;
            if (id(can_com_ok_1).state && !isnan(id(ac_voltage_1).state) && !isnan(id(ac_current_1).state)) { v += id(ac_voltage_1).state; a += id(ac_current_1).state; n++; }
            if (id(can_com_ok_2).state && !isnan(id(ac_voltage_2).state) && !isnan(id(ac_current_2).state)) { v += id(ac_voltage_2).state; a += id(ac_current_2).state; n++; }
            if (id(can_com_ok_3).state && !isnan(id(ac_voltage_3).state) && !isnan(id(ac_current_3).state)) { v += id(ac_voltage_3).state; a += id(ac_current_3).state; n++; }
            if (!n) return std::string("CAN offline");
            return str_sprintf("%.0f V  %.1f A", v/n, a/n);
      - lvgl.label.update:
          id: ui_dc_power
          text: !lambda |-
            if (isnan(id(combined_dc_power).state)) return std::string("--.-- kW");
            return str_sprintf("%.2f kW", id(combined_dc_power).state);
      - lvgl.label.update:
          id: ui_dc_detail
          text: !lambda |-
            if (isnan(id(average_dc_voltage).state) || isnan(id(combined_dc_current).state)) return std::string("CAN offline");
            return str_sprintf("%.1f V  %.1f A", id(average_dc_voltage).state, id(combined_dc_current).state);
      - lvgl.label.update:
          id: ui_run_state
          text: !lambda |-
            int on = 0;
            if (id(can_com_ok_1).state && id(power_state_1).state == "ON") on++;
            if (id(can_com_ok_2).state && id(power_state_2).state == "ON") on++;
            if (id(can_com_ok_3).state && id(power_state_3).state == "ON") on++;
            return on == 0 ? std::string("OFF") : str_sprintf("%d/3 ON", on);
          text_color: !lambda |-
            int on = 0;
            if (id(can_com_ok_1).state && id(power_state_1).state == "ON") on++;
            if (id(can_com_ok_2).state && id(power_state_2).state == "ON") on++;
            if (id(can_com_ok_3).state && id(power_state_3).state == "ON") on++;
            return on == 3 ? lv_color_hex(0x5CFF7A) : lv_color_hex(0xFF3030);
      - lvgl.label.update:
          id: ui_dashboard_status
          text: !lambda |-
            const float t = id(highest_output_temperature).state;
            if (isnan(t)) return str_sprintf("Units %.0f/3   Temp --.- C", id(available_units).state);
            return str_sprintf("Units %.0f/3   Temp %.1f C", id(available_units).state, t);
      - lvgl.label.update:
          id: ui_dashboard_efficiency
          text: !lambda |-
            if (isnan(id(conversion_efficiency).state)) return std::string("Efficiency --.- %");
            return str_sprintf("Efficiency %.1f %%", id(conversion_efficiency).state);
      # ----------------------------------------------------------------------
      # DC Voltage SELECT / EDIT presentation
      - lvgl.label.update:
          id: ui_set_voltage

          text: !lambda |-
            const bool selected =
              id(encoder_selection) == 0;

            const bool editing =
              id(encoder_edit_mode) && selected;

            const float value =
              editing
                ? id(encoder_edit_value)
                : id(set_dc_voltage_limit).state;

            return str_sprintf(
              "%s Voltage  %.1f V",
              !id(encoder_edit_mode) && selected
                ? ">"
                : " ",
              value
            );

          # SELECT:
          #   selected parameter = blue
          #
          # EDIT:
          #   edited parameter = white text on dark background
          text_color: !lambda |-
            if (
              id(encoder_edit_mode) &&
              id(encoder_selection) == 0
            ) {
              return lv_color_hex(0xFFFFFF);
            }

            if (
              !id(encoder_edit_mode) &&
              id(encoder_selection) == 0
            ) {
              return lv_color_hex(0x1769AA);
            }

            return lv_color_hex(0x182433);

          bg_color: 0x182433

          bg_opa: !lambda |-
            return
              id(encoder_edit_mode) &&
              id(encoder_selection) == 0
                ? LV_OPA_COVER
                : LV_OPA_TRANSP;

      # ----------------------------------------------------------------------
      # DC Sum Power SELECT / EDIT presentation
      - lvgl.label.update:
          id: ui_set_power

          text: !lambda |-
            const bool selected =
              id(encoder_selection) == 1;

            const bool editing =
              id(encoder_edit_mode) && selected;

            const float value =
              editing
                ? id(encoder_edit_value)
                : id(set_dc_sum_power).state;

            return str_sprintf(
              "%s Power    %.2f kW",
              !id(encoder_edit_mode) && selected
                ? ">"
                : " ",
              value
            );

          text_color: !lambda |-
            if (
              id(encoder_edit_mode) &&
              id(encoder_selection) == 1
            ) {
              return lv_color_hex(0xFFFFFF);
            }

            if (
              !id(encoder_edit_mode) &&
              id(encoder_selection) == 1
            ) {
              return lv_color_hex(0x1769AA);
            }

            return lv_color_hex(0x182433);

          bg_color: 0x182433

          bg_opa: !lambda |-
            return
              id(encoder_edit_mode) &&
              id(encoder_selection) == 1
                ? LV_OPA_COVER
                : LV_OPA_TRANSP;
      - lvgl.label.update:
          id: ui_set_current
          text: !lambda 'return str_sprintf("Applied %.1f A/unit", id(applied_dc_current_limit_sensor).state);'
