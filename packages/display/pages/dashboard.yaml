# ==============================================================================
# V5 LVGL PAGE: DASHBOARD
# ==============================================================================
# Main charger overview.
#
# v5.0.9 Part 2 connects the static 800x480 dashboard layout to the proven
# charger telemetry and setpoint entities restored from v4.

id: page_dashboard
styles: style_page

widgets:

  # ============================================================================
  # AC INPUT
  # ============================================================================

  - obj:
      x: 20
      y: 75
      width: 235
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "AC INPUT"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_ac_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_ac_voltage
            align: TOP_MID
            y: 105
            text: "--- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_ac_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8


  # ============================================================================
  # DC OUTPUT
  # ============================================================================

  - obj:
      x: 270
      y: 75
      width: 235
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "DC OUTPUT"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_dc_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            id: ui_dashboard_dc_voltage
            align: TOP_MID
            y: 105
            text: "--.-- V"
            text_font: montserrat_20
            text_color: 0xDDE3E8

        - label:
            id: ui_dashboard_dc_current
            align: TOP_MID
            y: 139
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xDDE3E8


  # ============================================================================
  # CHARGER STATUS
  # ============================================================================

  - obj:
      x: 520
      y: 75
      width: 260
      height: 205
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 12
            text: "CHARGER"
            text_font: montserrat_20
            text_color: 0x8B96A0

        - label:
            x: 16
            y: 55
            text: "Units"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_units
            x: 145
            y: 55
            text: "- / 3"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 94
            text: "Max Temp"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_temperature
            x: 145
            y: 94
            text: "--.- °C"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 16
            y: 133
            text: "Efficiency"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_efficiency
            x: 145
            y: 133
            text: "--.- %"
            text_font: montserrat_20
            text_color: 0xFFFFFF


  # ============================================================================
  # SETPOINTS
  # ============================================================================

  - obj:
      x: 20
      y: 295
      width: 760
      height: 100
      styles: style_card

      widgets:
        - label:
            x: 16
            y: 10
            text: "SETPOINTS"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            x: 35
            y: 48
            text: "Voltage"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_set_voltage
            x: 115
            y: 46
            text: "--.- V"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 280
            y: 48
            text: "Power"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_set_power
            x: 345
            y: 46
            text: "--.-- kW"
            text_font: montserrat_20
            text_color: 0xFFFFFF

        - label:
            x: 510
            y: 48
            text: "Applied"
            text_font: montserrat_18
            text_color: 0x8B96A0

        - label:
            id: ui_dashboard_set_current
            x: 585
            y: 46
            text: "--.- A"
            text_font: montserrat_20
            text_color: 0xFFFFFF