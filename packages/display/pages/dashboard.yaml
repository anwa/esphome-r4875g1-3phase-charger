# ==============================================================================
# V5 LVGL PAGE: DASHBOARD
# ==============================================================================
#
# Main charger overview with aggregate AC/DC telemetry, charger status,
# battery-bank telemetry and access to charger-wide setpoint dialogs.
#
# Runtime updates are handled by display/dashboard.yaml.
# ==============================================================================

id: page_dashboard
styles: style_page

widgets:

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 10
      y: 70
      width: 189
      height: 330
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "AC INPUT"

        - label:
            id: ui_dashboard_ac_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        - label:
            x: 10
            y: 113
            width: 95
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_dashboard_ac_voltage
            x: 105
            y: 110
            width: 74
            styles: style_value_label
            text: "--- V"

        - label:
            x: 10
            y: 151
            width: 95
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_dashboard_ac_current
            x: 105
            y: 148
            width: 74
            styles: style_value_label
            text: "--.- A"

        - label:
            x: 10
            y: 189
            width: 95
            styles: style_desc_label
            text: "Current Limit"

        - label:
            id: ui_dashboard_ac_current_limit
            x: 105
            y: 186
            width: 74
            styles: style_value_label
            text: "--.- A"

        - button:
            id: ui_dashboard_ac_setpoints_button
            x: 10
            y: 270
            width: 169
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "SETPOINTS"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(ui_ac_setpoints_current_edit) =
                    id(set_ac_current_limit).state;

              - lvgl.spinbox.update:
                  id: ui_ac_setpoints_current_spinbox
                  value: !lambda |-
                    return id(ui_ac_setpoints_current_edit);

              - lvgl.widget.show: ui_ac_setpoints_dialog

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - obj:
      x: 207
      y: 70
      width: 189
      height: 330
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "DC OUTPUT"

        - label:
            id: ui_dashboard_dc_power
            align: TOP_MID
            y: 53
            text: "--.-- kW"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        - label:
            x: 10
            y: 105
            width: 95
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_dashboard_dc_voltage
            x: 105
            y: 102
            width: 74
            styles: style_value_label
            text: "--.-- V"

        - label:
            x: 10
            y: 137
            width: 95
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_dashboard_dc_current
            x: 105
            y: 134
            width: 74
            styles: style_value_label
            text: "--.- A"

        - label:
            x: 10
            y: 169
            width: 95
            styles: style_desc_label
            text: "Voltage Limit"

        - label:
            id: ui_dashboard_dc_voltage_limit
            x: 105
            y: 166
            width: 74
            styles: style_value_label
            text: "--.- V"

        - label:
            x: 10
            y: 201
            width: 95
            styles: style_desc_label
            text: "Sum Power"

        - label:
            id: ui_dashboard_dc_sum_power
            x: 105
            y: 198
            width: 74
            styles: style_value_label
            text: "--.- kW"

        - button:
            id: ui_dashboard_dc_setpoints_button
            x: 10
            y: 270
            width: 169
            styles: style_dialog_button

            widgets:
              - label:
                  align: CENTER
                  text: "SETPOINTS"
                  text_font: montserrat_16

            on_short_click:
              - lambda: |-
                  id(ui_dc_setpoints_voltage_edit) =
                    id(set_dc_voltage_limit).state;

                  id(ui_dc_setpoints_power_edit) =
                    id(set_dc_sum_power).state;

              - lvgl.spinbox.update:
                  id: ui_dc_setpoints_voltage_spinbox
                  value: !lambda |-
                    return id(ui_dc_setpoints_voltage_edit);

              - lvgl.spinbox.update:
                  id: ui_dc_setpoints_power_spinbox
                  value: !lambda |-
                    return id(ui_dc_setpoints_power_edit);

              - lvgl.widget.show: ui_dc_setpoints_dialog

  # ---------------------------------------------------------------------------
  # CHARGER STATUS
  # ---------------------------------------------------------------------------

  - obj:
      x: 404
      y: 70
      width: 189
      height: 330
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "CHARGER"

        - label:
            x: 10
            y: 80
            width: 95
            styles: style_desc_label
            text: "Available"

        - label:
            id: ui_dashboard_units
            x: 105
            y: 77
            width: 74
            styles: style_value_label
            text: "- / 3"

        - label:
            x: 10
            y: 120
            width: 95
            styles: style_desc_label
            text: "Running"

        - label:
            id: ui_dashboard_running_units
            x: 105
            y: 117
            width: 74
            styles: style_value_label
            text: "- / 3"

        - label:
            x: 10
            y: 160
            width: 95
            styles: style_desc_label
            text: "Max Temp"

        - label:
            id: ui_dashboard_temperature
            x: 105
            y: 157
            width: 74
            styles: style_value_label
            text: "--.- °C"

        - label:
            x: 10
            y: 200
            width: 95
            styles: style_desc_label
            text: "Efficiency"

        - label:
            id: ui_dashboard_efficiency
            x: 105
            y: 197
            width: 74
            styles: style_value_label
            text: "--.- %"

        # Charger-wide START/STOP control.
        - button:
            id: ui_dashboard_power_button
            x: 10
            y: 270
            width: 169
            styles: style_dialog_button

            widgets:
              - label:
                  id: ui_dashboard_power_button_label
                  align: CENTER
                  text: "START CHARGER"
                  text_font: montserrat_16
                  text_color: 0xFFFFFF

            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      return
                        !isnan(id(running_units).state) &&
                        id(running_units).state > 0.0f;

                  then:
                    - lvgl.widget.show: ui_stop_charger_dialog

                  else:
                    - lvgl.widget.show: ui_start_charger_dialog

  # ---------------------------------------------------------------------------
  # BATTERY BANK
  # ---------------------------------------------------------------------------

  - obj:
      x: 601
      y: 70
      width: 189
      height: 330
      styles: style_card

      widgets:
        - label:
            x: 10
            y: 10
            styles: style_title_label
            text: "BATTERY BANK"

        - label:
            x: 10
            y: 48
            styles: style_desc_label
            text: "SOC"

        - label:
            id: ui_dashboard_battery_soc
            align: TOP_MID
            y: 67
            text: "--.- %"
            text_font: montserrat_32
            text_color: 0xFFFFFF

        - label:
            x: 10
            y: 125
            width: 95
            styles: style_desc_label
            text: "Power"

        - label:
            id: ui_dashboard_battery_power
            x: 105
            y: 122
            width: 74
            styles: style_value_label
            text: "--.-- kW"

        - label:
            x: 10
            y: 157
            width: 95
            styles: style_desc_label
            text: "Voltage"

        - label:
            id: ui_dashboard_battery_voltage
            x: 105
            y: 154
            width: 74
            styles: style_value_label
            text: "--.-- V"

        - label:
            x: 10
            y: 189
            width: 95
            styles: style_desc_label
            text: "Current"

        - label:
            id: ui_dashboard_battery_current
            x: 105
            y: 186
            width: 74
            styles: style_value_label
            text: "--.- A"

        - label:
            x: 10
            y: 221
            width: 95
            styles: style_desc_label
            text: "Temperature"

        - label:
            id: ui_dashboard_battery_temperature
            x: 105
            y: 218
            width: 74
            styles: style_value_label
            text: "--.- °C"

        - label:
            id: ui_dashboard_battery_state
            align: TOP_MID
            y: 270
            width: 169
            text_align: CENTER
            text: "NO HA DATA"
            text_font: montserrat_18
            text_color: 0x8B96A0
