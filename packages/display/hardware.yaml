# ==============================================================================
# V5 DISPLAY HARDWARE
# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7
# Native 800x480 RGB panel with GT911 capacitive touch input.

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: charger_display

    auto_clear_enabled: false
    update_interval: never


# ==============================================================================
# LVGL RUNTIME
# ==============================================================================

lvgl:
  displays:
    - charger_display

  touchscreens:
    - touchscreen_id: charger_touchscreen

  buffer_size: 100%
  color_depth: 16
  log_level: WARN
  page_wrap: true