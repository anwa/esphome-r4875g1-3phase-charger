# ==============================================================================
# SHARED DISPLAY HARDWARE
# ==============================================================================
#
# Defines the Waveshare ESP32-S3-Touch-LCD-7 display, backlight and LVGL
# hardware integration shared by the Charger Controller and Remote HMI.
#
# Network and recovery services intentionally initialize before the RGB display
# and LVGL so Wi-Fi can reserve its required internal/DMA-capable memory before
# the display stack allocates runtime resources.
# ==============================================================================

# ==============================================================================
# DISPLAY BACKLIGHT
# ==============================================================================
#
# CH422G EXIO2 drives the onboard DISP / backlight-enable signal.
# The backlight is enabled after boot and can be disabled by the LVGL idle
# runtime without stopping the RGB display controller itself.
# ==============================================================================

switch:
  - platform: gpio
    id: display_backlight
    internal: true
    restore_mode: ALWAYS_ON

    pin:
      ch422g: io_expander
      number: 2
      mode:
        output: true

# ==============================================================================
# DISPLAY ACTIVITY
# ==============================================================================
#
# Touch and optional external motion sources share the same LVGL inactivity
# timer. Motion state defaults to inactive when no motion package is composed.
#
# The activity script can optionally wake a paused display and always resets the
# native LVGL inactivity timer. This keeps display_idle_timeout as the single
# source of truth for automatic display shutoff.
# ==============================================================================

globals:
  - id: display_motion_active
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: display_register_activity
    mode: restart

    parameters:
      wake: bool

    then:
      - if:
          condition:
            and:
              - lambda: |-
                  return wake;
              - lvgl.is_paused

          then:
            - switch.turn_on: display_backlight

            - lvgl.resume:

            - lvgl.widget.redraw:

      - lambda: |-
          lv_display_trigger_activity(nullptr);

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: charger_display

    # Wi-Fi initializes at priority 250 and API/OTA at priority 200. Starting
    # the RGB display afterwards preserves internal memory for network recovery
    # services while still completing before LVGL.
    setup_priority: 190

    auto_clear_enabled: false
    update_interval: never


# ==============================================================================
# LVGL RUNTIME
# ==============================================================================

lvgl:
  # Start after the RGB display while keeping both display stages behind the
  # network and recovery services.
  setup_priority: 180

  displays:
    - charger_display

  touchscreens:
    - touchscreen_id: charger_touchscreen

  # A wake-up touch is handled explicitly by the touchscreen on_release
  # automation so the first blind touch cannot operate an LVGL control.
  resume_on_input: false

  on_idle:
    - timeout: ${display_idle_timeout}
      then:
        - if:
            condition:
              lambda: |-
                return id(display_motion_active);

            then:
              # Continuous motion keeps the existing LVGL idle timer alive
              # without introducing a second display timeout.
              - script.execute:
                  id: display_register_activity
                  wake: false

            else:
              - logger.log:
                  level: INFO
                  format: "Display idle timeout reached; turning backlight off."

              - lvgl.pause:
                  show_snow: false

              - switch.turn_off: display_backlight

  buffer_size: 30%
  color_depth: 16
  log_level: WARN
  page_wrap: true
