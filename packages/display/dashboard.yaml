# ==============================================================================
# V5 DASHBOARD DISPLAY RUNTIME
# ==============================================================================
#
# Dashboard widgets are refreshed only while page_dashboard is visible.
# Persistent header updates are handled separately by display/header.yaml.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 0;

          then:

            # ---------------------------------------------------------------------------
            # AC INPUT POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_power
                text: !lambda |-
                  if (isnan(id(combined_ac_power).state)) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(combined_ac_power).state
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT VOLTAGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_voltage
                text: !lambda |-
                  if (isnan(id(average_ac_voltage).state)) {
                    return std::string("--- V");
                  }

                  return str_sprintf(
                    "%.0f V",
                    id(average_ac_voltage).state
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT CURRENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_current
                text: !lambda |-
                  if (isnan(id(average_ac_current).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(average_ac_current).state
                  );

            # ---------------------------------------------------------------------------
            # DC OUTPUT POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_power
                text: !lambda |-
                  if (isnan(id(combined_dc_power).state)) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(combined_dc_power).state
                  );

            # ---------------------------------------------------------------------------
            # DC OUTPUT VOLTAGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_voltage
                text: !lambda |-
                  if (isnan(id(average_dc_voltage).state)) {
                    return std::string("--.-- V");
                  }

                  return str_sprintf(
                    "%.2f V",
                    id(average_dc_voltage).state
                  );

            # ---------------------------------------------------------------------------
            # COMBINED DC OUTPUT CURRENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_current
                text: !lambda |-
                  if (isnan(id(combined_dc_current).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(combined_dc_current).state
                  );

            # ---------------------------------------------------------------------------
            # AVAILABLE UNITS
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_units
                text: !lambda |-
                  if (isnan(id(available_units).state)) {
                    return std::string("- / 3");
                  }

                  return str_sprintf(
                    "%.0f / 3",
                    id(available_units).state
                  );

            # ---------------------------------------------------------------------------
            # HIGHEST RECTIFIER OUTPUT TEMPERATURE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_temperature
                text: !lambda |-
                  if (isnan(id(highest_output_temperature).state)) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(highest_output_temperature).state
                  );

            # ---------------------------------------------------------------------------
            # CONVERSION EFFICIENCY
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_efficiency
                text: !lambda |-
                  if (isnan(id(conversion_efficiency).state)) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(conversion_efficiency).state
                  );

            # ---------------------------------------------------------------------------
            # DC VOLTAGE SETPOINT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_set_voltage
                text: !lambda |-
                  if (isnan(id(set_dc_voltage_limit).state)) {
                    return std::string("--.- V");
                  }

                  return str_sprintf(
                    "%.1f V",
                    id(set_dc_voltage_limit).state
                  );

            # ---------------------------------------------------------------------------
            # TOTAL DC POWER SETPOINT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_set_power
                text: !lambda |-
                  if (isnan(id(set_dc_sum_power).state)) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(set_dc_sum_power).state
                  );

            # ---------------------------------------------------------------------------
            # APPLIED PER-UNIT DC CURRENT LIMIT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_set_current
                text: !lambda |-
                  if (isnan(id(applied_dc_current_limit_sensor).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(applied_dc_current_limit_sensor).state
                  );

            # ---------------------------------------------------------------------------
            # CHARGER POWER COMMAND TRANSITION
            # ---------------------------------------------------------------------------

            - lambda: |-
                const uint32_t now = millis();
                const uint8_t pending = id(ui_charger_power_pending);

                if (pending == 0) {
                  return;
                }

                bool any_on = false;
                bool all_available_on = true;
                int available = 0;

                if (id(can_com_ok_1).state) {
                  available++;
                  if (id(power_state_1).state == "ON") {
                    any_on = true;
                  } else {
                    all_available_on = false;
                  }
                }

                if (id(can_com_ok_2).state) {
                  available++;
                  if (id(power_state_2).state == "ON") {
                    any_on = true;
                  } else {
                    all_available_on = false;
                  }
                }

                if (id(can_com_ok_3).state) {
                  available++;
                  if (id(power_state_3).state == "ON") {
                    any_on = true;
                  } else {
                    all_available_on = false;
                  }
                }

                bool completed = false;

                if (pending == 1) {
                  completed =
                    available > 0 &&
                    all_available_on;
                } else if (pending == 2) {
                  completed = !any_on;
                }

                const bool timed_out =
                  static_cast<uint32_t>(
                    now - id(ui_charger_power_pending_since)
                  ) >= 10000UL;

                if (completed || timed_out) {
                  if (timed_out && !completed) {
                    ESP_LOGW(
                      "ui",
                      "Charger power command UI timeout."
                    );
                  }

                  id(ui_charger_power_pending) = 0;
                }

            # ---------------------------------------------------------------------------
            # CHARGER POWER BUTTON
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_power_button_label
                text: !lambda |-
                  if (id(ui_charger_power_pending) == 1) {
                    return std::string("STARTING...");
                  }

                  if (id(ui_charger_power_pending) == 2) {
                    return std::string("STOPPING...");
                  }

                  if (
                    isnan(id(available_units).state) ||
                    id(available_units).state < 1
                  ) {
                    return std::string("NO RECTIFIERS");
                  }

                  const bool running =
                    !isnan(id(running_units).state) &&
                    id(running_units).state > 0.0f;

                  return running
                    ? std::string("STOP CHARGER")
                    : std::string("START CHARGER");

            # ---------------------------------------------------------------------------
            # CHARGER POWER BUTTON AVAILABILITY
            # ---------------------------------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return
                      id(ui_charger_power_pending) == 0 &&
                      id(ui_rectifier_1_power_pending) == 0 &&
                      id(ui_rectifier_2_power_pending) == 0 &&
                      id(ui_rectifier_3_power_pending) == 0 &&
                      !isnan(id(available_units).state) &&
                      id(available_units).state > 0;

                then:
                  - lvgl.widget.enable:
                      id: ui_dashboard_power_button

                else:
                  - lvgl.widget.disable:
                      id: ui_dashboard_power_button
