# ==============================================================================
# DASHBOARD DISPLAY RUNTIME
# ==============================================================================
#
# Dashboard widgets are refreshed only while page_dashboard is visible.
# Persistent header updates are handled separately by display/header.yaml.
#
# Battery-bank telemetry is monitoring-only and never participates in charger
# control or safety decisions.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 0;

          then:

            # ---------------------------------------------------------------------------
            # AC INPUT POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_power
                text: !lambda |-
                  if (isnan(id(ui_model_ac_power).state)) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(ui_model_ac_power).state
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT VOLTAGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_voltage
                text: !lambda |-
                  if (isnan(id(ui_model_ac_voltage).state)) {
                    return std::string("--- V");
                  }

                  return str_sprintf(
                    "%.0f V",
                    id(ui_model_ac_voltage).state
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT CURRENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_current
                text: !lambda |-
                  if (isnan(id(ui_model_ac_current).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_ac_current).state
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT CURRENT LIMIT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_ac_current_limit
                text: !lambda |-
                  if (isnan(id(ui_model_ac_current_limit).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_ac_current_limit).state
                  );

            # ---------------------------------------------------------------------------
            # DC OUTPUT POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_power
                text: !lambda |-
                  if (isnan(id(ui_model_dc_power).state)) {
                    return std::string("--.-- kW");
                  }

                  return str_sprintf(
                    "%.2f kW",
                    id(ui_model_dc_power).state
                  );

            # ---------------------------------------------------------------------------
            # DC OUTPUT VOLTAGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_voltage
                text: !lambda |-
                  if (isnan(id(ui_model_dc_voltage).state)) {
                    return std::string("--.-- V");
                  }

                  return str_sprintf(
                    "%.2f V",
                    id(ui_model_dc_voltage).state
                  );

            # ---------------------------------------------------------------------------
            # COMBINED DC OUTPUT CURRENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_current
                text: !lambda |-
                  if (isnan(id(ui_model_dc_current).state)) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_dc_current).state
                  );

            # ---------------------------------------------------------------------------
            # DC VOLTAGE LIMIT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_voltage_limit
                text: !lambda |-
                  if (isnan(id(ui_model_dc_voltage_limit).state)) {
                    return std::string("--.- V");
                  }

                  return str_sprintf(
                    "%.1f V",
                    id(ui_model_dc_voltage_limit).state
                  );

            # ---------------------------------------------------------------------------
            # DC SUM POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_dc_sum_power
                text: !lambda |-
                  if (isnan(id(ui_model_dc_sum_power).state)) {
                    return std::string("--.- kW");
                  }

                  return str_sprintf(
                    "%.1f kW",
                    id(ui_model_dc_sum_power).state
                  );

            # ---------------------------------------------------------------------------
            # AVAILABLE UNITS
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_units
                text: !lambda |-
                  if (isnan(id(ui_model_available_units).state)) {
                    return std::string("- / 3");
                  }

                  return str_sprintf(
                    "%.0f / 3",
                    id(ui_model_available_units).state
                  );

            # ---------------------------------------------------------------------------
            # RUNNING UNITS
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_running_units
                text: !lambda |-
                  if (isnan(id(ui_model_running_units).state)) {
                    return std::string("- / 3");
                  }

                  return str_sprintf(
                    "%.0f / 3",
                    id(ui_model_running_units).state
                  );

            # ---------------------------------------------------------------------------
            # HIGHEST RECTIFIER OUTPUT TEMPERATURE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_temperature
                text: !lambda |-
                  if (isnan(id(ui_model_highest_output_temperature).state)) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_highest_output_temperature).state
                  );

            # ---------------------------------------------------------------------------
            # CONVERSION EFFICIENCY
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_efficiency
                text: !lambda |-
                  if (isnan(id(ui_model_conversion_efficiency).state)) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_conversion_efficiency).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK STATE OF CHARGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_soc
                text: !lambda |-
                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_battery_soc).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK POWER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_power
                text: !lambda |-
                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("--.--- kW");
                  }

                  return str_sprintf(
                    "%.3f kW",
                    id(ui_model_battery_power).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK VOLTAGE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_voltage
                text: !lambda |-
                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("--.-- V");
                  }

                  return str_sprintf(
                    "%.2f V",
                    id(ui_model_battery_voltage).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK CURRENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_current
                text: !lambda |-
                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("--.- A");
                  }

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_battery_current).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK TEMPERATURE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_temperature
                text: !lambda |-
                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_battery_temperature).state
                  );

            # ---------------------------------------------------------------------------
            # BATTERY BANK OPERATING STATE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_battery_state

                text: !lambda |-
                  if (!id(ui_model_battery_source_connected).state) {
                    return std::string("HA OFFLINE");
                  }

                  if (!id(ui_model_battery_data_available).state) {
                    return std::string("NO DATA");
                  }

                  return id(ui_model_battery_state).state;

                text_color: !lambda |-
                  if (!id(ui_model_battery_source_connected).state) {
                    return lv_color_hex(0xFFC04A);
                  }

                  if (!id(ui_model_battery_data_available).state) {
                    return lv_color_hex(0x8B96A0);
                  }

                  const std::string state =
                    id(ui_model_battery_state).state;

                  if (
                    state == "Charging" ||
                    state == "charging"
                  ) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    state == "Discharging" ||
                    state == "discharging"
                  ) {
                    return lv_color_hex(0xFF3030);
                  }

                  if (
                    state == "Idle" ||
                    state == "idle" ||
                    state == "Standby" ||
                    state == "standby"
                  ) {
                    return lv_color_hex(0x8B96A0);
                  }

                  return lv_color_hex(0xFFC04A);

            # ---------------------------------------------------------------------------
            # CHARGER POWER BUTTON
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_dashboard_power_button_label
                text: !lambda |-
                  if (id(ui_charger_power_pending) == 1) {
                    return std::string("STARTING...");
                  }

                  if (id(ui_charger_power_pending) == 2) {
                    return std::string("STOPPING...");
                  }

                  if (
                    isnan(id(ui_model_available_units).state) ||
                    id(ui_model_available_units).state < 1
                  ) {
                    return std::string("NO RECTIFIERS");
                  }

                  const bool running =
                    !isnan(id(ui_model_running_units).state) &&
                    id(ui_model_running_units).state > 0.0f;

                  return running
                    ? std::string("STOP CHARGER")
                    : std::string("START CHARGER");

            # ---------------------------------------------------------------------------
            # CHARGER POWER BUTTON AVAILABILITY
            # ---------------------------------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return
                      id(ui_model_data_available).state &&
                      id(ui_charger_power_pending) == 0 &&
                      id(ui_rectifier_1_power_pending) == 0 &&
                      id(ui_rectifier_2_power_pending) == 0 &&
                      id(ui_rectifier_3_power_pending) == 0 &&
                      !isnan(id(ui_model_available_units).state) &&
                      id(ui_model_available_units).state > 0;

                then:
                  - lvgl.widget.enable:
                      id: ui_dashboard_power_button

                else:
                  - lvgl.widget.disable:
                      id: ui_dashboard_power_button

            # ---------------------------------------------------------------------------
            # DASHBOARD SETPOINT COMMAND AVAILABILITY
            # ---------------------------------------------------------------------------

            - if:
                condition:
                  lambda: |-
                    return id(ui_model_data_available).state;

                then:
                  - lvgl.widget.enable:
                      id: ui_dashboard_ac_setpoints_button

                  - lvgl.widget.enable:
                      id: ui_dashboard_dc_setpoints_button

                else:
                  - lvgl.widget.disable:
                      id: ui_dashboard_ac_setpoints_button

                  - lvgl.widget.disable:
                      id: ui_dashboard_dc_setpoints_button
