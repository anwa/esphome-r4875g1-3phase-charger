# ==============================================================================
# SHARED RECTIFIER COMMAND STATE
# ==============================================================================
#
# Resolves per-rectifier START/STOP pending presentation state from the
# authoritative shared UI model.
#
# Command completion therefore behaves identically when rectifier controls are
# used locally on the Charger Controller or remotely through Home Assistant.
# ==============================================================================

interval:

  - interval: 500ms
    then:

      # ---------------------------------------------------------------------------
      # RECTIFIER 1
      # ---------------------------------------------------------------------------

      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_1_power_pending);

          if (pending == 0) {
            return;
          }

          const std::string state =
            id(ui_model_rectifier_1_power_state).state;

          const bool state_valid =
            id(ui_model_data_available).state &&
            id(ui_model_rectifier_1_connected).state &&
            !state.empty();

          const bool completed =
            state_valid &&
            (
              (pending == 1 && state == "ON") ||
              (pending == 2 && state == "OFF")
            );

          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_1_power_pending_since)
            ) >= 10000UL;

          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 1 power command UI timeout."
              );
            }

            id(ui_rectifier_1_power_pending) = 0;
          }

      # ---------------------------------------------------------------------------
      # RECTIFIER 2
      # ---------------------------------------------------------------------------

      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_2_power_pending);

          if (pending == 0) {
            return;
          }

          const std::string state =
            id(ui_model_rectifier_2_power_state).state;

          const bool state_valid =
            id(ui_model_data_available).state &&
            id(ui_model_rectifier_2_connected).state &&
            !state.empty();

          const bool completed =
            state_valid &&
            (
              (pending == 1 && state == "ON") ||
              (pending == 2 && state == "OFF")
            );

          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_2_power_pending_since)
            ) >= 10000UL;

          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 2 power command UI timeout."
              );
            }

            id(ui_rectifier_2_power_pending) = 0;
          }

      # ---------------------------------------------------------------------------
      # RECTIFIER 3
      # ---------------------------------------------------------------------------

      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_3_power_pending);

          if (pending == 0) {
            return;
          }

          const std::string state =
            id(ui_model_rectifier_3_power_state).state;

          const bool state_valid =
            id(ui_model_data_available).state &&
            id(ui_model_rectifier_3_connected).state &&
            !state.empty();

          const bool completed =
            state_valid &&
            (
              (pending == 1 && state == "ON") ||
              (pending == 2 && state == "OFF")
            );

          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_3_power_pending_since)
            ) >= 10000UL;

          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 3 power command UI timeout."
              );
            }

            id(ui_rectifier_3_power_pending) = 0;
          }
