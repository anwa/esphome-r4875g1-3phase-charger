            - lambda: |-
                id(ui_rectifier_1_power_pending) = 2;
                id(ui_rectifier_1_power_pending_since) = millis();

            - lvgl.widget.disable:
                id: ui_rectifier_1_power_button

            - lvgl.label.update:
                id: ui_rectifier_1_power_button_label
                text: "STOPPING..."

            - button.press: off_button_1

    # --------------------------------------------------------------------------
    # RECTIFIER 2 START
    # --------------------------------------------------------------------------
    - id: ui_start_rectifier_2_dialog
      close_button: false
      title: "Start Rectifier 2?"

      body:
        text: "Start Rectifier 2?\n\nAll individual safety checks will be applied."
        text_font: montserrat_18

      buttons:
        - text: "CANCEL"
          on_click:
            - lvgl.widget.hide: ui_start_rectifier_2_dialog

        - text: "START"
          on_click:
            - lvgl.widget.hide: ui_start_rectifier_2_dialog

            - lambda: |-
                id(ui_rectifier_2_power_pending) = 1;
                id(ui_rectifier_2_power_pending_since) = millis();

            - lvgl.widget.disable:
                id: ui_rectifier_2_power_button

            - lvgl.label.update:
                id: ui_rectifier_2_power_button_label
                text: "STARTING..."

            - button.press: on_button_2

    # --------------------------------------------------------------------------
    # RECTIFIER 2 STOP
    # --------------------------------------------------------------------------
    - id: ui_stop_rectifier_2_dialog
      close_button: false
      title: "Stop Rectifier 2?"

      body:
        text: "Stop Rectifier 2?"
        text_font: montserrat_18

      buttons:
        - text: "CANCEL"
          on_click:
            - lvgl.widget.hide: ui_stop_rectifier_2_dialog

        - text: "STOP"
          on_click:
            - lvgl.widget.hide: ui_stop_rectifier_2_dialog

            - lambda: |-
                id(ui_rectifier_2_power_pending) = 2;
                id(ui_rectifier_2_power_pending_since) = millis();

            - lvgl.widget.disable:
                id: ui_rectifier_2_power_button

            - lvgl.label.update:
                id: ui_rectifier_2_power_button_label
