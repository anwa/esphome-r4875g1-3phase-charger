                width: 460
                height: 240
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 18
                      width: 420
                      text_align: CENTER
                      text: "START RECTIFIER 1"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  - label:
                      x: 35
                      y: 70
                      width: 390
                      text_align: CENTER
                      text: "Start Rectifier 1?\n\nAll individual safety checks will be applied."
                      text_font: montserrat_18
                      text_color: 0xDDE3E8

                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_start_rectifier_1_dialog

                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "START"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_start_rectifier_1_dialog

                        - lambda: |-
                            id(ui_rectifier_1_power_pending) = 1;
                            id(ui_rectifier_1_power_pending_since) = millis();

                        - lvgl.widget.disable:
                            id: ui_rectifier_1_power_button

                        - lvgl.label.update:
                            id: ui_rectifier_1_power_button_label
                            text: "STARTING..."

                        - script.execute:
                            id: ui_command_rectifier_start
                            unit: 1

      # ---------------------------------------------------------------------------
      # RECTIFIER 1 STOP
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_stop_rectifier_1_dialog
