# ==============================================================================
# CHARGER CONTROLLER LVGL USER INTERFACE
# ==============================================================================
#
# Defines Controller-specific pages, navigation, fallback controls and per-unit
# dialogs that are not yet part of the shared V6 presentation.
#
# Shared Dashboard and persistent-header presentation are owned separately by
# display/dashboard-ui.yaml and display/header-ui.yaml.
#
# Periodic runtime updates remain in the dedicated display runtime packages.
# ==============================================================================

lvgl:

  # ---------------------------------------------------------------------------
  # MAIN PAGES
  # ---------------------------------------------------------------------------

  pages:

    - !include pages/rectifiers.yaml
    - !include pages/rectifier-detail.yaml
    - !include pages/battery.yaml
    - !include pages/cooling.yaml
    - !include pages/system.yaml
    - !include pages/trends.yaml

  # ---------------------------------------------------------------------------
  # PERSISTENT HEADER AND NAVIGATION
  # ---------------------------------------------------------------------------

  top_layer:
    widgets:

      # Bottom navigation
      - button:
          x: 10
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 0;
            - lvgl.page.show: page_dashboard

      - button:
          x: 142
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 1;
            - lvgl.page.show: page_rectifiers

      - button:
          x: 274
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Battery"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;
            - lvgl.page.show: page_battery

      - button:
          x: 406
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Cooling"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 4;
            - lvgl.page.show: page_cooling

      - button:
          x: 538
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;
            - lvgl.page.show: page_system

      - button:
          x: 670
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Trends"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 6;
            - lvgl.page.show: page_trends

      # ---------------------------------------------------------------------------
      # FALLBACK SETTINGS DIALOG
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_fallback_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 300
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  # Title
                  - label:
                      x: 20
                      y: 16
                      width: 420
                      text_align: CENTER
                      text: "FALLBACK SETTINGS"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  # Voltage
                  - obj:
                      align: TOP_MID
                      y: 55
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      scrollbar_mode: "OFF"

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "DC Voltage"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_voltage_spinbox

                        - spinbox:
                            id: ui_fallback_voltage_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: ${dc_voltage_min_v}
                            range_to: ${dc_voltage_max_v}
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_fallback_voltage_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_voltage_spinbox

                  # Current
                  - obj:
                      align: TOP_MID
                      y: 115
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      scrollbar_mode: "OFF"

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "DC Current"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_current_spinbox

                        - spinbox:
                            id: ui_fallback_current_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: ${minimum_dc_current_a}
                            range_to: ${project_max_dc_current_a}
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_fallback_current_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_current_spinbox

                  # Cancel
                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16

                      on_short_click:
                        - lvgl.widget.hide: ui_fallback_dialog

                  # Save
                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "SAVE"
                            text_font: montserrat_16

                      on_short_click:
                        - number.set:
                            id: set_dc_voltage_limit_fallback
                            value: !lambda |-
                              return id(ui_fallback_voltage_edit);

                        - number.set:
                            id: set_dc_current_limit_fallback
                            value: !lambda |-
                              return id(ui_fallback_current_edit);

                        - lvgl.widget.hide: ui_fallback_dialog

      # ---------------------------------------------------------------------------
      # RECTIFIER 1 START
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_start_rectifier_1_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
