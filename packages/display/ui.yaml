            - button.press: off_button_3

# ==============================================================================
# V5 DISPLAY RUNTIME UPDATES
# ==============================================================================

interval:
  - interval: 500ms
    then:
      # ------------------------------------------------------------------------
      # Date / time
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_header_clock
          text: !lambda |-
            auto now = id(sntp_time).now();

            if (!now.is_valid()) {
              return std::string("--.--.---- --:--");
            }

            return str_sprintf(
              "%02d.%02d.%04d  %02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute
            );

      # ------------------------------------------------------------------------
      # Charger run state
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_run_state

          text: !lambda |-
            int online = 0;

            if (
              id(can_com_ok_1).state &&
              id(power_state_1).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_2).state &&
              id(power_state_2).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_3).state &&
              id(power_state_3).state == "ON"
            ) {
              online++;
            }

            if (online == 0) {
              return std::string("OFF");
            }

            return str_sprintf(
              "%d/3 ON",
              online
            );

          text_color: !lambda |-
            int online = 0;

            if (
              id(can_com_ok_1).state &&
              id(power_state_1).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_2).state &&
              id(power_state_2).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_3).state &&
              id(power_state_3).state == "ON"
            ) {
              online++;
            }

            return online == 3
              ? lv_color_hex(0x5CFF7A)
              : lv_color_hex(0xFF3030);

      # ========================================================================
      # RECTIFIER POWER COMMAND TRANSITIONS
      # ========================================================================
      #
      # These remain global because command completion/timeout handling must
      # continue even after leaving the Rectifiers page.
      # ========================================================================

      # ------------------------------------------------------------------------
      # Rectifier 1
      # ------------------------------------------------------------------------
      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_1_power_pending);
          if (pending == 0) {
            return;
          }
          const bool completed =
            (pending == 1 &&
             id(power_state_1).state == "ON") ||
            (pending == 2 &&
             id(power_state_1).state == "OFF");
          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_1_power_pending_since)
            ) >= 10000UL;
          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 1 power command UI timeout."
              );
            }
            id(ui_rectifier_1_power_pending) = 0;
          }
      # ------------------------------------------------------------------------
      # Rectifier 2
      # ------------------------------------------------------------------------
      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_2_power_pending);
          if (pending == 0) {
            return;
          }
          const bool completed =
            (pending == 1 &&
             id(power_state_2).state == "ON") ||
            (pending == 2 &&
             id(power_state_2).state == "OFF");
          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_2_power_pending_since)
            ) >= 10000UL;
          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 2 power command UI timeout."
              );
            }
            id(ui_rectifier_2_power_pending) = 0;
          }
      # ------------------------------------------------------------------------
      # Rectifier 3
      # ------------------------------------------------------------------------
      - lambda: |-
          const uint8_t pending =
            id(ui_rectifier_3_power_pending);
          if (pending == 0) {
            return;
          }
          const bool completed =
            (pending == 1 &&
             id(power_state_3).state == "ON") ||
            (pending == 2 &&
             id(power_state_3).state == "OFF");
          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_rectifier_3_power_pending_since)
            ) >= 10000UL;
          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Rectifier 3 power command UI timeout."
              );
            }
            id(ui_rectifier_3_power_pending) = 0;
          }

      # ========================================================================
      # SYSTEM PAGE
      # ========================================================================

      # ------------------------------------------------------------------------
      # Network
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_system_ip
          text: !lambda |-
            if (id(ip_address).state.empty()) {
              return std::string("--");
            }

            return id(ip_address).state;

      - lvgl.label.update:
          id: ui_system_wifi
          text: !lambda |-
            if (isnan(id(wifi_sig).state)) {
              return std::string("-- dBm");
            }

            return str_sprintf(
              "%.0f dBm",
              id(wifi_sig).state
            );

          text_color: !lambda |-
            if (isnan(id(wifi_sig).state)) {
              return lv_color_hex(0x8B96A0);
            }

            const float rssi = id(wifi_sig).state;

            if (rssi >= -60.0f) {
              return lv_color_hex(0x5CFF7A);
            }

            if (rssi >= -75.0f) {
              return lv_color_hex(0xFFC857);
            }

            return lv_color_hex(0xFF5C5C);


      # ------------------------------------------------------------------------
      # Controller runtime
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_system_cpu
          text: !lambda |-
            if (isnan(id(cpu_temp).state)) {
              return std::string("--.- °C");
            }

            return str_sprintf(
              "%.1f °C",
              id(cpu_temp).state
            );

      # ------------------------------------------------------------------------
      # Rectifier 1 communication/lifecycle
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_system_unit_1

          text: !lambda |-
            if (!id(can_com_ok_1).state) {
              return std::string("OFFLINE");
            }

            const std::string lifecycle =
              id(rectifier_control_state_text_1).state;

            if (lifecycle.empty()) {
              return std::string("--");
            }

            return lifecycle;

          text_color: !lambda |-
            if (!id(can_com_ok_1).state) {
              return lv_color_hex(0xFF5C5C);
            }

            if (
              id(rectifier_control_state_1) ==
                ${rectifier_state_online}
            ) {
              return lv_color_hex(0x5CFF7A);
            }

            if (
              id(rectifier_control_state_1) ==
                ${rectifier_state_discovering}
            ) {
              return lv_color_hex(0xFFC857);
            }

            return lv_color_hex(0x8B96A0);


