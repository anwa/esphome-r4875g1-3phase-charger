# ==============================================================================
# V5 LVGL USER INTERFACE
# ==============================================================================
# Main pages plus persistent header and bottom navigation.

lvgl:

  # ============================================================================
  # MAIN PAGES
  # ============================================================================

  pages:

    # --------------------------------------------------------------------------
    # Dashboard
    # --------------------------------------------------------------------------
    - !include pages/dashboard.yaml


    # --------------------------------------------------------------------------
    # Rectifiers
    # --------------------------------------------------------------------------
    - id: page_rectifiers
      styles: style_page

      widgets:
        - obj:
            x: 20
            y: 75
            width: 760
            height: 320
            styles: style_placeholder

            widgets:
              - label:
                  align: CENTER
                  text: "RECTIFIERS"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF


    # --------------------------------------------------------------------------
    # Cooling
    # --------------------------------------------------------------------------
    - id: page_cooling
      styles: style_page

      widgets:
        - obj:
            x: 20
            y: 75
            width: 760
            height: 320
            styles: style_placeholder

            widgets:
              - label:
                  align: CENTER
                  text: "COOLING"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF


    # --------------------------------------------------------------------------
    # System
    # --------------------------------------------------------------------------
    - id: page_system
      styles: style_page

      widgets:
        - obj:
            x: 20
            y: 75
            width: 760
            height: 320
            styles: style_placeholder

            widgets:
              - label:
                  align: CENTER
                  text: "SYSTEM"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF


    # --------------------------------------------------------------------------
    # Trends
    # --------------------------------------------------------------------------
    - id: page_trends
      styles: style_page

      widgets:
        - obj:
            x: 20
            y: 75
            width: 760
            height: 320
            styles: style_placeholder

            widgets:
              - label:
                  align: CENTER
                  text: "TRENDS"
                  text_font: montserrat_32
                  text_color: 0xFFFFFF


  # ============================================================================
  # PERSISTENT HEADER + NAVIGATION
  # ============================================================================

  top_layer:
    widgets:

      # ------------------------------------------------------------------------
      # Header
      # ------------------------------------------------------------------------
      - obj:
          x: 0
          y: 0
          width: 800
          height: 58
          styles: style_header

          widgets:
            - label:
                x: 20
                align: LEFT_MID
                text: "R4875 Charger"
                text_font: montserrat_20
                text_color: 0xFFFFFF

            - label:
                x: 180
                align: LEFT_MID
                text: "v${firmware_version}"
                text_font: montserrat_18
                text_color: 0x8B96A0

            - label:
                id: ui_header_clock
                x: 0
                align: CENTER
                width: 250
                text_align: CENTER
                text: "--.--.---- --:--"
                text_font: montserrat_18
                text_color: 0xDDE3E8

            - label:
                id: ui_dashboard_run_state
                x: -20
                align: RIGHT_MID
                width: 100
                text_align: RIGHT
                text: "OFF"
                text_font: montserrat_18
                text_color: 0xFF3030

      # ------------------------------------------------------------------------
      # Bottom navigation
      # ------------------------------------------------------------------------
      - button:
          x: 10
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"
                text_font: montserrat_18

          on_short_click:
            - lvgl.page.show: page_dashboard


      - button:
          x: 168
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"
                text_font: montserrat_18

          on_short_click:
            - lvgl.page.show: page_rectifiers


      - button:
          x: 326
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Cooling"
                text_font: montserrat_18

          on_short_click:
            - lvgl.page.show: page_cooling


      - button:
          x: 484
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lvgl.page.show: page_system


      - button:
          x: 642
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Trends"
                text_font: montserrat_18

          on_short_click:
            - lvgl.page.show: page_trends

  # ============================================================================
  # CHARGER CONFIRMATION DIALOGS
  # ============================================================================

  msgboxes:

    # --------------------------------------------------------------------------
    # START confirmation
    # --------------------------------------------------------------------------
    - id: ui_start_charger_dialog
      close_button: false
      title: "Start charger?"

      body:
        text: "Start all available and ready rectifier units?\n\nSafety checks are applied individually before startup."
        text_font: montserrat_18

      buttons:
        - id: ui_start_cancel_button
          text: "CANCEL"

          on_click:
            - lvgl.widget.hide: ui_start_charger_dialog

        - id: ui_start_confirm_button
          text: "START"

          on_click:
            - lvgl.widget.hide: ui_start_charger_dialog
            - button.press: on_button_all


    # --------------------------------------------------------------------------
    # STOP confirmation
    # --------------------------------------------------------------------------
    - id: ui_stop_charger_dialog
      close_button: false
      title: "Stop charger?"

      body:
        text: "Stop all rectifier units?"
        text_font: montserrat_18

      buttons:
        - id: ui_stop_cancel_button
          text: "CANCEL"

          on_click:
            - lvgl.widget.hide: ui_stop_charger_dialog

        - id: ui_stop_confirm_button
          text: "STOP"

          on_click:
            - lvgl.widget.hide: ui_stop_charger_dialog
            - button.press: off_button_all

# ==============================================================================
# V5 DISPLAY RUNTIME UPDATES
# ==============================================================================

interval:
  - interval: 500ms
    then:
      # ------------------------------------------------------------------------
      # Date / time
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_header_clock
          text: !lambda |-
            auto now = id(sntp_time).now();

            if (!now.is_valid()) {
              return std::string("--.--.---- --:--");
            }

            return str_sprintf(
              "%02d.%02d.%04d  %02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute
            );

      # ------------------------------------------------------------------------
      # AC input power
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_ac_power
          text: !lambda |-
            if (isnan(id(combined_ac_power).state)) {
              return std::string("--.-- kW");
            }

            return str_sprintf(
              "%.2f kW",
              id(combined_ac_power).state
            );


      # ------------------------------------------------------------------------
      # AC input voltage
      #
      # The three rectifiers are connected to separate AC phases. Display the
      # average voltage of all currently reachable units with valid telemetry.
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_ac_voltage
          text: !lambda |-
            float voltage = 0.0f;
            int units = 0;

            if (
              id(can_com_ok_1).state &&
              !isnan(id(ac_voltage_1).state)
            ) {
              voltage += id(ac_voltage_1).state;
              units++;
            }

            if (
              id(can_com_ok_2).state &&
              !isnan(id(ac_voltage_2).state)
            ) {
              voltage += id(ac_voltage_2).state;
              units++;
            }

            if (
              id(can_com_ok_3).state &&
              !isnan(id(ac_voltage_3).state)
            ) {
              voltage += id(ac_voltage_3).state;
              units++;
            }

            if (units == 0) {
              return std::string("--- V");
            }

            return str_sprintf(
              "%.0f V",
              voltage / units
            );


      # ------------------------------------------------------------------------
      # AC input current
      #
      # Preserve the proven v4 dashboard behaviour: show the average phase
      # current of all reachable rectifiers rather than the sum of phase
      # currents.
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_ac_current
          text: !lambda |-
            float current = 0.0f;
            int units = 0;

            if (
              id(can_com_ok_1).state &&
              !isnan(id(ac_current_1).state)
            ) {
              current += id(ac_current_1).state;
              units++;
            }

            if (
              id(can_com_ok_2).state &&
              !isnan(id(ac_current_2).state)
            ) {
              current += id(ac_current_2).state;
              units++;
            }

            if (
              id(can_com_ok_3).state &&
              !isnan(id(ac_current_3).state)
            ) {
              current += id(ac_current_3).state;
              units++;
            }

            if (units == 0) {
              return std::string("--.- A");
            }

            return str_sprintf(
              "%.1f A",
              current / units
            );


      # ------------------------------------------------------------------------
      # DC output power
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_dc_power
          text: !lambda |-
            if (isnan(id(combined_dc_power).state)) {
              return std::string("--.-- kW");
            }

            return str_sprintf(
              "%.2f kW",
              id(combined_dc_power).state
            );


      # ------------------------------------------------------------------------
      # DC output voltage
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_dc_voltage
          text: !lambda |-
            if (isnan(id(average_dc_voltage).state)) {
              return std::string("--.-- V");
            }

            return str_sprintf(
              "%.2f V",
              id(average_dc_voltage).state
            );


      # ------------------------------------------------------------------------
      # Combined DC output current
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_dc_current
          text: !lambda |-
            if (isnan(id(combined_dc_current).state)) {
              return std::string("--.- A");
            }

            return str_sprintf(
              "%.1f A",
              id(combined_dc_current).state
            );


      # ------------------------------------------------------------------------
      # Available units
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_units
          text: !lambda |-
            if (isnan(id(available_units).state)) {
              return std::string("- / 3");
            }

            return str_sprintf(
              "%.0f / 3",
              id(available_units).state
            );


      # ------------------------------------------------------------------------
      # Highest rectifier output temperature
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_temperature
          text: !lambda |-
            if (isnan(id(highest_output_temperature).state)) {
              return std::string("--.- °C");
            }

            return str_sprintf(
              "%.1f °C",
              id(highest_output_temperature).state
            );


      # ------------------------------------------------------------------------
      # Conversion efficiency
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_efficiency
          text: !lambda |-
            if (isnan(id(conversion_efficiency).state)) {
              return std::string("--.- %");
            }

            return str_sprintf(
              "%.1f %%",
              id(conversion_efficiency).state
            );


      # ------------------------------------------------------------------------
      # DC voltage setpoint
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_set_voltage
          text: !lambda |-
            if (isnan(id(set_dc_voltage_limit).state)) {
              return std::string("--.- V");
            }

            return str_sprintf(
              "%.1f V",
              id(set_dc_voltage_limit).state
            );


      # ------------------------------------------------------------------------
      # Total DC power setpoint
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_set_power
          text: !lambda |-
            if (isnan(id(set_dc_sum_power).state)) {
              return std::string("--.-- kW");
            }

            return str_sprintf(
              "%.2f kW",
              id(set_dc_sum_power).state
            );


      # ------------------------------------------------------------------------
      # Applied per-unit DC current limit
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_set_current
          text: !lambda |-
            if (isnan(id(applied_dc_current_limit_sensor).state)) {
              return std::string("--.- A");
            }

            return str_sprintf(
              "%.1f A",
              id(applied_dc_current_limit_sensor).state
            );


      # ------------------------------------------------------------------------
      # Charger run state
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_run_state

          text: !lambda |-
            int online = 0;

            if (
              id(can_com_ok_1).state &&
              id(power_state_1).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_2).state &&
              id(power_state_2).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_3).state &&
              id(power_state_3).state == "ON"
            ) {
              online++;
            }

            if (online == 0) {
              return std::string("OFF");
            }

            return str_sprintf(
              "%d/3 ON",
              online
            );

          text_color: !lambda |-
            int online = 0;

            if (
              id(can_com_ok_1).state &&
              id(power_state_1).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_2).state &&
              id(power_state_2).state == "ON"
            ) {
              online++;
            }

            if (
              id(can_com_ok_3).state &&
              id(power_state_3).state == "ON"
            ) {
              online++;
            }

            return online == 3
              ? lv_color_hex(0x5CFF7A)
              : lv_color_hex(0xFF3030);

      # ------------------------------------------------------------------------
      # Charger power button
      # ------------------------------------------------------------------------
      - lvgl.label.update:
          id: ui_dashboard_power_button_label
          text: !lambda |-
            if (id(available_units).state < 1) {
              return std::string("NO RECTIFIERS");
            }

            const bool running =
              (id(can_com_ok_1).state &&
               id(power_state_1).state == "ON") ||
              (id(can_com_ok_2).state &&
               id(power_state_2).state == "ON") ||
              (id(can_com_ok_3).state &&
               id(power_state_3).state == "ON");

            return running
              ? std::string("STOP CHARGER")
              : std::string("START CHARGER");

      # ------------------------------------------------------------------------
      # Charger power button availability
      # ------------------------------------------------------------------------
      - if:
          condition:
            lambda: |-
              return id(available_units).state > 0;

          then:
            - lvgl.widget.enable: ui_dashboard_power_button

          else:
            - lvgl.widget.disable: ui_dashboard_power_button