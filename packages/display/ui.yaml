# ==============================================================================
# V5 LVGL USER INTERFACE
# ==============================================================================
#
# Defines the persistent LVGL widget tree, page includes, navigation controls,
# shared dialogs and UI state required across the complete display.
#
# Periodic runtime updates are handled by the dedicated display runtime
# packages rather than from this file.
# ==============================================================================

# ==============================================================================
# SHARED UI STATE
# ==============================================================================
#
# Persistent runtime state shared by navigation, dialogs and asynchronous
# START/STOP command handling.
# ==============================================================================

globals:

  # ---------------------------------------------------------------------------
  # ACTIVE DISPLAY PAGE
  # ---------------------------------------------------------------------------
  #
  # Only the currently visible page is refreshed periodically.
  #
  #   0 = Dashboard
  #   1 = Rectifiers
  #   2 = Rectifier Detail
  #   3 = Battery
  #   4 = Cooling
  #   5 = System
  #   6 = Trends
  # ---------------------------------------------------------------------------

  - id: ui_active_page
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_charger_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_charger_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_1_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_1_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_2_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_2_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_3_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_3_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---------------------------------------------------------------------------
  # FALLBACK EDIT DIALOG STATE
  # ---------------------------------------------------------------------------

  - id: ui_fallback_voltage_edit
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: ui_fallback_current_edit
    type: float
    restore_value: false
    initial_value: "0.0"

  # ---------------------------------------------------------------------------
  # AC SETPOINTS DIALOG STATE
  # ---------------------------------------------------------------------------

  - id: ui_ac_setpoints_current_edit
    type: float
    restore_value: false
    initial_value: "0.0"

  # ---------------------------------------------------------------------------
  # DC SETPOINTS DIALOG STATE
  # ---------------------------------------------------------------------------

  - id: ui_dc_setpoints_voltage_edit
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: ui_dc_setpoints_power_edit
    type: float
    restore_value: false
    initial_value: "0.0"

lvgl:

  # ---------------------------------------------------------------------------
  # MAIN PAGES
  # ---------------------------------------------------------------------------

  pages:

    - !include pages/dashboard.yaml
    - !include pages/rectifiers.yaml
    - !include pages/rectifier-detail.yaml
    - !include pages/battery.yaml
    - !include pages/cooling.yaml
    - !include pages/system.yaml
    - !include pages/trends.yaml

  # ---------------------------------------------------------------------------
  # PERSISTENT HEADER AND NAVIGATION
  # ---------------------------------------------------------------------------

  top_layer:
    widgets:

      # Header
      - obj:
          x: 0
          y: 0
          width: 800
          height: 58
          styles: style_header

          widgets:
            - label:
                x: 20
                align: LEFT_MID
                text: "R4875 Charger"
                text_font: montserrat_20
                text_color: 0xFFFFFF

            - label:
                x: 180
                align: LEFT_MID
                text: "v${firmware_version}"
                text_font: montserrat_18
                text_color: 0x8B96A0

            - label:
                id: ui_header_clock
                x: 0
                align: CENTER
                width: 250
                text_align: CENTER
                text: "--.--.---- --:--"
                text_font: montserrat_18
                text_color: 0xDDE3E8

            - label:
                id: ui_header_battery
                x: -125
                align: RIGHT_MID
                width: 130
                text_align: RIGHT
                text: "CTRL --.-- V"
                text_font: montserrat_16
                text_color: 0x8B96A0

            - label:
                id: ui_header_run_state
                x: -20
                align: RIGHT_MID
                width: 100
                text_align: RIGHT
                text: "OFF"
                text_font: montserrat_18
                text_color: 0xFF3030

      # Bottom navigation
      - button:
          x: 10
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 0;
            - lvgl.page.show: page_dashboard

      - button:
          x: 142
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 1;
            - lvgl.page.show: page_rectifiers

      - button:
          x: 274
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Battery"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;
            - lvgl.page.show: page_battery

      - button:
          x: 406
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Cooling"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 4;
            - lvgl.page.show: page_cooling

      - button:
          x: 538
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;
            - lvgl.page.show: page_system

      - button:
          x: 670
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Trends"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 6;
            - lvgl.page.show: page_trends

      # ---------------------------------------------------------------------------
      # FALLBACK SETTINGS DIALOG
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_fallback_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 300
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  # Title
                  - label:
                      x: 20
                      y: 16
                      width: 420
                      text_align: CENTER
                      text: "FALLBACK SETTINGS"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  # Voltage
                  - obj:
                      align: TOP_MID
                      y: 55
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      scrollbar_mode: "OFF"

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "DC Voltage"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_voltage_spinbox

                        - spinbox:
                            id: ui_fallback_voltage_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: ${dc_voltage_min_v}
                            range_to: ${dc_voltage_max_v}
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_fallback_voltage_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_voltage_spinbox

                  # Current
                  - obj:
                      align: TOP_MID
                      y: 115
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      scrollbar_mode: "OFF"

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "DC Current"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_fallback_current_spinbox

                        - spinbox:
                            id: ui_fallback_current_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: ${minimum_dc_current_a}
                            range_to: ${project_max_dc_current_a}
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_fallback_current_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_fallback_current_spinbox

                  # Cancel
                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16

                      on_short_click:
                        - lvgl.widget.hide: ui_fallback_dialog

                  # Save
                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "SAVE"
                            text_font: montserrat_16

                      on_short_click:
                        - number.set:
                            id: set_dc_voltage_limit_fallback
                            value: !lambda |-
                              return id(ui_fallback_voltage_edit);

                        - number.set:
                            id: set_dc_current_limit_fallback
                            value: !lambda |-
                              return id(ui_fallback_current_edit);

                        - lvgl.widget.hide: ui_fallback_dialog

      # ---------------------------------------------------------------------------
      # AC SETPOINTS DIALOG
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_ac_setpoints_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 240
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 16
                      width: 420
                      text_align: CENTER
                      text: "AC SETPOINTS"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  # AC current limit
                  - obj:
                      align: TOP_MID
                      y: 65
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "Current Limit"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_ac_setpoints_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_ac_setpoints_current_spinbox

                        - spinbox:
                            id: ui_ac_setpoints_current_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: 0
                            range_to: 21
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_ac_setpoints_current_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_ac_setpoints_current_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_ac_setpoints_current_spinbox

                  # Cancel
                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16

                      on_short_click:
                        - lvgl.widget.hide: ui_ac_setpoints_dialog

                  # Save
                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "SAVE"
                            text_font: montserrat_16

                      on_short_click:
                        - script.execute:
                            id: ui_command_set_ac_current_limit
                            value: !lambda |-
                              return id(ui_ac_setpoints_current_edit);

                        - lvgl.widget.hide: ui_ac_setpoints_dialog

      # ---------------------------------------------------------------------------
      # DC SETPOINTS DIALOG
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_dc_setpoints_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 300
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 16
                      width: 420
                      text_align: CENTER
                      text: "DC SETPOINTS"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  # DC voltage limit
                  - obj:
                      align: TOP_MID
                      y: 55
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "Voltage Limit"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_dc_setpoints_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_dc_setpoints_voltage_spinbox

                        - spinbox:
                            id: ui_dc_setpoints_voltage_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: ${dc_voltage_min_v}
                            range_to: ${dc_voltage_max_v}
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_dc_setpoints_voltage_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_dc_setpoints_voltage_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_dc_setpoints_voltage_spinbox

                  # DC sum power
                  - obj:
                      align: TOP_MID
                      y: 115
                      width: 360
                      height: 50
                      bg_opa: 0%
                      border_width: 0
                      pad_all: 0
                      scrollable: false

                      widgets:
                        - label:
                            align: LEFT_MID
                            x: 0
                            width: 115
                            text: "Sum Power"
                            text_font: montserrat_16
                            text_color: 0x8B96A0

                        - button:
                            align: LEFT_MID
                            x: 125
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "-"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.decrement:
                                  id: ui_dc_setpoints_power_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.decrement:
                                  id: ui_dc_setpoints_power_spinbox

                        - spinbox:
                            id: ui_dc_setpoints_power_spinbox
                            align: LEFT_MID
                            x: 185
                            width: 110
                            height: 45
                            range_from: 0.1
                            range_to: 12.0
                            decimal_places: 1
                            selected_digit: 0
                            text_align: CENTER
                            styles: style_dialog_spinbox

                            on_value:
                              then:
                                - lambda: |-
                                    id(ui_dc_setpoints_power_edit) = x;

                        - button:
                            align: LEFT_MID
                            x: 305
                            styles: style_dialog_step_button

                            widgets:
                              - label:
                                  align: CENTER
                                  text: "+"
                                  text_font: montserrat_20

                            on_press:
                              - lvgl.spinbox.increment:
                                  id: ui_dc_setpoints_power_spinbox

                            on_long_press_repeat:
                              - lvgl.spinbox.increment:
                                  id: ui_dc_setpoints_power_spinbox

                  # Cancel
                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16

                      on_short_click:
                        - lvgl.widget.hide: ui_dc_setpoints_dialog

                  # Save
                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "SAVE"
                            text_font: montserrat_16

                      on_short_click:
                        - script.execute:
                            id: ui_command_set_dc_setpoints
                            voltage: !lambda |-
                              return id(ui_dc_setpoints_voltage_edit);
                            power: !lambda |-
                              return id(ui_dc_setpoints_power_edit);

                        - lvgl.widget.hide: ui_dc_setpoints_dialog

      # ==============================================================================
      # CONFIRMATION DIALOGS
      # ==============================================================================

      # ---------------------------------------------------------------------------
      # CHARGER START
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_start_charger_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 250
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 18
                      width: 420
                      text_align: CENTER
                      text: "START CHARGER"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  - label:
                      x: 35
                      y: 70
                      width: 390
                      text_align: CENTER
                      text: "Start all available and ready rectifier units?\n\nSafety checks are applied individually before startup."
                      text_font: montserrat_18
                      text_color: 0xDDE3E8

                  - button:
                      id: ui_start_cancel_button
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_start_charger_dialog

                  - button:
                      id: ui_start_confirm_button
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "START"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_start_charger_dialog

                        - lambda: |-
                            id(ui_charger_power_pending) = 1;
                            id(ui_charger_power_pending_since) = millis();

                        - lvgl.widget.disable:
                            id: ui_dashboard_power_button

                        - lvgl.label.update:
                            id: ui_dashboard_power_button_label
                            text: "STARTING..."

                        - script.execute: ui_command_charger_start

      # ---------------------------------------------------------------------------
      # CHARGER STOP
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_stop_charger_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
