                      text: "STOP RECTIFIER 1"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  - label:
                      x: 35
                      y: 80
                      width: 390
                      text_align: CENTER
                      text: "Stop Rectifier 1?"
                      text_font: montserrat_18
                      text_color: 0xDDE3E8

                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_stop_rectifier_1_dialog

                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0xFF5C5C

                      widgets:
                        - label:
                            align: CENTER
                            text: "STOP"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide: ui_stop_rectifier_1_dialog

                        - lambda: |-
                            id(ui_rectifier_1_power_pending) = 2;
                            id(ui_rectifier_1_power_pending_since) = millis();

                        - lvgl.widget.disable:
                            id: ui_rectifier_1_power_button

                        - lvgl.label.update:
                            id: ui_rectifier_1_power_button_label
                            text: "STOPPING..."

                        - script.execute:
                            id: ui_command_rectifier_stop
                            unit: 1

