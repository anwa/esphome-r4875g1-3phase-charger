# ==============================================================================
# V5 LVGL USER INTERFACE
# ==============================================================================
# Main pages plus persistent header and bottom navigation.

# ==============================================================================
# V5 UI COMMAND STATE
# ==============================================================================
# Prevent repeated START/STOP commands while a rectifier state transition is
# still in progress.
#
# pending:
#   0 = idle
#   1 = starting
#   2 = stopping

globals:
  # ---------------------------------------------------------------------------
  # Active display page
  # ---------------------------------------------------------------------------
  #
  # Only the currently visible page is refreshed periodically.
  #
  #   0 = Dashboard
  #   1 = Rectifiers
  #   2 = Rectifier Detail
  #   3 = Cooling
  #   4 = System
  #   5 = Trends
  #
  - id: ui_active_page
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_charger_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_charger_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_1_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_1_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_2_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_2_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_3_power_pending
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: ui_rectifier_3_power_pending_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---------------------------------------------------------------------------
  # Fallback edit dialog temporary values
  # ---------------------------------------------------------------------------
  - id: ui_fallback_voltage_edit
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: ui_fallback_current_edit
    type: float
    restore_value: false
    initial_value: "0.0"

lvgl:

  # ============================================================================
  # MAIN PAGES
  # ============================================================================

  pages:

    # --------------------------------------------------------------------------
    # Dashboard
    # --------------------------------------------------------------------------
    - !include pages/dashboard.yaml

    # --------------------------------------------------------------------------
    # Rectifiers
    # --------------------------------------------------------------------------
    - !include pages/rectifiers.yaml

    # --------------------------------------------------------------------------
    # Rectifier Detail
    # --------------------------------------------------------------------------
    - !include pages/rectifier-detail.yaml

    # --------------------------------------------------------------------------
    # Cooling
    # --------------------------------------------------------------------------
    - !include pages/cooling.yaml

    # --------------------------------------------------------------------------
    # System
    # --------------------------------------------------------------------------
    - !include pages/system.yaml

    # --------------------------------------------------------------------------
    # Trends
    # --------------------------------------------------------------------------
    - !include pages/trends.yaml

  # ============================================================================
  # PERSISTENT HEADER + NAVIGATION
  # ============================================================================

  top_layer:
    widgets:

      # ------------------------------------------------------------------------
      # Header
      # ------------------------------------------------------------------------
      - obj:
          x: 0
          y: 0
          width: 800
          height: 58
          styles: style_header

          widgets:
            - label:
                x: 20
                align: LEFT_MID
                text: "R4875 Charger"
                text_font: montserrat_20
                text_color: 0xFFFFFF

            - label:
                x: 180
                align: LEFT_MID
                text: "v${firmware_version}"
                text_font: montserrat_18
                text_color: 0x8B96A0

            - label:
                id: ui_header_clock
                x: 0
                align: CENTER
                width: 250
                text_align: CENTER
                text: "--.--.---- --:--"
                text_font: montserrat_18
                text_color: 0xDDE3E8

            - label:
                id: ui_header_battery
                x: -125
                align: RIGHT_MID
                width: 130
                text_align: RIGHT
                text: "BAT --.-- V"
                text_font: montserrat_16
                text_color: 0x8B96A0

            - label:
                id: ui_dashboard_run_state
                x: -20
                align: RIGHT_MID
                width: 100
                text_align: RIGHT
                text: "OFF"
                text_font: montserrat_18
                text_color: 0xFF3030

      # ------------------------------------------------------------------------
      # Bottom navigation
      # ------------------------------------------------------------------------
      - button:
          x: 10
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Dashboard"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 0;
            - lvgl.page.show: page_dashboard


      - button:
          x: 168
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Rectifiers"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 1;
            - lvgl.page.show: page_rectifiers


      - button:
          x: 326
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Cooling"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;
            - lvgl.page.show: page_cooling


      - button:
          x: 484
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 4;
            - lvgl.page.show: page_system


      - button:
          x: 642
          y: 410
          width: 148
          height: 58
          styles: style_nav_button

          pressed:
            bg_color: 0x3A4652

          widgets:
            - label:
                align: CENTER
                text: "Trends"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;
            - lvgl.page.show: page_trends

      # ========================================================================
      # FALLBACK SETTINGS DIALOG
      # ========================================================================
      - obj:
          id: ui_fallback_dialog
          x: 170
          y: 95
          width: 460
          height: 300
          hidden: true
          bg_color: 0x202830
          border_color: 0x4A5662
          border_width: 2
          radius: 10
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            # ------------------------------------------------------------------
            # Title
            # ------------------------------------------------------------------
            - label:
                x: 20
                y: 16
                width: 420
                text_align: CENTER
                text: "FALLBACK SETTINGS"
                text_font: montserrat_20
                text_color: 0xFFFFFF
            # ------------------------------------------------------------------
            # Voltage
            # ------------------------------------------------------------------
            - label:
                x: 25
                y: 65
                text: "DC Voltage"
                text_font: montserrat_16
                text_color: 0x8B96A0

            - button:
                align: TOP_MID
                x: -85
                y: 55
                width: 50
                height: 45

                widgets:
                  - label:
                      align: CENTER
                      text: "-"
                      text_font: montserrat_20

                on_short_click:
                  - lvgl.spinbox.decrement:
                      id: ui_fallback_voltage_spinbox

            - spinbox:
                id: ui_fallback_voltage_spinbox
                align: TOP_MID
                x: 0
                y: 55
                width: 110
                height: 45

                range_from: ${dc_voltage_min_v}
                range_to: ${dc_voltage_max_v}
                decimal_places: 1
                selected_digit: 0

                text_align: CENTER
                text_font: montserrat_18

                on_value:
                  then:
                    - lambda: |-
                        id(ui_fallback_voltage_edit) = x;

            - button:
                align: TOP_MID
                x: 85
                y: 55
                width: 50
                height: 45

                widgets:
                  - label:
                      align: CENTER
                      text: "+"
                      text_font: montserrat_20

                on_short_click:
                  - lvgl.spinbox.increment:
                      id: ui_fallback_voltage_spinbox

            # ------------------------------------------------------------------
            # Current
            # ------------------------------------------------------------------
            - label:
                x: 25
                y: 125
                text: "DC Current"
                text_font: montserrat_16
                text_color: 0x8B96A0

            - button:
                align: TOP_MID
                x: -85
                y: 115
                width: 50
                height: 45

                widgets:
                  - label:
                      align: CENTER
                      text: "-"
                      text_font: montserrat_20

                on_short_click:
                  - lvgl.spinbox.decrement:
                      id: ui_fallback_current_spinbox

            - spinbox:
                id: ui_fallback_current_spinbox
                align: TOP_MID
                x: 0
                y: 115
                width: 110
                height: 45
                range_from: ${minimum_dc_current_a}
                range_to: ${project_max_dc_current_a}
                selected_digit: 0
                decimal_places: 1
                text_align: CENTER
                text_font: montserrat_18

                on_value:
                  then:
                    - lambda: |-
                        id(ui_fallback_current_edit) = x;

            - button:
                align: TOP_MID
                x: 85
                y: 115
                width: 50
                height: 45

                widgets:
                  - label:
                      align: CENTER
                      text: "+"
                      text_font: montserrat_20

                on_short_click:
                  - lvgl.spinbox.increment:
                      id: ui_fallback_current_spinbox

            # ------------------------------------------------------------------
            # Cancel
            # ------------------------------------------------------------------

            - button:
                align: BOTTOM_MID
                x: -85
                y: -20
                width: 140
                height: 50

                widgets:
                  - label:
                      align: CENTER
                      text: "CANCEL"
                      text_font: montserrat_16

                on_short_click:
                  - lvgl.widget.hide: ui_fallback_dialog

            # ------------------------------------------------------------------
            # Save
            # ------------------------------------------------------------------
            - button:
                align: BOTTOM_MID
                x: 85
                y: -20
                width: 140
                height: 50

                widgets:
                  - label:
                      align: CENTER
                      text: "SAVE"
                      text_font: montserrat_16

                on_short_click:
                  - number.set:
                      id: set_dc_voltage_limit_fallback
                      value: !lambda |-
                        return id(ui_fallback_voltage_edit);

                  - number.set:
                      id: set_dc_current_limit_fallback
                      value: !lambda |-
                        return id(ui_fallback_current_edit);

                  - lvgl.widget.hide: ui_fallback_dialog

  # ============================================================================
  # CHARGER CONFIRMATION DIALOGS
  # ============================================================================

  msgboxes:

    # --------------------------------------------------------------------------
    # START confirmation
    # --------------------------------------------------------------------------
    - id: ui_start_charger_dialog
      close_button: false
      title: "Start charger?"

      body:
        text: "Start all available and ready rectifier units?\n\nSafety checks are applied individually before startup."
        text_font: montserrat_18

      buttons:
        - id: ui_start_cancel_button
          text: "CANCEL"

          on_click:
            - lvgl.widget.hide: ui_start_charger_dialog

        - id: ui_start_confirm_button
          text: "START"

          on_click:
            - lvgl.widget.hide: ui_start_charger_dialog

            - lambda: |-
                id(ui_charger_power_pending) = 1;
                id(ui_charger_power_pending_since) = millis();

            - lvgl.widget.disable:
                id: ui_dashboard_power_button

            - lvgl.label.update:
                id: ui_dashboard_power_button_label
                text: "STARTING..."

            - button.press: on_button_all

    # --------------------------------------------------------------------------
    # STOP confirmation
    # --------------------------------------------------------------------------
    - id: ui_stop_charger_dialog
      close_button: false
      title: "Stop charger?"

      body:
        text: "Stop all rectifier units?"
        text_font: montserrat_18

      buttons:
        - id: ui_stop_cancel_button
          text: "CANCEL"

          on_click:
            - lvgl.widget.hide: ui_stop_charger_dialog

        - id: ui_stop_confirm_button
          text: "STOP"

          on_click:
            - lvgl.widget.hide: ui_stop_charger_dialog

            - lambda: |-
                id(ui_charger_power_pending) = 2;
                id(ui_charger_power_pending_since) = millis();

            - lvgl.widget.disable:
                id: ui_dashboard_power_button

            - lvgl.label.update:
                id: ui_dashboard_power_button_label
                text: "STOPPING..."

            - button.press: off_button_all

    # --------------------------------------------------------------------------
    # RECTIFIER 1 START
    # --------------------------------------------------------------------------
    - id: ui_start_rectifier_1_dialog
      close_button: false
      title: "Start Rectifier 1?"

      body:
        text: "Start Rectifier 1?\n\nAll individual safety checks will be applied."
        text_font: montserrat_18

      buttons:
        - text: "CANCEL"
          on_click:
            - lvgl.widget.hide: ui_start_rectifier_1_dialog

        - text: "START"
          on_click:
