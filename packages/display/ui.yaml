# ==============================================================================
# LVGL UI PACKAGE AGGREGATOR
# ==============================================================================
# Main pages use the normal wrapped page sequence.
#
# Rectifier detail is a hierarchical child view. Its page is marked skip:true
# so lvgl.page.next / previous never includes it in the main-menu cycle.

lvgl:
  page_wrap: true

packages:
  page_dashboard: !include pages/dashboard.yaml
  page_rectifiers: !include pages/rectifiers.yaml
  page_rectifier_detail: !include pages/rectifier-detail.yaml
  page_cooling: !include pages/cooling.yaml
  page_system: !include pages/system.yaml
