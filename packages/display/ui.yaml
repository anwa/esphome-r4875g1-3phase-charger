# ==============================================================================
# CHARGER CONTROLLER-SPECIFIC LVGL PRESENTATION
# ==============================================================================
#
# Defines pages and navigation that exist only on the Charger Controller.
#
# Dashboard and Rectifiers presentation, including Rectifier Detail and its
# dialogs, are composed through shared display packages.
# ==============================================================================

lvgl:

  # ---------------------------------------------------------------------------
  # CONTROLLER-ONLY PAGES
  # ---------------------------------------------------------------------------

  pages:
    - !include pages/battery.yaml
    - !include pages/cooling.yaml
    - !include pages/system.yaml
    - !include pages/trends.yaml

  # ---------------------------------------------------------------------------
  # CONTROLLER-ONLY BOTTOM NAVIGATION
  # ---------------------------------------------------------------------------

  top_layer:
    widgets:

      - button:
          x: 274
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Battery"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 3;

            - lvgl.page.show: page_battery

      - button:
          x: 406
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Cooling"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 4;

            - lvgl.page.show: page_cooling

      - button:
          x: 538
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "System"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 5;

            - lvgl.page.show: page_system

      - button:
          x: 670
          y: 410
          styles: style_nav_button

          widgets:
            - label:
                align: CENTER
                text: "Trends"
                text_font: montserrat_18

          on_short_click:
            - lambda: |-
                id(rectifier_detail_unit) = 0;
                id(ui_active_page) = 6;

            - lvgl.page.show: page_trends
