# ==============================================================================
# RECTIFIER DETAIL DISPLAY RUNTIME
# ==============================================================================
#
# Updates the Rectifier Detail page for the unit selected through
# rectifier_detail_unit.
#
# Per-unit telemetry and operational state are consumed exclusively through the
# shared ui_model_rectifier_* state.
#
# Charger fallback settings remain Controller-owned and are read from the local
# fallback control entities.
# ==============================================================================

script:

  - id: refresh_rectifier_detail
    mode: restart

    then:
      - if:
          condition:
            lambda: |-
              return
                id(rectifier_detail_unit) >= 1 &&
                id(rectifier_detail_unit) <= 3;

          then:

            # ---------------------------------------------------------------------------
            # HEADER AND STATUS
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_rectifier_detail_title

                text: !lambda |-
                  const int unit =
                    id(rectifier_detail_unit);

                  float hours = NAN;

                  switch (unit) {
                    case 1:
                      hours =
                        id(ui_model_rectifier_1_operating_hours).state;
                      break;

                    case 2:
                      hours =
                        id(ui_model_rectifier_2_operating_hours).state;
                      break;

                    case 3:
                      hours =
                        id(ui_model_rectifier_3_operating_hours).state;
                      break;
                  }

                  if (unit < 1 || unit > 3) {
                    return std::string(
                      "RECTIFIER --    ---- h"
                    );
                  }

                  if (isnan(hours)) {
                    return str_sprintf(
                      "RECTIFIER %d     ---- h",
                      unit
                    );
                  }

                  return str_sprintf(
                    "RECTIFIER %d    %.0f h",
                    unit,
                    hours
                  );

            - lvgl.label.update:
                id: ui_rectifier_detail_status

                text: !lambda |-
                  const int unit =
                    id(rectifier_detail_unit);

                  if (
                    unit < 1 ||
                    unit > 3 ||
                    !id(ui_model_data_available).state
                  ) {
                    return std::string(
                      "CAN -- | PWR -- | --"
                    );
                  }

                  bool connected = false;
                  std::string power_state;
                  std::string lifecycle;

                  switch (unit) {
                    case 1:
                      connected =
                        id(ui_model_rectifier_1_connected).state;
                      power_state =
                        id(ui_model_rectifier_1_power_state).state;
                      lifecycle =
                        id(ui_model_rectifier_1_lifecycle).state;
                      break;

                    case 2:
                      connected =
                        id(ui_model_rectifier_2_connected).state;
                      power_state =
                        id(ui_model_rectifier_2_power_state).state;
                      lifecycle =
                        id(ui_model_rectifier_2_lifecycle).state;
                      break;

                    case 3:
                      connected =
                        id(ui_model_rectifier_3_connected).state;
                      power_state =
                        id(ui_model_rectifier_3_power_state).state;
                      lifecycle =
                        id(ui_model_rectifier_3_lifecycle).state;
                      break;
                  }

                  if (power_state.empty()) {
                    power_state = "--";
                  }

                  if (lifecycle.empty()) {
                    lifecycle = "--";
                  }

                  return str_sprintf(
                    "CAN %s | PWR %s | %s",
                    connected
                      ? "OK"
                      : "FAULT",
                    power_state.c_str(),
                    lifecycle.c_str()
                  );

            # ---------------------------------------------------------------------------
            # AC INPUT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_rectifier_detail_ac_voltage

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_ac_voltage).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_ac_voltage).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_ac_voltage).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- V")
                    : str_sprintf("%.1f V", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_ac_current

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_ac_current).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_ac_current).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_ac_current).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- A")
                    : str_sprintf("%.1f A", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_ac_power

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_ac_power).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_ac_power).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_ac_power).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("---- W")
                    : str_sprintf("%.0f W", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_ac_frequency

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
