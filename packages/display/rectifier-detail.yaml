                        id(ui_model_rectifier_2_ac_frequency).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_ac_frequency).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.-- Hz")
                    : str_sprintf("%.2f Hz", value);

            # ---------------------------------------------------------------------------
            # DC OUTPUT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_rectifier_detail_dc_voltage

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_dc_voltage).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_dc_voltage).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_dc_voltage).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- V")
                    : str_sprintf("%.1f V", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_dc_current

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_dc_current).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_dc_current).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_dc_current).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- A")
                    : str_sprintf("%.1f A", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_dc_power

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_dc_power).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_dc_power).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_dc_power).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("---- W")
                    : str_sprintf("%.0f W", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_dc_setpoint

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_dc_current_setpoint).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_dc_current_setpoint).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_dc_current_setpoint).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- A")
                    : str_sprintf("%.1f A", value);

            # ---------------------------------------------------------------------------
            # THERMAL AND INTERNAL FAN
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_rectifier_detail_input_temp

                text: !lambda |-
