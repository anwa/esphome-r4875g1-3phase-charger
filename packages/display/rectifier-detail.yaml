            - lvgl.label.update:
                id: ui_rectifier_detail_fan_min

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_fan_target_duty).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_fan_target_duty).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_fan_target_duty).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- %")
                    : str_sprintf("%.1f %%", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_capability

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
