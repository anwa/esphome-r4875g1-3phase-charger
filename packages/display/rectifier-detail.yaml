                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_input_temperature).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_input_temperature).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- °C")
                    : str_sprintf("%.1f °C", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_output_temp

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_output_temperature).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_output_temperature).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_output_temperature).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("--.- °C")
                    : str_sprintf("%.1f °C", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_fan_rpm

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_fan_rpm).state;
                      break;

                    case 2:
                      value =
                        id(ui_model_rectifier_2_fan_rpm).state;
                      break;

                    case 3:
                      value =
                        id(ui_model_rectifier_3_fan_rpm).state;
                      break;
                  }

                  return isnan(value)
                    ? std::string("----")
                    : str_sprintf("%.0f", value);

            - lvgl.label.update:
                id: ui_rectifier_detail_fan_duty

                text: !lambda |-
                  float value = NAN;

                  switch (id(rectifier_detail_unit)) {
                    case 1:
                      value =
                        id(ui_model_rectifier_1_fan_minimum_duty).state;
                      break;

                    case 2:
                      value =
