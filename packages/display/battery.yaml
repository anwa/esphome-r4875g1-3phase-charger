# ==============================================================================
# SHARED SOLAR BATTERY DISPLAY RUNTIME
# ==============================================================================
#
# Updates the four individual solar-battery cards while the Battery page is
# visible.
#
# Battery state is consumed exclusively through the shared UI model. Source
# connection loss and incomplete per-unit telemetry remain distinct states.
# ==============================================================================

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 3;

          then:

            # ---------------------------------------------------------------------------
            # BATTERY 1
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_battery_1_status

                text: !lambda |-
                  if (!id(ui_model_battery_source_connected).state)
                    return std::string("HA OFFLINE");

                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("NO DATA");

                  if (id(ui_model_battery_1_fault).state)
                    return std::string("FAULT");

                  if (id(ui_model_battery_1_warning).state)
                    return std::string("WARNING");

                  return std::string("OK");

                text_color: !lambda |-
                  if (!id(ui_model_battery_source_connected).state)
                    return lv_color_hex(0xFFC04A);

                  if (!id(ui_model_battery_1_data_available).state)
                    return lv_color_hex(0x8B96A0);

                  if (id(ui_model_battery_1_fault).state)
                    return lv_color_hex(0xFF3030);

                  if (id(ui_model_battery_1_warning).state)
                    return lv_color_hex(0xFFC04A);

                  return lv_color_hex(0x5CFF7A);

            - lvgl.label.update:
                id: ui_battery_1_voltage
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.-- V");

                  return str_sprintf(
                    "%.2f V",
                    id(ui_model_battery_1_voltage).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_current
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.- A");

                  return str_sprintf(
                    "%.1f A",
                    id(ui_model_battery_1_current).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_power
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.--- kW");

                  return str_sprintf(
                    "%.3f kW",
                    id(ui_model_battery_1_power).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_soc
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.- %");

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_battery_1_soc).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_temperature
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.- °C");

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_battery_1_temperature).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_cell_drift
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--.- mV");

                  return str_sprintf(
                    "%.1f mV",
                    id(ui_model_battery_1_cell_drift).state
                  );

            - lvgl.label.update:
                id: ui_battery_1_warning
                text: !lambda |-
                  if (!id(ui_model_battery_1_data_available).state)
                    return std::string("--");

                  return
                    id(ui_model_battery_1_warning).state
                      ? std::string("ACTIVE")
                      : std::string("OK");

            - lvgl.label.update:
                id: ui_battery_1_fault
                text: !lambda |-
