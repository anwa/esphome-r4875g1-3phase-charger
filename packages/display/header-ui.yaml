# ==============================================================================
# SHARED V6 PERSISTENT HEADER
# ==============================================================================
#
# Defines the persistent header used by both V6 touchscreen targets.
#
# Runtime updates are handled by display/header.yaml and the corresponding
# backup-battery presentation runtime.
# ==============================================================================

lvgl:
  top_layer:
    widgets:

      # Header
      - obj:
          x: 0
          y: 0
          width: 800
          height: 58
          styles: style_header

          widgets:
            - label:
                x: 20
                align: LEFT_MID
                text: "R4875 Charger"
                text_font: montserrat_20
                text_color: 0xFFFFFF

            - label:
                x: 180
                align: LEFT_MID
                text: "v${firmware_version}"
                text_font: montserrat_18
                text_color: 0x8B96A0

            - label:
                id: ui_header_clock
                x: 0
                align: CENTER
                width: 250
                text_align: CENTER
                text: "--.--.---- --:--"
                text_font: montserrat_18
                text_color: 0xDDE3E8

            - label:
                id: ui_header_battery
                x: -125
                align: RIGHT_MID
                width: 130
                text_align: RIGHT
                text: "CTRL --.-- V"
                text_font: montserrat_16
                text_color: 0x8B96A0

            - label:
                id: ui_header_run_state
                x: -20
                align: RIGHT_MID
                width: 100
                text_align: RIGHT
                text: "OFF"
                text_font: montserrat_18
                text_color: 0xFF3030
