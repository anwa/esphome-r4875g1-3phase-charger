# ==============================================================================
# SHARED V6 HMI INFRASTRUCTURE
# ==============================================================================
#
# Composes persistent presentation state and the header runtime used by the
# shared V6 HMI features.
#
# Display hardware, LVGL, theme, fonts, chart support and the persistent header
# frame are provided by the shared Waveshare base. Dashboard, Rectifiers,
# Battery, Cooling, System, Trends and shared navigation packages consume this
# common infrastructure without owning or duplicating it.
# ==============================================================================

packages:

  # ---------------------------------------------------------------------------
  # SHARED PRESENTATION STATE
  # ---------------------------------------------------------------------------

  display_ui_state: !include ui-state.yaml
  display_trend_state: !include trend-state.yaml

  # ---------------------------------------------------------------------------
  # PERSISTENT HEADER
  # ---------------------------------------------------------------------------

  display_header: !include header.yaml
