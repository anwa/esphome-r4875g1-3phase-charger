# ==============================================================================
# V5 SYSTEM DISPLAY RUNTIME
# ==============================================================================
#
# Runtime updates for the System diagnostics page.
#
# System widgets are refreshed only while page_system is visible.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 4;

          then:

            # ---------------------------------------------------------------------------
            # NETWORK
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_ip
                text: !lambda |-
                  if (id(ip_address).state.empty()) {
                    return std::string("--");
                  }

                  return id(ip_address).state;

            - lvgl.label.update:
                id: ui_system_wifi
                text: !lambda |-
                  if (isnan(id(wifi_sig).state)) {
                    return std::string("-- dBm");
                  }

                  return str_sprintf(
                    "%.0f dBm",
                    id(wifi_sig).state
                  );

                text_color: !lambda |-
                  if (isnan(id(wifi_sig).state)) {
                    return lv_color_hex(0x8B96A0);
                  }

                  const float rssi = id(wifi_sig).state;

                  if (rssi >= -60.0f) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (rssi >= -75.0f) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0xFF5C5C);

            # ---------------------------------------------------------------------------
            # CONTROLLER
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_uptime
                text: !lambda |-
                  const float uptime =
                    id(debug_uptime).state;

                  if (isnan(uptime)) {
                    return std::string("--");
                  }

                  const uint32_t seconds =
                    static_cast<uint32_t>(uptime);

                  const uint32_t days =
                    seconds / 86400U;

                  const uint32_t hours =
                    (seconds % 86400U) / 3600U;

                  const uint32_t minutes =
                    (seconds % 3600U) / 60U;

                  if (days > 0) {
                    return str_sprintf(
                      "%lu d %02lu:%02lu",
                      static_cast<unsigned long>(days),
                      static_cast<unsigned long>(hours),
                      static_cast<unsigned long>(minutes)
                    );
                  }

                  return str_sprintf(
                    "%02lu:%02lu",
                    static_cast<unsigned long>(hours),
                    static_cast<unsigned long>(minutes)
                  );

            - lvgl.label.update:
                id: ui_system_cpu
                text: !lambda |-
                  if (isnan(id(cpu_temp).state)) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(cpu_temp).state
                  );

            # ---------------------------------------------------------------------------
            # MEMORY AND RUNTIME DEBUG
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_heap
                text: !lambda |-
                  if (isnan(id(debug_heap_free).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_heap_free).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_heap_block
                text: !lambda |-
                  if (isnan(id(debug_heap_max_block).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_heap_max_block).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_psram
                text: !lambda |-
                  if (isnan(id(debug_free_psram).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_free_psram).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_loop_time
                text: !lambda |-
                  if (isnan(id(debug_loop_time).state)) {
                    return std::string("-- ms");
                  }

                  return str_sprintf(
                    "%.0f ms",
                    id(debug_loop_time).state
                  );

            - lvgl.label.update:
                id: ui_system_cpu_frequency
                text: !lambda |-
                  if (isnan(id(debug_cpu_frequency).state)) {
                    return std::string("--- MHz");
                  }

                  return str_sprintf(
                    "%.0f MHz",
                    id(debug_cpu_frequency).state / 1000000.0f
                  );

            # ---------------------------------------------------------------------------
            # RECTIFIER 1 COMMUNICATION/LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_1

                text: !lambda |-
                  if (!id(can_com_ok_1).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(rectifier_control_state_text_1).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(can_com_ok_1).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  if (
                    id(rectifier_control_state_1) ==
                      ${rectifier_state_online}
                  ) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(rectifier_control_state_1) ==
                      ${rectifier_state_discovering}
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            # ---------------------------------------------------------------------------
            # RECTIFIER 2 COMMUNICATION/LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_2

                text: !lambda |-
                  if (!id(can_com_ok_2).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(rectifier_control_state_text_2).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(can_com_ok_2).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  if (
                    id(rectifier_control_state_2) ==
                      ${rectifier_state_online}
                  ) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(rectifier_control_state_2) ==
                      ${rectifier_state_discovering}
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            # ---------------------------------------------------------------------------
            # RECTIFIER 3 COMMUNICATION/LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_3

                text: !lambda |-
                  if (!id(can_com_ok_3).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(rectifier_control_state_text_3).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(can_com_ok_3).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  if (
                    id(rectifier_control_state_3) ==
                      ${rectifier_state_online}
                  ) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(rectifier_control_state_3) ==
                      ${rectifier_state_discovering}
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);
