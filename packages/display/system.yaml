# ==============================================================================
# SHARED V6 SYSTEM DISPLAY RUNTIME
# ==============================================================================
#
# Updates the shared System diagnostics page for both V6 firmware targets.
#
# Local network, ESP32 and backup-battery values describe the device running the
# current target. Rectifier state is consumed exclusively through the shared
# target-neutral UI model.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 5;

          then:

            # ---------------------------------------------------------------------------
            # LOCAL NETWORK
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_ip
                text: !lambda |-
                  if (id(ip_address).state.empty()) {
                    return std::string("--");
                  }

                  return id(ip_address).state;

            - lvgl.label.update:
                id: ui_system_wifi
                text: !lambda |-
                  if (isnan(id(wifi_sig).state)) {
                    return std::string("-- dBm");
                  }

                  return str_sprintf(
                    "%.0f dBm",
                    id(wifi_sig).state
                  );

                text_color: !lambda |-
                  if (isnan(id(wifi_sig).state)) {
                    return lv_color_hex(0x8B96A0);
                  }

                  const float rssi = id(wifi_sig).state;

                  if (rssi >= -60.0f) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (rssi >= -75.0f) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0xFF5C5C);

            # ---------------------------------------------------------------------------
            # LOCAL DEVICE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_uptime
                text: !lambda |-
                  const float uptime =
                    id(debug_uptime).state;

                  if (isnan(uptime)) {
                    return std::string("--");
                  }

                  const uint32_t seconds =
                    static_cast<uint32_t>(uptime);

                  const uint32_t days =
                    seconds / 86400U;

                  const uint32_t hours =
                    (seconds % 86400U) / 3600U;

                  const uint32_t minutes =
                    (seconds % 3600U) / 60U;

                  if (days > 0) {
                    return str_sprintf(
                      "%lu d %02lu:%02lu",
                      static_cast<unsigned long>(days),
                      static_cast<unsigned long>(hours),
                      static_cast<unsigned long>(minutes)
                    );
                  }

                  return str_sprintf(
                    "%02lu:%02lu",
                    static_cast<unsigned long>(hours),
                    static_cast<unsigned long>(minutes)
                  );

            - lvgl.label.update:
                id: ui_system_cpu
                text: !lambda |-
                  if (isnan(id(cpu_temp).state)) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(cpu_temp).state
                  );

            - lvgl.label.update:
                id: ui_system_battery

                text: !lambda |-
                  const float voltage =
                    id(local_backup_battery_voltage).state;

                  const float soc =
                    id(local_backup_battery_soc).state;

                  if (
                    isnan(voltage) ||
                    isnan(soc)
                  ) {
                    return std::string(
                      "--.-- V / -- %"
                    );
                  }

                  return str_sprintf(
                    "%.2f V / %.0f %%",
                    voltage,
                    soc
                  );

                text_color: !lambda |-
                  const float voltage =
                    id(local_backup_battery_voltage).state;

                  if (isnan(voltage)) {
                    return lv_color_hex(0x8B96A0);
                  }

                  if (voltage < 3.50f) {
                    return lv_color_hex(0xFF3030);
                  }

                  if (voltage < 3.70f) {
                    return lv_color_hex(0xFFC04A);
                  }

                  return lv_color_hex(0x5CFF7A);

            # ---------------------------------------------------------------------------
            # MEMORY AND RUNTIME DEBUG
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_heap
                text: !lambda |-
                  if (isnan(id(debug_heap_free).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_heap_free).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_heap_block
                text: !lambda |-
                  if (isnan(id(debug_heap_max_block).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_heap_max_block).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_psram
                text: !lambda |-
                  if (isnan(id(debug_free_psram).state)) {
                    return std::string("---- kB");
                  }

                  return str_sprintf(
                    "%.0f kB",
                    id(debug_free_psram).state / 1024.0f
                  );

            - lvgl.label.update:
                id: ui_system_loop_time
                text: !lambda |-
                  if (isnan(id(debug_loop_time).state)) {
                    return std::string("-- ms");
                  }

                  return str_sprintf(
                    "%.0f ms",
                    id(debug_loop_time).state
                  );

            - lvgl.label.update:
                id: ui_system_cpu_frequency
                text: !lambda |-
                  if (isnan(id(debug_cpu_frequency).state)) {
                    return std::string("--- MHz");
                  }

                  return str_sprintf(
                    "%.0f MHz",
                    id(debug_cpu_frequency).state / 1000000.0f
                  );

            # ---------------------------------------------------------------------------
            # RECTIFIER 1 LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_1

                text: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_1_lifecycle).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_1_lifecycle).state;

                  if (lifecycle == "ONLINE") {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (lifecycle == "DISCOVERING") {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            # ---------------------------------------------------------------------------
            # RECTIFIER 2 LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_2

                text: !lambda |-
                  if (!id(ui_model_rectifier_2_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_2_lifecycle).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_2_connected).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_2_lifecycle).state;

                  if (lifecycle == "ONLINE") {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (lifecycle == "DISCOVERING") {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            # ---------------------------------------------------------------------------
            # RECTIFIER 3 LIFECYCLE
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_system_unit_3

                text: !lambda |-
                  if (!id(ui_model_rectifier_3_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_3_lifecycle).state;

                  if (lifecycle.empty()) {
                    return std::string("--");
                  }

                  return lifecycle;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_3_connected).state) {
                    return lv_color_hex(0xFF5C5C);
                  }

                  const std::string lifecycle =
                    id(ui_model_rectifier_3_lifecycle).state;

                  if (lifecycle == "ONLINE") {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (lifecycle == "DISCOVERING") {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);
