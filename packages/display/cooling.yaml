# ==============================================================================
# V6 COOLING DISPLAY RUNTIME
# ==============================================================================
#
# Runtime updates for the Cooling page.
#
# Cooling widgets are refreshed only while page_cooling is visible. All charger
# state is consumed through the shared UI model so this runtime is independent
# of the active V6 target backend.
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 4;

          then:

            # ---------------------------------------------------------------------------
            # COMPARTMENT ENVIRONMENT
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_cooling_compartment_temperature
                text: !lambda |-
                  if (isnan(id(ui_model_cooling_compartment_temperature).state)) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_cooling_compartment_temperature).state
                  );

            - lvgl.label.update:
                id: ui_cooling_compartment_humidity
                text: !lambda |-
                  if (isnan(id(ui_model_cooling_compartment_humidity).state)) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_cooling_compartment_humidity).state
                  );

            # ---------------------------------------------------------------------------
            # RECTIFIER 1
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_cooling_r1_state
                text: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string state =
                    id(ui_model_rectifier_1_lifecycle).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return lv_color_hex(0x8B96A0);
                  }

                  if (id(ui_model_rectifier_1_online).state) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(ui_model_rectifier_1_lifecycle).state ==
                      "DISCOVERING"
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            - lvgl.label.update:
                id: ui_cooling_r1_rpm
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_fan_rpm).state)
                  ) {
                    return std::string("---- RPM");
                  }

                  return str_sprintf(
                    "%.0f RPM",
                    id(ui_model_rectifier_1_fan_rpm).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r1_min_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_fan_minimum_duty).state)
                  ) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_rectifier_1_fan_minimum_duty).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r1_target_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_fan_target_duty).state)
                  ) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_rectifier_1_fan_target_duty).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r1_temperature
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_1_connected).state ||
                    isnan(id(ui_model_rectifier_1_output_temperature).state)
                  ) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_rectifier_1_output_temperature).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r1_thermal
                text: !lambda |-
                  if (!id(ui_model_rectifier_1_connected).state) {
                    return std::string("--");
                  }

                  const std::string state =
                    id(ui_model_rectifier_1_thermal_state).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

            - if:
                condition:
                  lambda: |-
                    return
                      id(ui_model_data_available).state &&
                      id(ui_model_rectifier_1_online).state &&
                      id(ui_model_rectifier_1_power_state).state == "ON";

                then:
                  - lvgl.widget.enable:
                      id: ui_cooling_r1_auto_button
                  - lvgl.widget.enable:
                      id: ui_cooling_r1_full_button

                else:
                  - lvgl.widget.disable:
                      id: ui_cooling_r1_auto_button
                  - lvgl.widget.disable:
                      id: ui_cooling_r1_full_button

            # ---------------------------------------------------------------------------
            # RECTIFIER 2
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
