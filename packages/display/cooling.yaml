                    return std::string("OFFLINE");
                  }

                  const std::string state =
                    id(ui_model_rectifier_2_lifecycle).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_2_connected).state) {
                    return lv_color_hex(0x8B96A0);
                  }

                  if (id(ui_model_rectifier_2_online).state) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(ui_model_rectifier_2_lifecycle).state ==
                      "DISCOVERING"
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            - lvgl.label.update:
                id: ui_cooling_r2_rpm
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_2_connected).state ||
                    isnan(id(ui_model_rectifier_2_fan_rpm).state)
                  ) {
                    return std::string("---- RPM");
                  }

                  return str_sprintf(
                    "%.0f RPM",
                    id(ui_model_rectifier_2_fan_rpm).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r2_min_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_2_connected).state ||
                    isnan(id(ui_model_rectifier_2_fan_minimum_duty).state)
                  ) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_rectifier_2_fan_minimum_duty).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r2_target_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_2_connected).state ||
                    isnan(id(ui_model_rectifier_2_fan_target_duty).state)
                  ) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_rectifier_2_fan_target_duty).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r2_temperature
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_2_connected).state ||
                    isnan(id(ui_model_rectifier_2_output_temperature).state)
                  ) {
                    return std::string("--.- °C");
                  }

                  return str_sprintf(
                    "%.1f °C",
                    id(ui_model_rectifier_2_output_temperature).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r2_thermal
                text: !lambda |-
                  if (!id(ui_model_rectifier_2_connected).state) {
                    return std::string("--");
                  }

                  const std::string state =
                    id(ui_model_rectifier_2_thermal_state).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

            - if:
                condition:
                  lambda: |-
                    return
                      id(ui_model_data_available).state &&
                      id(ui_model_rectifier_2_online).state &&
                      id(ui_model_rectifier_2_power_state).state == "ON";

                then:
                  - lvgl.widget.enable:
                      id: ui_cooling_r2_auto_button
                  - lvgl.widget.enable:
                      id: ui_cooling_r2_full_button

                else:
                  - lvgl.widget.disable:
                      id: ui_cooling_r2_auto_button
                  - lvgl.widget.disable:
                      id: ui_cooling_r2_full_button

            # ---------------------------------------------------------------------------
            # RECTIFIER 3
            # ---------------------------------------------------------------------------

            - lvgl.label.update:
                id: ui_cooling_r3_state
                text: !lambda |-
                  if (!id(ui_model_rectifier_3_connected).state) {
                    return std::string("OFFLINE");
                  }

                  const std::string state =
                    id(ui_model_rectifier_3_lifecycle).state;

                  return state.empty()
                    ? std::string("--")
                    : state;

                text_color: !lambda |-
                  if (!id(ui_model_rectifier_3_connected).state) {
                    return lv_color_hex(0x8B96A0);
                  }

                  if (id(ui_model_rectifier_3_online).state) {
                    return lv_color_hex(0x5CFF7A);
                  }

                  if (
                    id(ui_model_rectifier_3_lifecycle).state ==
                      "DISCOVERING"
                  ) {
                    return lv_color_hex(0xFFC857);
                  }

                  return lv_color_hex(0x8B96A0);

            - lvgl.label.update:
                id: ui_cooling_r3_rpm
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_3_connected).state ||
                    isnan(id(ui_model_rectifier_3_fan_rpm).state)
                  ) {
                    return std::string("---- RPM");
                  }

                  return str_sprintf(
                    "%.0f RPM",
                    id(ui_model_rectifier_3_fan_rpm).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r3_min_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_3_connected).state ||
                    isnan(id(ui_model_rectifier_3_fan_minimum_duty).state)
                  ) {
                    return std::string("--.- %");
                  }

                  return str_sprintf(
                    "%.1f %%",
                    id(ui_model_rectifier_3_fan_minimum_duty).state
                  );

            - lvgl.label.update:
                id: ui_cooling_r3_target_duty
                text: !lambda |-
                  if (
                    !id(ui_model_rectifier_3_connected).state ||
                    isnan(id(ui_model_rectifier_3_fan_target_duty).state)
                  ) {
