# ==============================================================================
# V5 PERSISTENT HEADER RUNTIME
# ==============================================================================
#
# Runtime updates for widgets that are permanently visible on every page.
#
# Refresh rates:
#   Charger run state -> 500 ms
#   Clock             -> 10 s
#
# Battery voltage is maintained separately by display/battery.yaml.
# ==============================================================================


# ==============================================================================
# CHARGER RUN STATE
# ==============================================================================

interval:
  - interval: 500ms
    then:
      - lvgl.label.update:
          id: ui_header_run_state

          text: !lambda |-
            const float running =
              id(running_units).state;

            if (
              isnan(running) ||
              running < 1.0f
            ) {
              return std::string("OFF");
            }

            return str_sprintf(
              "%.0f/3 ON",
              running
            );

          text_color: !lambda |-
            const float running =
              id(running_units).state;

            return
              !isnan(running) &&
              running >= 3.0f
                ? lv_color_hex(0x5CFF7A)
                : lv_color_hex(0xFF3030);

# ==============================================================================
# CLOCK
# ==============================================================================

  - interval: 10s
    then:
      - lvgl.label.update:
          id: ui_header_clock

          text: !lambda |-
            auto now = id(sntp_time).now();

            if (!now.is_valid()) {
              return std::string("--.--.---- --:--");
            }

            return str_sprintf(
              "%02d.%02d.%04d  %02d:%02d",
              now.day_of_month,
              now.month,
              now.year,
              now.hour,
              now.minute
            );