# ==============================================================================
# SHARED DASHBOARD COMMAND STATE
# ==============================================================================
#
# Resolves the shared charger-wide START/STOP presentation state from the
# authoritative shared UI model.
#
# Command completion therefore behaves identically on the local Charger
# Controller and the Remote HMI.
# ==============================================================================

interval:

  - interval: 500ms
    then:

      # ---------------------------------------------------------------------------
      # CHARGER POWER COMMAND TRANSITION
      # ---------------------------------------------------------------------------

      - lambda: |-
          const uint8_t pending =
            id(ui_charger_power_pending);

          if (pending == 0) {
            return;
          }

          const float available =
            id(ui_model_available_units).state;

          const float running =
            id(ui_model_running_units).state;

          const bool state_valid =
            id(ui_model_data_available).state &&
            !isnan(available) &&
            !isnan(running);

          bool completed = false;

          if (state_valid) {
            if (pending == 1) {
              completed =
                available > 0.0f &&
                running >= available;
            } else if (pending == 2) {
              completed =
                running <= 0.0f;
            }
          }

          const bool timed_out =
            static_cast<uint32_t>(
              millis() -
              id(ui_charger_power_pending_since)
            ) >= 10000UL;

          if (completed || timed_out) {
            if (timed_out && !completed) {
              ESP_LOGW(
                "ui",
                "Charger power command UI timeout."
              );
            }

            id(ui_charger_power_pending) = 0;
          }
