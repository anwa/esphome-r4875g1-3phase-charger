# ==============================================================================
# V5 LVGL THEME
# ==============================================================================
#
# Shared visual styles used across all charger pages.
# ==============================================================================

lvgl:
  style_definitions:

    # ---------------------------------------------------------------------------
    # MAIN PAGE BACKGROUND
    # ---------------------------------------------------------------------------

    - id: style_page
      bg_color: 0x101418
      bg_opa: COVER
      border_width: 0
      pad_all: 0

    # ---------------------------------------------------------------------------
    # PERSISTENT TOP HEADER
    # ---------------------------------------------------------------------------

    - id: style_header
      bg_color: 0x171D23
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0

    # ---------------------------------------------------------------------------
    # BOTTOM NAVIGATION BUTTONS
    # ---------------------------------------------------------------------------

    - id: style_nav_button
      bg_color: 0x202830
      bg_opa: COVER
      border_color: 0x3B4652
      border_width: 1
      radius: 8
      text_color: 0xDDE3E8

    # ---------------------------------------------------------------------------
    # GENERIC CONTENT CARD
    # ---------------------------------------------------------------------------

    - id: style_card
      bg_color: 0x171D23
      bg_opa: COVER
      border_color: 0x303A44
      border_width: 1
      radius: 12
      pad_all: 0
