lvgl:
  displays: tft
  rotation: ${display_rotation}
  # The ESP32-S3 has 8 MB PSRAM, so keep a complete RGB565 framebuffer.
  # ESPHome LVGL currently supports 16-bit RGB565 output only.
  color_depth: 16
  buffer_size: 100%
  default_font: ui_font_18
  log_level: WARN

  # This installation has no touchscreen. Disable scrolling and scrollbars for
  # all generic container objects globally so cards never show unusable bars,
  # even when a child temporarily exceeds its content area.
  theme:
    obj:
      scrollable: false
      scrollbar_mode: "OFF"

  style_definitions:
    - id: style_card
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0xD8DEE8
      border_width: 1
      radius: 10
      pad_all: 8

    - id: style_header
      bg_color: 0x182433
      bg_opa: COVER
      border_width: 0
      radius: 0
      text_color: 0xFFFFFF

    - id: style_muted
      text_color: 0x657080
      text_font: ui_font_14

    - id: style_good
      text_color: 0x198754

    - id: style_warn
      text_color: 0xC27A00

    - id: style_fault
      text_color: 0xC62828

    - id: style_accent
      text_color: 0x1769AA
