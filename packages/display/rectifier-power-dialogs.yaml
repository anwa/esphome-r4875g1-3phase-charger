# ==============================================================================
# SHARED RECTIFIER POWER DIALOGS
# ==============================================================================
#
# Defines START and STOP confirmation dialogs for one rectifier.
#
# The package is instantiated once for each rectifier.
#
# Required variable:
#   ui_unit -> rectifier unit number
# ==============================================================================

lvgl:
  top_layer:
    widgets:

      # ---------------------------------------------------------------------------
      # START
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_start_rectifier_${ui_unit}_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 240
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 18
                      width: 420
                      text_align: CENTER
                      text: "START RECTIFIER ${ui_unit}"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  - label:
                      x: 35
                      y: 70
                      width: 390
                      text_align: CENTER
                      text: "Start Rectifier ${ui_unit}?\n\nAll individual safety checks will be applied."
                      text_font: montserrat_18
                      text_color: 0xDDE3E8

                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide:
                            id: ui_start_rectifier_${ui_unit}_dialog

                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0x5CFF7A

                      widgets:
                        - label:
                            align: CENTER
                            text: "START"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide:
                            id: ui_start_rectifier_${ui_unit}_dialog

                        - lambda: |-
                            id(ui_rectifier_${ui_unit}_power_pending) = 1;
                            id(ui_rectifier_${ui_unit}_power_pending_since) =
                              millis();

                        - lvgl.widget.disable:
                            id: ui_rectifier_${ui_unit}_power_button

                        - lvgl.label.update:
                            id: ui_rectifier_${ui_unit}_power_button_label
                            text: "STARTING..."

                        - script.execute:
                            id: ui_command_rectifier_start
                            unit: ${ui_unit}

      # ---------------------------------------------------------------------------
      # STOP
      # ---------------------------------------------------------------------------

      - obj:
          id: ui_stop_rectifier_${ui_unit}_dialog
          x: 0
          y: 0
          width: 800
          height: 480
          hidden: true
          clickable: true
          bg_color: 0x000000
          bg_opa: 55%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"

          widgets:
            - obj:
                align: CENTER
                width: 460
                height: 220
                styles: style_dialog_panel
                scrollable: false
                scrollbar_mode: "OFF"

                widgets:
                  - label:
                      x: 20
                      y: 18
                      width: 420
                      text_align: CENTER
                      text: "STOP RECTIFIER ${ui_unit}"
                      text_font: montserrat_20
                      text_color: 0xFFFFFF

                  - label:
                      x: 35
                      y: 80
                      width: 390
                      text_align: CENTER
                      text: "Stop Rectifier ${ui_unit}?"
                      text_font: montserrat_18
                      text_color: 0xDDE3E8

                  - button:
                      align: BOTTOM_MID
                      x: -85
                      y: -20
                      styles: style_dialog_button

                      widgets:
                        - label:
                            align: CENTER
                            text: "CANCEL"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide:
                            id: ui_stop_rectifier_${ui_unit}_dialog

                  - button:
                      align: BOTTOM_MID
                      x: 85
                      y: -20
                      styles: style_dialog_button
                      border_color: 0xFF5C5C

                      widgets:
                        - label:
                            align: CENTER
                            text: "STOP"
                            text_font: montserrat_16
                            text_color: 0xFFFFFF

                      on_click:
                        - lvgl.widget.hide:
                            id: ui_stop_rectifier_${ui_unit}_dialog

                        - lambda: |-
                            id(ui_rectifier_${ui_unit}_power_pending) = 2;
                            id(ui_rectifier_${ui_unit}_power_pending_since) =
                              millis();

                        - lvgl.widget.disable:
                            id: ui_rectifier_${ui_unit}_power_button

                        - lvgl.label.update:
                            id: ui_rectifier_${ui_unit}_power_button_label
                            text: "STOPPING..."

                        - script.execute:
                            id: ui_command_rectifier_stop
                            unit: ${ui_unit}
