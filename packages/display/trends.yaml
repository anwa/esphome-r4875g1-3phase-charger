# ==============================================================================
# SHARED V6 TRENDS RUNTIME
# ==============================================================================
#
# Native LVGL chart support for the Trends page.
#
# Current values are consumed through the target-neutral shared UI model.
# Trend acquisition and the five 360-sample ring buffers are owned by:
#   display/trend-state.yaml
#
# The page itself is defined in:
#   display/pages/trends.yaml
#
# Shared native chart support is enabled by display/chart-support.yaml.
# ==============================================================================

script:
  - id: trend_chart_refresh
    mode: restart

    then:
      - lambda: |-
          constexpr uint16_t TREND_POINTS = 360;

          static lv_obj_t *chart = nullptr;
          static lv_chart_series_t *series = nullptr;
          static lv_chart_series_t *secondary_series = nullptr;

          static int last_selection = -1;
          static uint16_t last_write_index = 0xFFFF;
          static uint16_t last_sample_count = 0xFFFF;


          // Create the native LVGL chart lazily on first use.
          if (chart == nullptr) {

            chart = lv_chart_create(
              id(ui_trend_chart_host)
            );

            lv_obj_set_size(
              chart,
              660,
              190
            );

            lv_obj_set_pos(
              chart,
              55,
              8
            );

            lv_chart_set_type(
              chart,
              LV_CHART_TYPE_LINE
            );

            lv_chart_set_point_count(
              chart,
              TREND_POINTS
            );

            lv_chart_set_update_mode(
              chart,
              LV_CHART_UPDATE_MODE_SHIFT
            );

            lv_chart_set_div_line_count(
              chart,
              5,
              7
            );

            lv_obj_set_style_border_width(
              chart,
              0,
              LV_PART_MAIN
            );

            lv_obj_set_style_bg_color(
              chart,
              lv_color_hex(0x11171C),
              LV_PART_MAIN
            );

            lv_obj_set_style_bg_opa(
              chart,
              LV_OPA_COVER,
              LV_PART_MAIN
            );

            lv_obj_set_style_line_color(
              chart,
              lv_color_hex(0x3B4652),
              LV_PART_MAIN
            );

            lv_obj_set_style_line_opa(
              chart,
              LV_OPA_COVER,
              LV_PART_MAIN
            );

            series = lv_chart_add_series(
              chart,
              lv_color_hex(0x5CFF7A),
              LV_CHART_AXIS_PRIMARY_Y
            );

            secondary_series = lv_chart_add_series(
              chart,
              lv_color_hex(0x4DB8FF),
              LV_CHART_AXIS_SECONDARY_Y
            );

            lv_chart_hide_series(
              chart,
              secondary_series,
              true
            );

            lv_obj_set_style_line_width(
              chart,
              2,
              LV_PART_ITEMS
            );

            lv_obj_set_style_size(
              chart,
              0,
              0,
              LV_PART_INDICATOR
            );

            lv_chart_set_range(
              chart,
              LV_CHART_AXIS_PRIMARY_Y,
              0,
              100
            );

            // Safe initial voltage range until the first dual-axis refresh
            // derives a dynamic secondary range.
            lv_chart_set_range(
              chart,
              LV_CHART_AXIS_SECONDARY_Y,
              4500,
              6000
            );

            ESP_LOGI(
              "trend",
              "V6 native LVGL trend chart created with %u points.",
              TREND_POINTS
            );
          }

          // Current buffer state
          const int selection =
            id(trend_selection);

          const uint16_t write_index =
            id(trend_write_index);

          const uint16_t sample_count =
            std::min<uint16_t>(
              id(trend_sample_count),
              TREND_POINTS
            );


          // Select source
          const std::vector<float> *buffer = nullptr;
          const std::vector<float> *secondary_buffer = nullptr;

          const char *title = "POWER";
          const char *unit = "kW";

          float scale = 100.0f;
          float minimum_span = 1.0f;
          bool zero_floor = true;
          int decimals = 2;

          bool dual_axis = false;
          constexpr float secondary_scale = 100.0f;

          float current = NAN;
          float secondary_current = NAN;

          switch (selection) {

            case 0:
              buffer = &id(trend_buffer_dc_power);
              title = "POWER";
              unit = "kW";
              scale = 100.0f;
              minimum_span = 1.0f;
              zero_floor = true;
              decimals = 2;
              current = id(ui_model_dc_power).state;
              break;

            case 1:
              buffer = &id(trend_buffer_dc_current);
              secondary_buffer = &id(trend_buffer_dc_voltage);
              title = "CURRENT";
              unit = "A";
              scale = 10.0f;
              minimum_span = 10.0f;
              zero_floor = true;
              decimals = 1;
              current = id(ui_model_dc_current).state;
              secondary_current = id(ui_model_dc_voltage).state;
              dual_axis = true;
              break;

            case 2:
              buffer = &id(trend_buffer_output_temp);
              title = "OUTPUT TEMP";
              unit = "C";
              scale = 10.0f;
              minimum_span = 10.0f;
              zero_floor = true;
              decimals = 1;
              current = id(ui_model_highest_output_temperature).state;
              break;

            case 3:
              buffer = &id(trend_buffer_compartment_temp);
              title = "COMPARTMENT";
              unit = "C";
              scale = 10.0f;
              minimum_span = 10.0f;
              zero_floor = true;
              decimals = 1;
              current =
                id(ui_model_cooling_compartment_temperature).state;
              break;

            default:
              return;
          }

          lv_label_set_text(
            id(ui_trend_primary_name),
            title
          );

          lv_chart_hide_series(
            chart,
            secondary_series,
            !dual_axis
          );

          // Select the active trend buffer and display unit.
          const lv_color_t normal =
            lv_color_hex(0x202830);

          const lv_color_t active =
            lv_color_hex(0x36505A);

          const lv_color_t normal_text =
            lv_color_hex(0xDDE3E8);

          const lv_color_t active_text =
            lv_color_hex(0x5CFF7A);

          lv_obj_set_style_text_color(
            id(ui_trend_tab_dc_iv),
            selection == 1 ? active_text : normal_text,
            LV_PART_MAIN
          );

          lv_obj_set_style_text_color(
            id(ui_trend_tab_output_temp),
            selection == 2 ? active_text : normal_text,
            LV_PART_MAIN
          );

          lv_obj_set_style_text_color(
            id(ui_trend_tab_compartment),
            selection == 3 ? active_text : normal_text,
            LV_PART_MAIN
          );

          // Current value
          std::string current_text;

          if (isnan(current)) {

            current_text =
              "--";

          } else if (decimals == 2) {

            current_text =
              str_sprintf(
                "%.2f %s",
                current,
                unit
              );

          } else {

            current_text =
              str_sprintf(
                "%.1f %s",
                current,
                unit
              );
          }

          lv_label_set_text(
            id(ui_trend_current),
            current_text.c_str()
          );

          if (dual_axis) {

            const std::string secondary_current_text =
              isnan(secondary_current)
                ? "--"
                : str_sprintf(
                    "%.1f V",
                    secondary_current
                  );

            lv_label_set_text(
              id(ui_trend_secondary_current),
              secondary_current_text.c_str()
            );

            lv_obj_clear_flag(
              id(ui_trend_secondary_name),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_clear_flag(
              id(ui_trend_secondary_current),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_clear_flag(
              id(ui_trend_secondary_min),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_clear_flag(
              id(ui_trend_secondary_max),
              LV_OBJ_FLAG_HIDDEN
            );

          } else {

            lv_obj_add_flag(
              id(ui_trend_secondary_name),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_add_flag(
              id(ui_trend_secondary_current),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_add_flag(
              id(ui_trend_secondary_min),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_add_flag(
              id(ui_trend_secondary_max),
              LV_OBJ_FLAG_HIDDEN
            );
          }

          // Nothing new for graph?
          if (
            selection == last_selection &&
            write_index == last_write_index &&
            sample_count == last_sample_count
          ) {
            return;
          }

          last_selection = selection;
          last_write_index = write_index;
          last_sample_count = sample_count;


          // Rewrite 360-point series
          float minimum = NAN;
          float maximum = NAN;
          float secondary_minimum = NAN;
          float secondary_maximum = NAN;

          const uint16_t leading_empty =
            TREND_POINTS - sample_count;

          for (
            uint16_t chart_index = 0;
            chart_index < TREND_POINTS;
            chart_index++
          ) {

            if (chart_index < leading_empty) {

              lv_chart_set_value_by_id(
                chart,
                series,
                chart_index,
                LV_CHART_POINT_NONE
              );

              if (dual_axis) {
                lv_chart_set_value_by_id(
                  chart,
                  secondary_series,
                  chart_index,
                  LV_CHART_POINT_NONE
                );
              }

              continue;
            }

            const uint16_t sample_offset =
              chart_index - leading_empty;

            uint16_t buffer_index;

            if (sample_count < TREND_POINTS) {

              buffer_index =
                sample_offset;

            } else {

              buffer_index =
                (
                  write_index +
                  sample_offset
                ) % TREND_POINTS;
            }

            const float value =
              (*buffer)[buffer_index];

            if (isnan(value)) {

              lv_chart_set_value_by_id(
                chart,
                series,
                chart_index,
                LV_CHART_POINT_NONE
              );

            } else {

              if (
                isnan(minimum) ||
                value < minimum
              ) {
                minimum = value;
              }

              if (
                isnan(maximum) ||
                value > maximum
              ) {
                maximum = value;
              }

              lv_chart_set_value_by_id(
                chart,
                series,
                chart_index,
                static_cast<int32_t>(
                  lroundf(value * scale)
                )
              );
            }

            if (dual_axis) {

              const float secondary_value =
                (*secondary_buffer)[buffer_index];

              if (isnan(secondary_value)) {

                lv_chart_set_value_by_id(
                  chart,
                  secondary_series,
                  chart_index,
                  LV_CHART_POINT_NONE
                );

              } else {

                if (
                  isnan(secondary_minimum) ||
                  secondary_value < secondary_minimum
                ) {
                  secondary_minimum = secondary_value;
                }

                if (
                  isnan(secondary_maximum) ||
                  secondary_value > secondary_maximum
                ) {
                  secondary_maximum = secondary_value;
                }

                lv_chart_set_value_by_id(
                  chart,
                  secondary_series,
                  chart_index,
                  static_cast<int32_t>(
                    lroundf(
                      secondary_value *
                      secondary_scale
                    )
                  )
                );
              }
            }
          }

          // Dynamic y range
          float axis_low = 0.0f;
          float axis_high = minimum_span;

          if (
            !isnan(minimum) &&
            !isnan(maximum)
          ) {

            axis_low = minimum;
            axis_high = maximum;

            float span =
              axis_high - axis_low;

            if (span < minimum_span) {

              const float center =
                (
                  axis_low +
                  axis_high
                ) * 0.5f;

              axis_low =
                center -
                minimum_span * 0.5f;

              axis_high =
                center +
                minimum_span * 0.5f;

              span = minimum_span;
            }

            const float padding =
              span * 0.10f;

            axis_low -= padding;
            axis_high += padding;

            if (
              zero_floor &&
              axis_low < 0.0f
            ) {
              axis_low = 0.0f;
            }
          }

          int32_t chart_axis_low =
            static_cast<int32_t>(
              floorf(
                axis_low * scale
              )
            );

          int32_t chart_axis_high =
            static_cast<int32_t>(
              ceilf(
                axis_high * scale
              )
            );

          if (
            chart_axis_high <=
            chart_axis_low
          ) {
            chart_axis_high =
              chart_axis_low + 1;
          }

          lv_chart_set_range(
            chart,
            LV_CHART_AXIS_PRIMARY_Y,
            chart_axis_low,
            chart_axis_high
          );

          // y-axis labels
          const float axis_mid =
            (
              axis_low +
              axis_high
            ) * 0.5f;

          std::string y_max;
          std::string y_mid;
          std::string y_min;

          if (
            isnan(minimum) ||
            isnan(maximum)
          ) {

            y_max = "--";
            y_mid = "--";
            y_min = "--";

          } else if (decimals == 2) {

            y_max =
              str_sprintf(
                "%.2f",
                axis_high
              );

            y_mid =
              str_sprintf(
                "%.2f",
                axis_mid
              );

            y_min =
              str_sprintf(
                "%.2f",
                axis_low
              );

          } else {

            y_max =
              str_sprintf(
                "%.1f",
                axis_high
              );

            y_mid =
              str_sprintf(
                "%.1f",
                axis_mid
              );

            y_min =
              str_sprintf(
                "%.1f",
                axis_low
              );
          }

          lv_label_set_text(
            id(ui_trend_y_max),
            y_max.c_str()
          );

          lv_label_set_text(
            id(ui_trend_y_mid),
            y_mid.c_str()
          );

          lv_label_set_text(
            id(ui_trend_y_min),
            y_min.c_str()
          );

          // Secondary voltage Y-axis
          if (
            dual_axis &&
            !isnan(secondary_minimum) &&
            !isnan(secondary_maximum)
          ) {

            float secondary_axis_low =
              secondary_minimum;

            float secondary_axis_high =
              secondary_maximum;

            float secondary_span =
              secondary_axis_high -
              secondary_axis_low;

            constexpr float SECONDARY_MINIMUM_SPAN =
              1.0f;

            if (
              secondary_span <
              SECONDARY_MINIMUM_SPAN
            ) {

              const float secondary_center =
                (
                  secondary_axis_low +
                  secondary_axis_high
                ) * 0.5f;

              secondary_axis_low =
                secondary_center -
                SECONDARY_MINIMUM_SPAN * 0.5f;

              secondary_axis_high =
                secondary_center +
                SECONDARY_MINIMUM_SPAN * 0.5f;

              secondary_span =
                SECONDARY_MINIMUM_SPAN;
            }

            const float secondary_padding =
              secondary_span * 0.10f;

            secondary_axis_low -=
              secondary_padding;

            secondary_axis_high +=
              secondary_padding;

            int32_t secondary_chart_low =
              static_cast<int32_t>(
                floorf(
                  secondary_axis_low *
                  secondary_scale
                )
              );

            int32_t secondary_chart_high =
              static_cast<int32_t>(
                ceilf(
                  secondary_axis_high *
                  secondary_scale
                )
              );

            if (
              secondary_chart_high <=
              secondary_chart_low
            ) {
              secondary_chart_high =
                secondary_chart_low + 1;
            }

            lv_chart_set_range(
              chart,
              LV_CHART_AXIS_SECONDARY_Y,
              secondary_chart_low,
              secondary_chart_high
            );

            const float secondary_axis_mid =
              (
                secondary_axis_low +
                secondary_axis_high
              ) * 0.5f;

            const std::string y2_max =
              str_sprintf(
                "%.1f",
                secondary_axis_high
              );

            const std::string y2_mid =
              str_sprintf(
                "%.1f",
                secondary_axis_mid
              );

            const std::string y2_min =
              str_sprintf(
                "%.1f",
                secondary_axis_low
              );

            lv_label_set_text(
              id(ui_trend_y2_max),
              y2_max.c_str()
            );

            lv_label_set_text(
              id(ui_trend_y2_mid),
              y2_mid.c_str()
            );

            lv_label_set_text(
              id(ui_trend_y2_min),
              y2_min.c_str()
            );

            lv_obj_clear_flag(
              id(ui_trend_y2_max),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_clear_flag(
              id(ui_trend_y2_mid),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_clear_flag(
              id(ui_trend_y2_min),
              LV_OBJ_FLAG_HIDDEN
            );

          } else {

            lv_obj_add_flag(
              id(ui_trend_y2_max),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_add_flag(
              id(ui_trend_y2_mid),
              LV_OBJ_FLAG_HIDDEN
            );

            lv_obj_add_flag(
              id(ui_trend_y2_min),
              LV_OBJ_FLAG_HIDDEN
            );
          }

          // Min / Max labels
          std::string minimum_text;
          std::string maximum_text;

          if (isnan(minimum)) {

            minimum_text =
              "--";

          } else if (decimals == 2) {

            minimum_text =
              str_sprintf(
                "%.2f %s",
                minimum,
                unit
              );

          } else {

            minimum_text =
              str_sprintf(
                "%.1f %s",
                minimum,
                unit
              );
          }

          if (isnan(maximum)) {

            maximum_text =
              "--";

          } else if (decimals == 2) {

            maximum_text =
              str_sprintf(
                "%.2f %s",
                maximum,
                unit
              );

          } else {

            maximum_text =
              str_sprintf(
                "%.1f %s",
                maximum,
                unit
              );
          }

          lv_label_set_text(
            id(ui_trend_min),
            minimum_text.c_str()
          );

          lv_label_set_text(
            id(ui_trend_max),
            maximum_text.c_str()
          );

          if (dual_axis) {

            const std::string secondary_minimum_text =
              isnan(secondary_minimum)
                ? "--"
                : str_sprintf(
                    "%.1f V",
                    secondary_minimum
                  );

            const std::string secondary_maximum_text =
              isnan(secondary_maximum)
                ? "--"
                : str_sprintf(
                    "%.1f V",
                    secondary_maximum
                  );

            lv_label_set_text(
              id(ui_trend_secondary_min),
              secondary_minimum_text.c_str()
            );

            lv_label_set_text(
              id(ui_trend_secondary_max),
              secondary_maximum_text.c_str()
            );
          }

          // Final chart refresh
          lv_chart_refresh(chart);


# ==============================================================================
# PERIODIC DISPLAY REFRESH
# ==============================================================================

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_active_page) == 6;

          then:
            - script.execute:
                id: trend_chart_refresh
