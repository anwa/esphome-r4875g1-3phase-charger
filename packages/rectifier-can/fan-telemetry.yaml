# R4875G1 internal-fan telemetry handler for Unit ${ru_unit}.
#
# Required substitutions:
#   ru_unit                      -> rectifier unit number (1..3)
#   fan_duty_counts_per_percent  -> raw protocol counts per duty-cycle percent
#
# Decodes minimum duty, target duty and fan speed from extended CAN frame
# 0x108${ru_unit}827E.

can_id: 0x108${ru_unit}827E
use_extended_id: true
then:
  - lambda: |-
      if (x.size() >= 8) {
        const uint8_t reg_byte0 =
            static_cast<uint8_t>(x[0]);

        const uint8_t reg_byte1 =
            static_cast<uint8_t>(x[1]);

        if (reg_byte0 == 0x01 && reg_byte1 == 0x87) {
          const uint16_t minimum_duty_raw =
              (static_cast<uint8_t>(x[2]) << 8) |
              static_cast<uint8_t>(x[3]);

          const uint16_t duty_target_raw =
              (static_cast<uint8_t>(x[4]) << 8) |
              static_cast<uint8_t>(x[5]);

          const uint16_t rpm =
              (static_cast<uint8_t>(x[6]) << 8) |
              static_cast<uint8_t>(x[7]);

          const float minimum_duty =
              static_cast<float>(minimum_duty_raw) /
              ${fan_duty_counts_per_percent}f;

          const float duty_target =
              static_cast<float>(duty_target_raw) /
              ${fan_duty_counts_per_percent}f;

          id(fan_duty_${ru_unit}).publish_state(minimum_duty);
          id(fan_duty_setpoint_${ru_unit}).publish_state(duty_target);
          id(fan_rpm_${ru_unit}).publish_state(rpm);
        }
      }
