can_id: 0x108${ru_unit}D27F
use_extended_id: true
then:
  - lambda: |-
      // Any valid property frame confirms that Unit ${ru_unit} is reachable.
      id(last_can_rx_${ru_unit}) = millis();

      static bool message_started = false;

      if (x.size() == 8) {
        if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
          id(unit_properties_${ru_unit}) = "";  // Clear existing string
          id(unit_properties_complete_${ru_unit}) = false;
          message_started = true;
          id(frame_counter_msg_start_${ru_unit}) = 0;  // Reset global frame counter
          ESP_LOGI(
            "unit_properties",
            "Unit ${ru_unit}: Message Start Detected"
          );
        }

        if (message_started) {
          // Extract and append all payload bytes starting from x[2]
          std::string frame_data((char*)&x[2], 6);  // 6 bytes of payload
          id(unit_properties_${ru_unit}) += frame_data;

          // Increment global frame counter
          id(frame_counter_msg_start_${ru_unit})++;

          // Log for debugging purposes
          ESP_LOGD(
            "unit_properties",
            "Unit ${ru_unit}: Captured Frame #%d: %s",
            id(frame_counter_msg_start_${ru_unit}),
            frame_data.c_str()
          );
        }
      }
