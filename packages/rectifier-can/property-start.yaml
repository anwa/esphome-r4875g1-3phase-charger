# R4875G1 static-property start/data-frame handler for Unit ${ru_unit}.
#
# Required substitution:
#   ru_unit -> rectifier unit number (1..3)
#
# Handles extended CAN frame 0x108${ru_unit}D27F, starts a new multi-frame ASCII
# property response and appends subsequent payload fragments until the dedicated
# property-end frame is received.

can_id: 0x108${ru_unit}D27F
use_extended_id: true
then:
  - lambda: |-
      // Any valid property frame confirms that Unit ${ru_unit} is reachable.
      id(last_can_rx_${ru_unit}) = millis();

      static bool message_started = false;

      if (x.size() == 8) {
        if ((uint8_t)x[0] == 0x00 && (uint8_t)x[1] == 0x01) {
          id(unit_properties_${ru_unit}) = "";
          id(unit_properties_complete_${ru_unit}) = false;
          message_started = true;
          id(frame_counter_msg_start_${ru_unit}) = 0;
          ESP_LOGI(
            "unit_properties",
            "Unit ${ru_unit}: Message Start Detected"
          );
        }

        if (message_started) {
          std::string frame_data((char*)&x[2], 6);
          id(unit_properties_${ru_unit}) += frame_data;

          id(frame_counter_msg_start_${ru_unit})++;

          ESP_LOGD(
            "unit_properties",
            "Unit ${ru_unit}: Captured Frame #%d: %s",
            id(frame_counter_msg_start_${ru_unit}),
            frame_data.c_str()
          );
        }
      }
