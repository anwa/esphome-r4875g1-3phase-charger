# ==============================================================================
# R4875G1 ALARM / STATUS TELEMETRY
# ==============================================================================
#
# Decodes the final cyclic telemetry frame containing register 0x0183.
#
# Required substitution:
#   ru_unit -> rectifier unit number (1..3)
# ==============================================================================

can_id: 0x108${ru_unit}407E
use_extended_id: true
then:
  - lambda: |-
      if (
        x.size() >= 8 &&
        static_cast<uint8_t>(x[0]) == 0x01 &&
        static_cast<uint8_t>(x[1]) == 0x83
      ) {
        id(last_can_rx_${ru_unit}) = millis();

        const uint32_t value =
          (static_cast<uint32_t>(x[4]) << 24) |
          (static_cast<uint32_t>(x[5]) << 16) |
          (static_cast<uint32_t>(x[6]) << 8) |
          static_cast<uint32_t>(x[7]);

        id(alarm_status_raw_${ru_unit}).publish_state(value);
      }
