# R4875G1 capability/address response handler for Unit ${ru_unit}.
#
# Required substitution:
#   ru_unit -> rectifier unit number (1..3)
#
# Decodes shelf/slot address values from extended CAN frame
# 0x108${ru_unit}507E during capability discovery.

can_id: 0x108${ru_unit}507E
use_extended_id: true
then:
  - lambda: |-
      if (id(data_found_${ru_unit})) {
        ESP_LOGI(
          "canbus",
          "Unit ${ru_unit}: Data already found. Skipping further processing."
        );
        return;
      }

      if (x.size() != 8) {
        ESP_LOGW(
          "canbus",
          "Unit ${ru_unit}: Ignoring invalid address frame 0x108${ru_unit}507E "
          "(DLC=%u, expected 8).",
          static_cast<unsigned>(x.size())
        );
        return;
      }

      // A valid address response confirms active communication during discovery.
      id(last_can_rx_${ru_unit}) = millis();

      ESP_LOGI(
        "canbus",
        "Unit ${ru_unit}: Received CAN message 0x108${ru_unit}507E (Packet 6)"
      );

      const uint8_t pin11 =
          static_cast<uint8_t>(x[2]);

      const uint8_t pin12 =
          static_cast<uint8_t>(x[3]);

      ESP_LOGI(
        "canbus",
        "Unit ${ru_unit}: Pin 11: %u, Pin 12: %u",
        static_cast<unsigned>(pin11),
        static_cast<unsigned>(pin12)
      );

      id(pin11_${ru_unit}).publish_state(pin11);
      id(pin12_${ru_unit}).publish_state(pin12);

      if ((pin11 >= 1 && pin11 <= 4) &&
          (pin12 >= 1 && pin12 <= 4)) {
        id(data_found_${ru_unit}) = true;
      }
