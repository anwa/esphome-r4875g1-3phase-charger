    unit_of_measurement: "%"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_1_temperature
    entity_id: ${battery_1_temperature_entity}
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_1_cell_drift
    entity_id: ${battery_1_cell_drift_entity}
    internal: true
    unit_of_measurement: "mV"
    accuracy_decimals: 1
    filters:
      - multiply: 1000.0

  # ---------------------------------------------------------------------------
  # BATTERY 2
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_2_voltage
    entity_id: ${battery_2_voltage_entity}
    internal: true
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: homeassistant
    id: battery_2_current
    entity_id: ${battery_2_current_entity}
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_2_power
    entity_id: ${battery_2_power_entity}
    internal: true
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    filters:
      - multiply: ${battery_unit_power_scale_to_kw}

  - platform: homeassistant
    id: battery_2_soc
    entity_id: ${battery_2_soc_entity}
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_2_temperature
    entity_id: ${battery_2_temperature_entity}
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_2_cell_drift
    entity_id: ${battery_2_cell_drift_entity}
    internal: true
    unit_of_measurement: "mV"
    accuracy_decimals: 1
    filters:
      - multiply: 1000.0

  # ---------------------------------------------------------------------------
  # BATTERY 3
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_3_voltage
    entity_id: ${battery_3_voltage_entity}
    internal: true
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: homeassistant
    id: battery_3_current
    entity_id: ${battery_3_current_entity}
