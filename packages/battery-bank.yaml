# ==============================================================================
# TEXT BATTERY STATES
# ==============================================================================
#
# Warning and fault entities are intentionally imported as text instead of
# Home Assistant binary sensors. This preserves the raw "unavailable" state so
# the display can distinguish a genuine OFF condition from missing HA data.
# ==============================================================================

text_sensor:

  # ---------------------------------------------------------------------------
  # BATTERY BANK
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_bank_state
    entity_id: ${battery_bank_state_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # BATTERY 1
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_1_warning_state
    entity_id: ${battery_1_warning_entity}
    internal: true

  - platform: homeassistant
    id: battery_1_fault_state
    entity_id: ${battery_1_fault_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # BATTERY 2
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_2_warning_state
    entity_id: ${battery_2_warning_entity}
    internal: true

  - platform: homeassistant
    id: battery_2_fault_state
    entity_id: ${battery_2_fault_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # BATTERY 3
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_3_warning_state
    entity_id: ${battery_3_warning_entity}
    internal: true

  - platform: homeassistant
    id: battery_3_fault_state
    entity_id: ${battery_3_fault_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # BATTERY 4
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_4_warning_state
    entity_id: ${battery_4_warning_entity}
    internal: true

  - platform: homeassistant
    id: battery_4_fault_state
    entity_id: ${battery_4_fault_entity}
    internal: true


# ==============================================================================
# BATTERY DATA AVAILABILITY
# ==============================================================================
#
# Native API connection state and source validity are kept separate from charger
# control. These internal binary sensors exist only so display code has one
# canonical way to decide whether HA battery telemetry is usable.
# ==============================================================================

binary_sensor:

  # ---------------------------------------------------------------------------
  # HOME ASSISTANT CONNECTION
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_ha_connected
    internal: true
    condition:
      api.connected:
        state_subscription_only: true

  # ---------------------------------------------------------------------------
  # BATTERY BANK DATA
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_bank_data_available
    internal: true
    lambda: |-
      if (!id(battery_ha_connected).state) {
        return false;
      }

      if (
        !id(battery_bank_voltage).has_state() ||
        !id(battery_bank_current).has_state() ||
        !id(battery_bank_power).has_state() ||
        !id(battery_bank_soc).has_state() ||
        !id(battery_bank_temperature).has_state()
      ) {
        return false;
      }

      if (
        isnan(id(battery_bank_voltage).state) ||
        isnan(id(battery_bank_current).state) ||
        isnan(id(battery_bank_power).state) ||
        isnan(id(battery_bank_soc).state) ||
        isnan(id(battery_bank_temperature).state)
      ) {
        return false;
      }

      if (!id(battery_bank_state).has_state()) {
        return false;
      }

      const std::string state =
        id(battery_bank_state).state;

      return
        !state.empty() &&
        state != "unknown" &&
        state != "unavailable";

  # ---------------------------------------------------------------------------
  # BATTERY 1 DATA
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_1_data_available
    internal: true
    lambda: |-
      if (!id(battery_ha_connected).state) {
        return false;
      }

      if (
        !id(battery_1_voltage).has_state() ||
        !id(battery_1_current).has_state() ||
        !id(battery_1_power).has_state() ||
        !id(battery_1_soc).has_state() ||
        !id(battery_1_temperature).has_state() ||
        !id(battery_1_cell_drift).has_state() ||
        !id(battery_1_warning_state).has_state() ||
        !id(battery_1_fault_state).has_state()
      ) {
        return false;
      }

      if (
        isnan(id(battery_1_voltage).state) ||
        isnan(id(battery_1_current).state) ||
        isnan(id(battery_1_power).state) ||
        isnan(id(battery_1_soc).state) ||
        isnan(id(battery_1_temperature).state) ||
        isnan(id(battery_1_cell_drift).state)
      ) {
        return false;
      }

      const std::string warning =
        id(battery_1_warning_state).state;

      const std::string fault =
        id(battery_1_fault_state).state;

      return
        (warning == "on" || warning == "off") &&
        (fault == "on" || fault == "off");

  # ---------------------------------------------------------------------------
  # BATTERY 2 DATA
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_2_data_available
    internal: true
    lambda: |-
      if (!id(battery_ha_connected).state) {
        return false;
      }

      if (
        !id(battery_2_voltage).has_state() ||
        !id(battery_2_current).has_state() ||
        !id(battery_2_power).has_state() ||
        !id(battery_2_soc).has_state() ||
        !id(battery_2_temperature).has_state() ||
        !id(battery_2_cell_drift).has_state() ||
        !id(battery_2_warning_state).has_state() ||
        !id(battery_2_fault_state).has_state()
      ) {
        return false;
      }

      if (
        isnan(id(battery_2_voltage).state) ||
        isnan(id(battery_2_current).state) ||
        isnan(id(battery_2_power).state) ||
        isnan(id(battery_2_soc).state) ||
        isnan(id(battery_2_temperature).state) ||
        isnan(id(battery_2_cell_drift).state)
      ) {
        return false;
      }

      const std::string warning =
        id(battery_2_warning_state).state;

      const std::string fault =
        id(battery_2_fault_state).state;

      return
        (warning == "on" || warning == "off") &&
        (fault == "on" || fault == "off");

  # ---------------------------------------------------------------------------
  # BATTERY 3 DATA
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_3_data_available
    internal: true
    lambda: |-
      if (!id(battery_ha_connected).state) {
        return false;
      }

      if (
        !id(battery_3_voltage).has_state() ||
        !id(battery_3_current).has_state() ||
        !id(battery_3_power).has_state() ||
        !id(battery_3_soc).has_state() ||
        !id(battery_3_temperature).has_state() ||
        !id(battery_3_cell_drift).has_state() ||
        !id(battery_3_warning_state).has_state() ||
        !id(battery_3_fault_state).has_state()
      ) {
        return false;
      }

      if (
        isnan(id(battery_3_voltage).state) ||
        isnan(id(battery_3_current).state) ||
        isnan(id(battery_3_power).state) ||
        isnan(id(battery_3_soc).state) ||
        isnan(id(battery_3_temperature).state) ||
        isnan(id(battery_3_cell_drift).state)
      ) {
        return false;
      }

      const std::string warning =
        id(battery_3_warning_state).state;

      const std::string fault =
        id(battery_3_fault_state).state;

      return
        (warning == "on" || warning == "off") &&
        (fault == "on" || fault == "off");

  # ---------------------------------------------------------------------------
  # BATTERY 4 DATA
  # ---------------------------------------------------------------------------

  - platform: template
    id: battery_4_data_available
    internal: true
    lambda: |-
      if (!id(battery_ha_connected).state) {
        return false;
      }

      if (
        !id(battery_4_voltage).has_state() ||
        !id(battery_4_current).has_state() ||
        !id(battery_4_power).has_state() ||
        !id(battery_4_soc).has_state() ||
        !id(battery_4_temperature).has_state() ||
        !id(battery_4_cell_drift).has_state() ||
        !id(battery_4_warning_state).has_state() ||
