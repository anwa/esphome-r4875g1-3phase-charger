# ==============================================================================
# SOLAR BATTERY BANK DATA
# ==============================================================================
#
# Imports the aggregate solar-battery bank telemetry and the individual values
# of four parallel battery units from Home Assistant through the native API.
#
# These values are monitoring-only. Charger control, safety limits and offline
# operation must remain independent of Home Assistant availability.
#
# Home Assistant entity IDs are centralized in the substitutions below so an
# installation can adapt the battery integration without modifying display or
# runtime logic.
# ==============================================================================

substitutions:

  # ---------------------------------------------------------------------------
  # BATTERY BANK ENTITY MAPPING
  # ---------------------------------------------------------------------------

  battery_bank_voltage_entity: "sensor.solar_battery_bank_reported_bank_voltage"
  battery_bank_current_entity: "sensor.solar_battery_bank_reported_bank_current"
  battery_bank_power_entity: "sensor.solar_battery_bank_reported_bank_power"
  battery_bank_soc_entity: "sensor.solar_battery_bank_reported_bank_state_of_charge"
  battery_bank_temperature_entity: "sensor.solar_battery_bank_reported_bank_temperature"
  battery_bank_state_entity: "sensor.solar_battery_bank_reported_bank_state"

  # The aggregate Home Assistant power entity reports W.
  # Normalize the imported value to kW for display use.
  battery_bank_power_scale_to_kw: "0.001"

  # ---------------------------------------------------------------------------
  # BATTERY 1 ENTITY MAPPING
  # ---------------------------------------------------------------------------

  battery_1_voltage_entity: "sensor.solar_battery_fs1_battery_voltage"
  battery_1_current_entity: "sensor.solar_battery_fs1_battery_current"
  battery_1_power_entity: "sensor.solar_battery_fs1_battery_power"
  battery_1_soc_entity: "sensor.solar_battery_fs1_state_of_charge"
  battery_1_temperature_entity: "sensor.solar_battery_fs1_battery_temperature"
  battery_1_cell_drift_entity: "sensor.solar_battery_fs1_battery_cell_drift"
  battery_1_warning_entity: "binary_sensor.solar_battery_fs1_battery_warning"
  battery_1_fault_entity: "binary_sensor.solar_battery_fs1_battery_fault"

  # ---------------------------------------------------------------------------
  # BATTERY 2 ENTITY MAPPING
  # ---------------------------------------------------------------------------

  battery_2_voltage_entity: "sensor.solar_battery_fs2_battery_voltage"
  battery_2_current_entity: "sensor.solar_battery_fs2_battery_current"
  battery_2_power_entity: "sensor.solar_battery_fs2_battery_power"
  battery_2_soc_entity: "sensor.solar_battery_fs2_state_of_charge"
  battery_2_temperature_entity: "sensor.solar_battery_fs2_battery_temperature"
  battery_2_cell_drift_entity: "sensor.solar_battery_fs2_battery_cell_drift"
  battery_2_warning_entity: "binary_sensor.solar_battery_fs2_battery_warning"
  battery_2_fault_entity: "binary_sensor.solar_battery_fs2_battery_fault"

  # ---------------------------------------------------------------------------
  # BATTERY 3 ENTITY MAPPING
  # ---------------------------------------------------------------------------

  battery_3_voltage_entity: "sensor.solar_battery_fs3_battery_voltage"
  battery_3_current_entity: "sensor.solar_battery_fs3_battery_current"
  battery_3_power_entity: "sensor.solar_battery_fs3_battery_power"
  battery_3_soc_entity: "sensor.solar_battery_fs3_state_of_charge"
  battery_3_temperature_entity: "sensor.solar_battery_fs3_battery_temperature"
  battery_3_cell_drift_entity: "sensor.solar_battery_fs3_battery_cell_drift"
  battery_3_warning_entity: "binary_sensor.solar_battery_fs3_battery_warning"
  battery_3_fault_entity: "binary_sensor.solar_battery_fs3_battery_fault"

  # ---------------------------------------------------------------------------
  # BATTERY 4 ENTITY MAPPING
  # ---------------------------------------------------------------------------

  battery_4_voltage_entity: "sensor.solar_battery_fs4_battery_voltage"
  battery_4_current_entity: "sensor.solar_battery_fs4_battery_current"
  battery_4_power_entity: "sensor.solar_battery_fs4_battery_power"
  battery_4_soc_entity: "sensor.solar_battery_fs4_state_of_charge"
  battery_4_temperature_entity: "sensor.solar_battery_fs4_battery_temperature"
  battery_4_cell_drift_entity: "sensor.solar_battery_fs4_battery_cell_drift"
  battery_4_warning_entity: "binary_sensor.solar_battery_fs4_battery_warning"
  battery_4_fault_entity: "binary_sensor.solar_battery_fs4_battery_fault"

  # All four individual battery power entities are expected to use the same
  # source unit. Set to 0.001 if Home Assistant reports these values in W.
  battery_unit_power_scale_to_kw: "0.001"


# ==============================================================================
# NUMERIC BATTERY TELEMETRY
# ==============================================================================

sensor:

  # ---------------------------------------------------------------------------
  # BATTERY BANK
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_bank_voltage
    entity_id: ${battery_bank_voltage_entity}
    internal: true
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: homeassistant
    id: battery_bank_current
    entity_id: ${battery_bank_current_entity}
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_bank_power
    entity_id: ${battery_bank_power_entity}
    internal: true
    unit_of_measurement: "kW"
    accuracy_decimals: 3
    filters:
      - multiply: ${battery_bank_power_scale_to_kw}

  - platform: homeassistant
    id: battery_bank_soc
    entity_id: ${battery_bank_soc_entity}
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_bank_temperature
    entity_id: ${battery_bank_temperature_entity}
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # ---------------------------------------------------------------------------
  # BATTERY 1
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: battery_1_voltage
    entity_id: ${battery_1_voltage_entity}
    internal: true
    unit_of_measurement: "V"
    accuracy_decimals: 2

  - platform: homeassistant
    id: battery_1_current
    entity_id: ${battery_1_current_entity}
    internal: true
    unit_of_measurement: "A"
    accuracy_decimals: 1

  - platform: homeassistant
