      - multiply: ${battery_unit_power_scale_to_kw}

  - platform: homeassistant
    id: battery_3_soc
    entity_id: ${battery_3_soc_entity}
    internal: true
    unit_of_measurement: "%"
    accuracy_decimals: 1

  - platform: homeassistant
    id: battery_3_temperature
    entity_id: ${battery_3_temperature_entity}
