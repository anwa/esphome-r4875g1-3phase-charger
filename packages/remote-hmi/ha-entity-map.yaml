# ==============================================================================
# REMOTE HMI HOME ASSISTANT ENTITY MAP
# ==============================================================================
#
# Derives the Home Assistant entities of the paired Charger Controller from one
# installation-specific entity prefix.
#
# The prefix normally matches the Home Assistant entity prefix generated for
# the Charger Controller ESPHome node.
#
# Example:
#
#   Charger Controller ESPHome name:
#     charger-garage
#
#   Default Home Assistant entity prefix:
#     charger_garage
#
#   Remote HMI setting:
#     ha_charger_entity_prefix: "charger_garage"
#
# Home Assistant entity IDs can remain unchanged after a device is renamed.
# Therefore the configured prefix must match the actual entity IDs in Home
# Assistant rather than being inferred at runtime.
# ==============================================================================

substitutions:

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  ha_charger_ac_power_entity: "sensor.${ha_charger_entity_prefix}_combined_ac_power_all_units"
  ha_charger_ac_voltage_entity: "sensor.${ha_charger_entity_prefix}_average_ac_voltage_all_units"
  ha_charger_ac_current_entity: "sensor.${ha_charger_entity_prefix}_average_ac_current_all_units"
