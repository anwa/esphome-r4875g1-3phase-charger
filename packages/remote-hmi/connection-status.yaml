# ==============================================================================
# REMOTE HMI CONNECTION STATUS
# ==============================================================================
#
# Displays persistent Home Assistant / Charger Controller connectivity state
# beside the shared bottom navigation.
#
# The status does not duplicate charger state or safety logic.
# ==============================================================================

lvgl:
  top_layer:
    widgets:
      - label:
          id: ui_remote_connection_status
          x: 406
          y: 422
          width: 384
          text_align: CENTER
          text: "REMOTE HMI - HA / CHARGER DATA OFFLINE"
          text_font: montserrat_16
          text_color: 0xFFC04A

interval:

  - interval: 500ms
    then:
      - lvgl.label.update:
          id: ui_remote_connection_status

          text: !lambda |-
            return id(ui_model_data_available).state
              ? std::string(
                  "REMOTE HMI - HA / CHARGER DATA ONLINE"
                )
              : std::string(
                  "REMOTE HMI - HA / CHARGER DATA OFFLINE"
                );

          text_color: !lambda |-
            return id(ui_model_data_available).state
              ? lv_color_hex(0x5CFF7A)
              : lv_color_hex(0xFFC04A);
