# ==============================================================================
# REMOTE HMI CONNECTION STATUS
# ==============================================================================
#
# Displays persistent Home Assistant / Charger Controller connectivity state in
# the Remote HMI target-specific sixth bottom slot.
#
# The status does not duplicate charger state or safety logic.
# ==============================================================================

lvgl:
  top_layer:
    widgets:
      - label:
          id: ui_remote_connection_status
          x: 670
          y: 422
          width: 120
          text_align: CENTER
          text: "HA OFFLINE"
          text_font: montserrat_16
          text_color: 0xFFC04A

interval:

  - interval: 500ms
    then:
      - lvgl.label.update:
          id: ui_remote_connection_status

          text: !lambda |-
            return id(ui_model_data_available).state
              ? std::string("HA ONLINE")
              : std::string("HA OFFLINE");

          text_color: !lambda |-
            return id(ui_model_data_available).state
              ? lv_color_hex(0x5CFF7A)
              : lv_color_hex(0xFFC04A);
