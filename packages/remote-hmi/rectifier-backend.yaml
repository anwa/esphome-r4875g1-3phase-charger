# ==============================================================================
# REMOTE HMI RECTIFIER BACKEND
# ==============================================================================
#
# Imports authoritative state for one Charger Controller rectifier through
# Home Assistant and publishes it into the shared V6 rectifier UI model.
#
# Home Assistant connection loss invalidates the complete per-unit model so
# stale telemetry cannot appear as live state.
#
# Required variables:
#   ui_unit
#   ha_rectifier_connected_entity
#   ha_rectifier_lifecycle_entity
#   ha_rectifier_power_state_entity
#   ha_rectifier_ac_voltage_entity
#   ha_rectifier_ac_current_entity
#   ha_rectifier_ac_power_entity
#   ha_rectifier_ac_frequency_entity
#   ha_rectifier_dc_voltage_entity
#   ha_rectifier_dc_current_entity
#   ha_rectifier_dc_power_entity
#   ha_rectifier_dc_current_setpoint_entity
#   ha_rectifier_input_temperature_entity
#   ha_rectifier_output_temperature_entity
#   ha_rectifier_fan_rpm_entity
#   ha_rectifier_fan_minimum_duty_entity
#   ha_rectifier_fan_target_duty_entity
#   ha_rectifier_max_current_capability_entity
#   ha_rectifier_operating_hours_entity
# ==============================================================================

globals:

  - id: remote_ha_rectifier_${ui_unit}_connected_received
    type: bool
    restore_value: false
    initial_value: "false"


binary_sensor:

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_connected
    entity_id: ${ha_rectifier_connected_entity}
    internal: true

    # The first Home Assistant binary-sensor state is published as an initial
    # state and does not trigger on_state unless explicitly requested. The
    # freshness latch depends on receiving that initial ON/OFF state.
    trigger_on_initial_state: true

    on_state:
      then:
        - lambda: |-
            id(remote_ha_rectifier_${ui_unit}_connected_received) = true;


sensor:

  # ---------------------------------------------------------------------------
  # AC INPUT
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_ac_voltage
    entity_id: ${ha_rectifier_ac_voltage_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_ac_current
    entity_id: ${ha_rectifier_ac_current_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_ac_power
    entity_id: ${ha_rectifier_ac_power_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_ac_frequency
    entity_id: ${ha_rectifier_ac_frequency_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # DC OUTPUT
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_dc_voltage
    entity_id: ${ha_rectifier_dc_voltage_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_dc_current
    entity_id: ${ha_rectifier_dc_current_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_dc_power
    entity_id: ${ha_rectifier_dc_power_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_dc_current_setpoint
    entity_id: ${ha_rectifier_dc_current_setpoint_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # TEMPERATURE
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_input_temperature
    entity_id: ${ha_rectifier_input_temperature_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_output_temperature
    entity_id: ${ha_rectifier_output_temperature_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # INTERNAL FAN
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_fan_rpm
    entity_id: ${ha_rectifier_fan_rpm_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_fan_minimum_duty
    entity_id: ${ha_rectifier_fan_minimum_duty_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_fan_target_duty
    entity_id: ${ha_rectifier_fan_target_duty_entity}
    internal: true

  # ---------------------------------------------------------------------------
  # CAPABILITY AND LIFETIME
  # ---------------------------------------------------------------------------

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_max_current_capability
    entity_id: ${ha_rectifier_max_current_capability_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_operating_hours
    entity_id: ${ha_rectifier_operating_hours_entity}
    internal: true


text_sensor:

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_lifecycle
    entity_id: ${ha_rectifier_lifecycle_entity}
    internal: true

  - platform: homeassistant
    id: remote_ha_rectifier_${ui_unit}_power_state
    entity_id: ${ha_rectifier_power_state_entity}
    internal: true


interval:

  - interval: 500ms
    then:
      - lambda: |-
          const bool ha_connected =
            id(native_api).is_connected_with_state_subscription();

          auto invalidate_model = [&](const bool source_received) {
            id(ui_model_rectifier_${ui_unit}_connected).publish_state(false);
            id(ui_model_rectifier_${ui_unit}_online).publish_state(false);

            id(ui_model_rectifier_${ui_unit}_lifecycle).publish_state(
              source_received
                ? "OFFLINE"
                : ""
            );

            id(ui_model_rectifier_${ui_unit}_power_state).publish_state("");

            id(ui_model_rectifier_${ui_unit}_ac_voltage).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_ac_current).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_ac_power).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_ac_frequency).publish_state(NAN);

            id(ui_model_rectifier_${ui_unit}_dc_voltage).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_dc_current).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_dc_power).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_dc_current_setpoint).publish_state(
              NAN
            );

            id(ui_model_rectifier_${ui_unit}_input_temperature).publish_state(
              NAN
            );

            id(ui_model_rectifier_${ui_unit}_output_temperature).publish_state(
              NAN
            );

            id(ui_model_rectifier_${ui_unit}_fan_rpm).publish_state(NAN);
            id(ui_model_rectifier_${ui_unit}_fan_minimum_duty).publish_state(
              NAN
            );
            id(ui_model_rectifier_${ui_unit}_fan_target_duty).publish_state(
              NAN
            );

            id(ui_model_rectifier_${ui_unit}_max_current_capability).publish_state(
              NAN
            );

            id(ui_model_rectifier_${ui_unit}_operating_hours).publish_state(
              NAN
            );
          };

          if (!ha_connected) {
            id(remote_ha_rectifier_${ui_unit}_connected_received) = false;
            invalidate_model(false);
            return;
          }

          const bool received =
            id(remote_ha_rectifier_${ui_unit}_connected_received);

          const bool connected =
            received &&
            id(remote_ha_rectifier_${ui_unit}_connected).state;

          if (!connected) {
            invalidate_model(received);
            return;
          }

          id(ui_model_rectifier_${ui_unit}_connected).publish_state(true);

          std::string lifecycle;

          if (id(remote_ha_rectifier_${ui_unit}_lifecycle).has_state()) {
            lifecycle =
              id(remote_ha_rectifier_${ui_unit}_lifecycle).state;

            if (
              lifecycle == "unknown" ||
              lifecycle == "unavailable"
            ) {
              lifecycle.clear();
            }
          }

          id(ui_model_rectifier_${ui_unit}_lifecycle).publish_state(
            lifecycle
          );

          id(ui_model_rectifier_${ui_unit}_online).publish_state(
            lifecycle == "ONLINE"
          );

          std::string power_state;

          if (id(remote_ha_rectifier_${ui_unit}_power_state).has_state()) {
            power_state =
              id(remote_ha_rectifier_${ui_unit}_power_state).state;

            if (
              power_state == "UNKNOWN" ||
              power_state == "unknown" ||
              power_state == "unavailable"
            ) {
              power_state.clear();
            }
          }

          id(ui_model_rectifier_${ui_unit}_power_state).publish_state(
            power_state
          );

          id(ui_model_rectifier_${ui_unit}_ac_voltage).publish_state(
            id(remote_ha_rectifier_${ui_unit}_ac_voltage).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_ac_voltage).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_ac_current).publish_state(
            id(remote_ha_rectifier_${ui_unit}_ac_current).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_ac_current).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_ac_power).publish_state(
            id(remote_ha_rectifier_${ui_unit}_ac_power).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_ac_power).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_ac_frequency).publish_state(
            id(remote_ha_rectifier_${ui_unit}_ac_frequency).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_ac_frequency).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_dc_voltage).publish_state(
            id(remote_ha_rectifier_${ui_unit}_dc_voltage).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_dc_voltage).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_dc_current).publish_state(
            id(remote_ha_rectifier_${ui_unit}_dc_current).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_dc_current).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_dc_power).publish_state(
            id(remote_ha_rectifier_${ui_unit}_dc_power).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_dc_power).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_dc_current_setpoint).publish_state(
            id(remote_ha_rectifier_${ui_unit}_dc_current_setpoint).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_dc_current_setpoint).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_input_temperature).publish_state(
            id(remote_ha_rectifier_${ui_unit}_input_temperature).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_input_temperature).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_output_temperature).publish_state(
            id(remote_ha_rectifier_${ui_unit}_output_temperature).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_output_temperature).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_fan_rpm).publish_state(
            id(remote_ha_rectifier_${ui_unit}_fan_rpm).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_fan_rpm).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_fan_minimum_duty).publish_state(
            id(remote_ha_rectifier_${ui_unit}_fan_minimum_duty).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_fan_minimum_duty).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_fan_target_duty).publish_state(
            id(remote_ha_rectifier_${ui_unit}_fan_target_duty).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_fan_target_duty).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_max_current_capability).publish_state(
            id(remote_ha_rectifier_${ui_unit}_max_current_capability).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_max_current_capability).state
              : NAN
          );

          id(ui_model_rectifier_${ui_unit}_operating_hours).publish_state(
            id(remote_ha_rectifier_${ui_unit}_operating_hours).has_state()
              ? id(remote_ha_rectifier_${ui_unit}_operating_hours).state
              : NAN
          );
