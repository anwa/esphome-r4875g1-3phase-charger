# ==============================================================================
# REMOTE HMI BOOTSTRAP UI
# ==============================================================================
#
# Minimal target-specific UI used to validate the Remote HMI hardware platform
# and the first Home Assistant-backed charger-state path.
#
# The page displays read-only charger availability and run-state telemetry
# through the shared V6 UI model. It does not expose charger commands.
# ==============================================================================

lvgl:
  pages:
    - id: page_remote_bootstrap
      styles: style_page

      widgets:

        - obj:
            x: 110
            y: 80
            width: 580
            height: 300
            styles: style_card

            widgets:

              - label:
                  x: 0
                  y: 30
                  width: 580
                  text_align: CENTER
                  text: "R4875 Remote HMI"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - label:
                  x: 0
                  y: 75
                  width: 580
                  text_align: CENTER
                  text: "V6 bootstrap hardware validation"
                  text_font: montserrat_18
                  text_color: 0x8B96A0

              - label:
                  x: 0
                  y: 110
                  width: 580
                  text_align: CENTER
                  text: "Firmware v${firmware_version}"
                  text_font: montserrat_16
                  text_color: 0x8B96A0

              - label:
                  id: ui_remote_bootstrap_connection
                  x: 0
                  y: 135
                  width: 580
                  text_align: CENTER
                  text: "HA / Charger Data Offline"
                  text_font: montserrat_18
                  text_color: 0xFFC04A

              - label:
                  id: ui_remote_bootstrap_units
                  x: 0
                  y: 170
                  width: 580
                  text_align: CENTER
                  text: "Available - / 3    Running - / 3"
                  text_font: montserrat_18
                  text_color: 0xDDE3E8

              - label:
                  id: ui_remote_bootstrap_battery
                  x: 0
                  y: 205
                  width: 580
                  text_align: CENTER
                  text: "Backup Battery --.-- V / -- %"
                  text_font: montserrat_18
                  text_color: 0xDDE3E8

              - button:
                  x: 190
                  y: 195
                  width: 200
                  height: 60
                  bg_color: 0x202830
                  bg_opa: COVER
                  border_color: 0x4A5662
                  border_width: 1
                  radius: 8

                  widgets:
                    - label:
                        align: CENTER
                        text: "Test Touch"
                        text_font: montserrat_18
                        text_color: 0xFFFFFF

                  on_short_click:
                    - lvgl.label.update:
                        id: ui_remote_bootstrap_touch
                        text: "Touch OK"
                        text_color: 0x5CFF7A

              - label:
                  id: ui_remote_bootstrap_touch
                  x: 0
                  y: 265
                  width: 580
                  text_align: CENTER
                  text: "Touch not tested"
                  text_font: montserrat_16
                  text_color: 0x8B96A0

# ==============================================================================
# BOOTSTRAP DISPLAY RUNTIME
# ==============================================================================
#
# Periodically exposes the local Remote HMI backup-battery state on the
# bootstrap page.
# ==============================================================================

interval:
  - interval: 5s
    then:
      - lvgl.label.update:
          id: ui_remote_bootstrap_battery

          text: !lambda |-
            const float voltage =
              id(controller_battery_voltage).state;

            const float soc =
              id(controller_battery_soc).state;

            if (
              isnan(voltage) ||
              isnan(soc)
            ) {
              return std::string(
                "Backup Battery --.-- V / -- %"
              );
            }

            return str_sprintf(
              "Backup Battery %.2f V / %.0f %%",
              voltage,
              soc
            );

      - lvgl.label.update:
          id: ui_remote_bootstrap_connection

          text: !lambda |-
            return id(ui_model_data_available).state
              ? std::string("HA / Charger Data Online")
              : std::string("HA / Charger Data Offline");

          text_color: !lambda |-
            return id(ui_model_data_available).state
              ? lv_color_hex(0x5CFF7A)
              : lv_color_hex(0xFFC04A);

      - lvgl.label.update:
          id: ui_remote_bootstrap_units

          text: !lambda |-
            if (!id(ui_model_data_available).state) {
              return std::string(
                "Available - / 3    Running - / 3"
              );
            }

            const float available =
              id(ui_model_available_units).state;

            const float running =
              id(ui_model_running_units).state;

            if (
              isnan(available) ||
              isnan(running)
            ) {
              return std::string(
                "Available - / 3    Running - / 3"
              );
            }

            return str_sprintf(
              "Available %.0f / 3    Running %.0f / 3",
              available,
              running
            );
